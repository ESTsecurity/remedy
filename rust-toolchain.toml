[toolchain]
# 재현성을 위해 정확히 고정한다 (설계-01 미결 5 · 설계-09 P0).
channel = "1.96.0"
components = ["rustfmt", "clippy"]
targets = [
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    # P0 실증으로 확정 (설계-01 미결 2). 추가 플래그 없이 정적이며 static-pie 로
    # 나온다 — INTERP/NEEDED 가 없다. 빌드에는 musl-gcc 가 필요하다(wasmtime 의
    # C 빌드 의존).
    "x86_64-unknown-linux-musl",
]
profile = "minimal"
