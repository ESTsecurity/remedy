schema_version: 1
id: example-registry-ifeo             # 예제 고유 값 — 대상 위협에 맞게 교체
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "예제 — IFEO Debugger 가로채기"
  en: "Example - IFEO Debugger hijack"

# **레지스트리 값도 이 상한을 받는다** (10-manifest.md §scan_roots 의 표).
# 적지 않으면 registry_value 는 언제나 0건이고, 그 위에서 도는 룰은
# 아무것도 맞히지 못한 채 초록이 된다.
#
# **끝의 `\*` 가 필요하다.** 값 수집은 재귀하지 않아 선언한 키의 직속 값만
# 읽는데, IFEO 는 하이재킹당한 실행 파일 이름마다 하위 키를 하나씩 두고
# `Debugger` 는 그 안에 있다. 그 이름은 미리 알 수 없으므로 펼쳐서 읽는다.
scan_roots:
  - "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\*"
  - "%LOCALAPPDATA%\\Programs"        # 자식 파일 규칙의 상한 — 페이로드 위치에 맞게 교체

subjects: [registry_value, file]

detect:
  # 부모 — IFEO 의 Debugger 값. 정상 시스템에는 이 값이 거의 없고,
  # 있다면 디버깅 도구가 자기 경로를 적는다.
  - id: ifeo
    subject: registry_value
    where:
      all:
        - { field: key,  op: contains, value: "\\Image File Execution Options\\" }
        - { field: name, op: equals,   value: "Debugger" }
        # 사용자 프로필 아래를 가리키는 디버거는 정상 도구가 아니다.
        - { field: data, op: matches,  value: '(?i)\\AppData\\Local\\Programs\\' }
    capture:
      # 값에서 경로를 뽑는다. 폴더 이름이 감염마다 바뀌므로 리터럴로 적을 수 없다.
      hook: "data | first_path"
      dir: "${hook} | dirname"

  # 자식 — 그 폴더 안의 실행 파일. 부모가 가리킨 곳에서만 찾는다.
  - id: payload
    subject: file
    from: "${ifeo.dir}"
    where:
      - { field: path, op: ends_with, value: ".exe" }

# 레지스트리 값 하나만으로 판정하지 않는다. 가리키는 파일이 실재해야 한다.
verdict:
  require: "ifeo and payload"

remediate:
  remove:
    # 레지스트리 값이 **유발자**다 — 코어가 산출물보다 먼저 처리한다.
    # Debugger 값은 기본이 "없음" 이므로 되돌림이 아니라 삭제다.
    - { ref: ifeo }
    - { ref: payload }
