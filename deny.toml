# cargo-deny 설정.
#
# 1주차부터 상시 검사하는 이유는 크레이트 280여 개의 라이선스를 상용 배포 직전에
# 몰아서 보면 늦기 때문이다 (설계-01 미결 6).

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # rsa 0.10.0-rc.19 — Marvin 공격(타이밍 사이드채널로 개인키 복구). yara-x 1.22 가
    # 이 출시 후보 판을 끌어온다(1.19 에서는 0.9.10).
    #
    # 권고 원문: "information about the private key is leaked through timing
    # information which is observable over the network."
    #
    # 두 전제가 모두 성립하지 않는다.
    #   1. remedy 는 RSA **개인키를 갖지 않는다.** yara-x 가 rsa 를 쓰는 곳은
    #      PE·Mach-O·MSI 모듈의 **서명 검증**(공개키 연산)이다.
    #   2. remedy 는 네트워크 서비스를 노출하지 않는다 — 치료 경로에 네트워크가
    #      없다(설계-01 D8). 공격자가 타이밍을 관측할 통로가 없다.
    # 상위에 안전한 업그레이드가 없다("No safe upgrade is available!").
    #
    # 재검토 조건: 코어가 RSA 개인키를 다루게 되면(플러그인 서명 생성 등, P10)
    # 즉시 재평가한다.
    #
    # **2026-08-25 재평가 완료 (P10).** 서명 방식이 Ed25519 기반 minisign 으로
    # 확정됐다(설계-01 미결 5). rsa 경로를 쓰지 않으며, 개인키를 다루는 코드는
    # 제품이 아니라 `xtask` 에만 있고 그것도 Ed25519 다.
    { id = "RUSTSEC-2023-0071", reason = "개인키 연산과 네트워크 노출이 모두 없어 해당 없음. P10 에서 서명 방식이 Ed25519 로 확정되어 재평가 완료" },

    # bincode 2.0.1 — 미유지보수(취약점 아님). yara-x 내부 직렬화에 쓰인다.
    # 상위에 대체가 없고 우리가 직접 호출하지 않는다.
    # 재검토 조건: yara-x 가 대체하거나, bincode 에 실제 취약점이 공지되면 즉시.
    { id = "RUSTSEC-2025-0141", reason = "yara-x 내부 의존. 미유지보수 공지이며 취약점 아님. 대체 없음" },

    # unsafe-libyaml 0.2.11 — 미유지보수(취약점 아님). 저장소가 2024-03-25 에 보관됐다.
    # serde_yaml_ng 가 YAML 파서로 쓰고, serde_yaml_ng 는 0.10.0(2024-05)이 마지막 판이라
    # 판을 올려 풀 수 없다.
    #
    # 이 파서에 공격자가 만든 바이트가 닿는 경로가 없다. 읽는 것은 넷이다 — 서명과
    # 파일 트리를 먼저 검증한 꾸러미의 매니페스트(`discover::usable` 뒤), 운영자가
    # 고른 플러그인(`--plugin`), 운영자 설정 파일, 분석가의 초안(`plugin lint`).
    # 감염 기계에서 모은 자료는 YAML 로 읽지 않는다.
    #
    # 권고가 권하는 대체(serde-saphyr 등)는 다른 파서라, 같은 매니페스트를 같게
    # 읽는지(값의 해석 · 오류의 자리)를 따로 재야 한다.
    #
    # 재검토 조건: unsafe-libyaml 에 취약점이 공지되거나, 공격자가 쥔 입력을 YAML 로
    # 읽게 되거나, serde_yaml_ng 가 다른 파서로 옮기면 즉시.
    { id = "RUSTSEC-2024-0449", reason = "미유지보수 공지이며 취약점 아님. 파서가 읽는 YAML 은 서명 검증 뒤의 매니페스트 · 운영자 입력 · 분석가 초안뿐이라 공격자 입력이 닿지 않는다. 대체는 해석 호환을 따로 재야 한다" },
]

[licenses]
version = 2
# 상용 배포 가능한 허용적 라이선스만 받는다. 목록에 없는 것은 실패한다.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []
# 워크스페이스 자체 크레이트는 publish = false 이며 사내 소유다.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 워크스페이스 내부 path 의존은 버전을 적지 않는다. 배포 대상이 아니므로 허용한다.
allow-wildcard-paths = true
# 치료 경로에 네트워크 코드가 링크되지 않아야 한다 (설계-01 D9).
# 크레이트 수준 금지는 P10(enrich/submit 도입) 시점에 대상별로 다시 검토한다.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
