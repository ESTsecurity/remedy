# 출시 전 필수 점검 — 룰만 바뀐 출시의 ①②③ 를 GitHub 호스팅 러너에서 돈다(2026-11-22 · docs/긴급-대응.md "출시 전 필수 점검").
#
# 부르는 것은 `bash ci/batch.sh` 다. 태그를 밀어 배포 잡이 초안을 올리면, 그 명령이 초안의 자산 셋을 받아 해시 목록(ASSETS —
# '<이름>:<sha256>' 셋)과 그 열쇠(KEY — ASSETS 의 sha256 · 줄바꿈 없이)를 짓고 이 워크플로를 **그 태그에서** 부른다:
#   gh workflow run checks.yml --ref <태그> -f tag=<태그> -f assets='<ASSETS>' -f key=<KEY>
# 실행 제목이 '점검 <태그> <KEY>' 다. 공개 워크플로의 확인 i 가 그 제목 · 그 실행의 커밋(= 태그 커밋) · 잡 linux · windows 의
# 성공으로 '공개한 바이트 = 점검한 바이트' 를 묶는다(ci/publish-check.sh). harnesses=all 은 견주기다 — `# 룰:` 줄을 단 하네스
# 전부를 돌고, 제목이 '견주기 <태그>' 라 i 를 채우지 못한다(태그가 아닌 가지에서도 부른다 · 공개본도 받는다).
#
# 잡 둘(이름은 확인 i 가 본다 — 바꾸면 ci/publish-check.sh 도):
#   linux    ubuntu-24.04 — ① 바뀐 리눅스 룰의 하네스 · ② 정식 파일 · ③ 기존 동작(testbed/harness/linux/emergency-checks.sh)
#   windows  windows-2025 — 러너가 자기 자신을 랩으로 세운 뒤(testbed/harness/host/Initialize-RunnerLab.ps1) ②③ 정식 파일 ·
#            시연 게이트 · 메뉴 하네스(Invoke-EmergencyChecks.ps1 -Runner)와 ① 바뀐 Windows 룰의 하네스(Invoke-RuleHarness.ps1)
# 하네스 목록은 잡이 스스로 셈한다(`bash ci/batch.sh harnesses` — 입력으로 받지 않아 뺄 수 없다). 결과는 잡마다 기록의
# '<<<summary <os>' 와 '>>>summary <os>' 사이에 찍는다 — `ci/batch.sh` 가 그 덩이를 승인 전에 보인다.
#
# 남의 입력(공식 이미지 · 배포판 저장소 · 공식 zip)을 돌리는 잡이다:
#   - 비밀 · 배포 환경을 쓰지 않는다(ci.yml 의 걸음이 이 파일을 본다). 캐시 · 산출물도 쓰지 않는다(공개 저장소라 누구나 받는다)
#   - 초안은 push 권한만 보므로 잡 토큰이 contents: write 다 — 초안을 받은 직후 돌려준다(DELETE /installation/token). 지난
#     공개본은 토큰 없이 받는다. 받기 걸음에서 명령을 되풀이해 찍지 않는다(set -x · curl -v 를 쓰지 않는다)
#   - 입력은 환경 변수로만 스크립트에 넘긴다(식을 스크립트 안에 펴지 않는다)
#   - Windows 잡의 PowerShell `run:` 안은 ASCII 만 쓴다 — 러너가 스크립트를 BOM 없는 UTF-8 로 적는데 Windows PowerShell 5.1 이
#     ANSI 로 읽는다(AGENTS.md "인코딩"). 그 잡의 bash 걸음은 한글을 써도 된다
#   - Windows 러너를 랩으로 세우는 스크립트 · `-Runner` 는 GitHub 호스팅 러너에서만 돈다(스크립트의 가드 — 개발 PC 에서 멈춘다)

name: Checks
run-name: ${{ inputs.harnesses == 'all' && format('견주기 {0}', inputs.tag) || format('점검 {0} {1}', inputs.tag, inputs.key) }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 점검할 태그(초안 · 견주기면 공개본도)
        required: true
      assets:
        description: "자산 셋의 해시 — '<이름>:<sha256>' 셋을 빈칸으로(ci/batch.sh 의 assets_arg)"
        required: true
      key:
        description: 자산 목록의 sha256 — 줄바꿈 없이(ci/batch.sh 의 assets_key)
        required: true
      harnesses:
        description: changed(지금 Latest 대비 바뀐 룰의 하네스) | all(견주기 — '# 룰:' 줄을 단 하네스 전부)
        type: choice
        options: [changed, all]
        default: changed

permissions: {}

env:
  TAG: ${{ inputs.tag }}
  ASSETS: ${{ inputs.assets }}
  KEY: ${{ inputs.key }}
  HARNESSES: ${{ inputs.harnesses }}

jobs:
  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 하네스 목록이 지금 Latest 의 태그와 이 커밋을 견준다.
          fetch-depth: 0
          persist-credentials: false
      # 지킴 — 룰 출시의 태그 꼴 · 자산 목록의 꼴 · 열쇠 = 목록의 sha256 · 점검(changed)은 그 태그에서만.
      - name: guard
        run: |
          RULES_RE='[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])(\.([2-9]|[1-9][0-9]+))?'
          [[ "$TAG" =~ ^rules-${RULES_RE}(-rc\.[0-9]+)?$ ]] || { echo "::error::태그 $TAG 가 룰 출시의 꼴이 아니다"; exit 1; }
          [[ "$ASSETS" =~ ^remedy-linux-x64\.tar\.gz:[0-9a-f]{64}\ remedy-windows-x64\.zip:[0-9a-f]{64}\ SHA256SUMS:[0-9a-f]{64}$ ]] ||
            { echo "::error::자산 목록이 '<이름>:<sha256>' 셋의 꼴이 아니다"; exit 1; }
          [ "$(printf '%s' "$ASSETS" | sha256sum | cut -d' ' -f1)" = "$KEY" ] || { echo "::error::열쇠가 자산 목록의 sha256 이 아니다"; exit 1; }
          if [ "$HARNESSES" = changed ] && [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::점검은 그 태그에서 부른다(gh workflow run checks.yml --ref $TAG) — 지금 $GITHUB_REF"
            exit 1
          fi
          echo "태그 $TAG · 열쇠 ${KEY:0:12} · 하네스 $HARNESSES · $GITHUB_REF · 커밋 $(git rev-parse --short HEAD)"
      # 초안 받기 — 리눅스 꾸러미 · SHA256SUMS 가 자산 목록의 해시와 같아야 한다. 지난 공개본(지금 Latest)의 이름을 읽은 뒤
      # 잡 토큰을 돌려준다 — 이 뒤로 이 잡은 쓰기 권한이 없다.
      - name: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/new"
          mkdir -p "$d"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern remedy-linux-x64.tar.gz --pattern SHA256SUMS
          for a in remedy-linux-x64.tar.gz SHA256SUMS; do
            want=$(printf '%s\n' $ASSETS | awk -F: -v n="$a" '$1 == n { print $2 }')
            # 표준 입력으로 센다(Windows 잡과 같은 꼴 — 이름으로 주면 역슬래시 경로에서 해시 앞에 '\' 가 붙는다).
            [ "$(sha256sum <"$d/$a" | cut -d' ' -f1)" = "$want" ] || { echo "::error::$a 가 자산 목록의 해시와 다르다"; exit 1; }
          done
          (cd "$d" && grep ' remedy-linux-x64.tar.gz$' SHA256SUMS | sha256sum -c -)
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' https://api.github.com/installation/token || true)
          { echo "PREV=$prev"; echo "TOKEN_REVOKE=$code"; } >>"$GITHUB_ENV"
          echo "초안 받음 · 지난 공개본 $prev · 토큰 돌려주기 HTTP $code(204 = 돌려줌)"
      # 지난 공개본 — 공개 자산이라 토큰 없이 받고 SHA256SUMS 로 잰다.
      - name: previous
        run: |
          p="$RUNNER_TEMP/prev"
          mkdir -p "$p"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$PREV"
          curl -sSfL -o "$p/remedy-linux-x64.tar.gz" "$url/remedy-linux-x64.tar.gz"
          curl -sSfL -o "$p/SHA256SUMS" "$url/SHA256SUMS"
          (cd "$p" && grep ' remedy-linux-x64.tar.gz$' SHA256SUMS | sha256sum -c -)
      # ① 의 하네스(잡이 스스로 셈한다)와 그 하네스 · 필수 점검이 쓰는 이미지(머리의 `# 이미지:` 줄)를 받는다.
      - name: harnesses
        run: |
          base=$PREV
          [ "$HARNESSES" != all ] || base=all
          bash ci/batch.sh harnesses "$base" HEAD linux >"$RUNNER_TEMP/harnesses.txt" 2>"$RUNNER_TEMP/harness-notes.txt" ||
            { cat "$RUNNER_TEMP/harness-notes.txt"; exit 1; }
          echo "하네스 $(wc -l <"$RUNNER_TEMP/harnesses.txt")개"
          cat "$RUNNER_TEMP/harnesses.txt" "$RUNNER_TEMP/harness-notes.txt"
          imgs=$( { cat "$RUNNER_TEMP/harnesses.txt"; echo testbed/harness/linux/emergency-checks.sh; } |
            while IFS= read -r h; do sed -n '1,10{s/^# 이미지: //p}' "$h"; done | tr ' ' '\n' | sed '/^$/d' | sort -u)
          for i in $imgs; do
            docker pull -q "$i" >/dev/null || { echo "::error::$i 를 받지 못했다"; exit 1; }
            echo "받음 $i"
          done
      - name: checks
        run: |
          hargs=()
          while IFS= read -r h; do hargs+=(--harness "$h"); done <"$RUNNER_TEMP/harnesses.txt"
          [ ${#hargs[@]} -gt 0 ] || hargs=(--harness none)
          bash testbed/harness/linux/emergency-checks.sh --new "$RUNNER_TEMP/new/remedy-linux-x64.tar.gz" \
            --prev "$RUNNER_TEMP/prev/remedy-linux-x64.tar.gz" --out "$RUNNER_TEMP/out" "${hargs[@]}"
      # 요약 — ci/batch.sh 가 이 덩이를 승인 전에 보인다(앞 걸음이 실패해도 찍는다).
      - name: summary
        if: ${{ !cancelled() }}
        run: |
          o="$RUNNER_TEMP/out"
          echo "<<<summary linux"
          echo "태그 $TAG · 커밋 $(git rev-parse --short HEAD) · 지난 공개본 ${PREV:-?} · 토큰 돌려주기 HTTP ${TOKEN_REVOKE:-?}"
          cat "$o/summary.txt" 2>/dev/null || echo "(필수 점검이 summary.txt 를 남기지 않았다 — 앞 걸음의 기록을 본다)"
          for f in "$o"/harness*.log; do
            [ -f "$f" ] || continue
            echo "① $(basename "$f" .log) 기록의 끝:"
            tail -n 2 "$f" | sed 's/^/    /'
          done
          for f in "$o"/harness*/checks.tsv; do
            [ -f "$f" ] || continue
            awk -F'\t' -v h="$(basename "$(dirname "$f")")" '$2 != 1 { print "① 실패 칸 " h " — " $1 " · " $3 }' "$f"
          done
          for f in "$o"/scan-all/*.diff; do
            [ -s "$f" ] || continue
            echo "③ 화면 차이 $(basename "$f") — 새 룰의 줄 · 룰 버전 줄뿐인지 본다:"
            sed -n '1,40p' "$f"
          done
          cat "$RUNNER_TEMP/harness-notes.txt" 2>/dev/null || true
          echo ">>>summary linux"

  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # 지킴 — 리눅스 잡과 같다.
      - name: guard
        shell: bash
        run: |
          RULES_RE='[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])(\.([2-9]|[1-9][0-9]+))?'
          [[ "$TAG" =~ ^rules-${RULES_RE}(-rc\.[0-9]+)?$ ]] || { echo "::error::태그 $TAG 가 룰 출시의 꼴이 아니다"; exit 1; }
          [[ "$ASSETS" =~ ^remedy-linux-x64\.tar\.gz:[0-9a-f]{64}\ remedy-windows-x64\.zip:[0-9a-f]{64}\ SHA256SUMS:[0-9a-f]{64}$ ]] ||
            { echo "::error::자산 목록이 '<이름>:<sha256>' 셋의 꼴이 아니다"; exit 1; }
          [ "$(printf '%s' "$ASSETS" | sha256sum | cut -d' ' -f1)" = "$KEY" ] || { echo "::error::열쇠가 자산 목록의 sha256 이 아니다"; exit 1; }
          if [ "$HARNESSES" = changed ] && [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::점검은 그 태그에서 부른다(gh workflow run checks.yml --ref $TAG) — 지금 $GITHUB_REF"
            exit 1
          fi
          echo "태그 $TAG · 열쇠 ${KEY:0:12} · 하네스 $HARNESSES · $GITHUB_REF · 커밋 $(git rev-parse --short HEAD)"
      # 초안 받기 — Windows 꾸러미 · SHA256SUMS. 지난 공개본의 이름을 읽은 뒤 잡 토큰을 돌려준다(리눅스 잡과 같다).
      - name: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/new"
          mkdir -p "$d"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern remedy-windows-x64.zip --pattern SHA256SUMS
          for a in remedy-windows-x64.zip SHA256SUMS; do
            want=$(printf '%s\n' $ASSETS | awk -F: -v n="$a" '$1 == n { print $2 }')
            # 표준 입력으로 센다 — Git Bash 의 RUNNER_TEMP 는 D:\a\_temp 라, 이름으로 주면 GNU sha256sum 이 줄 앞에 '\' 를 붙인다.
            [ "$(sha256sum <"$d/$a" | cut -d' ' -f1)" = "$want" ] || { echo "::error::$a 가 자산 목록의 해시와 다르다"; exit 1; }
          done
          (cd "$d" && grep ' remedy-windows-x64.zip$' SHA256SUMS | sha256sum -c -)
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' https://api.github.com/installation/token || true)
          { echo "PREV=$prev"; echo "TOKEN_REVOKE=$code"; } >>"$GITHUB_ENV"
          echo "초안 받음 · 지난 공개본 $prev · 토큰 돌려주기 HTTP $code(204 = 돌려줌)"
      - name: previous
        shell: bash
        run: |
          p="$RUNNER_TEMP/prev"
          mkdir -p "$p"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$PREV"
          curl -sSfL -o "$p/remedy-windows-x64.zip" "$url/remedy-windows-x64.zip"
          curl -sSfL -o "$p/SHA256SUMS" "$url/SHA256SUMS"
          (cd "$p" && grep ' remedy-windows-x64.zip$' SHA256SUMS | sha256sum -c -)
      - name: harnesses
        shell: bash
        run: |
          base=$PREV
          [ "$HARNESSES" != all ] || base=all
          bash ci/batch.sh harnesses "$base" HEAD windows >"$RUNNER_TEMP/harnesses.txt" 2>"$RUNNER_TEMP/harness-notes.txt" ||
            { cat "$RUNNER_TEMP/harness-notes.txt"; exit 1; }
          echo "하네스 $(wc -l <"$RUNNER_TEMP/harnesses.txt")개"
          cat "$RUNNER_TEMP/harnesses.txt" "$RUNNER_TEMP/harness-notes.txt"
      # ASCII only from here in the PowerShell steps (see the header).
      - name: unpack
        run: |
          foreach ($side in 'new', 'prev') {
            $zip = Join-Path $env:RUNNER_TEMP "$side\remedy-windows-x64.zip"
            $dest = Join-Path $env:RUNNER_TEMP "$side-pkg"
            Expand-Archive -LiteralPath $zip -DestinationPath $dest
            $exe = Get-ChildItem -LiteralPath $dest -Recurse -Filter remedy.exe | Select-Object -First 1
            if (-not $exe) { throw "remedy.exe not found in $zip" }
            $envName = if ($side -eq 'new') { 'PKG' } else { 'PREVPKG' }
            [IO.File]::AppendAllText($env:GITHUB_ENV, ('{0}={1}' -f $envName, $exe.DirectoryName) + "`n")
            '{0} = {1}' -f $envName, $exe.DirectoryName
          }
      # The runner becomes the lab (guarded: GitHub-hosted Windows runner only).
      - name: runner lab
        id: lab
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File testbed\harness\host\Initialize-RunnerLab.ps1
          exit $LASTEXITCODE
      # 2 3 - release files, demo gate, menu harness (no snapshot revert on the runner).
      - name: checks
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File testbed\harness\host\Invoke-EmergencyChecks.ps1 -Runner `
            -Package $env:PKG -Prev $env:PREVPKG -LogDir (Join-Path $env:RUNNER_TEMP 'wchecks')
          exit $LASTEXITCODE
      # 1 - the Windows rule harnesses of the changed rules, inputs from each harness header.
      # Runs even when step 2 3 failed, but only on a runner lab that came up.
      - name: rule harnesses
        if: ${{ !cancelled() && steps.lab.outcome == 'success' }}
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'rule-results.txt'
          [IO.File]::WriteAllText($results, '')
          $fail = 0
          foreach ($h in @(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'harnesses.txt') | Where-Object { $_ })) {
            $base = [IO.Path]::GetFileNameWithoutExtension($h)
            $t0 = Get-Date
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File testbed\harness\host\Invoke-RuleHarness.ps1 -Harness $h `
              -Package $env:PKG -LogDir (Join-Path $env:RUNNER_TEMP "rule-$base") -Inputs (Join-Path $env:RUNNER_TEMP 'inputs')
            $rc = $LASTEXITCODE
            if ($rc -ne 0) { $fail = 1 }
            [IO.File]::AppendAllText($results, ('1 {0} exit={1} seconds={2}' -f $base, $rc, [int]((Get-Date) - $t0).TotalSeconds) + "`n")
          }
          exit $fail
      - name: summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "<<<summary windows"
          echo "태그 $TAG · 커밋 $(git rev-parse --short HEAD) · 지난 공개본 ${PREV:-?} · 토큰 돌려주기 HTTP ${TOKEN_REVOKE:-?}"
          tr -d '\r' <"$RUNNER_TEMP/wchecks/summary.txt" 2>/dev/null || echo "(필수 점검이 summary.txt 를 남기지 않았다 — 앞 걸음의 기록을 본다)"
          tr -d '\r' <"$RUNNER_TEMP/rule-results.txt" 2>/dev/null || true
          for f in "$RUNNER_TEMP"/rule-*/summary.txt; do
            [ -f "$f" ] || continue
            echo "① $(basename "$(dirname "$f")") — 실패 줄과 끝 줄:"
            # 칸 줄은 '<칸 id> 실패  <무엇> — <근거>'(id 는 자리 채움 뒤 빈칸 하나) · 끝 줄은 '판정 N/T · 실패 M'.
            tr -d '\r' <"$f" | grep -E ' 실패  |^판정 ' | sed 's/^/    /' || true
          done
          cat "$RUNNER_TEMP/harness-notes.txt" 2>/dev/null || true
          echo ">>>summary windows"
