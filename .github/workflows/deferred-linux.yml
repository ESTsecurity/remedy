# 미룬 검증의 리눅스 몫 — 리눅스 rc 묶음(testbed/harness/linux/rc-bundle.sh)을 GitHub 호스팅 러너에서 돈다(2026-11-23 ·
# docs/긴급-대응.md "뒤로 미루는 것"). 룰만 바뀐 출시는 rc 묶음을 공개 뒤 24시간 안에 돌아야 하는데, 작업 PC 가 놓인 망에 따라
# 컨테이너가 배포판 저장소(HTTPS)의 인증서를 믿지 못해 설치 경우의 준비가 실패한 일이 있다(같은 날 그 경우를 러너에서 다시 재 통과).
#
# 지금은 손으로 부른다 — 러너가 새로 받는 이미지에는 고친 판이 깔려 java4shell · net-apache 하네스의 기대값이 어긋난다(같은 날
# 러너 실측 51/61 · 24/32 — 룰은 맞게 0). 그 둘을 고정한 뒤 일정(하루 한 번)을 켠다.
#
#   gh workflow run deferred-linux.yml [-f prev=<A 태그>] [-f new=<B 태그>]
#
# 비우면 A = 24시간 전의 Latest(그 시각까지 공개된 가장 새 정식 출시) · B = 지금 Latest — 그 사이 공개된 출시를 한 번에 덮는다
# (*하루치의 기한*). 그보다 오래 밀린 공개가 있거나 다름을 사이 공개본으로 가를 때는 A 를 준다. A 와 B 가 같으면(하루 동안 새
# 공개가 없다) 묶음을 돌지 않고 끝난다.
#
# 판정은 rc-bundle.sh 그대로다(0 = 모두 통과 · 1 = 실패나 다름 · 2 = 준비 모자람) — 잡은 그 종료 코드로 끝난다. 다름은 의도한
# 변경인지 사람이 본다(판정 기준 데이터 룰을 고친 출시의 net-ab 는 그 값이 바꾼 차이만 의도한 변경이다). 결과는 기록과 잡 요약에만
# 남긴다 — 산출물 · 캐시 · 비밀 · 배포 환경을 쓰지 않는다(공개 저장소 · 남의 입력을 돌리는 잡). 공개본은 토큰 없이 받는다.
# Windows 몫(랩 VM rc 묶음 · 콘솔 재캡처)은 랩이 있는 PC 에서, 리눅스 콘솔 재캡처는 WSL2 + docker 가 있는 PC 에서 돈다.
name: deferred linux

on:
  workflow_dispatch:
    inputs:
      prev:
        description: A — 지난 검증본 태그(비우면 24시간 전의 Latest)
        required: false
        default: ''
      new:
        description: B — 견줄 공개본 태그(비우면 지금 Latest)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deferred-linux
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pick A and B
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          IN_PREV: ${{ inputs.prev }}
          IN_NEW: ${{ inputs.new }}
        run: |
          set -eu
          # 정식 출시(초안 · 시험판 빼고)를 공개 시각의 거꾸로
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | "\(.published_at) \(.tag_name)"' | sort -r >"$RUNNER_TEMP/releases.txt"
          new=${IN_NEW:-$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)}
          cut=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          prev=${IN_PREV:-$(awk -v c="$cut" '$1 <= c { print $2; exit }' "$RUNNER_TEMP/releases.txt")}
          echo "A=$prev · B=$new · 24시간 전=$cut"
          if [ -z "$prev" ] || [ -z "$new" ]; then echo "::error::A 나 B 를 정하지 못했다"; exit 1; fi
          { echo "prev=$prev"; echo "new=$new"; } >>"$GITHUB_OUTPUT"
          if [ "$prev" = "$new" ]; then
            echo "A 와 B 가 같다 — 하루 동안 새 공개가 없다" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "run=1" >>"$GITHUB_OUTPUT"
          fi
      - name: download A and B (anonymous)
        if: steps.pick.outputs.run == '1'
        env:
          PREV: ${{ steps.pick.outputs.prev }}
          NEW: ${{ steps.pick.outputs.new }}
        run: |
          set -eu
          for t in "$PREV" "$NEW"; do
            d="$RUNNER_TEMP/rel/$t"
            mkdir -p "$d"
            for f in remedy-linux-x64.tar.gz SHA256SUMS; do
              curl -fsSL --retry 3 -o "$d/$f" "https://github.com/$GITHUB_REPOSITORY/releases/download/$t/$f"
            done
            (cd "$d" && grep ' remedy-linux-x64.tar.gz$' SHA256SUMS | sha256sum -c -)
          done
      - name: free disk
        if: steps.pick.outputs.run == '1'
        run: |
          df -h / | tail -n 1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -n 1
      - name: rc bundle
        if: steps.pick.outputs.run == '1'
        env:
          PREV: ${{ steps.pick.outputs.prev }}
          NEW: ${{ steps.pick.outputs.new }}
        run: |
          set -u
          rc=0
          RC_PULL=1 bash testbed/harness/linux/rc-bundle.sh --new "$RUNNER_TEMP/rel/$NEW/remedy-linux-x64.tar.gz" \
            --prev "$RUNNER_TEMP/rel/$PREV/remedy-linux-x64.tar.gz" --out "$RUNNER_TEMP/rc" >"$RUNNER_TEMP/rc.log" 2>&1 || rc=$?
          {
            echo "### 미룬 검증 · 리눅스 rc 묶음 — A $PREV · B $NEW · 종료 $rc"
            echo '```'
            cat "$RUNNER_TEMP/rc/summary.txt" 2>/dev/null || echo "summary 없음"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/rc/summary.txt" 2>/dev/null || true
          if [ "$rc" != 0 ]; then
            # 다름 · 실패의 근거를 기록에 찍는다(산출물을 쓰지 않는다)
            for f in "$RUNNER_TEMP"/rc/*/diff-*.txt; do
              if [ -s "$f" ]; then echo "── $f"; head -n 20 "$f"; fi
            done
            grep -h 'setup=failed' "$RUNNER_TEMP"/rc/*/summary.txt 2>/dev/null | head -n 20 || true
            # 실패한 하네스 단계의 실패 칸(단계 기록 <결과>/<단계>.log 의 '  실패' 줄 · net-apache 는 'FAIL' 줄)
            sed -n 's/^\([a-z0-9-]*\) 실패 .*/\1/p' "$RUNNER_TEMP/rc/summary.txt" 2>/dev/null | while read -r s; do
              echo "── $s 의 실패 칸"
              grep -E '^ *(실패|FAIL) ' "$RUNNER_TEMP/rc/$s.log" 2>/dev/null | head -n 30 || true
            done
            echo "── 기록의 끝"
            tail -n 40 "$RUNNER_TEMP/rc.log"
          fi
          exit "$rc"
