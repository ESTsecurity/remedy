# 배포 — `v<코어 버전>` 태그를 밀면 앵커를 박은 엔진과 위협 꾸러미를 짓고, 룰에 서명하고,
# 잡 안에서 잰 뒤(기준 5b) **초안** Release 에 올린다. 공개는 조직 Owner 가 한다 —
# 릴리스 전 게이트(G9 · 설계-03 §10)와 내려받은 그 파일의 확인을 마친 뒤에.
#
# 차례는 `docs/operator.md` §9 그대로다 — 앵커를 박아 빌드 → 룰에 서명 → `xtask
# package`. 빌드와 꾸러미는 같은 `REMEDY_TRUST_ANCHOR` 아래에서 한다: `package` 가 그
# 값으로 README 의 쓰는 법을 가른다. 키 · 서명 · 검증은 두 OS 가 `ci/release.sh` 를
# 함께 쓴다.
#
# - 내는 것: Windows x64 위협 꾸러미 `evilai-locust` 와 엔진만 둘 — Windows x64 · Linux
#   x64. 리눅스는 musl 정적이다(설계-01 · `rust-toolchain.toml`).
# - 시험판은 `v<코어 버전>-rc.<N>` 태그다. 같은 차례를 돌고 초안을 **시험판**으로
#   표시한다. 엔진과 README 의 '코어' 줄은 코어 버전 그대로다 — 그 버전의 후보다.
# - 산출물을 잡 사이에 넘기지 않는다. 공개 저장소의 Actions 산출물은 로그인한 누구나
#   받는다 — OS 잡마다 자기 것을 초안에 직접 올린다. 초안은 push 권한자만 본다.
# - 서명 비밀은 Environment `release` 에 있고 `v*` 태그에서 도는 잡만 받는다. 태그는
#   룰셋으로 조직 Owner 만 만든다. 비밀은 서명 단계에만 넣는다 — 서드파티 빌드
#   스크립트는 그 전에 다 돈다.
# - 캐시를 쓰지 않는다 — 배포물은 빈 자리에서 짓는다.
#
# PR 은 배포 경로를 고쳤을 때만 **시험 실행**한다 — 일회용 키로 같은 차례를 돌고
# 아무것도 올리지 않는다. 비밀을 쓰지 않는다.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ci/release.sh
      - xtask/src/package.rs
      - xtask/src/sign.rs
      - xtask/src/staticlink.rs

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PLUGIN: plugins/evilai-locust

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 태그가 코어 버전과 다르면 README 의 '코어' 줄과 Release 이름이 갈린다. 버전은
      # `xtask package` 가 README 에 적는 것과 같은 줄에서 읽는다. 더 받는 것은 시험판
      # 꼬리 `-rc.<N>` 하나다. 따옴표 안의 버전은 글자 그대로 견준다 — `.` 이 아무
      # 글자에나 맞지 않는다.
      - name: tag = v<core version>[-rc.<N>]
        run: |
          version=$(grep -m1 -E '^\s*version' Cargo.toml | cut -d'"' -f2)
          if ! [[ "$GITHUB_REF_NAME" =~ ^v"$version"(-rc\.[0-9]+)?$ ]]; then
            echo "::error::태그 $GITHUB_REF_NAME 가 코어 버전 v$version(시험판은 v$version-rc.<N>)과 다르다"
            exit 1
          fi
      # 다시 돌릴 때를 위해 — 같은 태그의 초안이 있으면 그것에 올리고, 이미 공개된
      # Release 면 건드리지 않고 멈춘다. 시험판 태그의 초안은 시험판으로 만든다 — 누가
      # 공개해도 최신 Release 로 걸리지 않는다.
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = true ]; then
            echo "초안이 이미 있다 — 그것에 올린다"
            exit 0
          fi
          if [ "$state" = false ]; then
            echo "::error::$GITHUB_REF_NAME 는 이미 공개된 Release 다"
            exit 1
          fi
          cat >"$RUNNER_TEMP/notes.md" <<'EOF'
          | 파일 | 무엇 |
          |---|---|
          | `remedy-evilai-locust-win64.zip` | 위협 꾸러미 — 앵커를 박은 `remedy.exe` · 서명된 `evilai-locust` 룰 · `README.txt` |
          | `remedy-windows-x64.zip` | 엔진만 — Windows x64 |
          | `remedy-linux-x64.tar.gz` | 엔진만 — Linux x64 (정적 링크) |

          꾸러미는 통째로 풀어 `README.txt` 의 차례대로 쓴다. 룰의 서명은 엔진에 박힌 공개키로
          확인한다 — `remedy plugin verify --dir plugins/evilai-locust`.
          EOF
          pre=
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then pre=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft $pre --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  release-windows:
    needs: draft
    # 시험 실행에서는 draft 를 건너뛴다 — 그때도 돈다.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 60
    # 태그 실행만 Environment 에 들어가 서명 비밀을 받는다. 빈 이름은 Environment 없음이다.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      PKG: dist/remedy-evilai-locust-win64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: rustc --version && cargo --version
      # 서명 도구를 비밀이 들어오기 전에 짓는다 — 서명 단계는 지어 둔 것을 돌릴 뿐이다.
      - name: xtask
        run: cargo build --locked -p xtask
      - name: public key
        env:
          ANCHOR: ${{ vars.REMEDY_TRUST_ANCHOR }}
        run: bash ci/release.sh pubkey
      - name: build (anchored)
        run: cargo build --release --locked --target "$TARGET" -p remedy-cli
      # 정적 CRT · 네트워크 임포트 — 설정이 무시되면 조용히 동적 링크가 나온다.
      - name: static
        run: cargo xtask static "target/$TARGET/release/remedy.exe"
      - name: sign
        env:
          SECRET_KEY: ${{ secrets.REMEDY_SIGN_SECRET_KEY }}
          SECRET_PASSWORD: ${{ secrets.REMEDY_SIGN_PASSWORD }}
        run: bash ci/release.sh sign "$PLUGIN"
      - name: package
        run: |
          cargo xtask package --plugin "$PLUGIN" --bin "target/$TARGET/release/remedy.exe" \
            --out "$PKG" --public-key "$RELEASE_PUBKEY"
      # 기준 5(b) — 받는 사람이 푸는 그 폴더에서 잰다.
      - name: verify (5b)
        run: |
          bash ci/release.sh readme "$PKG/README.txt"
          bash ci/release.sh verify "$PKG/remedy.exe" "$PKG/plugins/evilai-locust"
      - name: upload to draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && 7z a -tzip ../remedy-evilai-locust-win64.zip remedy-evilai-locust-win64 >/dev/null)
          7z a -tzip remedy-windows-x64.zip "./target/$TARGET/release/remedy.exe" >/dev/null
          gh release upload "$GITHUB_REF_NAME" remedy-evilai-locust-win64.zip remedy-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

  release-linux:
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # wasmtime 의 빌드 스크립트가 C 파일 하나를 musl 로 컴파일한다. cc-rs 는 타깃 접두가
      # 붙은 이름을 먼저 찾는다 — 없으면 `ci/linux-static-docker.sh` 처럼 링크를 건다.
      - name: musl-tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
          if ! command -v x86_64-linux-musl-gcc >/dev/null 2>&1; then
            sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/x86_64-linux-musl-gcc
          fi
          x86_64-linux-musl-gcc --version | head -1
      - name: toolchain
        run: rustc --version && cargo --version
      - name: xtask
        run: cargo build --locked -p xtask
      - name: public key
        env:
          ANCHOR: ${{ vars.REMEDY_TRUST_ANCHOR }}
        run: bash ci/release.sh pubkey
      - name: build (anchored)
        run: cargo build --release --locked --target "$TARGET" -p remedy-cli
      # 정적인가 — 동적 로더(INTERP)와 NEEDED 가 없어야 한다.
      - name: static
        run: |
          file "target/$TARGET/release/remedy" | tee "$RUNNER_TEMP/file.txt"
          grep -qE 'statically linked|static-pie' "$RUNNER_TEMP/file.txt"
      - name: sign
        env:
          SECRET_KEY: ${{ secrets.REMEDY_SIGN_SECRET_KEY }}
          SECRET_PASSWORD: ${{ secrets.REMEDY_SIGN_PASSWORD }}
        run: bash ci/release.sh sign "$PLUGIN"
      # 리눅스 위협 꾸러미는 아직 없다 — 엔진을 잰다(박힌 앵커 · selftest · 반대 확인).
      - name: verify (5b)
        run: bash ci/release.sh verify "target/$TARGET/release/remedy" "$PLUGIN"
      - name: upload to draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf remedy-linux-x64.tar.gz -C "target/$TARGET/release" remedy
          gh release upload "$GITHUB_REF_NAME" remedy-linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
