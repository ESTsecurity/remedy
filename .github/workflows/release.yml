# 배포 — `v<코어 버전>` 태그를 밀면 앵커를 박은 엔진과 그 OS 의 룰 전부를 담은 통합 꾸러미를 짓고,
# 룰에 서명하고, 잡 안에서 잰 뒤(기준 5b) **초안** Release 에 올린다. 공개는 조직 Owner 가 한다 —
# 릴리스 전 게이트(G9 · 설계-03 §10)와 내려받은 그 파일의 확인을 마친 뒤에.
#
# 차례는 `docs/operator.md` §9 그대로다 — 앵커를 박아 빌드 → 룰에 서명 → `xtask
# package`. 빌드와 꾸러미는 같은 `REMEDY_TRUST_ANCHOR` 아래에서 한다: `package` 가 그
# 값으로 README 의 쓰는 법을 가른다. 키 · 서명 · 검증은 두 OS 가 `ci/release.sh` 를
# 함께 쓴다.
#
# - 내는 것: **자산 셋** — OS 마다 통합 꾸러미 하나(`remedy-windows-x64.zip` ·
#   `remedy-linux-x64.tar.gz` — 엔진 + 그 OS 의 룰 전부)와 `SHA256SUMS` 한 장. 룰이 늘어도
#   자산은 늘지 않는다(GitHub 은 릴리스 하나에 자산 1,000 이 상한이다). 그 OS 의 룰은
#   `cargo xtask threats --dirs <os>` 가 매니페스트의 `platforms` 로 고른다.
#   리눅스는 musl 정적이다(설계-01 · `rust-toolchain.toml`).
# - 꾸러미 안에 **동반 프로그램 `remedy-net`** 이 함께 들어간다(설계-04 §1 *동반 모듈*) — 네트워크로
#   하는 점검을 맡는 별도 실행 파일이고, 본체는 서명이 맞는 것만 띄운다. 그래서 그 폴더도 룰과 같은
#   키로 서명하고, 잡 안에서 **본체가 실제로 띄우는지 · 바뀐 것은 띄우지 않는지**를 잰다. 본체와 따로
#   짓는다 — 한 번에 지으면 두 크레이트의 기능이 합쳐져 본체가 혼자 지은 것과 달라질 수 있다.
# - 시험판은 `v<코어 버전>-rc.<N>` 태그다. 같은 차례를 돌고 초안을 **시험판**으로
#   표시한다. 엔진과 README 의 '코어' 줄은 코어 버전 그대로다 — 그 버전의 후보다.
# - 산출물을 잡 사이에 넘기지 않는다. 공개 저장소의 Actions 산출물은 로그인한 누구나
#   받는다 — OS 잡마다 자기 것을 초안에 직접 올리고, 체크섬 잡은 초안에서 받아 잰다.
#   초안은 push 권한자만 본다.
# - 서명 비밀은 Environment `release` 에 있고 `v*` 태그에서 도는 잡만 받는다. 태그는
#   룰셋으로 조직 Owner 만 만든다. 비밀은 서명 단계에만 넣는다 — 서드파티 빌드
#   스크립트는 그 전에 다 돈다.
# - 캐시를 쓰지 않는다 — 배포물은 빈 자리에서 짓는다.
#
# PR 은 배포 경로를 고쳤을 때만 **시험 실행**한다 — 일회용 키로 같은 차례를 돌고
# 아무것도 올리지 않는다. 비밀을 쓰지 않는다.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ci/release.sh
      - xtask/src/package.rs
      - xtask/src/sign.rs
      - xtask/src/staticlink.rs
      - xtask/src/threats.rs
      # 동반 프로그램 — 정적 빌드(musl · 정적 CRT)가 깨지는 것을 태그가 아니라 PR 에서 본다.
      - crates/remedy-net/**
      - crates/remedy-cli/src/net.rs

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 역사와 태그를 다 받는다 — 아래 '새 룰은 마이너' 가 지난 공개본의 태그와 견준다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # 태그가 코어 버전과 다르면 README 의 '코어' 줄과 Release 이름이 갈린다. 버전은
      # `xtask package` 가 README 에 적는 것과 같은 줄에서 읽는다. 더 받는 것은 시험판
      # 꼬리 `-rc.<N>` 하나다. 따옴표 안의 버전은 글자 그대로 견준다 — `.` 이 아무
      # 글자에나 맞지 않는다.
      - name: tag = v<core version>[-rc.<N>]
        run: |
          version=$(grep -m1 -E '^\s*version' Cargo.toml | cut -d'"' -f2)
          if ! [[ "$GITHUB_REF_NAME" =~ ^v"$version"(-rc\.[0-9]+)?$ ]]; then
            echo "::error::태그 $GITHUB_REF_NAME 가 코어 버전 v$version(시험판은 v$version-rc.<N>)과 다르다"
            exit 1
          fi
      # 지난 공개본에 없던 룰 폴더가 있는데 패치만 올렸으면 멈춘다(docs/개발-안내.md "판 번호").
      # 시험판 태그에서도 돈다 — 정식 태그를 밀기 전에 걸린다.
      - name: new rule = minor
        run: bash ci/new-rule-minor.sh
      # 다시 돌릴 때를 위해 — 같은 태그의 초안이 있으면 그것에 올리고, 이미 공개된
      # Release 면 건드리지 않고 멈춘다. 시험판 태그의 초안은 시험판으로 만든다 — 누가
      # 공개해도 최신 Release 로 걸리지 않는다.
      #
      # 본문은 처음 온 사람이 읽는다 — 무엇을 받는지가 맨 앞이다. 위협 표는 README 의 표지
      # 구간을 그대로 옮긴다(`cargo xtask threats` 가 그 구간이 룰과 같은지 매 커밋 본다).
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = true ]; then
            echo "초안이 이미 있다 — 그것에 올린다"
            exit 0
          fi
          if [ "$state" = false ]; then
            echo "::error::$GITHUB_REF_NAME 는 이미 공개된 Release 다"
            exit 1
          fi
          # 맨 위는 이전 버전과 달라진 점이다 — 새 버전 페이지에 온 사람이 먼저 찾는 것이다.
          # 출처는 docs/업데이트-내역.md 의 이 버전 칸 하나다(README 도 그 파일을 가리킨다).
          # 칸이 없으면 멈춘다 — 달라진 점이 빠진 본문을 올리지 않는다.
          version=$(grep -m1 -E '^\s*version' Cargo.toml | cut -d'"' -f2)
          log=docs/업데이트-내역.md
          head="## $version"
          changes=$(awk -v h="$head" 'f && /^## / { exit } f { print } index($0, h " ") == 1 || $0 == h { f = 1 }' "$log" | sed '/./,$!d')
          prev=$(awk -v h="$head" 'f && /^## / { print $2; exit } index($0, h " ") == 1 || $0 == h { f = 1 }' "$log")
          if [ -z "$changes" ]; then
            echo "::error::$log 에 '$head' 칸이 없다 — 이 버전에서 달라진 점을 먼저 적는다"
            exit 1
          fi
          history="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/%EC%97%85%EB%8D%B0%EC%9D%B4%ED%8A%B8-%EB%82%B4%EC%97%AD.md"
          table=$(sed -n '/<!-- threats:begin/,/<!-- threats:end -->/p' README.md | sed '1d;$d')
          if [ -z "$table" ]; then
            echo "::error::README 에 위협 표가 없다 — cargo xtask threats --write"
            exit 1
          fi
          # 리눅스 확인은 `grep | sha256sum -c` 꼴이다 — `--ignore-missing` 은 coreutils 8.25 부터라
          # CentOS 7 급(8.22)이 거부한다. 한국어 환경의 `성공` 은 coreutils 번역 그대로다.
          {
            printf '## 이전 버전과 달라진 점 (%s%s)\n\n%s\n\n버전마다 달라진 점 전부 — [업데이트 내역](%s)\n\n' \
              "${prev:+$prev → }" "$version" "$changes" "$history"
            cat <<'EOF'
          ## 무엇을 받나요

          | 쓰는 곳 | 받을 파일 |
          |---|---|
          | Windows PC · 서버 (64비트) | `remedy-windows-x64.zip` |
          | 리눅스 서버 (64비트) | `remedy-linux-x64.tar.gz` |

          파일 하나에 프로그램과 그 OS 용 룰이 모두 들어 있습니다. 풀면 나오는 폴더의 `README.txt` 에 사용 방법이 있습니다.
          네트워크를 쓰는 *원격 점검* 항목은 함께 든 `remedy-net` 이 맡습니다 — 네트워크를 쓰지 않으려면 풀린 폴더에서 `remedy-net` 폴더를 지우면 됩니다.
          맨 아래 *Source code* 두 개와 *Release attestation (json)* 은 개발 · 검증용입니다 — 받지 않으셔도 됩니다.
          EOF
            printf '\n처음이시면 저장소 첫 화면의 설명부터 읽으십시오 — %s/%s\n\n## 다루는 위협\n\n%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$table"
            cat <<'EOF'

          ## 받은 파일 확인 (권장)

          `SHA256SUMS` 에 두 파일의 SHA-256 이 있습니다. 받은 파일과 같은 폴더에 둔 뒤 아래 명령을 실행하십시오.

          - 리눅스 — `grep linux SHA256SUMS | sha256sum -c` → `remedy-linux-x64.tar.gz: OK` (한국어 환경에서는 `성공`)
          - Windows PowerShell — 아래 한 줄 → `True`

          ```powershell
          (Get-FileHash remedy-windows-x64.zip).Hash -eq (Select-String windows SHA256SUMS).Line.Split(' ')[0]
          ```

          `False` · `FAILED`(한국어 환경에서는 `실패`)가 나오면 실행하지 말고 받은 파일을 지운 뒤 다시 받으십시오.
          EOF
          } >"$RUNNER_TEMP/notes.md"
          pre=
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then pre=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft $pre --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  release-windows:
    needs: draft
    # 시험 실행에서는 draft 를 건너뛴다 — 그때도 돈다.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 60
    # 태그 실행만 Environment 에 들어가 서명 비밀을 받는다. 빈 이름은 Environment 없음이다.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      PKG: dist/remedy-windows-x64
      COMPANION: companion/remedy-net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: rustc --version && cargo --version
      # 서명 도구를 비밀이 들어오기 전에 짓는다 — 서명 단계는 지어 둔 것을 돌릴 뿐이다.
      - name: xtask
        run: cargo build --locked -p xtask
      - name: public key
        env:
          ANCHOR: ${{ vars.REMEDY_TRUST_ANCHOR }}
        run: bash ci/release.sh pubkey
      - name: build (anchored)
        run: cargo build --release --locked --target "$TARGET" -p remedy-cli
      - name: build companion
        run: cargo build --release --locked --target "$TARGET" -p remedy-net
      # 정적 CRT · 네트워크 임포트 — 설정이 무시되면 조용히 동적 링크가 나온다. 본체는 네트워크
      # 임포트가 하나도 없어야 하고, 동반 프로그램은 소켓만 쓴다(OS 의 HTTP 스택은 막는다).
      - name: static
        run: |
          cargo xtask static "target/$TARGET/release/remedy.exe"
          cargo xtask static --companion "target/$TARGET/release/remedy-net.exe"
      - name: sign
        env:
          SECRET_KEY: ${{ secrets.REMEDY_SIGN_SECRET_KEY }}
          SECRET_PASSWORD: ${{ secrets.REMEDY_SIGN_PASSWORD }}
        run: |
          for d in $(cargo xtask threats --dirs windows); do bash ci/release.sh sign "$d"; done
          mkdir -p "$COMPANION"
          cp "target/$TARGET/release/remedy-net.exe" "$COMPANION/"
          bash ci/release.sh sign-companion "$COMPANION"
      - name: package
        run: |
          args=()
          for d in $(cargo xtask threats --dirs windows); do args+=(--plugin "$d"); done
          cargo xtask package "${args[@]}" --bin "target/$TARGET/release/remedy.exe" \
            --companion "$COMPANION" --out "$PKG" --public-key "$RELEASE_PUBKEY"
      # 기준 5(b) — 받는 사람이 푸는 그 폴더에서 룰마다 잰다. 동반 프로그램은 본체가 실제로 띄워 본다.
      - name: verify (5b)
        run: |
          bash ci/release.sh readme "$PKG/README.txt"
          for d in $(cargo xtask threats --dirs windows); do
            bash ci/release.sh verify "$PKG/remedy.exe" "$PKG/plugins/$(basename "$d")"
          done
          bash ci/release.sh verify-companion "$PKG/remedy.exe"
      - name: upload to draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && 7z a -tzip ../remedy-windows-x64.zip remedy-windows-x64 >/dev/null)
          gh release upload "$GITHUB_REF_NAME" remedy-windows-x64.zip --repo "$GITHUB_REPOSITORY" --clobber

  release-linux:
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
    env:
      TARGET: x86_64-unknown-linux-musl
      PKG: dist/remedy-linux-x64
      COMPANION: companion/remedy-net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # wasmtime 의 빌드 스크립트가 C 파일 하나를 musl 로 컴파일한다. cc-rs 는 타깃 접두가
      # 붙은 이름을 먼저 찾는다 — 없으면 `ci/linux-static-docker.sh` 처럼 링크를 건다.
      - name: musl-tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
          if ! command -v x86_64-linux-musl-gcc >/dev/null 2>&1; then
            sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/x86_64-linux-musl-gcc
          fi
          x86_64-linux-musl-gcc --version | head -1
      - name: toolchain
        run: rustc --version && cargo --version
      - name: xtask
        run: cargo build --locked -p xtask
      - name: public key
        env:
          ANCHOR: ${{ vars.REMEDY_TRUST_ANCHOR }}
        run: bash ci/release.sh pubkey
      - name: build (anchored)
        run: cargo build --release --locked --target "$TARGET" -p remedy-cli
      - name: build companion
        run: cargo build --release --locked --target "$TARGET" -p remedy-net
      # 정적인가 — 동적 로더(INTERP)와 NEEDED 가 없어야 한다. 동반 프로그램도 같다.
      - name: static
        run: |
          for bin in remedy remedy-net; do
            file "target/$TARGET/release/$bin" | tee "$RUNNER_TEMP/file-$bin.txt"
            grep -qE 'statically linked|static-pie' "$RUNNER_TEMP/file-$bin.txt"
          done
      - name: sign
        env:
          SECRET_KEY: ${{ secrets.REMEDY_SIGN_SECRET_KEY }}
          SECRET_PASSWORD: ${{ secrets.REMEDY_SIGN_PASSWORD }}
        run: |
          for d in $(cargo xtask threats --dirs linux); do bash ci/release.sh sign "$d"; done
          mkdir -p "$COMPANION"
          cp "target/$TARGET/release/remedy-net" "$COMPANION/"
          bash ci/release.sh sign-companion "$COMPANION"
      # 사고 하나에 룰이 둘일 수 있다(CWPdoor — 점검과 치료). 폴더 이름의 숫자가 안내 모드의 차례다.
      - name: package
        run: |
          args=()
          for d in $(cargo xtask threats --dirs linux); do args+=(--plugin "$d"); done
          cargo xtask package "${args[@]}" --bin "target/$TARGET/release/remedy" \
            --companion "$COMPANION" --out "$PKG" --public-key "$RELEASE_PUBKEY"
      # 기준 5(b) — 받는 사람이 푸는 그 폴더에서 룰마다 잰다. 동반 프로그램은 본체가 실제로 띄워 본다.
      - name: verify (5b)
        run: |
          bash ci/release.sh readme "$PKG/README.txt"
          for d in $(cargo xtask threats --dirs linux); do
            bash ci/release.sh verify "$PKG/remedy" "$PKG/plugins/$(basename "$d")"
          done
          bash ci/release.sh verify-companion "$PKG/remedy"
          cmp "$PKG/remedy" "target/$TARGET/release/remedy"
          cmp "$PKG/remedy-net/remedy-net" "target/$TARGET/release/remedy-net"
          test -x "$PKG/remedy-net/remedy-net"
      # root 가 풀면 tar 에 적힌 소유자가 그대로 남는다 — 러너 사용자(uid 1001)로 담으면 그 uid 의
      # 계정이 실행 파일을 바꿔 다음 `sudo ./remedy` 로 root 를 얻는다(v1.1.0 이 그렇게 나갔다).
      # 소유자를 root 로 적고, 시험 실행에서도 재도록 올리기와 나눈다.
      - name: tarball
        run: |
          tar --owner=0 --group=0 --numeric-owner -czf remedy-linux-x64.tar.gz -C dist remedy-linux-x64
          bad=$(tar -tvzf remedy-linux-x64.tar.gz --numeric-owner | awk '$2 != "0/0"' | wc -l)
          if [ "$bad" != 0 ]; then echo "::error::tar 안에 root 가 아닌 소유자 ${bad}개"; exit 1; fi
      - name: upload to draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" remedy-linux-x64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  # 체크섬 한 장 — 두 꾸러미가 다 올라간 **뒤** 초안에서 받아 잰다. 받은 사람이 쓰는 그 파일의
  # 해시여야 한다(잡 안의 사본이 아니라).
  checksums:
    needs: [release-windows, release-linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern remedy-windows-x64.zip --pattern remedy-linux-x64.tar.gz
          sha256sum remedy-windows-x64.zip remedy-linux-x64.tar.gz >SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
