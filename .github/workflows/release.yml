# 배포 — 태그를 밀면 앵커를 박은 엔진과 그 OS 의 룰 전부를 담은 통합 꾸러미를 짓고, 룰에 서명하고,
# 잡 안에서 잰 뒤(기준 5b) **초안** Release 에 올린다. 공개는 조직 Owner 의 승인 뒤 공개 워크플로
# (`.github/workflows/publish.yml`)가 한다 — 릴리스 전 게이트(G9 · 설계-03 §10)와 내려받은 그 파일의 확인을 마친 뒤에.
#
# 태그는 둘이다(`docs/개발-안내.md` "버전 번호" · `ci/version-check.sh` 가 본다) — 엔진이 바뀐 출시는
# `v<엔진 버전>`(Cargo.toml 의 SemVer · 룰 버전은 주석 태그의 메시지), 룰만 바뀐 출시는 `rules-<룰 버전>`(그 출시를 묶은
# 날 · `ci/batch.sh` 가 고른다). 꾸러미를 꾸리는 차례는 같고 실행 파일이 오는 곳이 다르다 — `v*` 는 이 커밋에서 짓고,
# **`rules-*` 는 짓지 않는다**: 버전 검사가 견준 지금 Latest 의 꾸러미를 받아(체크섬 · 코드서명 · 버전 줄을 잰 뒤) 그
# 엔진으로 이 OS 의 룰을 모두 lint 하고 그 실행 파일을 그대로 싣는다(`ci/release.sh fetch-prev` · `lint`). main 의 엔진이
# Latest 보다 앞서 있어도 된다. 그래서 룰만 바뀐 출시는 태그 push 한 번으로 끝나고 서명하는 기계가 필요 없다 — 받는
# 사람의 Windows 실행 파일은 지금 Latest 와 같은 바이트(같은 코드서명)다.
#
# 차례는 `docs/operator.md` §9 그대로다 — 앵커를 박아 빌드 → 룰에 서명 → `xtask
# package`. 빌드와 꾸러미는 같은 `REMEDY_TRUST_ANCHOR` 아래에서 한다: `package` 가 그
# 값으로 README 의 쓰는 법을 가른다. 키 · 서명 · 검증은 두 OS 가 `ci/release.sh` 를
# 함께 쓴다.
#
# - 내는 것: **자산 셋** — OS 마다 통합 꾸러미 하나(`remedy-windows-x64.zip` ·
#   `remedy-linux-x64.tar.gz` — 엔진 + 그 OS 의 룰 전부)와 `SHA256SUMS` 한 장. 룰이 늘어도
#   자산은 늘지 않는다(GitHub 은 릴리스 하나에 자산 1,000 이 상한이다). 그 OS 의 룰은
#   `cargo xtask threats --dirs <os>` 가 매니페스트의 `platforms` 로 고른다.
#   리눅스는 musl 정적이다(설계-01 · `rust-toolchain.toml`).
# - 꾸러미 안에 **동반 프로그램 `remedy-net`** 이 함께 들어간다(설계-04 §1 *동반 모듈*) — 네트워크로
#   하는 점검을 맡는 별도 실행 파일이고, 본체는 서명이 맞는 것만 띄운다. 그래서 그 폴더도 룰과 같은
#   키로 서명하고, 잡 안에서 **본체가 실제로 띄우는지 · 바뀐 것은 띄우지 않는지**를 잰다. 본체와 따로
#   짓는다 — 한 번에 지으면 두 크레이트의 기능이 합쳐져 본체가 혼자 지은 것과 달라질 수 있다.
# - 시험판은 꼬리 `-rc.<N>` 을 붙인 태그다(`v1.20.0-rc.1` · `rules-2026.11.18-rc.1`). 같은 차례를 돌고
#   초안을 **시험판**으로 표시한다. 엔진과 README 의 '프로그램' · '룰' 줄은 그 버전 그대로다 — 그 버전의 후보다.
# - 산출물을 잡 사이에 넘기지 않는다. 공개 저장소의 Actions 산출물은 로그인한 누구나
#   받는다 — OS 잡마다 자기 것을 초안에 직접 올리고, 체크섬 잡은 초안에서 받아 잰다.
#   초안은 push 권한자만 본다.
# - 서명 비밀은 Environment `release` 에 있고 `v*` · `rules-*` 태그에서 도는 잡만 받는다. 두 태그 모두
#   룰셋(`release-tags`)으로 조직 Owner 만 만든다. 비밀은 서명 단계에만 넣는다 — 서드파티 빌드
#   스크립트는 그 전에 다 돈다.
# - 캐시를 쓰지 않는다 — 배포물은 빈 자리에서 짓는다.
# - **Windows 실행 파일의 코드서명(Authenticode)은 잡 밖에서 한다** — 서명 도구(Azure Trusted Signing)와 그
#   계정이 서명하는 기계에만 있다. 그래서 **엔진이 바뀐 출시(`v*`)의** Windows 는 두 걸음이다(룰만 바뀐 출시는
#   이미 서명된 지난 공개본의 실행 파일을 실어 이 걸음이 없다).
#   1) 태그 실행(첫 걸음)이 지은 `remedy.exe` · `remedy-net.exe` 를 초안에 `unsigned-*` 로 넘기고 멈춘다.
#   2) 서명하는 기계가 그 둘을 받아 서명해 `signed-*` 로 올리고, 이 워크플로를 **같은 태그에서** 다시 부른다
#      (`testbed/harness/host/Invoke-ReleaseCodeSign.ps1` — `gh workflow run release.yml --ref <태그>`).
#   3) 그 실행(둘째 걸음)이 서명본을 잰다 — 지은 그 파일에 서명만 더했는가(`cargo xtask codesign` · 바이트) ·
#      서명이 유효하고 주체가 우리이며 타임스탬프가 있는가. 맞으면 서명본으로 룰 서명 · 꾸러미 · 기준 5(b) · zip ·
#      SHA256SUMS 를 하고 넘긴 파일 넷을 초안에서 지운다.
#   동반 프로그램은 **코드서명한 뒤** 그 해시를 MANIFEST 에 적는다 — 차례가 바뀌면 본체가 띄우지 않는다. 룰 · 동반
#   프로그램의 서명 비밀은 둘째 걸음만 받는다(첫 걸음은 짓고 넘길 뿐이다). 리눅스는 첫 걸음에서 끝난다.
#
# PR 은 배포 경로를 고쳤을 때만 **시험 실행**한다 — 일회용 키로 같은 차례를 돌고
# 아무것도 올리지 않는다. 비밀을 쓰지 않는다. 코드서명은 하지 않는다(서명 전 실행 파일로 돈다).
# 룰만 바뀐 출시의 받기 반쪽도 시험 실행에서 돈다 — 지금 Latest 의 꾸러미를 받아 체크섬 · 코드서명 · 정적 링크를 재고
# 그 본체가 그 동반 프로그램을 띄우는지 본다(`previous release rehearsal`). 받은 실행 파일(배포 키가 박혀 있다)로 이번
# 룰의 서명을 확인하는 것은 배포 키가 있어야 해서 태그 실행에서만 잰다 — 처음 쓸 때는 시험판 태그(`rules-…-rc.1`)로.

name: Release

on:
  push:
    tags: ["v*", "rules-*"]
  # 둘째 걸음 — 엔진이 바뀐 출시(`v*`)를 코드서명한 뒤 같은 태그에서 부른다(첫머리). 그 밖의 자리에서 부르면 Windows
  # 잡이 멈춘다.
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ci/release.sh
      - xtask/src/codesign.rs
      - xtask/src/package.rs
      - xtask/src/sign.rs
      - xtask/src/staticlink.rs
      - xtask/src/threats.rs
      # 동반 프로그램 — 정적 빌드(musl · 정적 CRT)가 깨지는 것을 태그가 아니라 PR 에서 본다.
      - crates/remedy-net/**
      - crates/remedy-cli/src/net.rs

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # 버전 검사가 견준 지금 Latest(지난 공개본) · 이 출시가 싣는 엔진 · 룰 버전 — 두 OS 잡이 쓴다(룰만 바뀐 출시는 그
    # Release 에서 실행 파일을 받는다 · 꾸러미의 룰 버전 파일 · README 의 '프로그램' 줄 · 동반 프로그램의 서명 버전).
    outputs:
      prev: ${{ steps.policy.outputs.prev }}
      engine: ${{ steps.policy.outputs.engine }}
      rules: ${{ steps.policy.outputs.rules }}
    steps:
      # 역사와 태그를 다 받는다 — 아래 버전 검사가 지금 Latest 의 태그와 견준다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # 태그의 꼴과 버전이 정책을 따르는가 — 견주는 것은 **지금 Latest**(gh 로 읽는다 · 2026-11-21 부터)다. Latest 가 이
      # 커밋의 조상인가, 룰이 바뀌었으면 룰 버전을 Latest 보다 올렸는가, 엔진 출시면 엔진이 Latest 가 싣는 엔진과 다르고
      # 버전이 높은가(docs/개발-안내.md "버전 번호"). 룰만 바뀐 출시는 main 의 엔진이 공개본보다 앞서 있어도 선다 — 싣는
      # 엔진은 Latest 의 것이고, 아래 OS 잡이 그 실행 파일로 모든 룰을 lint 한다. 시험판 태그에서도 돈다.
      - name: version policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ci/version-check.sh "$GITHUB_REF_NAME"
      # 룰만 바뀐 출시는 지금 Latest 의 실행 파일을 그대로 싣는다 — 그 Release 가 **공개된 정식 · 불변 Release** 이고 자산
      # 셋이 다 있는지 초안을 만들기 전에 본다. 버전 검사가 gh 의 Latest 를 고르지만(2026-11-21 — 전에는 git 태그로 골라
      # 초안일 수 있었다), 잡의 토큰은 초안도 받으므로 받기 전에 다시 본다 — 공개하지 않은 실행 파일은 싣지 않는다. 불변이
      # 아니면 공개 뒤 자산을 바꿀 수 있어 받은 파일이 공개한 그것이라는 보증이 없다(`ci/release.sh` 의 `fetch-prev` 도 본다).
      - name: previous release
        if: startsWith(github.ref_name, 'rules-')
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.policy.outputs.prev }}
        run: |
          if [ -z "$PREV" ]; then
            echo "::error::지난 정식 공개본이 없다 — 룰만 바뀐 출시가 실을 실행 파일이 없다"
            exit 1
          fi
          state=$(gh release view "$PREV" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,isImmutable,assets \
            --jq '"\(.isDraft) \(.isPrerelease) \(.isImmutable) " + ([.assets[].name] | sort | join(" "))' 2>/dev/null || echo none)
          echo "지난 공개본 $PREV: $state"
          if [ "$state" != "false false true SHA256SUMS remedy-linux-x64.tar.gz remedy-windows-x64.zip" ]; then
            echo "::error::$PREV 가 공개된 정식 · 불변 Release(자산 셋)가 아니다 — 룰만 바뀐 출시가 실을 실행 파일이 없다(지금 Latest 를 바로잡거나 엔진 출시로 낸다)"
            exit 1
          fi
      # 다시 돌릴 때를 위해 — 같은 태그의 초안이 있으면 그것에 올리고, 이미 공개된
      # Release 면 건드리지 않고 멈춘다. 시험판 태그의 초안은 시험판으로 만든다 — 누가
      # 공개해도 최신 Release 로 걸리지 않는다.
      #
      # 본문은 리눅스 잡이 도구를 지은 뒤 채운다(그 잡의 'release notes') — 바뀐 내용은 이 태그가 Latest 뒤에 새로 실은
      # 업데이트 내역 조각(`cargo xtask changes`), 위협 표는 태그 나무의 매니페스트(`cargo xtask threats --print`)에서
      # 짓는데 이 잡에는 도구가 없다. 리눅스 잡은 Windows 잡보다 짧아 그 걸음이 출시를 늦추지 않는다. 그때까지 본문은
      # 아래 표지 한 줄이고, 공개 걸음(.github/workflows/publish.yml)은 그 표지가 남은 초안을 공개하지 않는다.
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ steps.policy.outputs.engine }}
          RULES: ${{ steps.policy.outputs.rules }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = true ]; then
            echo "초안이 이미 있다 — 그것에 올린다"
            exit 0
          fi
          if [ "$state" = false ]; then
            echo "::error::$GITHUB_REF_NAME 는 이미 공개된 Release 다"
            exit 1
          fi
          # Release 이름은 두 버전을 함께, **출시의 종류와 상관없이 한 꼴로** 적는다 — `프로그램 <엔진> · 룰 <룰>`(2026-11-19 ·
          # 전에는 룰만 바뀐 출시가 `룰 … · 프로그램 …` 으로 차례가 거꾸로였고 1.19.1 까지는 태그 그대로였다 — 지난 제목도 이
          # 꼴로 고쳤다). 시험판의 꼬리 `-rc.<N>` 은 태그가 이름 붙인 버전에 붙는다. 엔진은 **싣는 엔진**(룰만 바뀐 출시는
          # Latest 의 것 — 이 나무의 Cargo.toml 이 앞서 있을 수 있다), 룰 버전은 태그(엔진 출시는 주석 태그의 메시지)에서
          # 버전 검사가 읽은 값이다. 다음 출시의 버전 검사가 이 이름을 읽는다 — 꼴을 바꾸지 않는다.
          if [ -z "$ENGINE" ] || [ -z "$RULES" ]; then
            echo "::error::버전 검사가 싣는 엔진 · 룰 버전을 내지 않았다"
            exit 1
          fi
          rc=
          if [[ "$GITHUB_REF_NAME" =~ (-rc\.[0-9]+)$ ]]; then rc=${BASH_REMATCH[1]}; fi
          case "$GITHUB_REF_NAME" in
            rules-*) title="프로그램 $ENGINE · 룰 $RULES$rc" ;;
            *) title="프로그램 $ENGINE$rc · 룰 $RULES" ;;
          esac
          printf '%s\n' '<!-- remedy:notes-pending — 리눅스 잡이 본문을 짓는다. 이 줄이 남은 초안은 공개하지 않는다 -->' >"$RUNNER_TEMP/notes.md"
          pre=
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then pre=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft $pre --verify-tag \
            --title "$title" --notes-file "$RUNNER_TEMP/notes.md"

  # 네 갈래가 한 잡이다 — 시험 실행(PR): 짓고 꾸려 재기만 한다 · 엔진 출시의 첫 걸음(`v*` 태그): 짓고 실행 파일을
  # 넘긴다 · 둘째 걸음(같은 `v*` 태그에서 다시 부름): 서명본을 받아 재고 꾸려 올린다(첫머리 '코드서명') · 룰만 바뀐
  # 출시(`rules-*` 태그 — `REUSE`): 지난 공개본의 서명된 실행 파일을 받아 재고 꾸려 올린다(한 걸음). 꾸리는 단계는 넷이
  # 같다 — `BIN_DIR` 이 지은 자리(시험 실행) · 서명본의 자리(둘째 걸음) · 지난 공개본에서 받은 자리(룰만 바뀐 출시)를
  # 가리킨다.
  release-windows:
    needs: draft
    # 시험 실행 · 둘째 걸음에서는 draft 를 건너뛴다 — 그때도 돈다.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 60
    # 서명 비밀은 꾸려 올리는 실행만 받는다 — 엔진 출시의 둘째 걸음과 룰만 바뀐 출시. Environment 는 배포 태그
    # (`v*` · `rules-*`)의 실행만 들인다. 엔진 출시의 첫 걸음은 짓고 넘길 뿐이라 들어가지 않는다(서드파티 빌드
    # 스크립트가 도는 실행이다). 빈 이름은 Environment 없음이다.
    environment: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref_name, 'rules-'))) && 'release' || '' }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      PKG: dist/remedy-windows-x64
      COMPANION: companion/remedy-net
      # 코드서명의 주체 — 서명본마다 이 이름과 견준다. 서명된 파일마다 들어 있는 공개된 이름이다.
      CODESIGN_SUBJECT: "CN=ESTsecurity Corp., O=ESTsecurity Corp., L=Seoul, C=KR"
      # 룰만 바뀐 출시인가 — 그때는 짓지 않고 지난 공개본(`PREV` — 버전 검사가 견준 지금 Latest)의 실행 파일을 싣는다.
      REUSE: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'rules-') }}
      PREV: ${{ needs.draft.outputs.prev }}
      # 이 출시가 싣는 엔진 · 룰 버전(버전 검사) — 꾸러미의 룰 버전 파일 · README 의 '프로그램' 줄 · 동반 프로그램의 서명
      # 버전 · 실행 파일의 버전 대조가 쓴다(`xtask/src/package.rs` 의 `engine_version`). 시험 실행과 엔진 출시의 둘째 걸음은
      # draft 잡을 건너뛰어 비어 있다 — 그때 엔진은 이 나무의 Cargo.toml 이고 룰 버전은 초안의 이름에서 읽는다.
      ENGINE_VERSION: ${{ needs.draft.outputs.engine }}
      RULES_VERSION: ${{ needs.draft.outputs.rules }}
      REMEDY_ENGINE_VERSION: ${{ needs.draft.outputs.engine }}
    steps:
      # 둘째 걸음은 엔진 출시(`v*`)의 초안에서만 — 다른 자리에서 부르면 아무것도 하지 않고 멈춘다. 룰만 바뀐 출시는
      # 태그 push 한 번으로 끝나 둘째 걸음이 없다.
      - name: release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "둘째 걸음: $GITHUB_REF_NAME" ;;
            refs/tags/rules-*) echo "::error::룰만 바뀐 출시($GITHUB_REF_NAME)에는 둘째 걸음이 없다 — 태그 push 의 실행이 지난 공개본의 서명된 실행 파일로 끝까지 올린다"; exit 1 ;;
            *) echo "::error::둘째 걸음은 엔진 출시의 태그에서 부른다 — gh workflow run release.yml --ref v<버전> ($GITHUB_REF)"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 잠금 파일이 매니페스트와 맞는가를 첫 cargo 호출로 본다 — 시험 실행은 아래 공개키 걸음이 일회용 키를 만드느라
      # 잠금 없이 cargo 를 부르는데, 그 호출이 어긋난 잠금 파일을 조용히 고쳐 쓰면 뒤의 `--locked` 빌드가 모두 지난다.
      - name: toolchain
        run: rustc --version && cargo --version && cargo fetch --locked
      # 공개키를 도구보다 먼저 준비한다 — 도구(xtask)가 기대는 크레이트가 `REMEDY_TRUST_ANCHOR` 를 컴파일할 때 읽어,
      # 그 값이 도구를 지은 뒤에 서면 다음 `cargo xtask` 가 도구를 다시 짓는다. 그 다시 짓기가 서명 비밀이 든 걸음에서
      # 일어나지 않게 한다(시험 실행은 일회용 키를 만드느라 이 걸음에서 도구를 한 번 짓고 아래에서 다시 짓는다).
      - name: public key
        env:
          ANCHOR: ${{ vars.REMEDY_TRUST_ANCHOR }}
        run: bash ci/release.sh pubkey
      # 서명 도구를 비밀이 들어오기 전에 짓는다 — 서명 단계는 지어 둔 것을 돌릴 뿐이다.
      - name: xtask
        run: cargo build --locked -p xtask
      # 이 OS 의 룰 목록 — 비밀이 없는 걸음에서 한 번 뽑아 둔다. 뒤 걸음들이 이 파일을 읽는다(명령 치환을 `for` 의
      # 목록 자리에 두면 실패가 삼켜져, 목록을 못 뽑았는데 룰 0개로 지나간다).
      - name: rule list
        run: |
          cargo xtask threats --dirs windows | tr -d '\r' >target/rule-dirs.txt
          test -s target/rule-dirs.txt
          echo "룰 $(wc -l <target/rule-dirs.txt)개"
      - name: build (anchored)
        if: github.event_name != 'workflow_dispatch' && env.REUSE != 'true'
        run: cargo build --release --locked --target "$TARGET" -p remedy-cli
      - name: build companion
        if: github.event_name != 'workflow_dispatch' && env.REUSE != 'true'
        run: |
          cargo build --release --locked --target "$TARGET" -p remedy-net
          echo "BIN_DIR=target/$TARGET/release" >>"$GITHUB_ENV"
      # 룰만 바뀐 출시 — 지난 공개본의 꾸러미를 받아 체크섬을 재고 실행 파일 둘을 꺼낸다. 코드서명 · 정적 링크 · 버전
      # 줄은 아래 걸음들이 그 파일로 잰다.
      - name: reuse previous executables
        if: env.REUSE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ci/release.sh fetch-prev "$PREV" prev-bin
          {
            echo "BIN_DIR=prev-bin"
            echo "CODESIGN_DIR=prev-bin"
          } >>"$GITHUB_ENV"
      # 정적 CRT · 네트워크 임포트 — 설정이 무시되면 조용히 동적 링크가 나온다. 본체는 네트워크
      # 임포트가 하나도 없어야 하고, 동반 프로그램은 소켓만 쓴다(OS 의 HTTP 스택은 막는다). 지난 공개본에서 받은
      # 파일에도 돈다 — 내보내는 그 바이트를 본다(파일을 읽기만 한다).
      - name: static
        if: github.event_name != 'workflow_dispatch'
        run: |
          cargo xtask static "$BIN_DIR/remedy.exe"
          cargo xtask static --companion "$BIN_DIR/remedy-net.exe"
      # 엔진 출시의 첫 걸음의 끝 — 지은 실행 파일 둘을 초안에 넘기고 멈춘다. 초안은 push 권한자만 본다.
      - name: hand over for code signing
        if: github.event_name == 'push' && env.REUSE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/release.sh handover "$BIN_DIR"
      # 둘째 걸음의 시작 — 넘긴 것과 서명한 것을 초안에서 받아, 서명본이 넘긴 그 파일에 서명만 더한 것인지 바이트로
      # 잰다(`cargo xtask codesign`). 맞으면 서명본이 아래 단계의 실행 파일이다(`BIN_DIR`).
      - name: fetch code-signed
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ci/release.sh fetch-signed signed
          echo "CODESIGN_DIR=signed" >>"$GITHUB_ENV"
      # 싣는 실행 파일로 이 OS 의 룰을 모두 lint 한다(2026-11-21) — 룰만 바뀐 출시는 지난 공개본의 엔진을 싣는데 main 의
      # 엔진은 앞서 있을 수 있다. 그 엔진이 모르는 칸(매니페스트는 모르는 칸을 거부한다) · 그보다 높은 min_core 를 쓴 룰은
      # 여기서 멈춘다 — 그 룰은 그 엔진을 낸 뒤의 출시로 간다. 비밀이 들어오기 전 걸음이다. 경고는 실패가 아니다.
      - name: lint with the shipped engine
        if: env.BIN_DIR != ''
        run: bash ci/release.sh lint "$BIN_DIR/remedy.exe"
      # 시험 실행 — 룰만 바뀐 출시의 받기 반쪽을 지금 Latest 로 돌려 본다: 받기 · 체크섬 · (아래 걸음의) 코드서명 확인 ·
      # 정적 링크 · 그 본체가 그 동반 프로그램을 띄우는가. 받은 것은 이 실행의 꾸러미에 쓰지 않는다. 배포 키가 없어 그
      # 실행 파일로 이번 룰의 서명을 확인하는 것은 여기서 재지 못한다(첫머리). 실제 출시와 같은 차례로 — 토큰이 있는
      # 걸음은 받기만 하고, 받은 실행 파일은 코드서명을 본 뒤 토큰이 없는 걸음에서 돌린다.
      - name: previous release rehearsal — fetch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          bash ci/release.sh fetch-prev "$latest" prev-rehearsal
          echo "CODESIGN_DIR=prev-rehearsal" >>"$GITHUB_ENV"
      # 서명이 유효한가 · 주체가 우리인가 · 타임스탬프가 있는가 — 서명 인증서는 사흘짜리라 타임스탬프가 없으면 사흘 뒤
      # 서명이 무효가 된다. 판정은 OS 가 한다(체인 검증을 직접 짜지 않는다 — `remedy-wintrust` 첫머리). 보는 자리는
      # `CODESIGN_DIR`(앞 걸음이 잡 환경에 쓴다) — 둘째 걸음의 서명본 · 룰만 바뀐 출시가 받은 지난 공개본 · 시험 실행이
      # 받아 본 Latest. 엔진 출시의 첫 걸음(서명 전)만 건너뛴다. 자리가 비면 멈춘다 — 조용히 건너뛰지 않는다.
      - name: check code signature
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || env.REUSE == 'true'
        shell: pwsh
        run: |
          if (-not $env:CODESIGN_DIR) { "::error::코드서명을 볼 자리(CODESIGN_DIR)가 없다"; exit 1 }
          $bad = 0
          foreach ($name in 'remedy.exe', 'remedy-net.exe') {
            $s = Get-AuthenticodeSignature -LiteralPath (Join-Path $env:CODESIGN_DIR $name)
            $who = if ($s.SignerCertificate) { $s.SignerCertificate.Subject } else { '(없음)' }
            $ts = if ($s.TimeStamperCertificate) { $s.TimeStamperCertificate.Subject.Split(',')[0] } else { '(없음)' }
            '{0}: {1} · {2} · 주체 {3} · 타임스탬프 {4}' -f $name, $s.Status, $s.SignatureType, $who, $ts
            if ($s.Status -ne 'Valid' -or $s.SignatureType -ne 'Authenticode' -or $who -ne $env:CODESIGN_SUBJECT -or -not $s.TimeStamperCertificate) {
              "::error::$name 의 코드서명이 맞지 않는다 — 유효 · Authenticode · 주체 '$env:CODESIGN_SUBJECT' · 타임스탬프가 모두 있어야 한다"
              $bad++
            }
          }
          if ($bad) { exit 1 }
      - name: previous release rehearsal — check
        if: github.event_name == 'pull_request'
        run: |
          cargo xtask static prev-rehearsal/remedy.exe
          cargo xtask static --companion prev-rehearsal/remedy-net.exe
          bash ci/release.sh verify-companion prev-rehearsal/package/remedy.exe
      # 룰은 한 번에 서명한다 — 키를 한 번만 푼다(`ci/release.sh` 의 `sign_as`). 동반 프로그램의 폴더는 실행 파일만
      # 가져와 이 커밋의 시각으로 다시 서명한다(지난 공개본에서 받은 실행 파일이어도 같다 — MANIFEST 는 같은 바이트다).
      - name: sign
        if: github.event_name != 'push' || env.REUSE == 'true'
        env:
          SECRET_KEY: ${{ secrets.REMEDY_SIGN_SECRET_KEY }}
          SECRET_PASSWORD: ${{ secrets.REMEDY_SIGN_PASSWORD }}
        run: |
          mapfile -t dirs <target/rule-dirs.txt
          bash ci/release.sh sign "${dirs[@]}"
          mkdir -p "$COMPANION"
          cp "$BIN_DIR/remedy-net.exe" "$COMPANION/"
          bash ci/release.sh sign-companion "$COMPANION"
      # 룰 버전은 저장소에 두지 않는다(2026-11-21 · 출시 때 정한다) — 꾸러미에 넣을 파일을 작업 폴더에 쓴다. 엔진은 화면에
      # 적기만 한다(`remedy_sdk::rules_version`). 시험 실행은 쓰지 않는다(README 의 '룰' 줄 없이 꾸린다).
      - name: rules version
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/release.sh rules-version
      - name: package
        if: github.event_name != 'push' || env.REUSE == 'true'
        run: |
          mapfile -t dirs <target/rule-dirs.txt
          args=()
          for d in "${dirs[@]}"; do args+=(--plugin "$d"); done
          cargo xtask package "${args[@]}" --bin "$BIN_DIR/remedy.exe" \
            --companion "$COMPANION" --out "$PKG" --public-key "$RELEASE_PUBKEY"
      # 기준 5(b) — 받는 사람이 푸는 그 폴더에서 잰다. 룰마다: 박힌 앵커로 확인 · 고친 사본 거부. 잡마다 한 번: 엔진이
      # 도는가 · 다른 키의 서명을 거부하는가(첫 룰로). 동반 프로그램은 본체가 실제로 띄워 본다. 꾸러미의 실행 파일이
      # 꾸린 그것(둘째 걸음이면 서명본 · 룰만 바뀐 출시면 지난 공개본의 그 파일)과 같은 바이트인지, 그 버전 줄이 이
      # 커밋의 엔진 버전인지도 본다.
      - name: verify (5b)
        if: github.event_name != 'push' || env.REUSE == 'true'
        run: |
          bash ci/release.sh readme "$PKG/README.txt"
          mapfile -t dirs <target/rule-dirs.txt
          pkgdirs=()
          for d in "${dirs[@]}"; do pkgdirs+=("$PKG/plugins/$(basename "$d")"); done
          bash ci/release.sh verify "$PKG/remedy.exe" "${pkgdirs[@]}"
          bash ci/release.sh verify-engine "$PKG/remedy.exe" "${pkgdirs[0]}"
          bash ci/release.sh verify-companion "$PKG/remedy.exe"
          bash ci/release.sh engine-version "$PKG/remedy.exe" "$PKG/remedy-net/remedy-net.exe"
          cmp "$PKG/remedy.exe" "$BIN_DIR/remedy.exe"
          cmp "$PKG/remedy-net/remedy-net.exe" "$BIN_DIR/remedy-net.exe"
      - name: upload to draft
        if: github.event_name == 'workflow_dispatch' || env.REUSE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && 7z a -tzip ../remedy-windows-x64.zip remedy-windows-x64 >/dev/null)
          gh release upload "$GITHUB_REF_NAME" remedy-windows-x64.zip --repo "$GITHUB_REPOSITORY" --clobber
          # 코드서명에 넘긴 파일은 엔진 출시의 둘째 걸음에만 있다.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then bash ci/release.sh clear-handover; fi

  release-linux:
    needs: draft
    # 리눅스는 태그 push 의 실행에서 끝난다 — 엔진 출시의 둘째 걸음(코드서명 뒤)에는 돌지 않는다.
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
    env:
      TARGET: x86_64-unknown-linux-musl
      PKG: dist/remedy-linux-x64
      COMPANION: companion/remedy-net
      # 룰만 바뀐 출시인가 — 그때는 짓지 않고 지난 공개본(`PREV` — 버전 검사가 견준 지금 Latest)의 실행 파일을 싣는다.
      REUSE: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'rules-') }}
      PREV: ${{ needs.draft.outputs.prev }}
      # 이 출시가 싣는 엔진 · 룰 버전(버전 검사 · Windows 잡의 같은 줄).
      ENGINE_VERSION: ${{ needs.draft.outputs.engine }}
      RULES_VERSION: ${{ needs.draft.outputs.rules }}
      REMEDY_ENGINE_VERSION: ${{ needs.draft.outputs.engine }}
    steps:
      # 역사와 태그를 다 받는다 — 릴리스 본문의 바뀐 내용이 'Latest 뒤에 새로 든 조각' 이라 그 태그의 트리와 견준다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # wasmtime 의 빌드 스크립트가 C 파일 하나를 musl 로 컴파일한다. cc-rs 는 타깃 접두가
      # 붙은 이름을 먼저 찾는다 — 없으면 `ci/linux-static-docker.sh` 처럼 링크를 건다. 엔진을 짓지 않는 룰만
      # 바뀐 출시에는 필요 없다(도구 xtask 는 호스트 타깃으로 짓는다 — CI 의 리눅스 잡이 이것 없이 짓는다).
      - name: musl-tools
        if: env.REUSE != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
          if ! command -v x86_64-linux-musl-gcc >/dev/null 2>&1; then
            sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/x86_64-linux-musl-gcc
          fi
          x86_64-linux-musl-gcc --version | head -1
      # 잠금 파일 확인이 첫 cargo 호출이다 — Windows 잡의 같은 걸음.
      - name: toolchain
        run: rustc --version && cargo --version && cargo fetch --locked
      # 공개키를 도구보다 먼저 준비한다 — Windows 잡의 같은 걸음에 까닭을 적었다(서명 비밀이 든 걸음에서 도구를 다시
      # 짓지 않게).
      - name: public key
        env:
          ANCHOR: ${{ vars.REMEDY_TRUST_ANCHOR }}
        run: bash ci/release.sh pubkey
      - name: xtask
        run: cargo build --locked -p xtask
      # 지금 Latest 와 견준 룰 잠금 · 조각(2026-11-21) — 파일이 바뀐 룰은 `version` 을 올렸는가 · 버전을 올린 룰마다 Latest
      # 뒤에 더한 조각이 있는가. PR 의 CI 는 병합 바탕과 견주지만 PR 은 갱신 없이 병합하므로, 공개본과 같은 판의 다른 룰이
      # 나가지 않게 출시가 Latest 와 다시 본다(`cargo xtask plugin-lock` · `fragments` · `--base`).
      - name: rules against latest
        if: github.event_name == 'push'
        run: |
          cargo xtask plugin-lock --base "$PREV"
          cargo xtask fragments --base "$PREV"
      # 릴리스 본문 — draft 잡이 표지 한 줄로 만든 초안의 본문을 채운다. 바뀐 내용은 이 태그가 Latest 뒤에 새로 실은
      # 업데이트 내역 조각, 위협 표는 이 태그 나무의 매니페스트에서 짓는다(`ci/release-notes.sh` — 칸이 없거나 꼴이
      # 어긋나면 멈추고, 표지가 남은 초안은 공개 걸음이 공개하지 않는다). 엔진 출시는 첫 걸음에서 채운다(둘째 걸음에는
      # 이 잡이 돌지 않는다).
      - name: release notes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ci/release-notes.sh "$GITHUB_REF_NAME" --prev "$PREV" --engine "$ENGINE_VERSION" \
            --rules "$RULES_VERSION" >"$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          echo "본문: $(wc -l <"$RUNNER_TEMP/notes.md")줄 · $(grep -m1 '^## 2\.' "$RUNNER_TEMP/notes.md")"
      # 이 OS 의 룰 목록 — 비밀이 없는 걸음에서 한 번 뽑아 둔다(Windows 잡의 같은 걸음).
      - name: rule list
        run: |
          # 이 잡의 셸은 pipefail 없이 돈다(`bash -e`) — 목록 명령의 실패가 파이프 뒤에 가려지지 않게 켠다.
          set -o pipefail
          cargo xtask threats --dirs linux | tr -d '\r' >target/rule-dirs.txt
          test -s target/rule-dirs.txt
          echo "룰 $(wc -l <target/rule-dirs.txt)개"
      - name: build (anchored)
        if: env.REUSE != 'true'
        run: cargo build --release --locked --target "$TARGET" -p remedy-cli
      - name: build companion
        if: env.REUSE != 'true'
        run: |
          cargo build --release --locked --target "$TARGET" -p remedy-net
          echo "BIN_DIR=target/$TARGET/release" >>"$GITHUB_ENV"
      # 룰만 바뀐 출시 — 지난 공개본의 꾸러미를 받아 체크섬을 재고 실행 파일 둘을 꺼낸다(Windows 잡의 같은 걸음).
      - name: reuse previous executables
        if: env.REUSE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ci/release.sh fetch-prev "$PREV" prev-bin
          echo "BIN_DIR=prev-bin" >>"$GITHUB_ENV"
      # 정적인가 — 동적 로더(INTERP)와 NEEDED 가 없어야 한다. 동반 프로그램도 같다. 지난 공개본에서 받은 파일에도
      # 돈다 — 내보내는 그 바이트를 본다.
      - name: static
        run: |
          for bin in remedy remedy-net; do
            file "$BIN_DIR/$bin" | tee "$RUNNER_TEMP/file-$bin.txt"
            grep -qE 'statically linked|static-pie' "$RUNNER_TEMP/file-$bin.txt"
          done
      # 싣는 실행 파일로 이 OS 의 룰을 모두 lint 한다(Windows 잡의 같은 걸음에 까닭을 적었다).
      - name: lint with the shipped engine
        run: bash ci/release.sh lint "$BIN_DIR/remedy"
      # 시험 실행 — 룰만 바뀐 출시의 받기 반쪽을 지금 Latest 로 돌려 본다(Windows 잡의 같은 걸음 · 토큰이 있는 걸음은
      # 받기만 하고 받은 실행 파일은 토큰이 없는 걸음에서 돌린다).
      - name: previous release rehearsal — fetch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          bash ci/release.sh fetch-prev "$latest" prev-rehearsal
      - name: previous release rehearsal — check
        if: github.event_name == 'pull_request'
        run: |
          for bin in remedy remedy-net; do
            file "prev-rehearsal/$bin" | tee "$RUNNER_TEMP/file-prev-$bin.txt"
            grep -qE 'statically linked|static-pie' "$RUNNER_TEMP/file-prev-$bin.txt"
          done
          bash ci/release.sh verify-companion prev-rehearsal/package/remedy
      # 룰은 한 번에 서명한다 — 키를 한 번만 푼다(`ci/release.sh` 의 `sign_as`).
      - name: sign
        env:
          SECRET_KEY: ${{ secrets.REMEDY_SIGN_SECRET_KEY }}
          SECRET_PASSWORD: ${{ secrets.REMEDY_SIGN_PASSWORD }}
        run: |
          mapfile -t dirs <target/rule-dirs.txt
          bash ci/release.sh sign "${dirs[@]}"
          mkdir -p "$COMPANION"
          cp "$BIN_DIR/remedy-net" "$COMPANION/"
          bash ci/release.sh sign-companion "$COMPANION"
      # 룰 버전 — 꾸러미에 넣을 파일을 작업 폴더에 쓴다(Windows 잡의 같은 걸음).
      - name: rules version
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/release.sh rules-version
      # 사고 하나에 룰이 둘일 수 있다(CWPdoor — 점검과 치료). 폴더 이름의 숫자가 안내 모드의 차례다.
      - name: package
        run: |
          mapfile -t dirs <target/rule-dirs.txt
          args=()
          for d in "${dirs[@]}"; do args+=(--plugin "$d"); done
          cargo xtask package "${args[@]}" --bin "$BIN_DIR/remedy" \
            --companion "$COMPANION" --out "$PKG" --public-key "$RELEASE_PUBKEY"
      # 기준 5(b) — 받는 사람이 푸는 그 폴더에서 잰다(Windows 잡의 같은 걸음에 무엇을 룰마다 · 잡마다 한 번 재는지
      # 적었다). 동반 프로그램은 본체가 실제로 띄워 본다.
      - name: verify (5b)
        run: |
          bash ci/release.sh readme "$PKG/README.txt"
          mapfile -t dirs <target/rule-dirs.txt
          pkgdirs=()
          for d in "${dirs[@]}"; do pkgdirs+=("$PKG/plugins/$(basename "$d")"); done
          bash ci/release.sh verify "$PKG/remedy" "${pkgdirs[@]}"
          bash ci/release.sh verify-engine "$PKG/remedy" "${pkgdirs[0]}"
          bash ci/release.sh verify-companion "$PKG/remedy"
          bash ci/release.sh engine-version "$PKG/remedy" "$PKG/remedy-net/remedy-net"
          cmp "$PKG/remedy" "$BIN_DIR/remedy"
          cmp "$PKG/remedy-net/remedy-net" "$BIN_DIR/remedy-net"
          test -x "$PKG/remedy-net/remedy-net"
      # root 가 풀면 tar 에 적힌 소유자가 그대로 남는다 — 러너 사용자(uid 1001)로 담으면 그 uid 의
      # 계정이 실행 파일을 바꿔 다음 `sudo ./remedy` 로 root 를 얻는다(v1.1.0 이 그렇게 나갔다).
      # 소유자를 root 로 적고, 시험 실행에서도 재도록 올리기와 나눈다.
      - name: tarball
        run: |
          tar --owner=0 --group=0 --numeric-owner -czf remedy-linux-x64.tar.gz -C dist remedy-linux-x64
          bad=$(tar -tvzf remedy-linux-x64.tar.gz --numeric-owner | awk '$2 != "0/0"' | wc -l)
          if [ "$bad" != 0 ]; then echo "::error::tar 안에 root 가 아닌 소유자 ${bad}개"; exit 1; fi
      - name: upload to draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" remedy-linux-x64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  # 체크섬 한 장 — 두 꾸러미가 다 올라간 **뒤** 초안에서 받아 잰다. 받은 사람이 쓰는 그 파일의
  # 해시여야 한다(잡 안의 사본이 아니라). 도는 때는 둘이다 — 엔진 출시는 Windows 꾸러미가 올라가는 둘째 걸음(리눅스
  # 꾸러미는 첫 걸음이 이미 올려 두었다 — 없으면 받기에서 멈춘다) · 룰만 바뀐 출시는 두 OS 잡이 다 끝난 태그 push 의
  # 실행. 엔진 출시의 첫 걸음에서는 돌지 않는다(Windows 꾸러미가 아직 없다).
  # 조건은 두 잡의 결과를 직접 본다 — `if:` 에 상태 함수가 없으면 암묵의 success() 가 붙는데, 그것은 조상 잡까지
  # 보아 둘째 걸음에서 건너뛴 `draft` · `release-linux` 때문에 이 잡도 건너뛴다(v1.24.0-rc.1 이 그렇게 SHA256SUMS
  # 없이 끝났다).
  checksums:
    needs: [release-linux, release-windows]
    if: ${{ !cancelled() && needs.release-windows.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref_name, 'rules-') && needs.release-linux.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern remedy-windows-x64.zip --pattern remedy-linux-x64.tar.gz
          sha256sum remedy-windows-x64.zip remedy-linux-x64.tar.gz >SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          # 공개할 초안에는 자산 셋만 있어야 한다 — 코드서명에 넘긴 중간 파일이 남으면 공개 전에 멈춘다.
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort | tr '\n' ' ')
          echo "자산: $assets"
          if [ "$assets" != "SHA256SUMS remedy-linux-x64.tar.gz remedy-windows-x64.zip " ]; then
            echo "::error::초안의 자산이 셋(SHA256SUMS · 두 꾸러미)이 아니다: $assets"
            exit 1
          fi
