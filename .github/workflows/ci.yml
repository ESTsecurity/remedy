# CI — `docs/개발-안내.md` "커밋하기 전에" 의 명령을 GitHub 호스팅 러너에서 돈다.
#
# 두 OS 가 PR · `main` 에 병합된 뒤 · 손으로(workflow_dispatch) 모두 돈다 — 공개
# 저장소라 표준 러너가 무료다. 병합 뒤의 실행은 병합된 커밋을 한 번 더 보고 `main`
# 의 캐시를 만든다. PR 의 실행이 받을 수 있는 캐시는 같은 PR 과 `main` 의 것뿐이다 —
# 리눅스가 PR 에서만 돌던 동안은 PR 마다 빈 캐시로 시작했다.
#
# 서식 · 누출 · 의존 검사는 OS 와 상관없어 리눅스에서만 본다. Windows 는
# `cfg(windows)` 코드를 컴파일하는 유일한 자리라 린트와 시험을 다시 돈다.
#
# 액션은 GitHub 이 만든 것만 쓰고 커밋 해시로 고정한다. 툴체인은 러너의 rustup 이
# `rust-toolchain.toml` 을 읽어 받는다.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 조직의 기본 토큰 권한은 쓰기다. 이 워크플로는 읽기만 한다.
permissions:
  contents: read

# 같은 PR 에 새 커밋이 오면 앞 실행을 끊는다 — 끝까지 돌아도 버릴 결과다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # 디버그 정보를 담지 않는다. 담으면 시험 바이너리가 러너 디스크를 채운다 — 첫
  # 실행이 test 단계에서 No space left on device 로 죽었다(리눅스에서 잰 시험
  # 바이너리 64 개가 7.8 GiB · 가장 큰 것 352 MiB 중 254 MiB 가 디버그 정보). 패닉
  # 위치(파일:줄)는 디버그 정보와 상관없이 찍히고, 백트레이스에는 함수 이름이 남는다.
  # RUSTFLAGS 가 아니라서 `.cargo/config.toml` 의 정적 CRT 설정을 덮지 않는다.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    # 걸린 잡이 분을 먹지 않게 하는 상한. 빈 캐시의 실행이 14분 29초(PR #1)와
    # 24분 52초(PR #2)였다 — 단계마다 고르게 느려, 러너 속도가 실행마다 달랐다.
    # 느린 쪽의 두 배쯤을 둔다.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 누출 검사가 모든 커밋의 메시지를 본다 — 얕게 받으면 한 커밋만 본다.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-
      - name: toolchain
        run: rustc --version && cargo --version
      # 가벼운 것부터 — 앞에서 걸리면 무거운 단계에 분을 쓰지 않는다.
      - name: fmt
        run: cargo fmt --all -- --check
      - name: deny
        # 권고(advisories)는 새 공지가 나오면 코드와 상관없이 빨개진다 — 그때는 해당
        # 여부를 평가해 판을 올리거나, `deny.toml` 에 근거와 재검토 조건을 단다.
        # 바이너리는 판과 해시를 고정해 받는다 — `~/.cargo/bin` 은 캐시하지 않아,
        # 소스로 지으면 실행마다 컴파일한다.
        env:
          DENY: cargo-deny-0.20.2-x86_64-unknown-linux-musl
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          curl -sSfL -o "$RUNNER_TEMP/deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$DENY.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C ~/.cargo/bin --strip-components=1 "$DENY/cargo-deny"
          cargo deny check
      - name: leaks
        run: cargo xtask leaks
      - name: xtask all
        run: cargo xtask all
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # 디스크가 찬 일이 있다 — 끝에 남은 자리와 크기를 적어 둔다.
      - name: disk
        if: ${{ !cancelled() }}
        run: |
          nproc
          df -h .
          du -sh target ~/.cargo/registry 2>/dev/null || true

  windows:
    runs-on: windows-2025
    # 빈 캐시의 첫 실행이 26분 54초였다(2026-11-02). 두 배쯤을 둔다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: windows-
      - name: toolchain
        run: rustc --version && cargo --version
      - name: fmt
        run: cargo fmt --all -- --check
      - name: xtask all
        run: cargo xtask all
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: disk
        if: ${{ !cancelled() }}
        run: |
          $env:NUMBER_OF_PROCESSORS
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{ n = 'UsedGB'; e = { [math]::Round($_.Used / 1GB, 1) } }, @{ n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 1) } }
          $bytes = (Get-ChildItem target -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
          'target: {0:N1} GiB' -f ($bytes / 1GB)
