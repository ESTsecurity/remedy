# CI — `docs/개발-안내.md` "커밋하기 전에" 의 명령을 GitHub 호스팅 러너에서 돈다.
#
# 두 OS 가 PR · `main` 에 병합된 뒤 · 손으로(workflow_dispatch) 모두 돈다 — 공개
# 저장소라 표준 러너가 무료다. 병합 뒤의 실행은 병합된 커밋을 한 번 더 보고 `main`
# 의 캐시를 만든다. PR 의 실행이 받을 수 있는 캐시는 같은 PR 과 `main` 의 것뿐이다 —
# 리눅스가 PR 에서만 돌던 동안은 PR 마다 빈 캐시로 시작했다.
#
# 서식 · 누출 · 의존 검사는 OS 와 상관없어 리눅스에서만 본다. Windows 는
# `cfg(windows)` 코드를 컴파일하는 유일한 자리라 린트와 시험을 다시 돈다.
#
# **룰 · 문서 · 하네스만 바뀐 PR 은 가벼운 길로 간다**(`scope` 걸음 · 2026-11-21) — 바뀐 것이 `plugins/` · `docs/` ·
# `README.md` · `testbed/harness/` 안뿐이면 입력이 그대로인 걸음(서식 · 린트 · Windows 의 시험 · 버전 검사 시험)을
# 건너뛴다. 그 걸음들의 입력은 `crates/` · `xtask/` · `ci/` 와 의존 목록이라 결과가 바탕과 같다. 의존 검사(deny)는
# 입력에 시간에 따라 바뀌는 권고 DB 가 있어 돌되 막지 않는다(그 걸음). 룰을 읽는 검사(`leaks` · `xtask all` · 릴리스
# 본문 시험)와 리눅스의 `cargo test` 는 남는다 — 판정 코드에 OS 갈래가 없어 자료를 읽는 시험은 리눅스 한 곳에서 돈다.
# 잰 값(2026-11-21 · 엔진 0줄 PR 10개): 지금 길은 중앙 20.4분이고 그 대부분이 `cargo test`(리눅스 9분 · Windows
# 16분)다.
# - 잡과 그 이름(`linux` · `windows`)은 그대로다 — `main` 룰셋의 필수 검사다. 걸음에만 조건을 건다(잡을 건너뛰면
#   필수 검사가 통과로 세어진다).
# - 조건은 **도는 쪽으로 떨어지게** 적는다(`light != 'true'`) — `scope` 가 값을 못 내면 전부 돈다.
# - PR 이 아닌 실행(main 에 병합된 뒤 · 손으로 `gh workflow run`)은 늘 전부 돈다.
#
# 액션은 GitHub 이 만든 것만 쓰고 커밋 해시로 고정한다. 툴체인은 러너의 rustup 이
# `rust-toolchain.toml` 을 읽어 받는다.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 조직의 기본 토큰 권한은 쓰기다. 이 워크플로는 읽기만 한다.
permissions:
  contents: read

# 같은 PR 에 새 커밋이 오면 앞 실행을 끊는다 — 끝까지 돌아도 버릴 결과다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # 디버그 정보를 담지 않는다. 담으면 시험 바이너리가 러너 디스크를 채운다 — 첫
  # 실행이 test 단계에서 No space left on device 로 죽었다(리눅스에서 잰 시험
  # 바이너리 64 개가 7.8 GiB · 가장 큰 것 352 MiB 중 254 MiB 가 디버그 정보). 패닉
  # 위치(파일:줄)는 디버그 정보와 상관없이 찍히고, 백트레이스에는 함수 이름이 남는다.
  # RUSTFLAGS 가 아니라서 `.cargo/config.toml` 의 정적 CRT 설정을 덮지 않는다.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    # 걸린 잡이 분을 먹지 않게 하는 상한. 빈 캐시의 실행이 14분 29초(PR #1)와
    # 24분 52초(PR #2)였다 — 단계마다 고르게 느려, 러너 속도가 실행마다 달랐다.
    # 느린 쪽의 두 배쯤을 둔다.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 누출 검사가 모든 커밋의 메시지를 본다 — 얕게 받으면 한 커밋만 본다.
          fetch-depth: 0
          persist-credentials: false
      # 가벼운 길인가(첫머리) — PR 의 HEAD 는 시험용 병합 커밋이고 첫 부모가 바탕이다. 허용 목록 밖이 그대로일 때만
      # `light=true` 다. 그 가운데 **이미 있던 룰 폴더를 건드리지 않은** PR(새 룰만 더했거나 문서 · 하네스만 고친 것)은
      # `rescore=false` — 재채점 시험 둘을 건너뛴다. 그 둘은 `testbed/ai-exam`(허용 목록 밖)과 이미 있는 룰 폴더 둘만
      # 읽고(`xtask/src/exam.rs` 의 `REFERENCES`) 리눅스 시험 시간의 3분의 2 를 쓴다. 어느 명령이든 실패하면 값이 서지
      # 않아 전부 돈다.
      - name: scope
        id: scope
        run: |
          light=false
          rescore=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
             git diff --quiet HEAD^1 HEAD -- . ':!plugins' ':!docs' ':!README.md' ':!testbed/harness'; then
            light=true
            # 옮기기 · 이름 바꾸기도 옛 자리를 센다(--no-renames) · 경로는 따옴표 없이 그대로(quotePath) · 이름에 공백이
            # 있어도 줄 단위로 읽는다. 바탕에 있던 `plugins/<폴더>` 안의 파일이 하나라도 바뀌었으면 rescore=true 다.
            if names=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD -- plugins) &&
               base=$(git -c core.quotePath=false ls-tree -d --name-only HEAD^1 plugins/); then
              rescore=false
              while IFS= read -r p; do
                rest=${p#plugins/}
                # plugins/ 바로 아래 파일(옛 룰 버전 파일 · 잠금 — 2026-11-21 에 지웠다)과 빈 줄은 룰 폴더가 아니다.
                case "$rest" in */*) ;; *) continue ;; esac
                if printf '%s\n' "$base" | grep -qxF -- "plugins/${rest%%/*}"; then rescore=true; fi
              done <<<"$names"
            fi
          fi
          { echo "light=$light"; echo "rescore=$rescore"; } | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-
      - name: toolchain
        run: rustc --version && cargo --version
      # 가벼운 것부터 — 앞에서 걸리면 무거운 단계에 분을 쓰지 않는다.
      - name: fmt
        if: steps.scope.outputs.light != 'true'
        run: cargo fmt --all -- --check
      - name: deny
        # 권고(advisories)는 새 공지가 나오면 코드와 상관없이 빨개진다 — 그때는 해당
        # 여부를 평가해 판을 올리거나, `deny.toml` 에 근거와 재검토 조건을 단다.
        # 가벼운 길에서도 돌되 막지 않는다 — 입력에 시간에 따라 바뀌는 권고 DB 가 있어 룰만 바뀐 PR 에서도 새 권고가
        # 보여야 하지만, 엔진과 상관없는 권고가 긴급 룰의 병합을 막지는 않는다(2026-11-19 에 그랬다). 룰만 바뀐 출시는
        # 지난 공개본의 엔진을 그 권고까지 그대로 싣는다 — 엔진을 고칠 일이면 `v` 출시로 낸다.
        continue-on-error: ${{ steps.scope.outputs.light == 'true' }}
        # 바이너리는 판과 해시를 고정해 받는다 — `~/.cargo/bin` 은 캐시하지 않아,
        # 소스로 지으면 실행마다 컴파일한다.
        env:
          DENY: cargo-deny-0.20.2-x86_64-unknown-linux-musl
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          curl -sSfL -o "$RUNNER_TEMP/deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$DENY.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C ~/.cargo/bin --strip-components=1 "$DENY/cargo-deny"
          cargo deny check
      - name: leaks
        run: cargo xtask leaks
      # 룰 잠금 · 업데이트 내역 조각은 git 바탕과 견준다(xtask/src/gitbase.rs). PR 의 실행은 받는 가지와의 병합 바탕, main 에
      # 병합된 뒤의 실행은 **지금 Latest** 다 — 공개본 뒤에 든 변경 전부가 '파일이 바뀐 룰은 버전이 오르고 조각이 있다' 를
      # 지키는지 본다(출시 잡의 같은 확인을 병합 때 먼저). 병합 커밋의 첫 부모와 견주던 판은 잇따른 병합에서 같은 그룹의 기다리던
      # 실행이 밀려 취소되면 마지막 PR 만 봤다(2026-11-21 리허설 — #132 · #133 의 병합 뒤 실행이 취소됐다).
      - name: xtask all
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            REMEDY_BASE=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            export REMEDY_BASE
            echo "바탕: 지금 Latest $REMEDY_BASE"
          fi
          cargo xtask all
      # 릴리스 본문 스크립트(ci/release-notes.sh)는 배포의 초안 잡에서만 돈다 — 태그 때에야 멈추지 않게, 지금 README 의 위협
      # 표 · 룰로 새 꼴 칸의 본문과 멈춤 장치를 PR 에서 본다(2026-11-20).
      - name: release notes script
        run: bash ci/release-notes-test.sh
      # 지금 Latest 의 실행 파일로 모든 룰을 lint 한다(2026-11-21) — 룰만 바뀐 출시는 그 엔진을 싣는다. 공개본 엔진이 읽지
      # 못하는 룰(모르는 칸 · 높은 min_core)이 main 에 들면 다음 룰 출시가 배포 잡의 같은 걸음에서 멈추니 여기서 먼저 막는다.
      # 받는 것은 공개 자산이라 토큰 없이 받고 SHA256SUMS 로 잰다. 엔진을 고친 PR(가벼운 길이 아니다)은 새 엔진이 필요한
      # 룰 고침이 맞을 수 있어 막지 않고 알린다 — 그 룰은 그 엔진을 낸 뒤의 출시로 간다.
      - name: lint with the latest public engine
        continue-on-error: ${{ steps.scope.outputs.light != 'true' }}
        run: |
          d="$RUNNER_TEMP/latest"
          mkdir -p "$d"
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          curl -sSfL -o "$d/remedy-linux-x64.tar.gz" "$url/remedy-linux-x64.tar.gz"
          curl -sSfL -o "$d/SHA256SUMS" "$url/SHA256SUMS"
          (cd "$d" && grep ' remedy-linux-x64.tar.gz$' SHA256SUMS | sha256sum -c -)
          tar -xzf "$d/remedy-linux-x64.tar.gz" -C "$d"
          "$d/remedy-linux-x64/remedy" --version | head -1
          rc=0
          "$d/remedy-linux-x64/remedy" plugin lint plugins/*/plugin.yaml >"$d/lint.txt" 2>&1 || rc=$?
          tail -n 2 "$d/lint.txt"
          if [ "$rc" != 0 ]; then
            grep -E '^plugins/|오류' "$d/lint.txt" | head -40
            echo "::error::지금 Latest 의 엔진이 읽지 못하는 룰이 있다 — 룰만 바뀐 출시로 낼 수 없다(그 엔진을 낸 뒤의 출시로)"
            exit 1
          fi
      # 버전 검사 스크립트(ci/version-check.sh)는 배포의 초안 잡에서만 돈다 — 고치면 태그 때가 아니라 PR 에서 드러나게
      # 그 시험을 여기서 돈다(임시 저장소에 출시 경우를 지어 돌린다 · 약 20초).
      - name: version check script
        if: steps.scope.outputs.light != 'true'
        run: bash ci/version-check-test.sh
      # 묶어 내는 명령(ci/batch.sh)의 판단 — 다음 룰 버전 · 시험판 번호 · 자산 목록의 갈래를 망 없이 합성 값으로 본다.
      - name: batch script
        if: steps.scope.outputs.light != 'true'
        run: bash ci/batch.sh selftest
      - name: clippy
        if: steps.scope.outputs.light != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # 실행 파일에 들어가는 코드는 화면에 `println!` 류로 쓰지 않는다 — 읽는 쪽이 먼저 닫힌 파이프(`| head`)에서
      # 패닉해, 1.21.0 까지는 치료 도중에 7 로 멈췄다. 쓰는 길은 본체의 `outln!` · `screen_err!` 등과 remedy-net 의
      # `crate::outln!` 등이다(`tee::write_screen` · `text::write_screen`). `-p` 로 두 실행 파일을 고르면 그것이
      # 링크하는 작업 공간 크레이트까지 린트를 받는다. 시험 · 예제 · xtask 는 짓지 않고, 빌드 스크립트가 cargo 에
      # 주는 stdout 은 `print_stdout` 이 보지 않는다.
      - name: screen macros
        if: steps.scope.outputs.light != 'true'
        run: cargo clippy -p remedy-cli -p remedy-net -- -D clippy::print_stdout -D clippy::print_stderr -D clippy::dbg_macro
      # 가벼운 길에서도 돈다 — 룰 · 문서 · 하네스를 읽는 시험이 여기 있다(G1 의 청정 코퍼스 · 가이드 예제 · 실기기
      # 증거 · remedy-net 기준 대조).
      - name: test
        if: steps.scope.outputs.light != 'true' || steps.scope.outputs.rescore != 'false'
        run: cargo test --workspace
      # 이미 있던 룰 폴더를 건드리지 않은 가벼운 PR — 재채점 시험 둘만 뺀다(`scope` 걸음). 이름이 바뀌면 그 시험이
      # 다시 돌 뿐이다(느려지는 쪽으로 틀린다).
      - name: test (without re-scoring)
        if: steps.scope.outputs.light == 'true' && steps.scope.outputs.rescore == 'false'
        run: >-
          cargo test --workspace --
          --skip every_recorded_run_still_scores_the_same
          --skip every_threat_has_a_reference_answer_that_passes
      # 룰 서명이 도는가(2026-11-21) — 저장소에 개발 키 서명을 두지 않으므로, 그 자리에서 만든 일회용 키로 룰 폴더 사본을 모두
      # 서명해 시험이 지은 remedy 가 그 공개키로 확인하는지 · 서명 뒤 고친 사본을 거부하는지 · remedy-net 이 그 키로 서명한
      # 판정 기준을 알아보는지 본다. 배포물의 서명은 배포 잡이 배포 키로 따로 잰다(기준 5b).
      - name: sign check
        run: bash ci/sign-check.sh target/debug/remedy target/debug/remedy-net
      # 디스크가 찬 일이 있다 — 끝에 남은 자리와 크기를 적어 둔다.
      - name: disk
        if: ${{ !cancelled() }}
        run: |
          nproc
          df -h .
          du -sh target ~/.cargo/registry 2>/dev/null || true

  windows:
    runs-on: windows-2025
    # 빈 캐시의 첫 실행이 26분 54초였다(2026-11-02). 두 배쯤을 둔다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 바탕(병합 커밋의 첫 부모)까지 받는다 — 아래 `scope` 가 그것과 견준다.
          fetch-depth: 2
          persist-credentials: false
      # 가벼운 길인가 — 리눅스 잡의 같은 걸음(첫머리). 가벼운 길의 Windows 는 `xtask all` 까지만 돈다.
      - name: scope
        id: scope
        shell: bash
        run: |
          light=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
             git diff --quiet HEAD^1 HEAD -- . ':!plugins' ':!docs' ':!README.md' ':!testbed/harness'; then
            light=true
          fi
          echo "light=$light" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: windows-
      - name: toolchain
        run: rustc --version && cargo --version
      - name: fmt
        if: steps.scope.outputs.light != 'true'
        run: cargo fmt --all -- --check
      # 룰 잠금 · 업데이트 내역 조각의 바탕 — 이 잡은 깊이 2 로 받아 태그가 없다. PR 은 병합 ref 의 첫 부모, main 의 실행은
      # 그 자신(바뀐 것 없음)과 견준다 — main 에서 공개본과 견주는 것은 리눅스 잡이다.
      - name: xtask all
        run: cargo xtask all
      - name: clippy
        if: steps.scope.outputs.light != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # 리눅스 잡과 같은 검사 — `cfg(windows)` 코드는 여기서만 컴파일된다.
      - name: screen macros
        if: steps.scope.outputs.light != 'true'
        run: cargo clippy -p remedy-cli -p remedy-net -- -D clippy::print_stdout -D clippy::print_stderr -D clippy::dbg_macro
      - name: test
        if: steps.scope.outputs.light != 'true'
        run: cargo test --workspace
      - name: disk
        if: ${{ !cancelled() }}
        run: |
          $env:NUMBER_OF_PROCESSORS
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{ n = 'UsedGB'; e = { [math]::Round($_.Used / 1GB, 1) } }, @{ n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 1) } }
          $bytes = (Get-ChildItem target -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
          'target: {0:N1} GiB' -f ($bytes / 1GB)
