# Node2Shell 점검 — 리눅스 (CVE-2026-111497 · Brotli 디코더)
#
# **고치지 않는다.** Node.js · Brotli 를 올리는 것은 운영자의 일이다.
#
# # 세 갈래로 본다
#
# 1. **공식 빌드의 `node`**(nodejs.org 의 tar 묶음 · 공식 Docker 이미지 · nvm · fnm · Volta) — SHA-256 으로
#    판을 안다(nodejs.org 가 서명한 SHASUMS256). 22 · 24 · 26 계열은 고친 판(22.23.4 · 24.22.1 · 26.12.1)
#    미만이면 **취약**이고, 지원이 끝난 18.20.8 · 20.20.2 는 든 Brotli(1.1.0)가 영향 범위라 **취약**이다.
#    해시가 맞지 않는 `node` 는 **확인 필요**다 — 단 배포판의 Node.js 패키지가 있으면 그 실행 파일은 패키지의
#    것으로 보고 아래 갈래가 판정한다. 공식 `node` 는 해시 상한(32 MiB)을 넘어 `hash_large` 로 해시한다.
# 2. **배포판 Node.js 패키지** — Debian 이 *미수정* 으로 확인한 판은 **취약**이다. Debian 의 nodejs 는 시스템
#    Brotli(`libbrotli1`)를 쓰므로 그것이 *미수정* 판이어도 **취약**이다. Oracle Linux 8.10 의 모듈(22 · 24)은
#    공지의 수정 판과 견준다 — 공급사가 먼저다(같은 꼴의 모듈 판을 RHEL · Rocky 도 낸다). 그 밖의 Node.js
#    패키지(Ubuntu · RHEL · 다른 저장소 · 기준에 없는 판)는 **확인 필요**다.
# 3. **RHEL · Oracle Linux 8.10 의 시스템 Brotli** 가 수정 판보다 낮고 RPM 의 Node.js 가 있으면 **확인 필요**다
#    — 그 Node.js 가 시스템 Brotli 를 쓰는지(공유 연결)는 이 도구가 재지 못한다.
#
# 공식 해시가 맞아야 판을 믿고, 기준에 없는 계열을 지원 종료 여부만으로 취약이라 하지 않는다.
#
# # 판정 기준의 출처 (공개)
#
# - CVE-2026-111497(CNA Google): Brotli 1.0.3~1.0.10 미만 · 1.1.0~1.1.1 미만 · 1.2.0~1.2.1 미만
# - Node.js 2026-10 보안 릴리스: 22.23.4 · 24.22.1 · 26.12.1
# - Node 공식 해시: nodejs.org 의 서명한 SHASUMS256 — linux-x64 89판 · linux-x64-musl 8판
# - Debian security-tracker CVE-2026-111497 — nodejs · libbrotli1 의 미수정 판
# - Oracle Linux ELSA-2026-500519(nodejs:22) · ELSA-2026-500520(nodejs:24) · RHSA-2026:90501 · ELSA-2026-90501(brotli)
#
# # 이 룰이 보지 않는 것
#
# - 다른 제품 안에 든 Node.js(Electron 앱 · 단일 실행 파일 · 컨테이너 이미지) · 선언한 자리 밖의 `node`
# - 실행 중인 프로세스가 고친 판을 실었는가 — 고친 뒤에는 그 서비스를 다시 시작한다
schema_version: 1
id: node2shell-check-linux
version: 0.1.0
min_core: "1.3.0"   # verdict.unconfirmed · hash_large · rpm_version_lt 가 1.3.0 부터 있다
platforms: [linux]

kind: check

name:
  ko: "Node2Shell 점검 (CVE-2026-111497)"
  en: "Node2Shell check (CVE-2026-111497)"

references:
  - "https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"
  - "CVE-2026-111497"
  - "https://github.com/google/brotli/releases/tag/v1.2.1"
  - "https://security-tracker.debian.org/tracker/CVE-2026-111497"
  - "https://linux.oracle.com/errata/ELSA-2026-500519.html"
  - "https://linux.oracle.com/errata/ELSA-2026-500520.html"
  - "https://access.redhat.com/errata/RHSA-2026:90501"
  - "https://linux.oracle.com/errata/ELSA-2026-90501.html"

# 실행 파일 자리 — `/usr/bin` · `/usr/local/bin` 은 **그 폴더 바로 아래의 `node*` 만** 본다(글롭 뿌리) — 폴더를
# 통째로 해시하지 않는다. tar 묶음 · 버전 관리자의 자리는 버전마다 폴더라 통째로 본다. 사용자 홈은
# `%ALLUSERPROFILES%`(`/home` 아래와 `/root`)로 모든 사용자를 본다.
scan_roots:
  - "/usr/bin/node*"
  - "/usr/local/bin/node*"
  - "/opt/node"
  - "/opt/nodejs"
  - "/usr/local/lib/nodejs"
  - "%ALLUSERPROFILES%/.nvm/versions/node"
  - "%ALLUSERPROFILES%/.local/share/fnm/node-versions"
  - "%ALLUSERPROFILES%/.fnm/node-versions"
  - "%ALLUSERPROFILES%/.volta/tools/image/node"

subjects: [package, file]

# 공식 `node` 는 해시 상한(32 MiB)을 넘는다 — 이 이름만 흘려 읽어 해시한다.
hash_large: ["node"]

