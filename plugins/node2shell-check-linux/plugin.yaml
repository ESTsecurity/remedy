          - "ad19784f7e90ba789a099eccba77ede8dc90a778c424f1c10a70fed3ff903fdc"   # 26.7.0 linux-x64 node-v26.7.0-linux-x64/bin/node (vulnerable)
          - "d76dcb890cf4167c4808df11b362147190b8405ba6cdb67e35fac4594eb2d42b"   # 26.8.0 linux-x64 node-v26.8.0-linux-x64/bin/node (vulnerable)
          - "19235a9b678f84729464c52623f92de130a165452747c6826d3fdc13df3abcc3"   # 26.8.1 linux-x64 node-v26.8.1-linux-x64/bin/node (vulnerable)
          - "8a22a371fd85aecf5411636574309f6380fbc42694aaf0651a089a8ef9c44e52"   # 26.8.2 linux-x64 node-v26.8.2-linux-x64/bin/node (vulnerable)
          - "05757b064ad2a221b41874794da42361c9bab033c7c33c1f1b458c25a7de7e59"   # 26.9.0 linux-x64 node-v26.9.0-linux-x64/bin/node (vulnerable)
          - "ab9c8eecf9f82d6693cdc3accced17034065c8d96213b0aa76a7e803d20ae1da"   # 26.10.0 linux-x64 node-v26.10.0-linux-x64/bin/node (vulnerable)
          - "c445d85bb8886e15bbc85973134274fb190088233b174841b9999dbabfeef9f8"   # 26.11.0 linux-x64 node-v26.11.0-linux-x64/bin/node (vulnerable)
          - "79bec1a885677573483fd5b81b6aa9a8f8993afe12bc74c10ae100d588f58006"   # 26.11.0 linux-x64-musl node-v26.11.0-linux-x64-musl/bin/node (vulnerable)
          - "5a7b8a3cf5ccb57d297519754fd73238f64cf560afd0ef19a2f9bf7384cbb657"   # 26.11.1 linux-x64 node-v26.11.1-linux-x64/bin/node (vulnerable)
          - "1d39736ceb126dee4ea975679f10b6e49214ab165c7aab130612cb59752bd406"   # 26.11.1 linux-x64-musl node-v26.11.1-linux-x64-musl/bin/node (vulnerable)
          - "caa24debe02770c92a70677e2a62ca98890150e7ac1c17bcfe31bcc98cc89943"   # 26.12.0 linux-x64 node-v26.12.0-linux-x64/bin/node (vulnerable)
          - "f536e791055d451fd95e77501b4226552d380f4025b234d7124e8e170290a179"   # 26.12.0 linux-x64-musl node-v26.12.0-linux-x64-musl/bin/node (vulnerable)
          - "08f12d42fb304468e8ee86247fe686aae5b225836ea65e9d6566c11ae6ba2e8e"   # 26.12.1 linux-x64 node-v26.12.1-linux-x64/bin/node (fixed)
          - "c6fa3c4a915da799b59b908e74a34f8f3307b7ec3251b211bc88d452558b3351"   # 26.12.1 linux-x64-musl node-v26.12.1-linux-x64-musl/bin/node (fixed)

  # ── 2. 배포판 Node.js 패키지 ──────────────────────────────────────────────
  - id: node_pkg
    subject: package
    where:
      - { field: name, op: matches, value: '^(nodejs[0-9]*|libnode[0-9]*(t64)?)$' }
  - id: deb_node
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(nodejs|libnode[0-9]+(t64)?)$' }
  # Debian 이 미수정으로 확인한 판(12 · 13 · 14 · sid).
  - id: deb_node_vuln
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: equals, value: nodejs }
        - field: version
          op: in
          value:
            - "18.20.4+dfsg-1~deb12u2"
            - "18.20.4+dfsg-1~deb12u3"
            - "20.19.2+dfsg-1+deb13u2"
            - "20.19.2+dfsg-1+deb13u3"
            - "24.21.0+dfsg+~cs24.13.4-1"
            - "24.22.0+dfsg+~cs24.19.2-2"
  # Debian 의 nodejs 가 쓰는 시스템 Brotli 의 미수정 판(12 · 13 · 14 · sid).
  - id: deb_libbrotli_vuln
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: equals, value: libbrotli1 }
        - { field: version, op: in, value: ["1.0.9-2", "1.1.0-2", "1.2.0-4"] }
  # Oracle Linux 8.10 의 nodejs 모듈 — 공급사 → 계열 → 판.
  - id: ol8_node_vuln
    subject: package
    where:
      all:
        - { field: vendor, op: equals, value: "Oracle America" }
        - { field: name, op: matches, value: '^nodejs' }
        - any:
            - all:
                - { field: version, op: matches, value: '^1:22\.[0-9]+\.[0-9]+-[0-9]+(?:\.[0-9]+)*\.module\+el8\.10\.0\+[0-9]+\+[0-9a-f]{8}$' }
                - { field: version, op: rpm_version_lt, value: "1:22.23.2-2.0.1.module+el8.10.0+91085+97cfd505" }
            - all:
                - { field: version, op: matches, value: '^1:24\.[0-9]+\.[0-9]+-[0-9]+(?:\.[0-9]+)*\.module\+el8\.10\.0\+[0-9]+\+[0-9a-f]{8}$' }
                - { field: version, op: rpm_version_lt, value: "1:24.21.0-1.0.1.module+el8.10.0+91086+e75af208" }
  # 기준 밖의 Node.js 패키지 — `exclude` 는 한 항목씩이라 공급사와 판을 함께 걸 수 없어 **공급사마다**
  # 적는다. Oracle 의 두 계열 줄은 그 공급사 안에서만 빼고, 그 밖의 공급사 · dpkg · apk 는 전부 확인 필요다.
  - id: node_pkg_ol_unknown
    subject: package
    where:
      all:
        - { field: vendor, op: equals, value: "Oracle America" }
        - { field: name, op: matches, value: '^(nodejs[0-9]*|libnode[0-9]*(t64)?)$' }
    exclude:
      - { field: version, op: matches, value: '^1:22\.[0-9]+\.[0-9]+-[0-9]+(?:\.[0-9]+)*\.module\+el8\.10\.0\+[0-9]+\+[0-9a-f]{8}$' }
      - { field: version, op: matches, value: '^1:24\.[0-9]+\.[0-9]+-[0-9]+(?:\.[0-9]+)*\.module\+el8\.10\.0\+[0-9]+\+[0-9a-f]{8}$' }
  - id: node_pkg_other
    subject: package
    where:
      - { field: name, op: matches, value: '^(nodejs[0-9]*|libnode[0-9]*(t64)?)$' }
    exclude:
      - { field: vendor, op: equals, value: "Oracle America" }

  # ── 3. RHEL · Oracle Linux 8.10 의 시스템 Brotli ─────────────────────────
  - id: rpm_node
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: rpm }
        - { field: name, op: matches, value: '^(nodejs[0-9]*|libnode[0-9]*)$' }
  - id: rpm_brotli_vuln
    subject: package
    where:
      all:
        - { field: vendor, op: in, value: ["Red Hat, Inc.", "Oracle America"] }
        - { field: name, op: equals, value: brotli }
        - { field: version, op: matches, value: '^(?:0:)?1\.0\.[0-9]+-[0-9]+\.el8_10(?:\.[0-9]+)?$' }
        - { field: version, op: rpm_version_lt, value: "0:1.0.6-5.el8_10" }

verdict:
  require: "node_vuln or deb_node_vuln or (deb_libbrotli_vuln and deb_node) or ol8_node_vuln"
  unconfirmed:
    - when: "node_unknown and not node_pkg"
      why:
        ko: "공식 Node.js 빌드의 해시와 맞지 않는 node 실행 파일입니다(기준에 없는 판 · 다른 빌드) — 판과 받은 곳을 확인하고 22.23.4 · 24.22.1 · 26.12.1 이상인지 보십시오"
        en: "a node executable that does not match an official Node.js build hash (an uncovered version or another build) - check its version and origin, and whether it is 22.23.4, 24.22.1, 26.12.1 or later"
    - when: "node_pkg_ol_unknown or node_pkg_other"
      why:
        ko: "공급사 수정 판 기준이 없는 Node.js 패키지입니다(다른 저장소이거나 기준에 없는 배포판 · 계열) — 그 공급사에 CVE-2026-111497 의 패치 여부를 확인하십시오"
        en: "a Node.js package with no vendor fix baseline (another repository, or an uncovered distribution or line) - confirm with that vendor whether CVE-2026-111497 is patched"
    - when: "rpm_brotli_vuln and rpm_node"
      why:
        ko: "시스템 Brotli 가 공급사 수정 판보다 낮습니다 — 이 Node.js 가 시스템 Brotli 를 쓰면 영향을 받습니다. brotli 패키지를 올리십시오"
        en: "the system Brotli is below the vendor fix - this Node.js is affected if it uses the system Brotli; update the brotli package"
