# Apache HTTP/2 점검 — Windows (CVE-2026-119618)
#
# Apache HTTP Server 의 mod_http2 가 assign_headers() 에서 힙을 망가뜨려 인증 없이 원격 코드 실행이 된다(critical ·
# Red Hat CVSS 9.8). 상류는 2.4.55 ~ 2.4.70 이 영향이고 2.4.71 이 고쳤다(2026-11-11). **고치지 않는다** — 판을 올리는
# 것은 설치한 사람의 일이다. 리눅스는 `apache-http2-check-linux` 가 본다.
#
# # Windows 의 Apache — 상류 판을 그대로 담는다
#
# 상류는 Windows 실행 파일을 내지 않는다. 받는 곳은 Apache Lounge(`C:\Apache24` 에 푸는 zip)와 Apache 를 묶어 내는
# 꾸러미(XAMPP · WampServer · Laragon)다. 배포판처럼 번호를 두고 고치지 않으므로 **서버 판으로 가른다** — 리눅스 룰의
# 직접 빌드와 같다.
#
# | 받는 곳 | 고친 판 (2026-11-14 확인) |
# |---|---|
# | Apache Lounge | 2.4.71 — `httpd-2.4.71-261112-Win64-VS18.zip`(2026-11-12) |
# | XAMPP for Windows | **아직 없다** — 8.5.12 · 8.4.27 · 8.3.36 이 모두 Apache 2.4.65 를 묶는다. HTTP/2 를 끄거나(Protocols 에서 h2 · h2c 를 뺀다) Apache 를 2.4.71 로 바꾼다 |
#
# 판은 `libhttpd.dll` 의 서버 판 문자열로 읽는다(`rules/apache.yar`). `mod_http2.so` 의 모듈 판은 쓰지 않는다 — 고친
# 2.4.71 의 모듈도 `2.0.42` 로, 영향 범위인 별도 mod_h2 의 마지막 판과 번호가 같다(Apache Lounge 2.4.71 실측).
#
# # 판정 — 설치본마다
#
# | 무엇 | 결과 |
# |---|---|
# | 설치본의 서버 판이 2.4.55 ~ 2.4.70 이고 그 설치본의 설정에 HTTP/2 를 켠 흔적(LoadModule http2_module + Protocols 의 h2 · h2c)이 있다 | 취약(2) |
# | 판은 취약인데 그 설치본의 설정에서 HTTP/2 를 켠 흔적을 다 찾지 못했다 | 확인 필요(6) — Include 로 다른 자리의 설정을 읽을 수 있다 |
# | 설치본의 `libhttpd.dll` 에서 서버 판을 읽지 못했다 | 확인 필요(6) |
# | 아래 자리 밖의 Apache 가 서비스로 있거나 돈다 | 확인 필요(6) — 그 판은 보지 않았다 |
# | 고친 판 · 영향 없는 판(2.4.54 이하 · 2.2) · Apache 없음 | 0 |
#
# **HTTP/2 를 켜야 닿는다** — Red Hat 공지(RHSB-2026-017): 악용에는 mod_http2 적재 · Protocols 의 h2 또는 h2c · 네트워크
# 노출 셋이 다 필요하다. Windows 빌드의 기본 설정은 켜지 않는다 — Apache Lounge 2.4.71 은 `# LoadModule http2_module` 이
# 주석이고 `Protocols` 가 없다(실측). 그래서 영향 판을 기본 설정 그대로 두었으면 확인 필요다.
#
# **설치본마다 가른다** — 한 기계에 XAMPP · WampServer · Apache Lounge 가 함께 깔리는 일이 흔하다. 설치본(`libhttpd.dll` 의
# 두 단계 위 폴더)마다 그 아래 `conf` 의 줄만 본다 — 다른 설치본의 HTTP/2 설정으로 취약을 세우지 않는다.
#
# # 이 룰이 보지 않는 것
#
# - 아래 자리 밖에 풀어 두기만 한 Apache(서비스도 아니고 돌지도 않는다)
# - 설치본 밖의 설정 — Include 로 읽는 다른 자리. 흔적을 못 찾으면 확인 필요로 돌린다
# - 별도 mod_h2 로 갈아 끼운 `mod_http2.so` — 모듈 판 번호로는 고친 것을 가를 수 없다(위)
# - TLS 개인키 — 실행 파일은 `libhttpd.dll` 만, 설정은 줄 단위로 설정 접미사(`.conf` 등)만 읽는다. `conf\private` 의 키는 읽지 않는다
schema_version: 1
id: apache-http2-check-windows
version: 0.1.0
min_core: "1.13.0"  # label 은 1.13.0 · file_names 는 1.11.0
platforms: [windows]

kind: check

name:
  ko: "Apache HTTP/2 점검 (CVE-2026-119618)"
  en: "Apache HTTP/2 check (CVE-2026-119618)"

references:
  - "https://httpd.apache.org/security/vulnerabilities_24.html"
  - "CVE-2026-119618"
  - "https://access.redhat.com/security/vulnerabilities/RHSB-2026-017"
  - "https://www.apachelounge.com/download/"
  - "https://www.apachefriends.org/download.html"

# 흔한 설치 자리 — Apache Lounge(`C:\Apache24`) · 옛 설치 프로그램 · XAMPP · WampServer · Laragon(PHP 점검 룰과 같은 자리).
# 상한은 설치 폴더이고 subject 마다 `bin` · `conf` 로 좁힌다 — 웹 문서(htdocs) · 로그는 읽지 않는다. 설치 폴더를 상한에 두는
# 까닭: 설치본마다 가르는 `from` 이 그 폴더를 가리킨다(상한 밖이면 그 그룹이 빠진다). WampServer · Laragon 은 판마다 폴더가
# 따로라(`apache2.4.65` · `httpd-2.4.65-…`) 그 위를 적는다. 린트의 경고 하나(`C:\Apache24` 깊이 2)가 이 줄이다 — 읽는 것은
# 아래 `subject_roots` 의 `bin` · `conf` 뿐이다.
scan_roots:
  - 'C:\Apache24'
  - 'C:\Program Files\Apache Software Foundation\Apache2.4'
  - 'C:\xampp\apache'
  - 'C:\wamp64\bin\apache'
  - 'C:\wamp\bin\apache'
  - 'C:\laragon\bin\apache'
subject_roots:
  file:
    - 'C:\Apache24\bin'
    - 'C:\Program Files\Apache Software Foundation\Apache2.4\bin'
    - 'C:\xampp\apache\bin'
    - 'C:\wamp64\bin\apache'
    - 'C:\wamp\bin\apache'
    - 'C:\laragon\bin\apache'
  text_config:
    - 'C:\Apache24\conf'
    - 'C:\Program Files\Apache Software Foundation\Apache2.4\conf'
    - 'C:\xampp\apache\conf'
    - 'C:\wamp64\bin\apache'
    - 'C:\wamp\bin\apache'
    - 'C:\laragon\bin\apache'
# 이 이름만 기록 · 해시한다 — 서버 판을 담은 DLL 하나.
file_names: ["libhttpd.dll"]
subjects: [file, text_config, service, process]

detect:
  # ── 설치본 — libhttpd.dll 하나가 설치본 하나다 ──────────────────────────────────────
  #
  # 아래 판 · 설정 규칙은 모두 이 설치본의 폴더(`bin` 의 한 단계 위) 안에서만 본다.
  - id: install
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\bin\\libhttpd\.dll$' }
        - { field: sha256, op: exists }
    capture:
      root: 'path | dirname | dirname'
    label:
      ko: "Apache 설치본입니다(서버 판을 담은 DLL)"
      en: "an Apache installation (the DLL that holds the server version)"

  # ── 판 — libhttpd.dll 의 서버 판 문자열 ────────────────────────────────────────────
  - id: affected
    subject: file
    from: '${install.root}'
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\bin\\libhttpd\.dll$' }
        - { yara: "rules/apache.yar:apache_version_affected" }
    label:
      ko: "Apache 2.4.55 ~ 2.4.70 — CVE-2026-119618 · 2.4.71 이상으로 올리십시오(XAMPP 는 아직 고친 판이 없어 HTTP/2 를 꺼야 합니다)"
      en: "Apache 2.4.55 - 2.4.70 - CVE-2026-119618, upgrade to 2.4.71 or later (XAMPP has no fixed release yet, so turn HTTP/2 off)"
  # 서버 판 문자열이 아예 없는 빌드 — 판을 모른다. YARA 를 재지 못하면 빼지 못해 이 규칙이 선다(확인 필요 쪽).
  - id: unknown
    subject: file
    from: '${install.root}'
    where:
      - { field: path, op: matches, value: '(?i)\\bin\\libhttpd\.dll$' }
    exclude:
      - { yara: "rules/apache.yar:apache_version_any" }
    label:
      ko: "이 DLL 에서 Apache 서버 판을 읽지 못했습니다"
      en: "no Apache server version could be read from this DLL"

  # ── HTTP/2 를 켠 흔적 — 그 설치본의 설정 줄 ─────────────────────────────────────────
  #
  # 줄 머리의 공백 뒤에서 시작하는 것만 센다 — `#` 으로 시작하는 줄(주석)은 아니다. Apache 는 지시어 이름의 대소문자를
  # 가리지 않는다. `Protocols` 의 값은 공백으로 나뉘고 순서는 상관없다 — `ProtocolsHonorOrder` 는 다른 지시어다.
  # `conf\original` 은 설치할 때의 사본이라 보지 않는다.
  - id: h2_module
    subject: text_config
    from: '${install.root}'
    where:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+http2_module\s' }
    exclude:
      - { field: path, op: matches, value: '(?i)\\conf\\original\\' }
    label:
      ko: "HTTP/2 모듈(mod_http2)을 싣는 줄입니다"
      en: "this line loads the HTTP/2 module (mod_http2)"
  - id: h2_protocols
    subject: text_config
    from: '${install.root}'
    where:
      - { field: line, op: matches, value: '(?i)^\s*Protocols\s+([^#]*\s)?h2c?(\s|$)' }
    exclude:
      - { field: path, op: matches, value: '(?i)\\conf\\original\\' }
    label:
      ko: "HTTP/2(h2 · h2c)를 켜는 Protocols 줄입니다"
      en: "a Protocols line turns HTTP/2 (h2, h2c) on"

  # ── 위 자리 밖의 Apache — 서비스 · 실행 중 ─────────────────────────────────────────
  #
  # 그 Apache 의 파일은 읽지 않는다(상한 밖이다) — 있다는 것만 알리고 확인 필요로 둔다. 서버에서는 Apache 가 서비스로
  # 돈다(`httpd.exe -k install` 이 `Apache2.4` 서비스를 만든다).
  - id: outside_service
    subject: service
    where:
      - { field: image_path, op: matches, value: '(?i)\\httpd\.exe' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^"?(c:\\apache24|c:\\program files\\apache software foundation\\apache2\.4|c:\\xampp\\apache|c:\\wamp64\\bin\\apache\\[^\\"]+|c:\\wamp\\bin\\apache\\[^\\"]+|c:\\laragon\\bin\\apache\\[^\\"]+)\\bin\\httpd\.exe' }
    label:
      ko: "이 룰이 보는 자리 밖의 Apache 서비스입니다"
      en: "an Apache service outside the places this rule reads"
  - id: outside_process
    subject: process
    where:
      - { field: image_path, op: matches, value: '(?i)\\httpd\.exe$' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^(c:\\apache24|c:\\program files\\apache software foundation\\apache2\.4|c:\\xampp\\apache|c:\\wamp64\\bin\\apache\\[^\\]+|c:\\wamp\\bin\\apache\\[^\\]+|c:\\laragon\\bin\\apache\\[^\\]+)\\bin\\httpd\.exe$' }
    label:
      ko: "이 룰이 보는 자리 밖에서 도는 Apache 입니다"
      en: "an Apache running outside the places this rule reads"

verdict:
  require: "install and affected and h2_module and h2_protocols"
  unconfirmed:
    - when: "install and affected and not (h2_module and h2_protocols)"
      why:
        ko: "Apache(위 경로)가 CVE-2026-119618 의 취약 판(2.4.55 ~ 2.4.70)인데, 그 설치본의 설정에서 HTTP/2 를 켠 흔적(LoadModule http2_module 과 Protocols 의 h2 · h2c)을 다 찾지 못했습니다 — Include 로 읽는 다른 설정을 확인하거나 2.4.71 이상으로 올리십시오"
        en: "Apache (path above) is a build vulnerable to CVE-2026-119618 (2.4.55 - 2.4.70), but not every sign of HTTP/2 being on (LoadModule http2_module and h2 or h2c in Protocols) was found in that installation's settings - check any other settings read with Include, or upgrade to 2.4.71 or later"
    - when: "unknown"
      why:
        ko: "Apache(위 경로)의 libhttpd.dll 에서 서버 판을 읽지 못했습니다 — httpd.exe -v 로 판을 확인하십시오(2.4.55 ~ 2.4.70 이면 CVE-2026-119618 의 영향을 받습니다)"
        en: "the server version could not be read from Apache's libhttpd.dll (path above) - check the version with httpd.exe -v (2.4.55 - 2.4.70 is affected by CVE-2026-119618)"
    - when: "outside_service or outside_process"
      why:
        ko: "이 룰이 보는 자리(C:\\Apache24 · XAMPP · WampServer · Laragon) 밖의 Apache(위 경로)가 서비스로 있거나 돌고 있어 그 판을 보지 않았습니다 — httpd.exe -v 로 판을 확인하십시오(2.4.55 ~ 2.4.70 이면 CVE-2026-119618 의 영향을 받습니다)"
        en: "an Apache (path above) outside the places this rule reads (C:\\Apache24, XAMPP, WampServer, Laragon) is a service or is running, so its version was not checked - check it with httpd.exe -v (2.4.55 - 2.4.70 is affected by CVE-2026-119618)"

# YARA 는 본문을 본다 — 설치본마다 libhttpd.dll 하나(약 0.5 MB · `ref` 형의 상한은 기본 8 MB). 판마다 폴더 이름이 다른
# WampServer · Laragon 에는 글롭(마지막 성분만 와일드카드)이 닿지 않아, 경로 규칙 `install` 이 고른 파일의 본문을 담는다.
collect_extra:
  - { ref: install, content: true }
