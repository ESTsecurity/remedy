  - { glob: "/usr/lib64/tls/libkeystats*", max_size: 1MB }
  - { glob: "/usr/lib64/tls/libkeyctl*", max_size: 1MB }
  - { glob: "/usr/lib64/tls/librwctl*", max_size: 1MB }
  - { glob: "/usr/lib64/tls/libllz564*", max_size: 1MB }
  - { glob: "/usr/lib/x86_64-linux-gnu/libkeyutils*", max_size: 1MB }
  - { glob: "/usr/lib/x86_64-linux-gnu/libns2*", max_size: 1MB }
