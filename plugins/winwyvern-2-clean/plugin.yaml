# WinWyvern — 취약 드라이버 NeacSafe64(CVE-2025-45737)를 부팅마다 자동으로 올리는 서비스 `NeacSafe64` 를 없앤다.
#
# 판정은 winwyvern-1-check 와 같다(같은 위협의 두 룰 — 서비스 and 드라이버 파일 · cwpdoor-2-clean 선례). 1차 출처는 ASEC 의
# 보고 하나다(references 두 줄 — 한국어판 · 영문판). 지표는 그 보고에 있는 것만 쓴다.
#
# 치료는 하나다 — 서비스 `NeacSafe64` 를 엔진이 정한 차례로 없앤다(복구 동작 제거 → 정지 → 사용 안 함 → 삭제 · 설계-03 §2).
# 서비스의 정의 키는 하위 트리째(`Instances` 포함) 백업되어 `restore` 로 돌아온다. 돌아온 서비스는 PC 를 다시 시작해야 서비스
# 관리자가 다시 안다(RELEASE.md).
#
# **드라이버 파일은 치료하지 않는다(remove 밖).** 정상 서명된 안티치트 드라이버라(ASEC) 진짜 파일이면 엔진이 서명을 보고 격리를
# 미루고(2층), 서비스가 없으면 부팅 뒤 올라오지 않는다. 판정의 근거로만 쓰고 흔적으로 남는다. 대체 데이터 스트림에 숨긴 DLL ·
# 커널 메모리에만 올린 WinWyvern 드라이버는 엔진이 보지 못한다(1-check 와 같다 — RELEASE.md *이 룰이 보지 않는 것*).
#
# 치료 뒤 PC 를 다시 시작해 관리자로 로그온하면 같은 룰로 다시 판정한다(`verify.after_reboot`). 서비스가 다시 생겼으면 재발(2)이다.
#
# **`kind: check` 를 적지 않는다** — 감염의 흔적이다(1-check 와 같다). 종료 코드: 1 치료 완료 · 3 일부만 치료 · 2 위협 발견
# (검사만 — 치료하지 않았다) · 0 위협 없음 · 6 다 보지 못했다.
schema_version: 1
id: winwyvern-2-clean
version: 0.1.0
min_core: "1.25.4"  # 드라이버 서비스에서 치료 네 동작을 잰 엔진(2026-11-25 랩) · added 는 1.25.0 · label 은 1.13.0 · 글롭 뿌리는 1.2.0
platforms: [windows]
added: "2026-11-25"
name:
  ko: "WinWyvern 제거 (CVE-2025-45737)"
  en: "WinWyvern Removal (CVE-2025-45737)"
references:
  - "https://asec.ahnlab.com/ko/96707/"
  - "https://asec.ahnlab.com/en/96708/"

# ── 권한 상한 ──────────────────────────────────────────────
# 1-check 와 같다 — 파일은 `%SystemRoot%\System32` 바로 아래에서 이름이 `neacsafe64*.sys` 인 것만 읽는다(글롭 뿌리 — 깨끗한 기계는
# 6 이 아니라 0). 서비스는 `scan_roots` 와 무관하게 서비스 키 전부에서 모인다.
scan_roots:
  - "%SystemRoot%\\System32\\neacsafe64*.sys"
subjects: [service, file]

detect:
  # 근거 1 · 2 — winwyvern-1-check 와 같은 조건 · 라벨이다(받는 꼴 · 맞지 않는 꼴은 그쪽 주석). 한쪽만 고치지 않는다 — 하네스가
  # 두 룰의 판정을 칸마다 견준다(testbed/harness/host/Invoke-WinwyvernVerify.ps1).
  - id: service
    subject: service
    where:
      - { field: id,         op: equals,  value: "NeacSafe64" }
      - { field: start_type, op: equals,  value: "auto" }
      - { field: image_path, op: matches, value: '(?i)^"?(?:(?:\\\?\?\\|\\\\\?\\)?[a-z]:\\[^\\"]+\\|\\SystemRoot\\|%SystemRoot%\\|%windir%\\)?System32\\neacsafe64\.sys"?$' }
    label: { ko: "취약 드라이버 NeacSafe64 를 자동으로 시작하는 서비스 — CVE-2025-45737", en: "Service that starts the vulnerable driver NeacSafe64 automatically - CVE-2025-45737" }

  - id: driver-file
    subject: file
    where:
      - { field: path, op: ends_with, value: '\System32\neacsafe64.sys' }
    label: { ko: "취약 드라이버 NeacSafe64 파일 — CVE-2025-45737", en: "Vulnerable driver NeacSafe64 file - CVE-2025-45737" }

# ── 판정 ──────────────────────────────────────────────────
# 1-check 와 같다 — 둘 가운데 하나만 남은 기계는 흔적이고 0 이다(치료하지 않는다).
verdict:
  require: "service and driver-file"

# ── 치료 — "무엇이 남아 있으면 안 되는가" ──────────────────
# 서비스 하나다. 차례는 계획기가 정한다 — 복구 동작 제거 · 정지 → 사용 안 함 → 삭제(4건). 정지는 되돌릴 수 없는 동작이고 나머지
# 셋은 정의 키의 백업으로 되돌린다. 드라이버 파일은 remove 밖이다(머리 주석).
remediate:
  remove:
    - { ref: service }
  verify:
    after_reboot: true
