# Node2Shell 점검 — Windows (CVE-2026-111497 · Brotli 디코더)
#
# **고치지 않는다.** Node.js · PHP 를 올리는 것은 운영자의 일이다.
#
# # 두 갈래로 본다 — 둘 다 공식 빌드의 해시로만 확정한다
#
# 1. **Node.js** — 공식 `node.exe` 의 SHA-256 으로 판을 안다(nodejs.org 가 서명한 SHASUMS256). 22 · 24 · 26
#    계열은 고친 판(22.23.4 · 24.22.1 · 26.12.1) 미만이면 **취약**이고, 지원이 끝난 18.20.8 · 20.20.2 는 든
#    Brotli(1.1.0)가 영향 범위라 **취약**이다. 해시가 맞지 않는 `node.exe`(기준에 없는 판 · 다른 빌드 · 읽지
#    못한 것)는 **확인 필요**다. 공식 `node.exe` 는 83~90 MiB 라 `hash_large` 로 해시한다(코어 1.3.0).
# 2. **PHP for Windows 의 Brotli** — PHP 는 `brotlidec.dll` 을 함께 낸다. 2026-10-26 에 PHP 판 번호는 그대로
#    두고 Brotli 를 1.2.1 로 다시 지은 `-1` 재빌드가 나왔다 — 그 전 빌드의 `brotlidec.dll`(Brotli 1.2.0)은
#    영향 범위다. 파일에 판 정보가 없어 **해시로만** 가린다. 맞지 않으면 **확인 필요**다.
#
# 공식 해시가 맞아야 판을 믿고, 기준에 없는 계열을 지원 종료 여부만으로 취약이라 하지 않는다.
#
# # 판정 기준의 출처 (공개)
#
# - CVE-2026-111497(CNA Google): Brotli 1.0.3~1.0.10 미만 · 1.1.0~1.1.1 미만 · 1.2.0~1.2.1 미만
# - Node.js 2026-10 보안 릴리스: 22.23.4 · 24.22.1 · 26.12.1
# - Node 공식 해시: nodejs.org 의 서명한 SHASUMS256 — win-x64 `node.exe` 89판(18.20.8 · 20.20.2 · 22.x · 24.x · 26.x)
# - PHP for Windows: downloads.php.net 의 원래 빌드와 `-1` 재빌드 ZIP — 각 ZIP 의 SHA-256 을 같은 자리의
#   SBOM(`.cdx.json`)과 맞췄고, SBOM 이 Brotli 판(1.2.0 → 1.2.1)을 적는다(2026-11-09)
#
# # 선언한 자리 밖은 찾아서 알린다 (0.2.0)
#
# 실행 중인 `node.exe` · PHP, 그리고 IIS 가 FastCGI · 핸들러로 쓰는 PHP 가 선언한 자리 밖이면 *확인 필요*
# 로 그 경로를 적는다(PHP 쪽은 그 PHP 의 `brotlidec.dll` 을 보지 않았다는 뜻이다). 그 파일은 열지 않는다
# — 룰은 선언한 자리만 읽는다(목표 결정 22).
#
# # 이 룰이 보지 않는 것
#
# - 선언한 자리 밖에 놓였을 뿐 실행 중도 아니고 IIS 설정에도 없는 `node.exe` · `brotlidec.dll`
# - 다른 제품 안에 든 Node.js(Electron 앱 · 단일 실행 파일 — 실행 파일 이름이 `node.exe` 가 아니다)
# - 실행 중인 프로세스가 고친 판을 실었는가 — 고친 뒤에는 그 서비스를 다시 시작한다
schema_version: 1
id: node2shell-check-windows
version: 0.2.0
min_core: "1.6.0"   # IIS 설정(XML 구조적 설정)이 1.6.0 · verdict.unconfirmed · hash_large 는 1.3.0
platforms: [windows]

kind: check

name:
  ko: "Node2Shell 점검 (CVE-2026-111497)"
  en: "Node2Shell check (CVE-2026-111497)"

references:
  - "https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"
  - "CVE-2026-111497"
  - "https://github.com/google/brotli/releases/tag/v1.2.1"
  - "https://downloads.php.net/~windows/releases/"

# Node.js 의 설치 자리 — 공식 설치 관리자 · 사용자마다의 버전 관리자(nvm-windows · fnm · Volta · nvm).
# 사용자 폴더는 `%ALLUSERPROFILES%` 로 모든 사용자를 본다. PHP 는 PHP2Shell 룰과 같은 자리다.
#
# 린트가 `C:\php` 를 *"사실상 전체를 훑는다(깊이 2)"* 로 경고한다 — PHP 의 수동 설치본은 그 디렉터리
# **바로 아래**에 파일을 두므로 더 좁힐 자리가 없다(PHP2Shell 룰과 같은 사유).
scan_roots:
  - 'C:\Program Files\nodejs'
  - 'C:\Program Files (x86)\nodejs'
  - '%ALLUSERPROFILES%\AppData\Roaming\nvm'
  - '%ALLUSERPROFILES%\AppData\Local\nvm'
  - '%ALLUSERPROFILES%\AppData\Roaming\fnm\node-versions'
  - '%ALLUSERPROFILES%\AppData\Local\fnm\node-versions'
  - '%ALLUSERPROFILES%\AppData\Local\Volta\tools\image\node'
  - '%ALLUSERPROFILES%\.nvm\versions\node'
  - '%ALLUSERPROFILES%\.volta\tools\image\node'
  - 'C:\php'
  - 'C:\Program Files\PHP'
  - 'C:\Program Files (x86)\PHP'
  - 'C:\xampp\php'
  - 'C:\wamp64\bin\php'
  - 'C:\wamp\bin\php'
  - 'C:\laragon\bin\php'
  - 'C:\tools\php85'
  - 'C:\tools\php84'
  - 'C:\tools\php83'
  - 'C:\tools\php82'
  # IIS 가 PHP 를 어디서 띄우는지 적힌 자리 — 선언 밖 PHP 를 찾는 곳이다.
  - 'C:\Windows\System32\inetsrv\config'

subject_roots:
  structured_config: ['C:\Windows\System32\inetsrv\config']

subjects: [file, structured_config, process]

# 공식 `node.exe` 는 해시 상한(32 MiB)을 넘는다 — 이 이름만 흘려 읽어 해시한다.
hash_large: ["node.exe"]

detect:
  # ── 1. Node.js — 공식 node.exe 의 해시 ───────────────────────────────────
  - id: node_vuln
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\node\.exe$' }
        - field: sha256
          op: in
          value:
