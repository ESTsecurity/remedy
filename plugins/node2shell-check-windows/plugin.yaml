  # ── 2. PHP for Windows 의 brotlidec.dll ──────────────────────────────────
  #
  # 같은 빌드 도구 묶음(vs16: 8.2 · 8.3 / vs17: 8.4 · 8.5)의 판들은 같은 `brotlidec.dll` 을 낸다.
  - id: brotli_vuln
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\brotlidec\.dll$' }
        - field: sha256
          op: in
          value:
            - "0bad9a53141114e30f37386733040d1c45ddde1ca6c5de7f5feeeb0063b9cc4f"   # brotlidec.dll Brotli 1.2.0 — PHP 8.2.35 · 8.3.36
            - "d6aa2b6651696a66ef00e43921aa7629907ca4f2f1a35deeff25ff921bc2eeed"   # brotlidec.dll Brotli 1.2.0 — PHP 8.4.27 · 8.5.12
  - id: brotli_unknown
    subject: file
    where:
      - { field: path, op: matches, value: '(?i)\\brotlidec\.dll$' }
    exclude:
      - field: sha256
        op: in
        value:
          - "0bad9a53141114e30f37386733040d1c45ddde1ca6c5de7f5feeeb0063b9cc4f"   # brotlidec.dll Brotli 1.2.0 — PHP 8.2.35 · 8.3.36
          - "58bd479f8947c805033efd0b3d59481093a506282b792fe4dcea64d4572494e4"   # brotlidec.dll Brotli 1.2.1 (-1 재빌드) — PHP 8.2.35 · 8.3.36
          - "d6aa2b6651696a66ef00e43921aa7629907ca4f2f1a35deeff25ff921bc2eeed"   # brotlidec.dll Brotli 1.2.0 — PHP 8.4.27 · 8.5.12
          - "3ff248840797380f91573c26f072b1173de3ac29bc2565c96b73c68c8d9d386f"   # brotlidec.dll Brotli 1.2.1 (-1 재빌드) — PHP 8.4.27 · 8.5.12

  # ── 3. 선언한 자리 밖 (0.2.0) ───────────────────────────────────────────────
  #
  # `exclude` 의 정규식이 위 `scan_roots` 의 자리다. IIS 는 값에 환경 변수를 둘 수 있어 그 꼴도 같은
  # 자리로 친다. `%ALLUSERPROFILES%` 는 사용자 프로필마다 펼쳐지므로 `C:\Users\<누구>` 로 쓴다 — 정규식에서는
  # `users(?:\\[^\\]+)` 꼴이다(누출 검사가 `users\` 바로 뒤의 글자를 사용자 이름으로 읽는다).
  - id: running_node
    subject: process
    where:
      - { field: image_path, op: matches, value: '(?i)\\node\.exe$' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^(c:\\program files( \(x86\))?\\nodejs|c:\\users(?:\\[^\\]+)\\(appdata\\(roaming|local)\\(nvm|fnm\\node-versions)|appdata\\local\\volta\\tools\\image\\node|\.nvm\\versions\\node|\.volta\\tools\\image\\node))\\' }

  - id: iis_php
    subject: structured_config
    where:
      - { field: key_path, op: matches, value: '(?i)/(fastCgi\[\d+\]/application\[\d+\]/@fullPath|handlers\[\d+\]/add\[\d+\]/@scriptProcessor)$' }
      - { field: value, op: matches, value: '(?i)\\php(-cgi)?\.exe(\|.*)?$' }
    exclude:
      - { field: value, op: matches, value: '(?i)^((c:|%systemdrive%)\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82))|(c:\\program files( \(x86\))?|%programfiles%|%programfiles\(x86\)%|%programw6432%)\\php)\\' }

  - id: iis_shared
    subject: structured_config
    where:
      - { field: key_path, op: matches, value: '(?i)/configurationRedirection\[\d+\]/@enabled$' }
      - { field: value, op: matches, value: '(?i)^true$' }

  - id: running_php
    subject: process
    where:
      - { field: image_path, op: matches, value: '(?i)\\php(-cgi|-win)?\.exe$' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^(c:\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82))|c:\\program files( \(x86\))?\\php)\\' }

# 판정이 규칙 하나씩에 걸려 있다는 린트 경고는 치료 룰을 위한 것이다 — 이 룰은 아무것도 바꾸지 않고,
# 공식 빌드의 해시가 맞는다는 것은 그 자체로 결정적인 근거다.
verdict:
  require: "node_vuln or brotli_vuln"
  unconfirmed:
    - when: "node_unknown"
      why:
        ko: "공식 Node.js 빌드의 해시와 맞지 않는 node.exe 입니다(기준에 없는 판 · 다른 빌드) — 판과 받은 곳을 확인하고 22.23.4 · 24.22.1 · 26.12.1 이상인지 보십시오"
        en: "a node.exe that does not match an official Node.js build hash (an uncovered version or another build) - check its version and origin, and whether it is 22.23.4, 24.22.1, 26.12.1 or later"
    - when: "brotli_unknown"
      why:
        ko: "PHP 폴더의 brotlidec.dll 이 공식 빌드의 해시와 맞지 않아 Brotli 판을 가리지 못했습니다 — 2026-10-26 이후의 공식 PHP for Windows(-1 재빌드)로 바꾸었는지 확인하십시오"
        en: "the brotlidec.dll in a PHP folder does not match an official build hash, so its Brotli version cannot be told - check that it was replaced with an official PHP for Windows build from 2026-10-26 or later (the -1 rebuild)"
    - when: "running_node"
      why:
        ko: "이 점검이 보는 자리 밖에서 node.exe 가 실행 중입니다(아래 경로) — 그 Node.js 는 판정하지 않았습니다. 판이 22.23.4 · 24.22.1 · 26.12.1 이상인 공식 빌드인지 확인하십시오"
        en: "a node.exe is running outside the places this check reads (path below) - that Node.js was not judged; check that it is an official build of 22.23.4, 24.22.1, 26.12.1 or later"
    - when: "iis_php or running_php"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 를 IIS 가 쓰거나 그 PHP 가 실행 중입니다(아래 경로) — 그 PHP 의 brotlidec.dll 은 보지 않았습니다. 2026-10-26 이후의 공식 PHP for Windows(-1 재빌드)인지 확인하십시오"
        en: "IIS uses, or there is running, a PHP outside the places this check reads (path below) - its brotlidec.dll was not read; check that it is an official PHP for Windows build from 2026-10-26 or later (the -1 rebuild)"
    - when: "iis_shared"
      why:
        ko: "IIS 가 공유 설정을 씁니다 — 다른 자리에 있는 그 설정이 가리키는 PHP 는 보지 않았습니다"
        en: "IIS uses a shared configuration - PHP referenced from that configuration elsewhere was not read"
