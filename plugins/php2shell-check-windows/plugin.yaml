# PHP2Shell 점검 — Windows (CVE-2026-109618 · CVE-2026-109619)
#
# **고치지 않는다.** 원인은 OOM 상황의 요청 데이터 미초기화이고 메우는 것은 공급사의 일이다.
# 설정으로 완화할 수도 없다 — 점검의 답은 **판 하나**다.
#
# # 판정은 공식 빌드의 해시로만 확정한다
#
# PE 의 판 문자열은 그 빌드가 패치를 담았는지 말해 주지 않는다 — 같은 판 번호로 다시 지은 빌드 ·
# 공급사가 고친 빌드 · 직접 지은 빌드가 모두 같은 문자열을 낸다. 그래서
#
# - **공식 빌드 해시와 맞으면** 그 판이 판정이다(고친 판이면 0, 아니면 2).
# - **맞지 않으면 확인 필요(6)** 다. 판이 수정 판보다 낮으면 *패치되지 않았을 가능성이 큽니다* 라고
#   따로 적어, 할 일이 판 올리기인지 받은 곳 확인인지 화면에서 갈린다.
#
# 판정의 단위는 **설치본**(코어 DLL 이 있는 폴더)이다 — 한 기계에 여럿 깔려도 한 설치본의 사실이
# 다른 설치본의 판정을 바꾸지 않게, 코어 DLL 마다 그룹을 가른다(`from: ${core.dir}`).
#
# # 런타임만 본다
#
# 코어 DLL(`php8ts.dll` · `php8.dll` · `php7ts.dll` · … · `php5.dll`)이 PHP 의 판이다. 확장
# DLL(`ext\php_*.dll`)은 PHP 와 같은 판을 선언하지만 PHP 가 아니다 — 그것으로 PHP 를 세면 다른
# 제품 안의 확장 몇 개가 가짜 PHP 여럿이 된다(공개된 SBOM 도구의 실패 사례).
#
# # 수정 판의 출처 (공개 공지)
#
# - 상류: 8.2.35 · 8.3.36 · 8.4.27 · 8.5.12 — https://www.php.net/archive/2026.php · 8.1 이하는
#   지원이 끝나 수정 판이 없다
# - 공식 빌드 해시: downloads.php.net 의 Windows x64(TS · NTS) 코어 DLL — 취약 `php-8.3.35`, 고친 판
#   `php-8.2.35` · `8.3.36` · `8.4.27` · `8.5.12` 와 그 **`-1` 재빌드**(2026-10-26 · Brotli 1.2.1 —
#   PHP 판 번호는 같고 파일은 전부 다시 지어졌다). 각 ZIP 의 SHA-256 을 같은 자리의 SBOM(`.cdx.json`)
#   과 맞춘 뒤 코어 DLL 을 쟀다(2026-11-09)
#
# # 선언한 자리 밖의 PHP 는 찾아서 알린다 (0.2.0)
#
# 흔한 자리만 적었으므로(`scan_roots`) 그 밖의 설치본은 판정하지 못한다. 그런데 그 자리를 알려 주는
# 곳이 둘 있다 — **IIS 설정**(FastCGI 의 `fullPath` · 핸들러의 `scriptProcessor`)과 **실행 중
# 프로세스**. 거기서 선언한 자리 밖의 PHP 를 찾으면 *확인 필요* 로 그 경로를 알린다. 그 파일은 열지
# 않는다 — 룰은 선언한 자리만 읽는다(목표 결정 22). 실측(v1.5.0): 같은 취약 PHP 8.3.35 가 `C:\php`
# 면 2, `C:\inetpub\php83` 이면 0 이었다.
#
# # 다른 프로그램에 모듈로 실린 PHP 도 알린다 (0.3.0)
#
# 실행 중인 프로세스의 **실린 모듈**(코어 1.9.0 부터 Windows 도 모은다)에 선언한 자리 밖의 PHP 코어
# DLL 이 있으면 그 프로세스를 *확인 필요* 로 알린다 — Apache 의 `php8apache2_4.dll` 이 PHP 코어 DLL 을
# 함께 싣는다. 화면은 걸린 DLL 의 경로를 적는다. 모듈 목록을 읽지 못한 Apache(`httpd.exe`)도 *확인
# 필요* 다. 보호 프로세스(PPL)는 서명된 모듈만 실어 PHP 가 들어갈 수 없고, 목록을 거부하는 보안 제품은
# PHP 를 싣는 프로그램이 아니므로 Apache 만 묻는다(랩 VM 실측: 프로세스 158개 중 거부 2 가 nProtect).
#
# 멈춰 있어도 남는 자리 둘도 같은 *확인 필요* 로 본다(0.3.0) — **서비스**의 실행 파일 자리(`ImagePath`)와
# **Apache 설정**의 `LoadModule php_module` 줄. 그 PHP 의 파일은 열지 않는다(목표 결정 28).
#
# 0.4.0 부터 **NSSM** 이 감싸 띄우는 PHP 도 같은 *확인 필요* 로 본다 — 그 서비스의 `ImagePath` 는 `nssm.exe`
# 이고 띄우는 프로그램은 `Services\<이름>\Parameters` 의 `Application` 값에 있다(srvany 도 같은 자리).
#
# # 이 룰이 보지 않는 것
#
# - 선언한 자리 밖에 놓였을 뿐 IIS 설정에도 없고 실행 중도 아니며 어디에도 실리지 않은 PHP.
# - IIS 의 공유 설정(다른 기계 · 다른 폴더의 `applicationHost.config`) — 쓰고 있으면 *확인 필요* 다.
# - 실행 중인 PHP 가 고친 판을 실었는가 — 고친 뒤에는 IIS · Apache · PHP 를 다시 시작한다.
schema_version: 1
id: php2shell-check-windows
version: 0.4.0
min_core: "1.10.0"  # 가운데 별표 레지스트리 루트(`Services\*\Parameters`)는 1.10.0 · 실린 모듈은 1.9.0 · IIS 설정(XML)은 1.6.0
platforms: [windows]

kind: check

name:
  ko: "PHP2Shell 점검 (CVE-2026-109618 · 109619)"
  en: "PHP2Shell check (CVE-2026-109618, 109619)"

references:
  - "https://www.php.net/archive/2026.php"
  - "CVE-2026-109618"
  - "CVE-2026-109619"

# 흔한 설치 자리 — 수동 설치 · XAMPP · WampServer · Laragon · Chocolatey(`C:\tools\phpNN`).
#
# # 경고 하나를 남긴다 — 그 이유를 여기 적는다
#
# 린트가 `C:\php` 를 *"사실상 전체를 훑는다(깊이 2)"* 로 경고한다. 맞는 지적이지만 PHP 의 수동
# 설치본은 그 디렉터리 **바로 아래**에 코어 DLL 을 두므로 더 좁힐 자리가 없다. 좁히는 대신 읽는 것을
# 좁혔다 — `subjects` 가 `file` 하나이고 판정이 코어 DLL 이름에만 걸린다. `C:\tools` 는 통째로 적지
# 않는다 — Chocolatey 가 msys64 같은 큰 도구를 함께 두는 자리라 폴더 이름(`php83` …)으로 적는다.
scan_roots:
  - 'C:\php'
  - 'C:\Program Files\PHP'
  - 'C:\Program Files (x86)\PHP'
  - 'C:\xampp\php'
  - 'C:\wamp64\bin\php'
  - 'C:\wamp\bin\php'
  - 'C:\laragon\bin\php'
  - 'C:\tools\php85'
  - 'C:\tools\php84'
  - 'C:\tools\php83'
  - 'C:\tools\php82'
  - 'C:\tools\php81'
  - 'C:\tools\php80'
  - 'C:\tools\php74'
  # IIS 가 PHP 를 어디서 띄우는지 적힌 자리 — 판정할 PHP 가 아니라 **선언 밖 PHP 를 찾는 곳**이다.
  - 'C:\Windows\System32\inetsrv\config'
  # Apache 가 어느 PHP 를 싣는지 적힌 자리(0.3.0) — 위 IIS 설정과 같이 **선언 밖 PHP 를 찾는 곳**이다.
  # Apache Lounge(`C:\Apache24`) · Apache 설치 프로그램 · XAMPP · WampServer · Laragon 의 설정 폴더.
  - 'C:\Apache24\conf'
  - 'C:\Program Files\Apache Software Foundation\Apache2.4\conf'
  - 'C:\xampp\apache\conf'
  - 'C:\wamp64\bin\apache'
  - 'C:\wamp\bin\apache'
  - 'C:\laragon\bin\apache'
  # NSSM 이 띄우는 프로그램이 적힌 자리(0.4.0) — 서비스마다 `Parameters` 키 하나의 값만 읽는다(하위 키는
  # 내려가지 않는다). 랩 VM 실측: 서비스 763 중 `Parameters` 가 있는 것 364 · 관리자가 못 연 것 0 · 값 848.
  - 'HKLM\SYSTEM\CurrentControlSet\Services\*\Parameters'

# 구조적 설정은 IIS 설정만, 줄 단위 설정은 Apache 설정만 읽는다 — PHP 폴더의 JSON · XML · `php.ini` 는
# 이 룰이 볼 것이 아니다.
subject_roots:
  structured_config: ['C:\Windows\System32\inetsrv\config']
  text_config:
    - 'C:\Apache24\conf'
    - 'C:\Program Files\Apache Software Foundation\Apache2.4\conf'
    - 'C:\xampp\apache\conf'
    - 'C:\wamp64\bin\apache'
    - 'C:\wamp\bin\apache'
    - 'C:\laragon\bin\apache'

subjects: [file, structured_config, process, service, text_config, registry_value]

detect:
  # 설치본 하나 = 코어 DLL 하나. 아래 규칙은 모두 이 폴더 안에서만 본다.
  - id: core
    subject: file
    where:
      - { field: path, op: matches, value: '(?i)\\php[5-8](ts)?\.dll$' }
    capture:
      dir: 'path | dirname'

  - id: core_official_vuln
    subject: file
    from: '${core.dir}'
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\php[5-8](ts)?\.dll$' }
        - field: sha256
          op: in
          value:
            - "37d0e60d20b7f17a564bafab657f9cf448044a3f333a6abce8750113d79fe5f7"   # 8.3.35 windows/amd64 nts php8.dll
            - "986b6d6e4f56d348acbedf0ea5ef80b81cbbeaed28fdb0227c5f33f6fe68ed81"   # 8.3.35 windows/amd64 ts php8ts.dll

  - id: core_official_fixed
    subject: file
    from: '${core.dir}'
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\php[5-8](ts)?\.dll$' }
        - field: sha256
          op: in
          value:
            # 10-26 이후에 받은 설치본은 `-1` 재빌드다 — 그 해시가 없으면 고친 판을 *확인 필요* 로 낸다.
            - "87cdf69cd713d167b9171a2147287c19a6f360838d7d2392ba122e7f36510707"   # 8.2.35 windows/amd64 nts php8.dll
            - "e6809f93d0f8a140b2e8caac8d31e510204de53d639374e1c660e74d15487d35"   # 8.2.35 windows/amd64 ts php8ts.dll
            - "8e5ba819292c9f1c028ebffe4bcc389ab731d53f5ed84e9775f462fe1656d315"   # 8.2.35-1 windows/amd64 nts php8.dll
            - "c2d9a871e0d7b61e48b3f83630c6953ccaa9fc4f8845a8e8c980f7f69f1118be"   # 8.2.35-1 windows/amd64 ts php8ts.dll
            - "77cd2e30cc9c223086eea12ef2a214dd34a3f92117324906ea9990c0606f4bd7"   # 8.3.36 windows/amd64 nts php8.dll
            - "f7c85c4f5547379f5177ef1d6cace4f2473792034914718f6820aa252dec29c1"   # 8.3.36 windows/amd64 ts php8ts.dll
            - "24a3ff0fa1b27e219f237364c14560c6417a54fe4fab9e657eee593d09661547"   # 8.3.36-1 windows/amd64 nts php8.dll
            - "0c8de24a1e034ddfa7a3749d662803d2411587c7899436e64be30e0417de16c9"   # 8.3.36-1 windows/amd64 ts php8ts.dll
            - "8b8b1c4d535a28204d27c86652f923c4b69f3196580b43d02307fe7060954cac"   # 8.4.27 windows/amd64 nts php8.dll
            - "e7bf5898ee70077bcaf7bf0862167b23262871ff1e8d5465c98ca49130b0b554"   # 8.4.27 windows/amd64 ts php8ts.dll
            - "d3ab8a382818c1d937e8d88464bda8c031aa73179ae092ba8a660f1c8ff87661"   # 8.4.27-1 windows/amd64 nts php8.dll
            - "2573bd39ef01e0f6105cec2d94f7ffec38dea60e4116999e6dfef9bd680e1194"   # 8.4.27-1 windows/amd64 ts php8ts.dll
            - "7af6c47fee46995865a3ac3aaa04915b19547e3ffd7072b6242b0f7a027d5754"   # 8.5.12 windows/amd64 nts php8.dll
            - "a3d2acd1453aaff16be437fd9975f8b923cc190095931158bc8e1444d0db3069"   # 8.5.12 windows/amd64 ts php8ts.dll
            - "7f9c2ab08b1668426e4ee0cd571b7012030dad1f99ff435a9efd7b8161c7b086"   # 8.5.12-1 windows/amd64 nts php8.dll
            - "2cad79b8aca7ccb8051d24e76ee394a1bf10f6f1fb0a0698ec570f4e6f4cbd5b"   # 8.5.12-1 windows/amd64 ts php8ts.dll

  # 판이 그 계열의 수정 판보다 낮다 — 또는 수정 판이 없는 계열(5.4~8.1). 따옴표는 **필수다**:
  # 없으면 YAML 이 `8.2` 를 수로 읽어 뒤의 0 이 사라진다.
  - id: core_below_fix
    subject: file
    from: '${core.dir}'
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\php[5-8](ts)?\.dll$' }
        - any:
            - all:
                - { field: version, op: matches, value: '^8\.2\.' }
                - { field: version, op: version_lt, value: "8.2.35" }
            - all:
                - { field: version, op: matches, value: '^8\.3\.' }
                - { field: version, op: version_lt, value: "8.3.36" }
            - all:
                - { field: version, op: matches, value: '^8\.4\.' }
                - { field: version, op: version_lt, value: "8.4.27" }
            - all:
                - { field: version, op: matches, value: '^8\.5\.' }
                - { field: version, op: version_lt, value: "8.5.12" }
            - { field: version, op: matches, value: '^(5\.[4-6]|7\.[0-4]|8\.[01])\.' }

  # ── 선언한 자리 밖의 PHP (0.2.0) ──────────────────────────────────────────────
  #
  # `exclude` 의 정규식이 위 `scan_roots` 의 PHP 자리다(그 아래는 이 룰이 판정한다). IIS 는 값에
  # 환경 변수를 그대로 둘 수 있어(`%SystemDrive%` · `%ProgramFiles%`) 그 꼴도 같은 자리로 친다.
  # 그룹을 가르지 않는다(`from` 없음) — 설치본마다가 아니라 기계에 하나인 사실이다.
  - id: iis_php
    subject: structured_config
    where:
      - { field: key_path, op: matches, value: '(?i)/(fastCgi\[\d+\]/application\[\d+\]/@fullPath|handlers\[\d+\]/add\[\d+\]/@scriptProcessor)$' }
      - { field: value, op: matches, value: '(?i)\\php(-cgi)?\.exe(\|.*)?$' }
    exclude:
      - { field: value, op: matches, value: '(?i)^((c:|%systemdrive%)\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82|81|80|74))|(c:\\program files( \(x86\))?|%programfiles%|%programfiles\(x86\)%|%programw6432%)\\php)\\' }

  # 공유 설정을 쓰는 IIS 는 그 설정이 다른 자리에 있다 — 이 룰은 그것을 읽지 않는다.
  - id: iis_shared
    subject: structured_config
    where:
      - { field: key_path, op: matches, value: '(?i)/configurationRedirection\[\d+\]/@enabled$' }
      - { field: value, op: matches, value: '(?i)^true$' }

  # 실행 중인 PHP — 요청이 없어 떠 있지 않은 FastCGI 는 여기 없다(위 IIS 설정이 맡는다).
  - id: running_php
    subject: process
    where:
      - { field: image_path, op: matches, value: '(?i)\\php(-cgi|-win)?\.exe$' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^(c:\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82|81|80|74))|c:\\program files( \(x86\))?\\php)\\' }

  # 다른 프로그램에 모듈로 실린 선언 밖의 PHP (0.3.0). 모듈 목록은 JSON 글자로 견준다(평가기가 목록을
  # 그렇게 꺼낸다) — 경로의 `\` 하나가 그 글자에서 `\\` 라 정규식에서는 `\\\\` 다. 첫 `exclude` 는 PHP
  # 자신이다(위 `running_php` 가 본다). 둘째는 선언한 자리의 코어 DLL 이다 — 그것은 위 파일 규칙이 판정한다.
  - id: module_php
    subject: process
    where:
      - { field: modules, op: matches, value: '(?i)\\\\php[578](ts)?\.dll"' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)\\php(-cgi|-win)?\.exe$' }
      - { field: modules, op: matches, value: '(?i)"(c:\\\\(php|xampp\\\\php|wamp64\\\\bin\\\\php|wamp\\\\bin\\\\php|laragon\\\\bin\\\\php|tools\\\\php(85|84|83|82|81|80|74))|c:\\\\program files( \(x86\))?\\\\php)\\\\([^"]*\\\\)?php[578](ts)?\.dll"' }

  # 모듈 목록을 읽지 못한 Apache (0.3.0) — 실행 파일은 보이는데 목록을 내주지 않았다. 그 Apache 가 PHP 를
  # 싣는지 보지 못했다.
  - id: apache_unread
    subject: process
    where:
      - { field: modules_denied, op: equals, value: "true" }
      - { field: image_path, op: matches, value: '(?i)\\httpd\.exe$' }

  # 서비스로 등록된 선언 밖의 PHP (0.3.0) — 멈춰 있어도 레지스트리의 실행 파일 자리(`ImagePath`)가 남는다.
  # 그 칸은 원문이라 따옴표 · 인자 · 펴지 않은 환경 변수가 그대로다(청정 코퍼스: `"C:\…\x.exe"` ·
  # `%SystemRoot%\…\svchost.exe -k …`).
  - id: service_php
    subject: service
    where:
      - { field: image_path, op: matches, value: '(?i)\\php(-cgi|-win)?\.exe("|\s|$)' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^"?((c:|%systemdrive%)\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82|81|80|74))|(c:\\program files( \(x86\))?|%programfiles%|%programfiles\(x86\)%|%programw6432%)\\php)\\' }

  # NSSM 이 감싸 띄우는 선언 밖의 PHP (0.4.0). 값은 원문이라 환경 변수가 펴지지 않은 채다. 경로 없이 이름만
  # 적혔으면(`php-cgi.exe` — `AppDirectory` 에서 찾는다) 어디의 PHP 인지 알 수 없어 함께 알린다.
  - id: nssm_php
    subject: registry_value
    where:
      all:
        - { field: key, op: matches, value: '(?i)^system\\currentcontrolset\\services\\[^\\]+\\parameters$' }
        - { field: name, op: matches, value: '(?i)^application$' }
        - { field: data, op: matches, value: '(?i)(^"?|\\)php(-cgi|-win)?\.exe("|\s|$)' }
    exclude:
      - { field: data, op: matches, value: '(?i)^"?((c:|%systemdrive%)\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82|81|80|74))|(c:\\program files( \(x86\))?|%programfiles%|%programfiles\(x86\)%|%programw6432%)\\php)\\' }

  # Apache 설정이 싣는 선언 밖의 PHP 모듈 (0.3.0) — Apache 가 멈춰 있어도 설정의 `LoadModule` 줄이 남는다.
  # 경로는 `/` 로도 `\` 로도, 따옴표 없이도 적힌다. XAMPP 는 드라이브 없이(`/xampp/php/…`), WampServer 는
  # 변수로(`${INSTALL_DIR}/bin/php/…`) 적는다 — 둘 다 그 제품의 PHP 자리라 선언한 자리로 친다.
  - id: apache_php
    subject: text_config
    where:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+php\d*_module\s' }
    exclude:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+php\d*_module\s+"?((c:)?[\\/](php|xampp[\\/]php|wamp64[\\/]bin[\\/]php|wamp[\\/]bin[\\/]php|laragon[\\/]bin[\\/]php|tools[\\/]php(85|84|83|82|81|80|74)|program files( \(x86\))?[\\/]php)|\$\{install_dir\}[\\/]bin[\\/]php)[\\/]' }

# 판정이 규칙 하나(`core_official_vuln`)에 걸려 있다는 린트 경고도 남긴다 — 그 경고는 **룰 하나의 오탐이
# 곧바로 삭제로 이어지는** 치료 룰을 위한 것이다. 이 룰은 아무것도 바꾸지 않고, 공식 빌드의 해시가
# 맞는다는 것은 그 자체로 결정적인 근거다(판 문자열과 달리 다른 빌드가 같은 값을 낼 수 없다).
verdict:
  require: "core_official_vuln"
  unconfirmed:
    - when: "core_below_fix and not core_official_vuln and not core_official_fixed"
      why:
        ko: "버전이 고친 버전보다 낮습니다(8.1 이하는 고친 버전이 없습니다) — 공식 빌드인지 확인하지 못했지만 패치되지 않았을 가능성이 큽니다. 쓰는 계열의 고친 버전(8.2 는 8.2.35 · 8.3 은 8.3.36 · 8.4 는 8.4.27 · 8.5 는 8.5.12) 이상으로 올리십시오"
        en: "the version is below the fixed release (8.1 and older have no fix) - not confirmed as an official build, but most likely unpatched; upgrade to the fixed release of its line or later (8.2.35 for 8.2, 8.3.36 for 8.3, 8.4.27 for 8.4, 8.5.12 for 8.5)"
    # 버전 문자열이 없거나 5.3 이하 · 다음 계열이어도 이 줄로 온다(`core_below_fix` 는 5.4~8.1 과 고친 버전 미만만
    # 잡는다) — 그래서 '버전은 고친 버전 이상' 이라고 말하지 않는다(0.2.1).
    - when: "core and not core_below_fix and not core_official_vuln and not core_official_fixed"
      why:
        ko: "공식 빌드의 해시와 맞지 않아 패치 여부를 가리지 못했습니다 — 버전과 받은 곳(windows.php.net 공식 빌드인지)을 확인하십시오"
        en: "does not match an official build hash, so its patch status cannot be told - check its version and where it came from (an official windows.php.net build or not)"
    # IIS 가 쓰는 PHP 와 실행 중인 PHP 는 같은 PHP 인 때가 많다 — 한 칸으로 두어 같은 문장이 두 번 서지 않게 한다
    # (0.2.1 · php-session · node2shell 과 같은 꼴).
    - when: "iis_php or running_php"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 를 IIS 가 쓰거나 그 PHP 가 실행 중입니다(위 경로) — 그 PHP 는 판정하지 않았습니다. 쓰는 계열의 고친 버전(8.2 는 8.2.35 · 8.3 은 8.3.36 · 8.4 는 8.4.27 · 8.5 는 8.5.12 — 8.1 이하는 고친 버전이 없습니다) 이상인 공식 빌드인지 확인하십시오"
        en: "IIS uses, or there is running, a PHP outside the places this check reads (path above) - that PHP was not judged; check that it is an official build at or above the fixed release of its line (8.2.35 for 8.2, 8.3.36 for 8.3, 8.4.27 for 8.4, 8.5.12 for 8.5 - 8.1 and older have no fix)"
    - when: "iis_shared"
      why:
        ko: "IIS 가 공유 설정을 씁니다 — 다른 자리에 있는 그 설정이 가리키는 PHP 는 보지 않았습니다. 그 설정이 가리키는 PHP 의 버전을 확인하십시오"
        en: "IIS uses a shared configuration - PHP referenced from that configuration elsewhere was not read; check the version of the PHP it points to"
    - when: "module_php"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 가 다른 프로그램(위 경로)에 모듈로 실려 있습니다(괄호 안이 그 PHP) — 그 PHP 는 판정하지 않았습니다. 쓰는 계열의 고친 버전(8.2 는 8.2.35 · 8.3 은 8.3.36 · 8.4 는 8.4.27 · 8.5 는 8.5.12 — 8.1 이하는 고친 버전이 없습니다) 이상인 공식 빌드인지 확인하십시오"
        en: "a PHP outside the places this check reads is loaded as a module into another program (path above; the PHP is in brackets) - that PHP was not judged; check that it is an official build at or above the fixed release of its line (8.2.35 for 8.2, 8.3.36 for 8.3, 8.4.27 for 8.4, 8.5.12 for 8.5 - 8.1 and older have no fix)"
    - when: "apache_unread"
      why:
        ko: "Apache(위 경로)에 실린 모듈 목록을 읽지 못해 그 Apache 가 PHP 를 싣는지 보지 못했습니다 — Apache 설정(httpd.conf)의 LoadModule php_module 줄이 가리키는 PHP 의 버전을 확인하십시오"
        en: "the list of modules loaded into Apache (path above) could not be read, so whether it loads PHP was not seen - check the version of the PHP named by the LoadModule php_module line of its configuration (httpd.conf)"
    # 서비스와 Apache 설정은 멈춰 있어도 남는 자리라 같은 PHP 가 실행 중 줄과 함께 설 수 있다 — 한 칸으로 둔다.
    # NSSM 이 띄우는 PHP 도 서비스다(0.4.0).
    - when: "service_php or nssm_php or apache_php"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 를 서비스가 띄우거나 Apache 설정이 싣습니다(위 서비스 · 설정 줄의 경로) — 그 PHP 는 판정하지 않았습니다. 쓰는 계열의 고친 버전(8.2 는 8.2.35 · 8.3 은 8.3.36 · 8.4 는 8.4.27 · 8.5 는 8.5.12 — 8.1 이하는 고친 버전이 없습니다) 이상인 공식 빌드인지 확인하십시오"
        en: "a service starts, or the Apache configuration loads, a PHP outside the places this check reads (the path in the service or configuration line above) - that PHP was not judged; check that it is an official build at or above the fixed release of its line (8.2.35 for 8.2, 8.3.36 for 8.3, 8.4.27 for 8.4, 8.5.12 for 8.5 - 8.1 and older have no fix)"
