# nginx2root 점검 — Windows (CVE-2026-123007 · CVE-2026-123634 · CVE-2026-123633 · CVE-2026-121810 · CVE-2026-113425)
#
# nginx 의 결함 다섯이 인증 없이 원격 코드 실행으로 이어진다(xint.io 분석 · 2026-11-18). nginx.org 공지(2026-11-19 07:34
# 확인)의 영향 판은 123007 1.9.5 · 123634 0.6.18 · 123633 1.19.7 · 121810 1.25.0 · 113425 0.5.33 부터 1.31.8 까지이고,
# **고친 판은 mainline 1.31.9 와 stable 1.30.7** 이다 — 1.29.x 와 legacy 1.28.x 이하에는 고친 판이 없다. 공지는 플랫폼을
# 가르지 않는다. 리눅스는 `nginx2root-check-linux` 가 본다. **고치지 않는다** — 판을 올리는 것은 설치한 사람의 일이다.
#
# # Windows 의 nginx — 상류 판을 그대로 담는다
#
# Windows 의 nginx 는 nginx.org 의 zip(`nginx-<판>.zip`)을 풀어 쓴다. 설치 프로그램이 없고 배포판처럼 번호를 두고 고치지
# 않으므로 **실행 파일의 서버 판 문자열(`nginx/<판>`)로 가른다** — 리눅스 룰의 직접 빌드와 같은 YARA 다(`rules/nginx.yar`).
#
# # 판정 (2차 — 판으로만 · 설치본마다)
#
# | 무엇 | 결과 |
# |---|---|
# | 아래 자리의 nginx.exe 의 판이 0.5.33 이상이고 1.30.7 아래 · 또는 1.31.0 ~ 1.31.8 | 취약(2) |
# | 그 nginx.exe 에서 판을 읽지 못했다 | 확인 필요(6) |
# | 아래 자리 밖의 nginx.exe 가 돌거나 서비스로 등록됐다(NSSM 이 띄우는 것 포함) | 확인 필요(6) — 그 판은 보지 않았다 |
# | 1.31.9 이상 · 1.30.7 ~ 1.30.x · nginx 없음 | 0 |
#
# **설치본마다 가른다** — nginx.exe 가 든 폴더가 설치본 하나다. 한 기계에 판이 다른 nginx 가 여럿 풀려 있으면 설치본마다
# 판정한다 — 고친 판 하나가 판을 읽지 못한 다른 설치본을 가리지 않는다.
#
# # 이 룰이 보지 않는 것
#
# - 아래 자리 밖에 풀어 두기만 한 nginx(돌지도 않고 서비스도 아니다) — nginx.org 안내의 기본 자리 `C:\nginx-<판>` 처럼
#   판마다 이름이 다른 폴더는 파일 경로에 와일드카드를 쓸 수 없어 자리로 적지 못한다(2차 카드 — 자리 지정). 돌거나 서비스면
#   확인 필요로 알린다
# - WinSW 로 감싼 서비스의 대상 — 서비스의 실행 파일은 감싸는 프로그램이고 대상은 옆의 XML 에 있다. 서비스가 돌면 nginx.exe
#   프로세스로 잡는다(NSSM 은 `Parameters` 의 `Application` 값으로 본다)
# - NGINX Plus · 파생 제품(OpenResty · Tengine · Angie)의 고침 여부 · 컨테이너 안 · WSL 안의 nginx(리눅스 룰의 몫)
# - 커널 SCTP 결함 — 리눅스의 결함이다
schema_version: 1
id: nginx2root-check-windows
version: 0.1.1
min_core: "1.25.0"  # added 는 1.25.0 · product 는 1.21.0 · label 은 1.13.0 · file_names 는 1.11.0 · 가운데 별표 레지스트리 루트(`Services\*\Parameters`)는 1.10.0
platforms: [windows]

kind: check
product: nginx
added: "2026-11-19"

name:
  ko: "nginx2root 점검 (CVE-2026-123007 · CVE-2026-123634 · CVE-2026-123633 · CVE-2026-121810 · CVE-2026-113425)"
  en: "nginx2root check (CVE-2026-123007, CVE-2026-123634, CVE-2026-123633, CVE-2026-121810, CVE-2026-113425)"

references:
  - "https://xint.io/ko/blog/nginx2root-remote-code-execution"
  - "https://nginx.org/en/security_advisories.html"
  - "https://nginx.org/en/docs/windows.html"
  - "CVE-2026-123007"
  - "CVE-2026-123634"
  - "CVE-2026-123633"
  - "CVE-2026-121810"
  - "CVE-2026-113425"

# 흔한 설치 자리 — 손으로 푼 zip(`C:\nginx`) · Program Files · Laragon(`C:\laragon\bin\nginx\nginx-<판>`) · Chocolatey
# (`C:\tools\nginx-<판>` — 도구 자리의 기본) · Scoop(사용자 · 전역 — `apps\nginx\<판>`) · winget 의 `nginxinc.nginx`(portable —
# 사용자 범위 · 기계 범위의 `Packages\nginxinc.nginx_Microsoft.Winget.Source_8wekyb3d8bbwe\nginx-<판>`). 이름이 `nginx.exe` 인
# 파일만 기록 · 해시한다 — 설정 · 웹 문서 · 로그는 읽지 않는다. 린트의 경고 둘(`C:\nginx` · `C:\tools` 깊이 2)이 이 줄이다 —
# 읽는 것은 `nginx.exe` 하나다. 서비스마다 `Parameters` 키 하나의 값은 NSSM 이 띄우는 프로그램의 자리다(Chocolatey 의 nginx
# 패키지가 기본으로 NSSM 서비스를 건다).
scan_roots:
  - 'C:\nginx'
  - 'C:\Program Files\nginx'
  - 'C:\Program Files (x86)\nginx'
  - 'C:\laragon\bin\nginx'
  - 'C:\tools'
  - 'C:\ProgramData\chocolatey\lib\nginx'
  - 'C:\ProgramData\scoop\apps\nginx'
  - '%ALLUSERPROFILES%\scoop\apps\nginx'
  - '%ALLUSERPROFILES%\AppData\Local\Microsoft\WinGet\Packages\nginxinc.nginx_Microsoft.Winget.Source_8wekyb3d8bbwe'
  - 'C:\Program Files\WinGet\Packages\nginxinc.nginx_Microsoft.Winget.Source_8wekyb3d8bbwe'
  - 'HKLM\SYSTEM\CurrentControlSet\Services\*\Parameters'
file_names: ["nginx.exe"]
subjects: [file, process, service, registry_value]

detect:
  # ── 설치본 — nginx.exe 하나가 설치본 하나다 ─────────────────────────────────────────
  #
  # 아래 판 규칙은 모두 이 설치본의 폴더(nginx.exe 가 든 폴더) 안에서만 본다.
  - id: install
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\nginx\.exe$' }
        - { field: sha256, op: exists }
    capture:
      root: 'path | dirname'
    label:
      ko: "nginx 실행 파일입니다"
      en: "an nginx executable"

  # ── 판 — nginx.exe 의 서버 판 문자열 ───────────────────────────────────────────────
  - id: affected
    subject: file
    from: '${install.root}'
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\nginx\.exe$' }
        - { yara: "rules/nginx.yar:nginx_version_affected" }
    label:
      ko: "nginx 의 영향 판 — nginx2root(CVE-2026-123007 외 넷) · 1.31.9 이상으로, stable 갈래(1.30.x)는 1.30.7 이상으로 올리십시오(1.31.0 ~ 1.31.8 은 영향 판입니다)"
      en: "an nginx in the affected range - nginx2root (CVE-2026-123007 and four more), upgrade to 1.31.9 or later, or on the stable branch (1.30.x) to 1.30.7 or later (1.31.0 to 1.31.8 are affected)"
  # 서버 판 문자열이 아예 없는 실행 파일 — 판을 모른다. YARA 를 재지 못하면 빼지 못해 이 규칙이 선다(확인 필요 쪽).
  - id: unknown
    subject: file
    from: '${install.root}'
    where:
      - { field: path, op: matches, value: '(?i)\\nginx\.exe$' }
    exclude:
      - { yara: "rules/nginx.yar:nginx_version_string" }
    label:
      ko: "이 실행 파일에서 nginx 판을 읽지 못했습니다"
      en: "no nginx version could be read from this executable"

  # ── 위 자리 밖의 nginx — 서비스 · 실행 중 ──────────────────────────────────────────
  #
  # 그 nginx 의 파일은 읽지 않는다(상한 밖이다) — 있다는 것만 알리고 확인 필요로 둔다. Scoop 의 shim(`scoop\shims\nginx.exe`)은
  # 뺀다 — PATH 에 놓인 작은 런처로, 진짜 nginx 를 자식 프로세스(`apps\nginx\current\nginx.exe` — 자리 안)로 띄우고 그동안
  # 살아 있다(ScoopInstaller/Shim). 빼지 않으면 Scoop 의 고친 nginx 를 띄운 채 점검할 때마다 확인 필요가 난다(2026-11-19 검토).
  - id: outside_service
    subject: service
    where:
      - { field: image_path, op: matches, value: '(?i)\\nginx\.exe' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^"?(c:\\nginx|c:\\program files\\nginx|c:\\program files \(x86\)\\nginx|c:\\laragon\\bin\\nginx|c:\\tools|c:\\programdata\\chocolatey\\lib\\nginx|c:\\programdata\\scoop\\apps\\nginx|c:\\programdata\\scoop\\shims|c:\\users(?:\\[^\\"]+)\\scoop\\apps\\nginx|c:\\users(?:\\[^\\"]+)\\scoop\\shims|c:\\users(?:\\[^\\"]+)\\appdata\\local\\microsoft\\winget\\packages\\nginxinc\.nginx_microsoft\.winget\.source_8wekyb3d8bbwe|c:\\program files\\winget\\packages\\nginxinc\.nginx_microsoft\.winget\.source_8wekyb3d8bbwe)\\([^"]*\\)?nginx\.exe' }
    label:
      ko: "이 룰이 보는 자리 밖의 nginx 서비스입니다"
      en: "an nginx service outside the places this rule reads"
  - id: outside_process
    subject: process
    where:
      - { field: image_path, op: matches, value: '(?i)\\nginx\.exe$' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^(c:\\nginx|c:\\program files\\nginx|c:\\program files \(x86\)\\nginx|c:\\laragon\\bin\\nginx|c:\\tools|c:\\programdata\\chocolatey\\lib\\nginx|c:\\programdata\\scoop\\apps\\nginx|c:\\programdata\\scoop\\shims|c:\\users(?:\\[^\\]+)\\scoop\\apps\\nginx|c:\\users(?:\\[^\\]+)\\scoop\\shims|c:\\users(?:\\[^\\]+)\\appdata\\local\\microsoft\\winget\\packages\\nginxinc\.nginx_microsoft\.winget\.source_8wekyb3d8bbwe|c:\\program files\\winget\\packages\\nginxinc\.nginx_microsoft\.winget\.source_8wekyb3d8bbwe)\\(.*\\)?nginx\.exe$' }
    label:
      ko: "이 룰이 보는 자리 밖에서 도는 nginx 입니다"
      en: "an nginx running outside the places this rule reads"

  # NSSM 이 감싸 띄우는 선언 밖의 nginx — 그 서비스의 `ImagePath` 는 `nssm.exe` 이고 띄우는 프로그램은
  # `Services\<이름>\Parameters` 의 `Application` 값에 있다(php2shell-check-windows 0.4.0 과 같은 자리). 값은 원문이라 환경
  # 변수가 펴지지 않은 채다. 경로 없이 이름만 적혔으면(`nginx.exe` — `AppDirectory` 에서 찾는다) 어디의 nginx 인지 알 수
  # 없어 함께 알린다. 자리 안의 nginx 를 띄우면 그 파일을 판으로 본다(뺀다).
  - id: nssm_nginx
    subject: registry_value
    where:
      all:
        - { field: key, op: matches, value: '(?i)^system\\currentcontrolset\\services\\[^\\]+\\parameters$' }
        - { field: name, op: matches, value: '(?i)^application$' }
        - { field: data, op: matches, value: '(?i)(^"?|\\)nginx\.exe("|\s|$)' }
    exclude:
      - { field: data, op: matches, value: '(?i)^"?(c:\\nginx|c:\\program files\\nginx|c:\\program files \(x86\)\\nginx|c:\\laragon\\bin\\nginx|c:\\tools|c:\\programdata\\chocolatey\\lib\\nginx|c:\\programdata\\scoop\\apps\\nginx|c:\\programdata\\scoop\\shims|c:\\users(?:\\[^\\"]+)\\scoop\\apps\\nginx|c:\\users(?:\\[^\\"]+)\\scoop\\shims|c:\\users(?:\\[^\\"]+)\\appdata\\local\\microsoft\\winget\\packages\\nginxinc\.nginx_microsoft\.winget\.source_8wekyb3d8bbwe|c:\\program files\\winget\\packages\\nginxinc\.nginx_microsoft\.winget\.source_8wekyb3d8bbwe)\\([^"]*\\)?nginx\.exe' }
    label:
      ko: "이 룰이 보는 자리 밖의 nginx 를 띄우는 NSSM 서비스입니다"
      en: "an NSSM service that starts an nginx outside the places this rule reads"

verdict:
  require: "install and affected"
  unconfirmed:
    - when: "unknown"
      why:
        ko: "nginx(위 경로)의 실행 파일에서 판을 읽지 못했습니다 — 그 폴더에서 nginx.exe -v 로 판을 확인하십시오(1.30.7 아래이거나 1.31.0 ~ 1.31.8 이면 nginx2root 의 영향을 받습니다 — 1.30.7 이상의 1.30.x 와 1.31.9 이상은 고친 판입니다)"
        en: "the version could not be read from the nginx executable above - check it with nginx.exe -v in that folder (below 1.30.7, or 1.31.0 to 1.31.8, is affected by nginx2root; 1.30.7 and later 1.30.x, and 1.31.9 or later, are fixed)"
    - when: "outside_service or outside_process or nssm_nginx"
      why:
        ko: "이 룰이 보는 자리(C:\\nginx · Program Files · Laragon · Chocolatey · Scoop · winget) 밖의 nginx(위 경로)가 서비스로 있거나(NSSM 이 띄우는 것 포함) 돌고 있어 그 판을 보지 않았습니다 — 그 폴더에서 nginx.exe -v 로 판을 확인하십시오(1.30.7 아래이거나 1.31.0 ~ 1.31.8 이면 영향을 받습니다 — 1.30.7 이상의 1.30.x 와 1.31.9 이상은 고친 판입니다)"
        en: "an nginx (path above) outside the places this rule reads (C:\\nginx, Program Files, Laragon, Chocolatey, Scoop, winget) is a service (including one NSSM starts) or is running, so its version was not checked - check it with nginx.exe -v in that folder (below 1.30.7, or 1.31.0 to 1.31.8, is affected; 1.30.7 and later 1.30.x, and 1.31.9 or later, are fixed)"

# YARA 는 본문을 본다 — 설치본마다 nginx.exe 하나. 판마다 폴더 이름이 다른 Laragon · Chocolatey · Scoop 에는 글롭(마지막
# 성분만 와일드카드)이 닿지 않아, 경로 규칙 `install` 이 고른 파일의 본문을 담는다(`ref` 형의 상한은 기본 8 MB).
collect_extra:
  - { ref: install, content: true }
