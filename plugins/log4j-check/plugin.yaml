# Log4j 점검 — Windows · 리눅스 (CVE-2021-44228 Log4Shell 계열 · log4j 1.x · logback)
#
# **고치지 않는다.** 라이브러리를 올리는 것은 그 앱을 만든 쪽 · 운영자의 일이다 — jar 에서 클래스를 빼면 서명 ·
# 무결성을 보는 앱이 멈춘다.
#
# # 어디를 보나
#
# **디스크 전체의 jar · war · ear** 다(`%FIXED_DISKS%` · `file_names`) — 라이브러리는 기계마다 아무 자리에나 깔린다.
# Windows 는 고정 드라이브, 리눅스는 로컬 디스크 마운트이고, 다른 마운트(`/proc` · 네트워크 · `9p` 공유)로 넘어가지
# 않는다. 이름이 맞는 파일만 기록 · 해시한다.
#
# # 세 갈래로 판을 안다 (코어 1.11.0 · `archive_entry`)
#
# 1. **파일 이름** — `log4j-core-2.14.1.jar` 처럼 이름에 판이 있다(디스크의 파일 · 아카이브 안의 jar).
# 2. **공식 빌드의 SHA-256** — 이름을 바꿔도 Maven Central 의 그 jar 면 판을 안다(디스크의 파일 · 아카이브 안의 jar).
# 3. **`pom.properties` 의 `version`** — 압축을 풀어 읽는다. shade 한 jar · 다시 묶은 jar(배포판 패키지)처럼 이름에
#    판이 없어도 좌표가 남아 있으면 판을 안다. war · ear · Spring Boot jar 안은 4겹까지 연다.
#
# **모르면 확인 필요**다 — log4j-core 의 좌표는 있는데 판이 적혀 있지 않거나, 아카이브를 끝까지 읽지 못했으면
# (깨진 목록 · 잘린 파일 · 상한 · 암호 · 모르는 압축) 그 자리를 적어 6 으로 낸다.
#
# # 취약 판 (CNA 레코드 기준 — 아래 출처)
#
# | 라이브러리 | 취약 | CVE |
# |---|---|---|
# | log4j-core 2.x | 2.0-alpha1 ~ 2.17.0, **2.3.2 · 2.12.4 는 뺀다**(Java 6 · 7 의 고친 판) | 2021-44228 · 45046 · 45105 · 44832 |
# | log4j 1.x | **전부**(2015 년 지원 종료) | 2021-4104 · 2019-17571 · 2022-23302 · 23305 · 23307 · 2023-26464 |
# | logback-core | 1.2.9 미만 · 1.3.0-alpha10 이하 | 2021-42550 |
#
# 2017-5645 · 2020-9488 은 위 범위 안이다. 2025 ~ 2026 의 중간 위험 공지(특정 appender · layout 을 쓸 때만)는
# 넣지 않는다 — 파일로는 그 설정을 쓰는지 가릴 수 없다.
#
# # 판정 기준의 출처 (공개)
#
# - Apache Logging Services 보안 공지 — https://logging.apache.org/security.html
# - CVE 원본 레코드(CNA) — CVE-2021-44832 는 웹 페이지가 45105 의 범위를 적었고 CNA(apache) 레코드는 `2.0-beta7 through
#   2.17.0 (excluding 2.3.2 and 2.12.4)` 다 → **레코드를 따른다**. CVE-2021-42550 은 설명이 *"1.2.7 and prior"* 지만 레코드의
#   범위는 `<1.2.9 · <1.3.0-alpha11` 이다 → 레코드를 따른다(1.2.8 은 취약).
# - 공식 jar 해시 — Maven Central(게시된 SHA-1 로 대조한 뒤 SHA-256 을 적었다)
#
# # 이 룰이 보지 않는 것
#
# - 실행 중인 자바 프로세스가 어느 log4j 를 실었는가 — 디스크의 파일만 본다
# - 좌표(`pom.properties`) 없이 클래스만 옮겨 담은 jar 의 판 — log4j-core 가 들어 있다는 것도 알리지 못한다
# - 2.x 를 쓰는 앱이 `JndiLookup.class` 를 뺐는가 — 판으로 판정한다(뺀 jar 도 45105 · 44832 가 남는다)
schema_version: 1
id: log4j-check
version: 0.1.0
min_core: "1.11.0"
platforms: [windows, linux]

kind: check

name:
  ko: "Log4j 점검 (CVE-2021-44228 등)"
  en: "Log4j check (CVE-2021-44228 and related)"

references:
  - "https://logging.apache.org/security.html"
  - "CVE-2021-44228"
  - "CVE-2021-45046"
  - "CVE-2021-45105"
  - "CVE-2021-44832"
  - "CVE-2021-4104"
  - "CVE-2019-17571"
  - "CVE-2022-23302"
  - "CVE-2022-23305"
  - "CVE-2022-23307"
  - "CVE-2023-26464"
  - "CVE-2021-42550"
  - "https://logback.qos.ch/news.html"

scan_roots: ["%FIXED_DISKS%"]
file_names: ["*.jar", "*.war", "*.ear"]
subjects: [file, archive_entry]
# 담을 항목 — 안쪽 jar · war · ear(이 꼴의 zip 은 안까지 연다)와 좌표 파일.
archive_members: ["*.jar", "*.war", "*.ear", "pom.properties"]

detect:
  # ── 1. 이름 ─────────────────────────────────────────────────────────────
  - id: core_name
    subject: file
    where:
      - { field: path, op: matches, value: '(?i)(^|[\\/])log4j-core-2\.(0([.-][0-9a-z]+)*|[124-9](\.[0-9]+)?|3(\.[01])?|1[013-6](\.[0-9]+)?|12(\.[0-3])?|17\.0)\.jar$' }
  - id: v1_name
    subject: file
    where:
      - { field: path, op: matches, value: '(?i)(^|[\\/])log4j-1\.[0-9]+(\.[0-9]+)*([.-]?(alpha|beta|rc)[0-9a-z-]*)?\.jar$' }
  - id: logback_name
    subject: file
    where:
      - { field: path, op: matches, value: '(?i)(^|[\\/])logback-core-(0\.[0-9.]+|1\.[01](\.[0-9]+)?|1\.2(\.[0-8])?|1\.3\.0-alpha([0-9]|10))\.jar$' }
  - id: nested_core_name
    subject: archive_entry
    where:
      - { field: name, op: matches, value: '(?i)^log4j-core-2\.(0([.-][0-9a-z]+)*|[124-9](\.[0-9]+)?|3(\.[01])?|1[013-6](\.[0-9]+)?|12(\.[0-3])?|17\.0)\.jar$' }
  - id: nested_v1_name
    subject: archive_entry
    where:
      - { field: name, op: matches, value: '(?i)^log4j-1\.[0-9]+(\.[0-9]+)*([.-]?(alpha|beta|rc)[0-9a-z-]*)?\.jar$' }
  - id: nested_logback_name
    subject: archive_entry
    where:
      - { field: name, op: matches, value: '(?i)^logback-core-(0\.[0-9.]+|1\.[01](\.[0-9]+)?|1\.2(\.[0-8])?|1\.3\.0-alpha([0-9]|10))\.jar$' }

  # ── 2. 공식 빌드의 SHA-256 (Maven Central) ──────────────────────────────
  - id: official_hash
    subject: file
    where:
      - field: sha256
        op: in
        value: &vulnerable_builds
          - dcde6033b205433d6e9855c93740f798951fa3a3f252035a768d9f356fde806d   # log4j-core 2.0-beta9
          - 85338f694c844c8b66d8a1b981bcf38627f95579209b2662182a009d849e1a4c   # log4j-core 2.0
          - 6ae3b0cb657e051f97835a6432c2b0f50a651b36b6d4af395bbe9060bb4ef4b2   # log4j-core 2.3
          - 08174cf19ad32b5190f3c97c8e15f8dbb00cc93bbbdb72fd3a1130784ca7831b   # log4j-core 2.3.1
          - 885e31a14fc71cb4849e93564d26a221c685a789379ef63cb2d082cedf3c2235   # log4j-core 2.12.1
          - 57bc36ea9fbe150b892fd1fe239a18fcf762ce87f198cb9ffbc41d28d8a5b59a   # log4j-core 2.12.2
          - 048b115555db409892bcd186fbda492041a82cdb84ad6fcf5c928d03f8a92d9a   # log4j-core 2.12.3
          - ade7402a70667a727635d5c4c29495f4ff96f061f12539763f6f123973b465b0   # log4j-core 2.14.1
          - 419a8512895971b7b4f4f33e620d361254e5c9552b904b0474b09ddd4a6a220b   # log4j-core 2.15.0
          - 5d241620b10e3f1475320bc9552cf7bcfa27eeb9b1b6a891449e76db4b4a02a8   # log4j-core 2.16.0
          - 65c33dc9b24a5e5f6cacae62680641582894749c7bf16c951032ef92f3e12a60   # log4j-core 2.17.0
          - dc67378cf428c06408e7959e83bdc1518dd22ccd313e7c28a986612d65c276c7   # log4j 1.2.12
          - 7ae3fdde7ab0cae4735a2aec04381ad9b6e25c93d24205f3ed315d9866f12fe1   # log4j 1.2.16
          - 1d31696445697720527091754369082a6651bd49781b6005deb94e56753406f9   # log4j 1.2.17
          - 5946d837fe6f960c02a53eda7a6926ecc3c758bbdd69aa453ee429f858217f22   # logback-core 1.2.3
          - 763ead25f9be559fe7799d6a0660c085a9091eba59e961a4734597deb10c2938   # logback-core 1.2.7
          - 799fc59faec20f5043ab50bd03e3c9f83381adf1818eae3307257923afd1e44d   # logback-core 1.2.8
  - id: nested_official_hash
    subject: archive_entry
    where:
      - { field: sha256, op: in, value: *vulnerable_builds }

  # ── 3. 압축을 푼 pom.properties 의 판 ───────────────────────────────────
  # 판 뒤의 꼬리(`2.13.3.redhat-00002` 처럼 글자로 시작하는 것)는 그 판으로 본다.
  - id: core_pom
    subject: archive_entry
    where:
      - { field: path, op: matches, value: '(^|/)META-INF/maven/org\.apache\.logging\.log4j/log4j-core/pom\.properties$' }
      - { field: text, op: matches, value: '(?m)^version=2\.(0([.-][0-9a-z]+)*|[124-9](\.[0-9]+)?|3(\.[01])?|1[013-6](\.[0-9]+)?|12(\.[0-3])?|17\.0)([.-][a-z][^\r\n]*)?\r?$' }
  - id: v1_pom
    subject: archive_entry
    where:
      - { field: path, op: matches, value: '(^|/)META-INF/maven/log4j/log4j/pom\.properties$' }
      - { field: text, op: matches, value: '(?m)^version=1\.[^\r\n]*\r?$' }
  - id: logback_pom
    subject: archive_entry
    where:
      - { field: path, op: matches, value: '(^|/)META-INF/maven/ch\.qos\.logback/logback-core/pom\.properties$' }
      - { field: text, op: matches, value: '(?m)^version=(0\.[0-9.]+|1\.[01](\.[0-9]+)?|1\.2(\.[0-8])?|1\.3\.0-alpha([0-9]|10))([.-][a-z][^\r\n]*)?\r?$' }

  # ── 모르는 것 ─────────────────────────────────────────────────────────────
  # log4j-core 의 좌표는 있는데 판이 적혀 있지 않다.
  - id: core_no_version
    subject: archive_entry
    where:
      - { field: path, op: matches, value: '(^|/)META-INF/maven/org\.apache\.logging\.log4j/log4j-core/pom\.properties$' }
    exclude:
      - { field: text, op: matches, value: '(?m)^version=[0-9]' }
  # 아카이브를 끝까지 읽지 못했다 — 그 안에 log4j 가 있어도 모른다.
  - id: unread
    subject: archive_entry
    where:
      - { field: error, op: exists }

verdict:
  require: "core_name or v1_name or logback_name or nested_core_name or nested_v1_name or nested_logback_name or official_hash or nested_official_hash or core_pom or v1_pom or logback_pom"
  unconfirmed:
    - when: "core_no_version"
      why:
        ko: "log4j-core 가 들어 있는데 버전이 적혀 있지 않습니다 — 위 파일 안의 log4j-core 버전을 확인하십시오"
        en: "log4j-core is present but its version is not recorded - check the log4j-core version inside the file above"
    - when: "unread"
      why:
        ko: "위 아카이브를 끝까지 읽지 못했습니다 — 그 파일 안에 log4j · logback 이 있는지 확인하십시오"
        en: "the archive above could not be read to the end - check that file for log4j or logback"
