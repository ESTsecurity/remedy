# Java4Shell 점검 — Windows (CVE-2026-114938)
#
# **고치지 않는다.** 이 결함은 Java 런타임 안에 있고 메우는 것은 그 런타임을 낸 곳의 일이다. 점검의 답은 **판 하나**다.
#
# # 어떻게 판을 읽나
#
# JDK · JRE 이미지는 제 홈에 `release` 라는 텍스트 파일을 두고 그 안에 `JAVA_VERSION="17.0.21"` 줄이 있다 — Windows 판도
# 같다(실측 2026-11-18 · Eclipse Temurin 17.0.21+9 의 Windows x64 zip: `jdk-17.0.21+9\bin\java.exe` 와 같은 폴더의
# `release` 에 `JAVA_VERSION="17.0.21"` · `OS_ARCH="x86_64"` · `OS_NAME="Windows"`). 확장자가 없어 코어의 설정
# 수집(`text_config`)이 닿지 않으므로 **파일 본문**으로 읽는다(`rules/java.yar` — 리눅스 룰과 같은 파일이다).
#
# 홈을 가리키는 것은 그 안의 `bin\java.exe` 다 — `release` 라는 이름만으로는 Java 와 무관한 파일도 걸리므로, **`bin\java.exe`
# 가 있는 폴더의 `release` 만** 본다(`capture` + `from`).
#
# # 판정
#
# 공지의 위험 표가 이 CVE 가 걸린 줄을 **17 · 21 · 25 · 27** 로 적었고(8 · 11 칸은 비어 있다), 같은 날 나온 고친 판이
# **17.0.21.1 · 21.0.13.1 · 25.0.5.1 · 27.0.1.1** 이다. 그래서 **고친 판 미만은 취약(2) · 고친 판 이상은 0** 이다.
# **Java SE 8 은 Enterprise Performance Pack(`-perf` 빌드)만** 영향 판이다 — Oracle CPU 2026-11 의 Java SE 위험 표가 이
# CVE 의 줄에 8u511b33-perf 를 적었고 고친 판은 8u513-perf 다(일반 8u511b33 은 같은 표의 다른 CVE 줄이다 · 0.2.0).
# GraalVM for JDK 는 바탕 Java 의 `JAVA_VERSION` 으로 같은 판정을 받는다. **Oracle GraalVM Enterprise Edition 21.3 은 제품
# 판으로 본다** — Oracle 이 21.3.20.0.3 을 영향 판으로 적었고 그 줄에는 Java 17 · 11 · 8 판이 있어, `GRAALVM_VERSION` 이
# 21.3.20.1 미만이고 Oracle 빌드(`IMPLEMENTOR="Oracle Corporation"`)면 바탕 Java 와 상관없이 취약이다(0.3.0). Community 판 ·
# 다른 배포사가 지은 것은 바탕 Java 로 판정한다.
# 배포사의 제 번호(Corretto-17.0.21.0.11 · Red_Hat-17.0.21.0.9)는 `JAVA_VERSION` 이 아니라 `IMPLEMENTOR_VERSION` 에
# 있으므로(실측) 여기서 견주는 것은 상류 판이다. 17 줄은 **17.0.6 아래를 영향에서 뺀다**(x86-64 Base64 디코드 코드가 그
# 판에 들어왔다 — JDK-8268276). 지원이 끝난 줄(18 ~ 20 · 22 ~ 24 · 26)은 같은 코드를 담았고 고친 판이 나오지 않으므로
# 취약으로 내고 지원되는 줄로 올리라고 적는다. 아직 개발 중인 줄(28)은 고친 빌드 번호가 없어 **확인 필요(6)** 다.
#
# 32비트 빌드와 ARM64 빌드는 영향이 없다(결함이 x86-64 의 AVX-512 VBMI 경로에 있다) — `release` 의 `OS_ARCH` 가
# **x86-64 가 아닌 값으로 적혀 있을 때만** 뺀다. 그 줄이 아예 없는 런타임이 있기 때문이다(jlink 로 지은 런타임 — 실측
# 2026-11-18: 랩 기계가 담아 쓰는 Java 21 의 `release` 에는 `JAVA_VERSION` 과 `MODULES` 두 줄뿐이었다). 그런 홈을
# '모른다' 로 내면 실제로 취약한 기계가 확인 필요로 묻히므로 **판으로 판정한다**. **CPU 가 그 명령 집합을 가졌는지는
# 판정에 넣지 않는다**: 가상 머신은 다른 호스트로 옮겨 가고, 그때 CPU 가 바뀐다. 완화 옵션(`-XX:-UseBASE64Intrinsics` ·
# `-XX:UseAVX=2`)도 판정에 넣지 않는다 — 그 옵션을 넣는 자리가 제품마다 달라 다 볼 수 없다. 둘은 찾은 줄 아래 문구로 알린다.
#
# # 이 룰이 보지 않는 것
#
# - **아래 자리 밖에 풀어 둔 Java.** Windows 의 Java 는 설치 프로그램이 `C:\Program Files` 아래에 깔거나 제품이 함께
#   담지만, zip 을 아무 폴더에나 풀어 쓰기도 한다. **돌고 있거나 서비스로 등록됐으면 찾아서 *확인 필요* 로 그 경로를
#   적는다** — 그 파일은 열지 않는다. 멈춰 있는 것은 보지 않는다(레지스트리의 `JavaHome` 을 읽는 것은 실측한 키로
#   다음 판에 더한다). 사용자마다 까는 자리(IntelliJ 가 받는 `.jdks` · Scoop · 사용자 프로그램 폴더)는 0.2.0 부터
#   선언한 자리다. Oracle 설치 프로그램이 두는 `javapath` 의 `java.exe` 는 `C:\Program Files` 의 홈을 가리키는 길이라
#   자리 밖으로 세지 않는다(0.2.0).
# - `C:\Program Files` 아래의 **관리자도 열 수 없는 폴더**(Defender for Endpoint 의 설정 폴더 등) 안. 코어 1.24.0 부터는 그
#   폴더를 건너뛰고 나머지로 말하며 건너뛴 경로를 알린다. 1.23.0 까지는 그 폴더 하나 때문에 확인 필요였다.
# - 애플리케이션이 제 안에 담아 쓰는 런타임(jar 안의 클래스).
schema_version: 1
id: java4shell-check-windows
version: 0.3.0
min_core: "1.21.0"  # product 는 1.21.0 · label 은 1.13.0 · file_names 는 1.11.0
platforms: [windows]

kind: check
product: Java

name:
  ko: "Java4Shell 점검 (CVE-2026-114938)"
  en: "Java4Shell check (CVE-2026-114938)"

references:
  - "https://openjdk.org/groups/vulnerability/advisories/2026-11-17"
  - "CVE-2026-114938"
  - "https://www.oracle.com/security-alerts/cspunov2026.html"
  - "https://calif.io/java4shell/"

# Java 런타임이 놓이는 자리 — 배포사 설치 프로그램(`C:\Program Files\Java` · `Eclipse Adoptium` · `Amazon Corretto` ·
# `Microsoft` · `Zulu` · `BellSoft` · `SapMachine` 등이 전부 그 아래다)과 제품이 함께 담은 런타임. `file_names` 가 이
# 자리에서 **이름이 맞는 파일만** 기록하므로 폴더를 걷기만 한다.
#
# 사용자마다 까는 JDK — `%ALLUSERPROFILES%` 로 모든 사용자를 본다: IntelliJ 가 받는 JDK(`.jdks`) · Scoop(`scoop\apps` · 전역은
# `C:\ProgramData\scoop\apps`) · 사용자 프로그램 폴더(`AppData\Local\Programs` — JetBrains IDE 가 담아 쓰는 런타임 등) ·
# Gradle 툴체인(`.gradle\jdks`) · jabba(0.2.0).
#
# VS Code 의 Java 확장(redhat.java)이 담는 JRE(0.3.0) — 실측 2026-11-18: 1.59.2026111308 win32-x64 판이
# `jre\25.0.5-win32-x86_64\` 에 `bin\java.exe` 와 `JAVA_VERSION="25.0.5"` · `MODULES` 두 줄의 `release` 를 담는다(아키텍처
# 줄이 없는 jlink 꼴 — 판으로 판정한다). 확장은 사용자마다 `.vscode\extensions` 에 깔린다.
scan_roots:
  - 'C:\Program Files'
  - 'C:\Program Files (x86)'
  - 'C:\ProgramData\scoop\apps'
  - '%ALLUSERPROFILES%\.jdks'
  - '%ALLUSERPROFILES%\scoop\apps'
  - '%ALLUSERPROFILES%\AppData\Local\Programs'
  - '%ALLUSERPROFILES%\.gradle\jdks'
  - '%ALLUSERPROFILES%\.jabba\jdk'
  - '%ALLUSERPROFILES%\.vscode\extensions'

file_names: ["release", "java.exe"]
subjects: [file, process, service]

detect:
  # ── 설치본 — `bin\java.exe` 가 홈을 가리킨다 ─────────────────────────────
  - id: java_bin
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\bin\\java\.exe$' }
        - { field: sha256, op: exists }
    capture:
      home: "path | dirname | dirname"
    label:
      ko: "Java 런타임 설치본입니다"
      en: "a Java runtime installation"

  # 그 홈의 `release` — 판을 읽는 파일이다. 본문은 아래 `collect_extra` 가 담는다.
  - id: release_file
    subject: file
    from: "${java_bin.home}"
    where:
      - { field: path, op: matches, value: '(?i)\\release$' }
    label:
      ko: "이 설치본의 판이 적힌 파일입니다"
      en: "the file that records this installation's version"

  # ── 판정 — 영향 판 ───────────────────────────────────────────────────────
  - id: affected
    subject: file
    from: "${java_bin.home}"
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\release$' }
        - { yara: "rules/java.yar:java_version_affected" }
    exclude:
      - { yara: "rules/java.yar:os_arch_not_x64" }
      - { yara: "rules/java.yar:java_version_17_before_intrinsic" }
      # GraalVM EE 21.3 은 아래 제품 판 줄이 말한다 — 같은 파일에 고칠 판이 다른 두 줄이 서지 않게(0.3.0).
      - { yara: "rules/java.yar:graalvm_ee_affected" }
    label:
      ko: "CVE-2026-114938 의 영향 판입니다 — 고친 판(17.0.21.1 · 21.0.13.1 · 25.0.5.1 · 27.0.1.1) 이상으로 올리고 그 자바로 돌던 서비스를 다시 시작하십시오"
      en: "a build affected by CVE-2026-114938 - upgrade to a fixed release (17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1) or later and restart the services that ran on it"

  # Java SE 8 의 Enterprise Performance Pack — 판 줄의 업데이트 번호가 513 아래이고 어느 판 줄에든 `-perf` 표지가 있다(0.2.0).
  - id: epp_affected
    subject: file
    from: "${java_bin.home}"
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\release$' }
        - { yara: "rules/java.yar:java_epp_affected" }
    exclude:
      - { yara: "rules/java.yar:os_arch_not_x64" }
    label:
      ko: "CVE-2026-114938 의 영향 판(Java SE 8 Enterprise Performance Pack)입니다 — 8u513-perf 이상으로 올리고 그 자바로 돌던 서비스를 다시 시작하십시오"
      en: "a build affected by CVE-2026-114938 (Java SE 8 Enterprise Performance Pack) - upgrade to 8u513-perf or later and restart the services that ran on it"

  # Oracle GraalVM Enterprise Edition 21.3 — Oracle 이 21.3.20.0.3 을 영향 판으로 적었고 그 줄에는 Java 17 · 11 · 8 판이 있다.
  # 바탕 Java 와 상관없이 제품 판(`GRAALVM_VERSION`)이 21.3.20.1 미만이면 취약이다(0.3.0 · 2026-11-18 결정 G1).
  - id: graalvm_ee_affected
    subject: file
    from: "${java_bin.home}"
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\release$' }
        - { yara: "rules/java.yar:graalvm_ee_affected" }
    exclude:
      - { yara: "rules/java.yar:os_arch_not_x64" }
    label:
      ko: "CVE-2026-114938 의 영향 판(Oracle GraalVM Enterprise Edition 21.3)입니다 — Oracle 이 낸 고친 판으로 올리고 그 자바로 돌던 서비스를 다시 시작하십시오"
      en: "a build affected by CVE-2026-114938 (Oracle GraalVM Enterprise Edition 21.3) - upgrade to the fixed release from Oracle and restart the services that ran on it"

  - id: eol_line
    subject: file
    from: "${java_bin.home}"
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\release$' }
        - { yara: "rules/java.yar:java_version_eol_line" }
    exclude:
      - { yara: "rules/java.yar:os_arch_not_x64" }
    label:
      ko: "지원이 끝난 Java 판입니다 — CVE-2026-114938 의 고친 판이 나오지 않습니다. 지원되는 판(17 · 21 · 25)으로 올리십시오"
      en: "a Java release past its support - no fixed build for CVE-2026-114938 will come; move to a supported release (17, 21, 25)"

  # ── 모르는 자리 ──────────────────────────────────────────────────────────
  - id: future_line
    subject: file
    from: "${java_bin.home}"
    where:
      all:
        - { field: path, op: matches, value: '(?i)\\release$' }
        - { yara: "rules/java.yar:java_version_future_line" }
    exclude:
      - { yara: "rules/java.yar:os_arch_not_x64" }
    label:
      ko: "아직 개발 중인 Java 판입니다 — 이 결함을 고친 빌드 번호가 공개되지 않았습니다"
      en: "a Java release still in development - the number of the build that carries the fix is not published yet"

  - id: no_version
    subject: file
    from: "${java_bin.home}"
    where:
      - { field: path, op: matches, value: '(?i)\\release$' }
    exclude:
      - { yara: "rules/java.yar:java_release_file" }
      # 판을 못 읽어도 x86-64 가 아니라고 적힌 빌드는 영향이 없다 — 판정 줄들과 같은 제외다(0.3.0 · 독립 검토).
      - { yara: "rules/java.yar:os_arch_not_x64" }
    label:
      ko: "이 설치본의 판을 읽지 못했습니다"
      en: "this installation's version could not be read"

  # ── 선언한 자리 밖 ───────────────────────────────────────────────────────
  # 선언한 자리 — `C:\Program Files` 둘 · 사용자 프로필의 세 자리. Oracle 설치 프로그램의 `javapath`(`C:\ProgramData\Oracle\
  # Java\javapath`)는 `C:\Program Files\Java` 의 홈을 가리키는 길이라 함께 뺀다(0.2.0).
  - id: outside_process
    subject: process
    where:
      - { field: image_path, op: matches, value: '(?i)\\javaw?\.exe$' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^"?c:\\program files( \(x86\))?\\' }
      - { field: image_path, op: matches, value: '(?i)^"?c:\\users(\\[^\\]+)\\(\.jdks|scoop\\apps|appdata\\local\\programs|\.gradle\\jdks|\.jabba\\jdk|\.vscode\\extensions)\\' }
      - { field: image_path, op: matches, value: '(?i)^"?c:\\programdata\\(oracle\\java\\javapath|scoop\\apps)\\' }
    label:
      ko: "이 룰이 보는 자리 밖에서 도는 Java 입니다"
      en: "a Java running outside the places this rule reads"

  - id: outside_service
    subject: service
    where:
      - { field: image_path, op: matches, value: '(?i)\\javaw?\.exe' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^"?c:\\program files( \(x86\))?\\' }
      - { field: image_path, op: matches, value: '(?i)^"?c:\\users(\\[^\\]+)\\(\.jdks|scoop\\apps|appdata\\local\\programs|\.gradle\\jdks|\.jabba\\jdk|\.vscode\\extensions)\\' }
      - { field: image_path, op: matches, value: '(?i)^"?c:\\programdata\\(oracle\\java\\javapath|scoop\\apps)\\' }
    label:
      ko: "이 룰이 보는 자리 밖의 Java 를 띄우는 서비스입니다"
      en: "a service that starts a Java outside the places this rule reads"

verdict:
  require: "java_bin and (affected or epp_affected or graalvm_ee_affected or eol_line)"
  unconfirmed:
    - when: "java_bin and future_line"
      why:
        ko: "아직 개발 중인 Java 판입니다(위 경로) — 이 결함의 수정이 소스에는 들어갔지만 그것을 담은 빌드 번호가 아직 공개되지 않아 이 빌드가 고쳐졌는지 말할 수 없습니다. 지원되는 판(17 · 21 · 25)의 고친 판으로 옮기십시오"
        en: "a Java release still in development (path above) - the fix is in the source but the number of the build that carries it is not published yet, so whether this build is fixed cannot be stated; move to a fixed release of a supported line (17, 21, 25)"
    - when: "java_bin and no_version"
      why:
        ko: "Java 런타임(위 경로)의 release 파일에서 판을 읽지 못했습니다 — 그 홈의 bin\\java.exe -version 으로 판을 확인하십시오(17.0.21.0.3 · 21.0.13.0.3 · 25.0.5.0.3 · 27.0.1.0.3 · Java 8 EPP 8u511-perf 이하면 CVE-2026-114938 의 영향을 받습니다)"
        en: "the version could not be read from the release file of the Java runtime above - check it with that home's bin\\java.exe -version (at or below 17.0.21.0.3, 21.0.13.0.3, 25.0.5.0.3, 27.0.1.0.3 or Java 8 EPP 8u511-perf is affected by CVE-2026-114938)"
    - when: "java_bin and not release_file"
      why:
        ko: "Java 런타임(위 경로)에 판이 적힌 release 파일이 없습니다 — 그 홈의 bin\\java.exe -version 으로 판을 확인하십시오"
        en: "the Java runtime above has no release file recording its version - check it with that home's bin\\java.exe -version"
    - when: "outside_process or outside_service"
      why:
        ko: "이 룰이 보는 자리(C:\\Program Files · C:\\Program Files (x86) · Scoop · 사용자 프로필의 .jdks · AppData\\Local\\Programs · .gradle\\jdks · VS Code 확장 등) 밖의 Java(위 경로)가 돌고 있거나 서비스로 등록돼 그 판을 보지 않았습니다 — 그 경로의 bin\\java.exe -version 으로 확인하십시오"
        en: "a Java outside the places this rule reads (C:\\Program Files, C:\\Program Files (x86), Scoop, and .jdks, AppData\\Local\\Programs, .gradle\\jdks, VS Code extensions and the like in user profiles) is running or registered as a service, so its version was not checked - check it with that path's bin\\java.exe -version"

# 판을 읽을 바이트는 수집 시점에 담겨 있어야 한다. `release` 는 1 ~ 15 KB 다(실측).
collect_extra:
  - { ref: release_file, content: true }
