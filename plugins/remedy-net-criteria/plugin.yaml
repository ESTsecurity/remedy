# 동반 프로그램 판정 기준 — 데이터 룰 (코어 1.12.0)
#
# **이 룰은 아무것도 보지 않는다.** 동반 프로그램 `remedy-net` 이 점검할 때 견주는 기준을 담는다 —
# 원격 점검(url)의 PHP2Shell 수정 버전 표(`url.json`)와, 이미지 · 컨테이너 점검의 PHP · Node.js 기준
# (`baseline.json`). remedy-net 은 점검을 시작할 때 이 폴더를 배포 키로 확인하고(본체가 룰 폴더를 확인하는
# 것과 같은 사슬 — 서명 · 파일 목록 · 서명 주석의 이름), 확인하지 못하면 점검하지 않는다(종료 4).
#
# # 기준을 바꾸려면
#
# 이 폴더의 파일과 아래 `version` 만 고친다 — remedy-net 은 다시 짓지 않는다. 같은 공지의 값이 본체의
# 점검 룰(`php2shell-check-*` · `node2shell-check-*`)에도 있으므로 함께 고치고, `cargo xtask net-criteria`
# 가 두 자리가 같은지 · 두 파일이 remedy-net 의 형식으로 읽히는지 본다(모르는 칸은 거부한다). 고친 파일은
# `plugin-lock` 이 잠근다 — 버전을 올리지 않으면 실패한다.
#
# # 메뉴에 서지 않는다
#
# `kind: data` — 메뉴 · 모두 검사만 · 위협 표에 서지 않고, `scan` · `run` · `verify` 에 주면 종료 4 로
# 멈춘다. 꾸러미에는 두 OS 모두 들어간다.
schema_version: 1
id: remedy-net-criteria
version: 1.0.0
min_core: "1.12.0"
platforms: [windows, linux]

kind: data

name:
  ko: "동반 프로그램 판정 기준"
  en: "Companion program criteria"

references:
  - "https://www.php.net/archive/2026.php"
  - "https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"

# 이 기계에서 읽는 것이 없다 — 데이터 룰은 아래 셋을 비워 둔다(채우면 로드가 거부한다).
scan_roots: []
subjects: []
detect: []
