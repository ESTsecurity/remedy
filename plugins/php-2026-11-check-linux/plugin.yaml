# PHP 2026년 11월 보안 업데이트 점검 — 리눅스
#
# PHP 는 2026-11-19 에 8.5.13 · 8.4.28 · 8.3.37 · 8.2.36 보안 릴리스를 냈다(https://www.php.net/archive/2026.php). 8.5.13 의
# ChangeLog 가 보안 고침 18건(GHSA · CVE)을 적는다 — Core · CGI · Date · DOM · FPM · Phar · SOAP · Session · Standard · URI.
# 전날 공지(Upcoming Critical PHP Security Release)는 CRITICAL 인 것이 기본 설정이 아닌 구성이나 흔치 않은 설정에서만
# 닿는다고 적었다. **고치지 않는다** — 판을 올리는 것은 공급사의 일이다.
#
# # 판정 (1차 — 판으로만)
#
# | 무엇 | 결과 |
# |---|---|
# | 배포판 · 저장소 패키지(dpkg · apk · rpm)의 상류 판이 그 갈래의 고친 판 아래 · 지원이 끝난 8.1 이하 | 취약(2) |
# | 패키지 밖 PHP(공식 이미지 · 직접 빌드)의 판(실행 파일의 `X-Powered-By: PHP/<판>`)이 같은 범위 | 취약(2) |
# | 패키지 밖 PHP 의 판을 읽지 못했다 · 이 룰이 보는 자리 밖에서 돌거나 서비스 · Apache 설정이 싣는 PHP · 고친 뒤 다시 시작하지 않은 PHP · 패키지가 깐 실행 파일이 기록과 다르다 · RPM 자리에 패키지 없는 PHP | 확인 필요(6) |
# | 고친 판 이상 · 8.6 · PHP 없음 | 0 |
#
# **배포판 패키지도 상류 판으로 견준다**(1차) — 배포판이 고친 패키지를 아직 내지 않았다(2026-11-19). 배포판이 옛 판 번호에
# 고침을 넣으면(백포트 — Ubuntu · RHEL 등) 그 패키지는 이 룰에서 여전히 취약으로 나온다 — 그 배포판의 고친 판은 다음 차수에서
# 줄로 더한다(PHP2Shell 룰의 `deb12_vuln` 꼴). 판이 상류 번호를 따르는 저장소(Debian 의 새 상류 판 · Alpine · deb.sury.org ·
# Remi)는 고친 판이 나오면 그대로 0 이다.
#
# # 이 룰이 보지 않는 것
#
# - 기능을 켠 흔적(FPM · CGI · SOAP · Phar 를 쓰는가) — 판으로만 판정한다(1차)
# - 실행 중인 PHP 가 고친 판을 실었는가(재시작) — 옛 파일이 지워지지 않고 남은 채 떠 있는 php-fpm 은 가리지 못한다.
#   옛 파일이 지워졌으면 아래 `stale_php` 가 본다
# - 선언한 자리 밖에 놓였을 뿐 실행 중이 아닌 PHP — 실행 중이거나 서비스 · Apache 설정이 싣으면 확인 필요로 그 경로를 적는다
# - 컨테이너 안 · Windows(`php-2026-11-check-windows` — 다음 차수)
schema_version: 1
id: php-2026-11-check-linux
version: 0.1.0
min_core: "1.25.0"  # added 는 1.25.0 · product 는 1.21.0 · 시작 스크립트의 서비스는 1.10.0 · package_match 는 1.7.0
platforms: [linux]

kind: check
product: PHP
added: "2026-11-20"

name:
  ko: "PHP 11월 보안 업데이트 점검 (CVE-2026-129474 등 18건)"
  en: "PHP November security update check (CVE-2026-129474 and 17 more)"

references:
  - "https://www.php.net/archive/2026.php"
  - "https://www.php.net/ChangeLog-8.php"
  - "https://github.com/php/php-src/security/advisories"

# 패키지 DB 는 자리가 정해져 있어 `scan_roots` 를 보지 않는다. 파일은 PHP 실행 파일이 놓이는 자리만 읽는다 — 공식 이미지
# (`/usr/local`) · Debian 계열 Apache 모듈 · RPM 계열(`/usr/bin` · `/usr/sbin` · httpd 모듈) · 직접 빌드의 흔한 접두사
# (`/usr/local/php` · `/opt/php`). Apache 설정 자리는 판정할 PHP 가 아니라 선언 밖 PHP 를 찾는 곳이다(PHP2Shell 룰과 같다).
scan_roots:
  - "/usr/local/bin"
  - "/usr/local/sbin"
  - "/usr/local/lib"
  - "/usr/lib/apache2/modules"
  - "/usr/bin"
  - "/usr/sbin"
  - "/usr/lib64/httpd/modules"
  - "/usr/local/php"
  - "/opt/php"
  - "/etc/apache2"
  - "/etc/httpd"
  - "/usr/local/apache2/conf"
  - "/opt/lampp/etc"

subject_roots:
  file:
    - "/usr/local/bin"
    - "/usr/local/sbin"
    - "/usr/local/lib"
    - "/usr/lib/apache2/modules"
    - "/usr/bin"
    - "/usr/sbin"
    - "/usr/lib64/httpd/modules"
    - "/usr/local/php"
    - "/opt/php"
  text_config:
    - "/etc/apache2"
    - "/etc/httpd"
    - "/usr/local/apache2/conf"
    - "/opt/lampp/etc"
text_config_dirs: ["/etc/apache2/mods-available"]

subjects: [package, file, process, service, text_config]

detect:
  # ── 1. 배포판 · 저장소 패키지 — 상류 판으로 ─────────────────────────────────────
  #
  # 런타임 패키지만 본다(CLI · CGI · FPM · Apache 모듈). Debian · Ubuntu 의 메타 패키지(`php-defaults` 의 `php-cli` 등 —
  # 실행 파일이 없고 판 붙은 패키지를 끌어올 뿐)는 이름이 판 없이 `php-` 로 시작해 아래 이름 꼴에 맞지 않는다.
  # 갈래마다 계열(정규식) → 판(`*_version_lt`) 순으로 못박는다 — 고친 판은 그 갈래끼리만 견줄 뜻이 있다.
  - id: deb_vuln_85
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(php8\.5-(cli|cgi|fpm)|libapache2-mod-php8\.5)$' }
        - { field: version, op: matches, value: '^8\.5\.' }
        - { field: version, op: pkg_version_lt, value: "8.5.13" }
    label:
      ko: "PHP 11월 보안 업데이트의 영향을 받는 버전 — 8.5 계열은 8.5.13 이상으로 올리십시오(배포판 패키지는 그 배포판의 고친 패키지 · 공지를 따르십시오)"
      en: "affected by the PHP November security update - upgrade the 8.5 line to 8.5.13 or later (for a distribution package, follow that distribution's fixed package and advisory)"
  - id: deb_vuln_84
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(php8\.4-(cli|cgi|fpm)|libapache2-mod-php8\.4)$' }
        - { field: version, op: matches, value: '^8\.4\.' }
        - { field: version, op: pkg_version_lt, value: "8.4.28" }
    label:
      ko: "PHP 11월 보안 업데이트의 영향을 받는 버전 — 8.4 계열은 8.4.28 이상으로 올리십시오(배포판 패키지는 그 배포판의 고친 패키지 · 공지를 따르십시오)"
      en: "affected by the PHP November security update - upgrade the 8.4 line to 8.4.28 or later (for a distribution package, follow that distribution's fixed package and advisory)"
  - id: deb_vuln_83
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(php8\.3-(cli|cgi|fpm)|libapache2-mod-php8\.3)$' }
        - { field: version, op: matches, value: '^8\.3\.' }
        - { field: version, op: pkg_version_lt, value: "8.3.37" }
    label:
      ko: "PHP 11월 보안 업데이트의 영향을 받는 버전 — 8.3 계열은 8.3.37 이상으로 올리십시오(배포판 패키지는 그 배포판의 고친 패키지 · 공지를 따르십시오)"
      en: "affected by the PHP November security update - upgrade the 8.3 line to 8.3.37 or later (for a distribution package, follow that distribution's fixed package and advisory)"
  - id: deb_vuln_82
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(php8\.2-(cli|cgi|fpm)|libapache2-mod-php8\.2)$' }
        - { field: version, op: matches, value: '^8\.2\.' }
        - { field: version, op: pkg_version_lt, value: "8.2.36" }
    label:
      ko: "PHP 11월 보안 업데이트의 영향을 받는 버전 — 8.2 계열은 8.2.36 이상으로 올리십시오(배포판 패키지는 그 배포판의 고친 패키지 · 공지를 따르십시오)"
      en: "affected by the PHP November security update - upgrade the 8.2 line to 8.2.36 or later (for a distribution package, follow that distribution's fixed package and advisory)"
  - id: deb_eol
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(php[0-9.]+-(cli|cgi|fpm)|libapache2-mod-php[0-9.]+|php5|libapache2-mod-php5)$' }
        - { field: version, op: matches, value: '^([0-9]+:)?([5-7]\.|8\.[01]\.)' }
    label:
      ko: "지원이 끝난 PHP 계열(8.1 이하) — 고친 버전이 나오지 않습니다. 지원되는 계열(8.2 이상)의 고친 버전으로 옮기거나, 배포판 패키지면 그 배포판의 고친 패키지 · 공지를 따르십시오"
      en: "an end-of-life PHP line (8.1 or older) - there is no upstream fix; move to a fixed release of a supported line (8.2 or later), or for a distribution package follow that distribution's fixed package and advisory"
  - id: apk_vuln
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: apk }
        - { field: name, op: matches, value: '^php[0-9]{2}(-(cgi|fpm|apache2))?$' }
        - any:
            - all:
                - { field: version, op: matches, value: '^8\.5\.' }
                - { field: version, op: apk_version_lt, value: "8.5.13-r0" }
            - all:
                - { field: version, op: matches, value: '^8\.4\.' }
                - { field: version, op: apk_version_lt, value: "8.4.28-r0" }
            - all:
                - { field: version, op: matches, value: '^8\.3\.' }
                - { field: version, op: apk_version_lt, value: "8.3.37-r0" }
            - all:
                - { field: version, op: matches, value: '^8\.2\.' }
                - { field: version, op: apk_version_lt, value: "8.2.36-r0" }
            - { field: version, op: matches, value: '^([5-7]\.|8\.[01]\.)' }
    label:
      ko: "PHP 11월 보안 업데이트의 영향을 받는 버전(Alpine 패키지) — 그 계열의 고친 버전(8.5.13 · 8.4.28 · 8.3.37 · 8.2.36) 이상으로 올리십시오(8.1 이하는 고친 버전이 없습니다)"
      en: "affected by the PHP November security update (Alpine package) - upgrade to the fixed release of its line (8.5.13, 8.4.28, 8.3.37, 8.2.36); 8.1 and older have no fix"
  - id: rpm_vuln
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: rpm }
        - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }
        - any:
            - all:
                - { field: version, op: matches, value: '^(?:0:)?8\.5\.' }
                - { field: version, op: rpm_version_lt, value: "0:8.5.13" }
            - all:
                - { field: version, op: matches, value: '^(?:0:)?8\.4\.' }
                - { field: version, op: rpm_version_lt, value: "0:8.4.28" }
            - all:
                - { field: version, op: matches, value: '^(?:0:)?8\.3\.' }
                - { field: version, op: rpm_version_lt, value: "0:8.3.37" }
            - all:
                - { field: version, op: matches, value: '^(?:0:)?8\.2\.' }
                - { field: version, op: rpm_version_lt, value: "0:8.2.36" }
            - { field: version, op: matches, value: '^(?:0:)?([5-7]\.|8\.[01]\.)' }
    label:
      ko: "PHP 11월 보안 업데이트의 영향을 받는 버전(RPM 패키지) — 그 계열의 고친 버전(8.5.13 · 8.4.28 · 8.3.37 · 8.2.36) 이상으로 올리거나 공급사(RHEL · Oracle · SUSE · Remi 등)의 고친 패키지 · 공지를 따르십시오(8.1 이하는 상류의 고친 버전이 없습니다)"
      en: "affected by the PHP November security update (RPM package) - upgrade to the fixed release of its line (8.5.13, 8.4.28, 8.3.37, 8.2.36), or follow the vendor's (RHEL, Oracle, SUSE, Remi and so on) fixed package and advisory; 8.1 and older have no upstream fix"
  # RPM 의 PHP 런타임 패키지가 있는가 — 아래 `bin_rpm` 이 *"패키지가 깔지 않은 PHP"* 를 가를 때 쓴다.
  - id: rpm_php
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: rpm }
        - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }

  # ── 2. 패키지 밖의 PHP — 실행 파일의 판 문자열 ───────────────────────────────────
  #
  # 공식 Docker 이미지는 PHP 를 `/usr/local` 에 직접 빌드해 둔다(패키지가 아니다). Apache 이미지의 모듈은
  # `/usr/lib/apache2/modules/libphp.so` 다. 직접 빌드의 접두사 `/usr/local/php` · `/opt/php` 아래(판마다 하위 폴더를 두는
  # 꼴도)의 `bin` · `sbin` 실행 파일과 `lib` 의 `libphp*.so` 도 본다. 패키지가 깐 파일은 패키지 줄이 판정한다.
  - id: bin_vuln
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^(/usr/local/(bin/php(-cgi)?|sbin/php-fpm|lib/libphp[0-9]*\.so)|/usr/lib/apache2/modules/libphp\.so|/(usr/local|opt)/php/(.+/)?(s?bin/(php|php-cgi|php-fpm)[0-9.]*|lib(64)?/libphp[0-9.]*\.so))$' }
        - { yara: "rules/php.yar:php_version_affected" }
    exclude:
      - { field: package, op: matches, value: '.' }
    label:
      ko: "패키지로 깔지 않은 PHP(공식 Docker 이미지 · 직접 빌드)의 영향을 받는 버전 — 그 계열의 고친 버전(8.5.13 · 8.4.28 · 8.3.37 · 8.2.36) 이상으로 올리십시오(8.1 이하는 고친 버전이 없습니다)"
      en: "a PHP outside any package (official image or own build) in the affected range - upgrade to the fixed release of its line (8.5.13, 8.4.28, 8.3.37, 8.2.36); 8.1 and older have no fix"
  - id: bin_php
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^(/usr/local/(bin/php(-cgi)?|sbin/php-fpm|lib/libphp[0-9]*\.so)|/usr/lib/apache2/modules/libphp\.so|/(usr/local|opt)/php/(.+/)?(s?bin/(php|php-cgi|php-fpm)[0-9.]*|lib(64)?/libphp[0-9.]*\.so))$' }
        - { field: sha256, op: exists }
    exclude:
      - { field: package, op: matches, value: '.' }
  - id: bin_version_known
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^(/usr/local/(bin/php(-cgi)?|sbin/php-fpm|lib/libphp[0-9]*\.so)|/usr/lib/apache2/modules/libphp\.so|/(usr/local|opt)/php/(.+/)?(s?bin/(php|php-cgi|php-fpm)[0-9.]*|lib(64)?/libphp[0-9.]*\.so))$' }
        - { yara: "rules/php.yar:php_version_string" }
    exclude:
      - { field: package, op: matches, value: '.' }

  # ── 3. RPM 의 자리에 놓인 PHP — 패키지가 깔지 않았다면 확인 필요 ─────────────────────
  #
  # 정규 파일만 본다(`sha256` 이 있다). Debian 계열의 `/usr/bin/php` 는 대안(alternatives) 링크라 해시가 없다.
  - id: bin_rpm
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^/usr/(bin/php(-cgi)?|sbin/php-fpm|lib64/httpd/modules/libphp[0-9]?\.so)$' }
        - { field: sha256, op: exists }

  # ── 선언한 자리 밖에서 실행 중 · 서비스 · Apache 설정의 PHP — PHP2Shell 룰 0.6.1 과 같은 줄 ──────────────
  - id: running_php
    subject: process
    where:
      - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
    exclude:
      - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }
  - id: service_php
    subject: service
    where:
      - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
    exclude:
      - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }
  - id: apache_php
    subject: text_config
    where:
      - { field: path, op: matches, value: '^/(etc/apache2|usr/local/apache2/conf|opt/lampp/etc)/' }
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s' }
    exclude:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s+"?(/usr/lib(64)?/(apache2|httpd)[^/]*/|/usr/local/lib/|/(usr/local|opt)/php/)' }
  - id: apache_php_rpm
    subject: text_config
    where:
      - { field: path, op: matches, value: '^/etc/httpd/' }
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s' }
    exclude:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s+"?(/usr/lib(64)?/(apache2|httpd)[^/]*/|/usr/local/lib/|/(usr/local|opt)/php/|modules/)' }

  # ── 고친 뒤 다시 시작하지 않은 PHP — PHP2Shell 룰 0.4.0 과 같은 줄 ───────────────────────
  - id: stale_php
    subject: process
    where:
      any:
        - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]* \(deleted\)$' }
        - { field: modules, op: matches, value: '/libphp[0-9.]*\.so \(deleted\)"' }

  # ── 패키지가 깐 실행 파일이 그 기록과 다르다 — PHP2Shell 룰 0.3.0 과 같은 줄 ─────────────────
  - id: pkg_bin_changed
    subject: file
    where:
      - { field: path, op: matches, value: '^/usr/(bin/php(-cgi)?[0-9.]*|sbin/php-fpm[0-9.]*|lib/apache2/modules/libphp[0-9.]*\.so|lib64/httpd/modules/libphp[0-9]?\.so)$' }
      - { field: package, op: matches, value: '.' }
      - { field: package_match, op: in, value: [different, unrecorded, unreadable] }

# YARA 는 본문을 본다 — 패키지 밖 PHP 의 실행 파일 자리만 담는다. **전부 `glob` 형이다** — 없으면 담을 것이 없는 것이지
# 미해소가 아니다(대부분의 기계에 이 자리 대부분이 없다). 글롭은 마지막 성분에만 와일드카드를 둘 수 있어, 판마다 하위 폴더를 두는
# 직접 빌드(`/opt/php/8.3/bin`)는 담지 못한다 — 그 PHP 는 판을 재지 못해 확인 필요로 남는다(다음 차수 후보). 공식 이미지의
# 실행 파일은 수십 MB 라 상한을 64MB 로 둔다.
collect_extra:
  - { glob: "/usr/local/bin/php", max_size: 64MB }
  - { glob: "/usr/local/bin/php-cgi", max_size: 64MB }
  - { glob: "/usr/local/sbin/php-fpm", max_size: 64MB }
  - { glob: "/usr/local/lib/libphp*.so", max_size: 64MB }
  - { glob: "/usr/lib/apache2/modules/libphp.so", max_size: 64MB }
  - { glob: "/usr/local/php/bin/php*", max_size: 64MB }
  - { glob: "/usr/local/php/sbin/php-fpm*", max_size: 64MB }
  - { glob: "/usr/local/php/lib/libphp*.so", max_size: 64MB }
  - { glob: "/opt/php/bin/php*", max_size: 64MB }
  - { glob: "/opt/php/sbin/php-fpm*", max_size: 64MB }
  - { glob: "/opt/php/lib/libphp*.so", max_size: 64MB }

verdict:
  require: "((deb_vuln_85 or deb_vuln_84 or deb_vuln_83 or deb_vuln_82 or deb_eol or apk_vuln or rpm_vuln) and not pkg_bin_changed) or bin_vuln"
  unconfirmed:
    - when: "bin_php and not bin_version_known"
      why:
        ko: "패키지로 깔지 않은 PHP(위 경로)의 버전을 읽지 못했습니다 — 그 경로의 php -v 로 버전을 확인하십시오(8.5 는 8.5.13 · 8.4 는 8.4.28 · 8.3 은 8.3.37 · 8.2 는 8.2.36 보다 낮거나 8.1 이하면 영향을 받습니다)"
        en: "the version of the PHP above, outside any package, could not be read - check it with that path's php -v (below 8.5.13 for 8.5, 8.4.28 for 8.4, 8.3.37 for 8.3, 8.2.36 for 8.2, or 8.1 and older, is affected)"
    - when: "bin_rpm and not rpm_php"
      why:
        ko: "RPM 계열의 자리에 패키지가 깔지 않은 PHP 가 있습니다(RPM 의 PHP 패키지가 없습니다) — 버전과 받은 곳을 확인하십시오"
        en: "a PHP that no RPM package installed sits in an RPM system location (no RPM PHP package is present) - check its version and origin"
    - when: "running_php"
      why:
        ko: "이 점검이 보는 자리 밖에서 PHP 가 실행 중입니다(위 경로) — 그 PHP 는 판정하지 않았습니다. 그 PHP 의 버전과 받은 곳(패키지 · 공급사 · 직접 빌드)을 확인하십시오"
        en: "a PHP is running outside the places this check reads (path above) - that PHP was not judged; check its version and origin (package, vendor or own build)"
    - when: "service_php or apache_php or apache_php_rpm"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 를 서비스가 띄우거나 Apache 설정이 싣습니다(위 서비스 · 설정 줄의 경로) — 그 PHP 는 판정하지 않았습니다. 그 PHP 의 버전과 받은 곳(패키지 · 공급사 · 직접 빌드)을 확인하십시오"
        en: "a service starts, or the Apache configuration loads, a PHP outside the places this check reads (the path in the service or configuration line above) - that PHP was not judged; check its version and origin (package, vendor or own build)"
    - when: "pkg_bin_changed"
      why:
        ko: "패키지가 깐 PHP 실행 파일이 패키지 기록과 같은지 확인되지 않습니다(위 경로) — 내용이 다르거나 기록이 없어 그 패키지의 버전으로 판정하지 않았습니다. 누가 그 파일을 바꿨는지 확인하고, 패키지를 다시 설치한 뒤 다시 검사하십시오"
        en: "a PHP executable installed by a package cannot be confirmed to match the package record (path above) - its content differs or there is no record, so it was not judged by the package version; check who changed it, reinstall the package and scan again"
    - when: "stale_php"
      why:
        ko: "고친 뒤 다시 시작하지 않은 PHP 가 실행 중입니다(위 경로) — 그 프로세스가 지워진 옛 PHP 파일(실행 파일 · 모듈)을 실은 채 돌고 있어 디스크의 버전으로 판정하지 않았습니다. 그 PHP 를 쓰는 서비스(PHP-FPM · 웹 서버)를 다시 시작한 뒤 다시 검사하십시오"
        en: "a PHP that was not restarted after an update is running (path above) - the process still runs a deleted old PHP file (executable or module), so it was not judged by the version on disk; restart the service using that PHP (PHP-FPM, web server) and scan again"
