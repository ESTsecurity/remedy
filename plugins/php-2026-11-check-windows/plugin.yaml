# PHP 2026년 11월 보안 업데이트 점검 — Windows
#
# PHP 는 2026-11-19 에 8.5.13 · 8.4.28 · 8.3.37 · 8.2.36 보안 릴리스를 냈다(https://www.php.net/archive/2026.php). 8.5.13 의
# ChangeLog 가 보안 고침 18건(GHSA · CVE)을 적는다 — Core · CGI · Date · DOM · FPM · Phar · SOAP · Session · Standard · URI.
# Windows 용 공식 빌드(downloads.php.net/~windows)도 같은 날 같은 판으로 나왔다(TS · NTS). **고치지 않는다** — 판을 올리는 것은
# 공급사의 일이다. 리눅스 몫은 `php-2026-11-check-linux` 다(1차 · 룰 2026.11.20).
#
# # 판정 (판으로만 — 리눅스 1차와 같은 정책)
#
# | 무엇 | 결과 |
# |---|---|
# | 설치본(코어 DLL `php8ts.dll` · `php8.dll` · … 가 있는 폴더)의 파일 버전이 그 갈래의 고친 판 아래 · 지원이 끝난 8.1 이하 | 취약(2) |
# | 코어 DLL 에서 정식 버전을 읽지 못했다(버전 정보 없음 · 시험판 · 개발 빌드) · 이 룰이 보는 자리 밖의 PHP 를 IIS 가 쓰거나 서비스(NSSM 포함) · Apache 설정이 싣거나 그 PHP 가 실행 중 · 다른 프로그램에 모듈로 실림 · 모듈 목록을 읽지 못한 Apache · IIS 공유 설정 | 확인 필요(6) |
# | 고친 판 이상 · 정식 8.6 이상 · PHP 없음 | 0 |
#
# PHP2Shell 룰(`php2shell-check-windows`)은 공식 빌드의 해시로 확정했지만, 이 룰은 1차 정책대로 **판으로만** 본다 — 판
# 번호가 같으면 같은 코드라는 상류 번호의 뜻을 따른다(Windows 의 PHP 는 배포판 백포트가 없다). 판은 코어 DLL 의 파일 버전
# 자원이다 — 공식 빌드는 정식 판을 꼬리 없이 적고(`8.3.35` · 2026-11-20 실측), 시험판 · 개발 빌드는 꼬리를 붙인다(`8.6.0RC3` ·
# `8.6.0-dev` — php-src 의 win32 자원 틀이 PHP_VERSION 을 그대로 넣는다). 판정의 단위는 설치본이다 — 한 기계에 여럿 깔려도
# 한 설치본의 사실이 다른 설치본의 판정을 바꾸지 않게 코어 DLL 마다 그룹을 가르고(`from: ${core.dir}`), 판 사실은 그 그룹의
# 코어 DLL 하나에만 묶는다(`path equals ${core.file}`) — `from` 은 폴더 아래를 끝까지 걸어, 묶지 않으면 설치본 폴더 안에 둔
# 다른 설치본(옛 판 백업 등)이 바깥 설치본의 '판 없음' 을 채우고 같은 영향 판을 두 번 센다(2026-11-20 독립 검토 · 합성 실측).
#
# # 런타임만 본다
#
# 코어 DLL 이 PHP 의 판이다. 확장 DLL(`ext\php_*.dll`)은 PHP 와 같은 판을 선언하지만 PHP 가 아니다(PHP2Shell 룰과 같다).
#
# # 이 룰이 보지 않는 것
#
# - 선언한 자리 밖에 놓였을 뿐 IIS 설정에도 없고 실행 중도 아니며 어디에도 실리지 않은 PHP
# - IIS 의 공유 설정이 가리키는 다른 자리 — 쓰고 있으면 확인 필요다
# - 실행 중인 PHP 가 고친 판을 실었는가 — 고친 뒤에는 IIS · Apache · PHP-CGI 를 다시 시작한다
# - 기능을 켠 흔적(FPM · CGI · SOAP · Phar 를 쓰는가) — 판으로만 판정한다
schema_version: 1
id: php-2026-11-check-windows
version: 0.1.0
min_core: "1.25.0"  # added 는 1.25.0 · product 는 1.21.0 · 가운데 별표 레지스트리 루트(`Services\*\Parameters`)는 1.10.0 · 실린 모듈은 1.9.0 · IIS 설정(XML)은 1.6.0
platforms: [windows]

kind: check
product: PHP
added: "2026-11-20"

name:
  ko: "PHP 11월 보안 업데이트 점검 (CVE-2026-129474 등 18건)"
  en: "PHP November security update check (CVE-2026-129474 and 17 more)"

references:
  - "https://www.php.net/archive/2026.php"
  - "https://www.php.net/ChangeLog-8.php"
  - "https://github.com/php/php-src/security/advisories"

# 흔한 설치 자리 — 수동 설치 · XAMPP · WampServer · Laragon · Chocolatey(`C:\tools\phpNN`). PHP2Shell 룰과 같은 자리다 —
# 린트의 `C:\php` 경고(깊이 2)도 같은 까닭으로 남긴다(수동 설치본은 그 폴더 바로 아래에 코어 DLL 을 둔다).
scan_roots:
  - 'C:\php'
  - 'C:\Program Files\PHP'
  - 'C:\Program Files (x86)\PHP'
  - 'C:\xampp\php'
  - 'C:\wamp64\bin\php'
  - 'C:\wamp\bin\php'
  - 'C:\laragon\bin\php'
  - 'C:\tools\php85'
  - 'C:\tools\php84'
  - 'C:\tools\php83'
  - 'C:\tools\php82'
  - 'C:\tools\php81'
  - 'C:\tools\php80'
  - 'C:\tools\php74'
  # IIS 가 PHP 를 어디서 띄우는지 적힌 자리 — 판정할 PHP 가 아니라 **선언 밖 PHP 를 찾는 곳**이다.
  - 'C:\Windows\System32\inetsrv\config'
  # Apache 가 어느 PHP 를 싣는지 적힌 자리 — 위 IIS 설정과 같이 **선언 밖 PHP 를 찾는 곳**이다.
  - 'C:\Apache24\conf'
  - 'C:\Program Files\Apache Software Foundation\Apache2.4\conf'
  - 'C:\xampp\apache\conf'
  - 'C:\wamp64\bin\apache'
  - 'C:\wamp\bin\apache'
  - 'C:\laragon\bin\apache'
  # NSSM 이 띄우는 프로그램이 적힌 자리 — 서비스마다 `Parameters` 키 하나의 값만 읽는다(하위 키는 내려가지 않는다).
  - 'HKLM\SYSTEM\CurrentControlSet\Services\*\Parameters'

# 구조적 설정은 IIS 설정만, 줄 단위 설정은 Apache 설정만 읽는다 — PHP 폴더의 JSON · XML · `php.ini` 는 이 룰이 볼 것이 아니다.
# 파일(코어 DLL)은 PHP 자리만 걷는다 — WampServer 는 Apache 모듈로 쓰는 PHP 의 코어 DLL 을 `bin\apache\apache<판>\bin` 에
# 심볼릭 링크로 둔다. Apache 자리까지 걸으면 그 링크(수집기는 경로만 담고 판을 비운다)가 판 없는 설치본으로 세어져, PHP 를 고친
# 판으로 올린 기계도 6 으로 끝난다(2026-11-20 독립 검토 — 같은 동작이 PHP2Shell 룰 0.4.1 에도 있다).
subject_roots:
  file:
    - 'C:\php'
    - 'C:\Program Files\PHP'
    - 'C:\Program Files (x86)\PHP'
    - 'C:\xampp\php'
    - 'C:\wamp64\bin\php'
    - 'C:\wamp\bin\php'
    - 'C:\laragon\bin\php'
    - 'C:\tools\php85'
    - 'C:\tools\php84'
    - 'C:\tools\php83'
    - 'C:\tools\php82'
    - 'C:\tools\php81'
    - 'C:\tools\php80'
    - 'C:\tools\php74'
  structured_config: ['C:\Windows\System32\inetsrv\config']
  text_config:
    - 'C:\Apache24\conf'
    - 'C:\Program Files\Apache Software Foundation\Apache2.4\conf'
    - 'C:\xampp\apache\conf'
    - 'C:\wamp64\bin\apache'
    - 'C:\wamp\bin\apache'
    - 'C:\laragon\bin\apache'

subjects: [file, structured_config, process, service, text_config, registry_value]

detect:
  # 설치본 하나 = 코어 DLL 하나. 아래 규칙은 모두 이 폴더 안에서만 본다.
  - id: core
    subject: file
    where:
      - { field: path, op: matches, value: '(?i)\\php[5-8](ts)?\.dll$' }
    capture:
      dir: 'path | dirname'
      file: 'path'

  # 판이 그 갈래의 고친 판 아래 — 또는 고친 판이 없는 갈래(8.1 이하). 따옴표는 **필수다**: 없으면 YAML 이 `8.2` 를 수로 읽어
  # 뒤의 0 이 사라진다. 갈래마다 계열(정규식) → 판(`version_lt`) 순으로 못박는다.
  - id: core_vuln
    subject: file
    from: '${core.dir}'
    where:
      all:
        - { field: path, op: equals, value: '${core.file}' }
        - any:
            - all:
                - { field: version, op: matches, value: '^8\.5\.' }
                - { field: version, op: version_lt, value: "8.5.13" }
            - all:
                - { field: version, op: matches, value: '^8\.4\.' }
                - { field: version, op: version_lt, value: "8.4.28" }
            - all:
                - { field: version, op: matches, value: '^8\.3\.' }
                - { field: version, op: version_lt, value: "8.3.37" }
            - all:
                - { field: version, op: matches, value: '^8\.2\.' }
                - { field: version, op: version_lt, value: "8.2.36" }
            - { field: version, op: matches, value: '^([5-7]|8\.[01])\.' }
    label:
      ko: "PHP 11월 보안 업데이트의 영향을 받는 버전 — 그 계열의 고친 버전(8.5.13 · 8.4.28 · 8.3.37 · 8.2.36) 이상으로 올리십시오(8.1 이하는 고친 버전이 없습니다)"
      en: "affected by the PHP November security update - upgrade to the fixed release of its line (8.5.13, 8.4.28, 8.3.37, 8.2.36); 8.1 and older have no fix"

  # 코어 DLL 에서 **정식** 판을 읽었는가 — 끝을 묶는다. 묶지 않으면 8.6 시험판(`8.6.0RC3`) · 개발 빌드(`8.6.0-dev`)가 '읽었다' 로
  # 세어지고, 위 갈래 정규식에는 걸리지 않아 0 으로 끝난다(같은 꼴이 8.2 ~ 8.5 면 version_lt 가 꼬리를 거절해 6 이 된다 —
  # 2026-11-20 독립 검토 · 합성 실측). 못 읽었으면 판정하지 못한다(아래 확인 필요).
  - id: core_version_known
    subject: file
    from: '${core.dir}'
    where:
      all:
        - { field: path, op: equals, value: '${core.file}' }
        - { field: version, op: matches, value: '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' }

  # ── 선언한 자리 밖의 PHP — PHP2Shell 룰 0.4.1 과 같은 줄 ─────────────────────────────────────
  - id: iis_php
    subject: structured_config
    where:
      - { field: key_path, op: matches, value: '(?i)/(fastCgi\[\d+\]/application\[\d+\]/@fullPath|handlers\[\d+\]/add\[\d+\]/@scriptProcessor)$' }
      - { field: value, op: matches, value: '(?i)\\php(-cgi)?\.exe(\|.*)?$' }
    exclude:
      - { field: value, op: matches, value: '(?i)^((c:|%systemdrive%)\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82|81|80|74))|(c:\\program files( \(x86\))?|%programfiles%|%programfiles\(x86\)%|%programw6432%)\\php)\\' }

  - id: iis_shared
    subject: structured_config
    where:
      - { field: key_path, op: matches, value: '(?i)/configurationRedirection\[\d+\]/@enabled$' }
      - { field: value, op: matches, value: '(?i)^true$' }

  - id: running_php
    subject: process
    where:
      - { field: image_path, op: matches, value: '(?i)\\php(-cgi|-win)?\.exe$' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^(c:\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82|81|80|74))|c:\\program files( \(x86\))?\\php)\\' }

  # 모듈 목록은 JSON 글자로 견준다 — 경로의 `\` 하나가 그 글자에서 `\\` 라 정규식에서는 `\\\\` 다(PHP2Shell 룰과 같다).
  - id: module_php
    subject: process
    where:
      - { field: modules, op: matches, value: '(?i)\\\\php[578](ts)?\.dll"' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)\\php(-cgi|-win)?\.exe$' }
      - { field: modules, op: matches, value: '(?i)"(c:\\\\(php|xampp\\\\php|wamp64\\\\bin\\\\php|wamp\\\\bin\\\\php|laragon\\\\bin\\\\php|tools\\\\php(85|84|83|82|81|80|74))|c:\\\\program files( \(x86\))?\\\\php)\\\\([^"]*\\\\)?php[578](ts)?\.dll"' }

  - id: apache_unread
    subject: process
    where:
      - { field: modules_denied, op: equals, value: "true" }
      - { field: image_path, op: matches, value: '(?i)\\httpd\.exe$' }

  - id: service_php
    subject: service
    where:
      - { field: image_path, op: matches, value: '(?i)\\php(-cgi|-win)?\.exe("|\s|$)' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^"?((c:|%systemdrive%)\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82|81|80|74))|(c:\\program files( \(x86\))?|%programfiles%|%programfiles\(x86\)%|%programw6432%)\\php)\\' }

  - id: nssm_php
    subject: registry_value
    where:
      all:
        - { field: key, op: matches, value: '(?i)^system\\currentcontrolset\\services\\[^\\]+\\parameters$' }
        - { field: name, op: matches, value: '(?i)^application$' }
        - { field: data, op: matches, value: '(?i)(^"?|\\)php(-cgi|-win)?\.exe("|\s|$)' }
    exclude:
      - { field: data, op: matches, value: '(?i)^"?((c:|%systemdrive%)\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82|81|80|74))|(c:\\program files( \(x86\))?|%programfiles%|%programfiles\(x86\)%|%programw6432%)\\php)\\' }

  - id: apache_php
    subject: text_config
    where:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+php\d*_module\s' }
    exclude:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+php\d*_module\s+"?((c:)?[\\/](php|xampp[\\/]php|wamp64[\\/]bin[\\/]php|wamp[\\/]bin[\\/]php|laragon[\\/]bin[\\/]php|tools[\\/]php(85|84|83|82|81|80|74)|program files( \(x86\))?[\\/]php)|\$\{install_dir\}[\\/]bin[\\/]php)[\\/]' }

# 판정이 규칙 하나(`core_vuln`)에 걸려 있다는 린트 경고도 남긴다 — 그 경고는 룰 하나의 오탐이 곧바로 삭제로 이어지는 치료
# 룰을 위한 것이다. 이 룰은 아무것도 바꾸지 않는다(PHP2Shell 룰과 같은 까닭).
verdict:
  require: "core_vuln"
  unconfirmed:
    - when: "core and not core_version_known"
      why:
        ko: "PHP(위 경로)의 코어 DLL 에서 정식 버전을 읽지 못했습니다(버전 정보가 없거나 정식 출시 전 버전 — RC · 개발 빌드입니다) — 그 폴더의 php -v 로 버전을 확인하십시오(8.5 는 8.5.13 · 8.4 는 8.4.28 · 8.3 은 8.3.37 · 8.2 는 8.2.36 보다 낮거나 8.1 이하면 영향을 받습니다. 정식 출시 전 버전은 정식 고친 버전으로 바꾸십시오)"
        en: "a release version could not be read from the core DLL of the PHP above (no version information, or a pre-release or development build) - check it with php -v in that folder (below 8.5.13 for 8.5, 8.4.28 for 8.4, 8.3.37 for 8.3, 8.2.36 for 8.2, or 8.1 and older, is affected; replace a pre-release or development build with a fixed release)"
    - when: "iis_php or running_php"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 를 IIS 가 쓰거나 그 PHP 가 실행 중입니다(위 경로) — 그 PHP 는 판정하지 않았습니다. 쓰는 계열의 고친 버전(8.5 는 8.5.13 · 8.4 는 8.4.28 · 8.3 은 8.3.37 · 8.2 는 8.2.36 — 8.1 이하는 고친 버전이 없습니다) 이상인지 확인하십시오"
        en: "IIS uses, or there is running, a PHP outside the places this check reads (path above) - that PHP was not judged; check that it is at or above the fixed release of its line (8.5.13 for 8.5, 8.4.28 for 8.4, 8.3.37 for 8.3, 8.2.36 for 8.2 - 8.1 and older have no fix)"
    - when: "iis_shared"
      why:
        ko: "IIS 가 공유 설정을 씁니다 — 다른 자리에 있는 그 설정이 가리키는 PHP 는 보지 않았습니다. 그 설정이 가리키는 PHP 의 버전을 확인하십시오"
        en: "IIS uses a shared configuration - PHP referenced from that configuration elsewhere was not read; check the version of the PHP it points to"
    - when: "module_php"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 가 다른 프로그램(위 경로)에 모듈로 실려 있습니다(괄호 안이 그 PHP) — 그 PHP 는 판정하지 않았습니다. 쓰는 계열의 고친 버전(8.5 는 8.5.13 · 8.4 는 8.4.28 · 8.3 은 8.3.37 · 8.2 는 8.2.36 — 8.1 이하는 고친 버전이 없습니다) 이상인지 확인하십시오"
        en: "a PHP outside the places this check reads is loaded as a module into another program (path above; the PHP is in brackets) - that PHP was not judged; check that it is at or above the fixed release of its line (8.5.13 for 8.5, 8.4.28 for 8.4, 8.3.37 for 8.3, 8.2.36 for 8.2 - 8.1 and older have no fix)"
    - when: "apache_unread"
      why:
        ko: "Apache(위 경로)에 실린 모듈 목록을 읽지 못해 그 Apache 가 PHP 를 싣는지 보지 못했습니다 — Apache 설정(httpd.conf)의 LoadModule php_module 줄이 가리키는 PHP 의 버전을 확인하십시오"
        en: "the list of modules loaded into Apache (path above) could not be read, so whether it loads PHP was not seen - check the version of the PHP named by the LoadModule php_module line of its configuration (httpd.conf)"
    - when: "service_php or nssm_php or apache_php"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 를 서비스가 띄우거나 Apache 설정이 싣습니다(위 서비스 · 설정 줄의 경로) — 그 PHP 는 판정하지 않았습니다. 쓰는 계열의 고친 버전(8.5 는 8.5.13 · 8.4 는 8.4.28 · 8.3 은 8.3.37 · 8.2 는 8.2.36 — 8.1 이하는 고친 버전이 없습니다) 이상인지 확인하십시오"
        en: "a service starts, or the Apache configuration loads, a PHP outside the places this check reads (the path in the service or configuration line above) - that PHP was not judged; check that it is at or above the fixed release of its line (8.5.13 for 8.5, 8.4.28 for 8.4, 8.3.37 for 8.3, 8.2.36 for 8.2 - 8.1 and older have no fix)"
