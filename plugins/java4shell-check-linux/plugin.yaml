# Java4Shell 점검 — 리눅스 (CVE-2026-114938)
#
# **고치지 않는다.** 이 결함은 Java 런타임 안에 있고 메우는 것은 그 런타임을 낸 곳의 일이다. 점검의 답은 **판 하나**다.
#
# # 어떻게 판을 읽나
#
# JDK · JRE 이미지는 제 홈에 `release` 라는 텍스트 파일을 두고 그 안에 `JAVA_VERSION="17.0.21"` 줄이 있다. 확장자가
# 없어 코어의 설정 수집(`text_config`)이 닿지 않으므로 **파일 본문**으로 읽는다(`rules/java.yar`). 홈을 가리키는 것은
# 그 안의 `bin/java` 다 — `release` 라는 이름만으로는 Java 와 무관한 파일도 걸리므로, **`bin/java` 가 있는 폴더의
# `release` 만** 본다(`capture` + `from`).
#
# # 판정
#
# 공지의 위험 표가 이 CVE 가 걸린 줄을 **17 · 21 · 25 · 27** 로 적었고(8 · 11 칸은 비어 있다), 같은 날 나온 고친 판이
# **17.0.21.1 · 21.0.13.1 · 25.0.5.1 · 27.0.1.1** 이다. 그래서 **고친 판 미만은 취약(2) · 고친 판 이상은 0** 이다.
# **Java SE 8 은 Enterprise Performance Pack(`-perf` 빌드)만** 영향 판이다 — Oracle CPU 2026-11 의 Java SE 위험 표가 이
# CVE 의 줄에 8u511b33-perf 를 적었고 고친 판은 8u513-perf 다(일반 8u511b33 은 같은 표의 다른 CVE 줄이다 · 0.2.0).
# GraalVM for JDK 는 바탕 Java 의 `JAVA_VERSION` 으로 같은 판정을 받는다. **Oracle GraalVM Enterprise Edition 21.3 은 제품
# 판으로 본다** — Oracle 이 21.3.20.0.3 을 영향 판으로 적었고 그 줄에는 Java 17 · 11 · 8 판이 있어, `GRAALVM_VERSION` 이
# 21.3.20.1 미만이고 Oracle 빌드(`IMPLEMENTOR="Oracle Corporation"`)면 바탕 Java 와 상관없이 취약이다(0.3.0). Community 판 ·
# 다른 배포사가 지은 것(Mandrel · Liberica NIK)은 바탕 Java 로 판정한다.
# 배포사의 제 번호(Corretto-17.0.21.0.11 · Red_Hat-17.0.21.0.9)는 `JAVA_VERSION` 이 아니라 `IMPLEMENTOR_VERSION` 에
# 있으므로(실측) 여기서 견주는 것은 상류 판이다. 17 줄은 **17.0.6 아래를 영향에서 뺀다**(x86-64 Base64 디코드 코드가 그
# 판에 들어왔다 — JDK-8268276). 지원이 끝난 줄(18 ~ 20 · 22 ~ 24 · 26)은 같은 코드를 담았고 고친 판이 나오지 않으므로
# 취약으로 내고 지원되는 줄로 올리라고 적는다. 아직 개발 중인 줄(28)은 고친 빌드 번호가 없어 **확인 필요(6)** 다.
#
# ARM64 빌드는 영향이 없다(결함이 x86-64 의 AVX-512 VBMI 경로에 있다) — `release` 의 `OS_ARCH` 가 **x86-64 가 아닌
# 값으로 적혀 있을 때만** 뺀다. 그 줄이 아예 없는 런타임이 있기 때문이다(jlink 로 지은 런타임 — 실측 2026-11-18: 어떤
# 제품이 담아 쓰는 Java 21 의 `release` 에는 `JAVA_VERSION` 과 `MODULES` 두 줄뿐이었다). 그런 홈을 '모른다' 로 내면
# 실제로 취약한 기계가 확인 필요로 묻히므로 **판으로 판정한다**. **CPU 가 그 명령 집합을 가졌는지는 판정에 넣지
# 않는다**: 가상 머신은 다른 호스트로 옮겨 가고, 그때 CPU 가 바뀐다. 완화 옵션(`-XX:-UseBASE64Intrinsics` ·
# `-XX:UseAVX=2`)도 판정에 넣지 않는다 — 그 옵션을 넣는 자리가 제품마다 달라 다 볼 수 없다. 둘은 찾은 줄 아래 문구로 알린다.
#
# # 이 룰이 보지 않는 것
#
# - **배포판이 같은 판 번호에 고침만 얹은 경우**(백포트). `release` 의 판이 그대로면 고친 기계도 취약으로 보고한다 —
#   오늘(2026-11-18) 어느 배포판에도 고친 빌드가 없어 그 경우가 없고, **고친 빌드가 나오면 이 룰을 다시 낸다**
#   (`docs/긴급-대응.md`). 그때 패키지 판 비교(`pkg_version_lt` · `rpm_version_lt` · `apk_version_lt`)를 더한다.
# - 선언한 자리 밖에 깔렸고 돌지도 않는 Java. **돌고 있거나 서비스로 등록됐으면 찾아서 *확인 필요* 로 그 경로를 적는다**
#   — 그 파일은 열지 않는다. 사용자마다 까는 자리(SDKMAN · IntelliJ 의 `.jdks` · asdf · Gradle 툴체인 · jabba)와 Logstash ·
#   Jenkins 가 스스로 받는 JDK 는 0.2.0 부터 선언한 자리다.
#   서비스가 `/usr/bin/java`(배포판의 대체 링크)로 띄우면 그 링크가 가리키는 `/usr/lib/jvm` 의 홈을 이미 보므로 자리 밖으로
#   세지 않는다(0.2.0 — 0.1.0 은 그런 서비스마다 *확인 필요* 를 냈다).
# - 애플리케이션이 제 안에 담아 쓰는 런타임(jar 안의 클래스 · 컨테이너 이미지 안). 컨테이너 안은 `remedy-net` 의
#   `image` · `container` 점검이 따로 본다.
schema_version: 1
id: java4shell-check-linux
version: 0.3.0
min_core: "1.21.0"  # product 는 1.21.0 · label 은 1.13.0 · file_names 는 1.11.0
platforms: [linux]

kind: check
product: Java

name:
  ko: "Java4Shell 점검 (CVE-2026-114938)"
  en: "Java4Shell check (CVE-2026-114938)"

references:
  - "https://openjdk.org/groups/vulnerability/advisories/2026-11-17"
  - "CVE-2026-114938"
  - "https://www.oracle.com/security-alerts/cspunov2026.html"
  - "https://calif.io/java4shell/"

# Java 런타임이 놓이는 자리 — 배포판 패키지(`/usr/lib/jvm` · `/usr/lib64/jvm`) · 배포사 tar 와 제품이 함께 깐 런타임
# (`/opt` · `/usr/local`) · Oracle RPM(`/usr/java`) · 제품이 담아 쓰는 런타임 두 자리. `file_names` 가 이 자리에서
# **이름이 맞는 파일만** 기록하므로 폴더를 걷기만 한다.
#
# 0.2.0 에 더한 자리 — 제품이 담아 쓰는 런타임(Logstash · Jenkins 가 스스로 받는 JDK)과 사용자마다 까는 JDK.
# 뒤엣것은 `%ALLUSERPROFILES%`(`/home` 아래와 `/root`)로 모든 사용자를 본다: SDKMAN · IntelliJ 가 받는 JDK(`.jdks`) ·
# asdf · Gradle 툴체인(`.gradle/jdks`) · jabba.
#
# VS Code 의 Java 확장(redhat.java)이 담는 JRE(0.3.0) — 실측 2026-11-18: 1.59.2026111308 linux-x64 판이
# `jre/25.0.5-linux-x86_64/` 에 `bin/java` 와 `JAVA_VERSION="25.0.5"` · `MODULES` 두 줄의 `release` 를 담는다(아키텍처 줄이
# 없는 jlink 꼴 — 판으로 판정한다). 확장은 사용자마다 `.vscode/extensions` 에, 원격(SSH · 컨테이너)으로 붙은 서버에서는
# `.vscode-server/extensions` 에 깔린다.
scan_roots:
  - "/usr/lib/jvm"
  - "/usr/lib64/jvm"
  - "/opt"
  - "/usr/local"
  - "/usr/java"
  - "/usr/share/elasticsearch"
  - "/usr/share/opensearch"
  - "/usr/share/logstash"
  - "/var/lib/jenkins/tools"
  - "%ALLUSERPROFILES%/.sdkman/candidates/java"
  - "%ALLUSERPROFILES%/.jdks"
  - "%ALLUSERPROFILES%/.asdf/installs/java"
  - "%ALLUSERPROFILES%/.gradle/jdks"
  - "%ALLUSERPROFILES%/.jabba/jdk"
  - "%ALLUSERPROFILES%/.vscode/extensions"
  - "%ALLUSERPROFILES%/.vscode-server/extensions"

file_names: ["release", "java"]
subjects: [file, process, service]

detect:
  # ── 설치본 — `bin/java` 가 홈을 가리킨다 ──────────────────────────────────
  - id: java_bin
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '/bin/java$' }
        - { field: sha256, op: exists }
    capture:
      home: "path | dirname | dirname"
    label:
      ko: "Java 런타임 설치본입니다"
      en: "a Java runtime installation"

  # 그 홈의 `release` — 판을 읽는 파일이다. 본문은 아래 `collect_extra` 가 담는다.
  - id: release_file
    subject: file
    from: "${java_bin.home}"
    where:
      - { field: path, op: matches, value: '/release$' }
    label:
      ko: "이 설치본의 판이 적힌 파일입니다"
      en: "the file that records this installation's version"

  # ── 판정 — 영향 판 ───────────────────────────────────────────────────────
  - id: affected
    subject: file
    from: "${java_bin.home}"
    where:
      all:
        - { field: path, op: matches, value: '/release$' }
        - { yara: "rules/java.yar:java_version_affected" }
    exclude:
      - { yara: "rules/java.yar:os_arch_not_x64" }
      - { yara: "rules/java.yar:java_version_17_before_intrinsic" }
      # GraalVM EE 21.3 은 아래 제품 판 줄이 말한다 — 같은 파일에 고칠 판이 다른 두 줄이 서지 않게(0.3.0).
      - { yara: "rules/java.yar:graalvm_ee_affected" }
    label:
      ko: "CVE-2026-114938 의 영향 판입니다 — 고친 판(17.0.21.1 · 21.0.13.1 · 25.0.5.1 · 27.0.1.1) 이상으로 올리고 그 자바로 돌던 서비스를 다시 시작하십시오"
      en: "a build affected by CVE-2026-114938 - upgrade to a fixed release (17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1) or later and restart the services that ran on it"

  # Java SE 8 의 Enterprise Performance Pack — 판 줄의 업데이트 번호가 513 아래이고 어느 판 줄에든 `-perf` 표지가 있다(0.2.0).
  - id: epp_affected
    subject: file
    from: "${java_bin.home}"
    where:
      all:
        - { field: path, op: matches, value: '/release$' }
        - { yara: "rules/java.yar:java_epp_affected" }
    exclude:
      - { yara: "rules/java.yar:os_arch_not_x64" }
    label:
      ko: "CVE-2026-114938 의 영향 판(Java SE 8 Enterprise Performance Pack)입니다 — 8u513-perf 이상으로 올리고 그 자바로 돌던 서비스를 다시 시작하십시오"
      en: "a build affected by CVE-2026-114938 (Java SE 8 Enterprise Performance Pack) - upgrade to 8u513-perf or later and restart the services that ran on it"

  # Oracle GraalVM Enterprise Edition 21.3 — Oracle 이 21.3.20.0.3 을 영향 판으로 적었고 그 줄에는 Java 17 · 11 · 8 판이 있다.
  # 바탕 Java 와 상관없이 제품 판(`GRAALVM_VERSION`)이 21.3.20.1 미만이면 취약이다(0.3.0 · 2026-11-18 결정 G1).
  - id: graalvm_ee_affected
    subject: file
    from: "${java_bin.home}"
    where:
      all:
        - { field: path, op: matches, value: '/release$' }
        - { yara: "rules/java.yar:graalvm_ee_affected" }
    exclude:
      - { yara: "rules/java.yar:os_arch_not_x64" }
    label:
      ko: "CVE-2026-114938 의 영향 판(Oracle GraalVM Enterprise Edition 21.3)입니다 — Oracle 이 낸 고친 판으로 올리고 그 자바로 돌던 서비스를 다시 시작하십시오"
      en: "a build affected by CVE-2026-114938 (Oracle GraalVM Enterprise Edition 21.3) - upgrade to the fixed release from Oracle and restart the services that ran on it"

  - id: eol_line
    subject: file
    from: "${java_bin.home}"
    where:
      all:
        - { field: path, op: matches, value: '/release$' }
        - { yara: "rules/java.yar:java_version_eol_line" }
    exclude:
      - { yara: "rules/java.yar:os_arch_not_x64" }
    label:
      ko: "지원이 끝난 Java 판입니다 — CVE-2026-114938 의 고친 판이 나오지 않습니다. 지원되는 판(17 · 21 · 25)으로 올리십시오"
      en: "a Java release past its support - no fixed build for CVE-2026-114938 will come; move to a supported release (17, 21, 25)"

  # ── 모르는 자리 ──────────────────────────────────────────────────────────
  - id: future_line
    subject: file
    from: "${java_bin.home}"
    where:
      all:
        - { field: path, op: matches, value: '/release$' }
        - { yara: "rules/java.yar:java_version_future_line" }
    exclude:
      - { yara: "rules/java.yar:os_arch_not_x64" }
    label:
      ko: "아직 개발 중인 Java 판입니다 — 이 결함을 고친 빌드 번호가 공개되지 않았습니다"
      en: "a Java release still in development - the number of the build that carries the fix is not published yet"

  - id: no_version
    subject: file
    from: "${java_bin.home}"
    where:
      - { field: path, op: matches, value: '/release$' }
    exclude:
      - { yara: "rules/java.yar:java_release_file" }
      # 판을 못 읽어도 x86-64 가 아니라고 적힌 빌드는 영향이 없다 — 판정 줄들과 같은 제외다(0.3.0 · 독립 검토).
      - { yara: "rules/java.yar:os_arch_not_x64" }
    label:
      ko: "이 설치본의 판을 읽지 못했습니다"
      en: "this installation's version could not be read"

  # ── 선언한 자리 밖 · 다시 시작하지 않은 런타임 ───────────────────────────
  - id: outside_process
    subject: process
    where:
      - { field: image_path, op: matches, value: '/bin/java$' }
    exclude:
      - { field: image_path, op: matches, value: '^/(usr/(lib/jvm|lib64/jvm|local|java|share/(elasticsearch|opensearch|logstash))|opt|var/lib/jenkins/tools)/' }
      - { field: image_path, op: matches, value: '^/(home/[^/]+|root)/(\.sdkman/candidates/java|\.jdks|\.asdf/installs/java|\.gradle/jdks|\.jabba/jdk|\.vscode(-server)?/extensions)/' }
    label:
      ko: "이 룰이 보는 자리 밖에서 도는 Java 입니다"
      en: "a Java running outside the places this rule reads"

  # 서비스의 경로는 유닛에 적힌 글자 그대로다(링크를 풀지 않는다). 배포판의 대체 링크(`/usr/bin/java` → `/etc/alternatives/java`
  # → `/usr/lib/jvm/…`)로 띄우는 서비스는 선언한 자리의 홈을 띄우므로 자리 밖으로 세지 않는다(0.2.0).
  - id: outside_service
    subject: service
    where:
      - { field: image_path, op: matches, value: '/bin/java( |$)' }
    exclude:
      - { field: image_path, op: matches, value: '^/(usr/(lib/jvm|lib64/jvm|local|java|share/(elasticsearch|opensearch|logstash))|opt|var/lib/jenkins/tools)/' }
      - { field: image_path, op: matches, value: '^/(home/[^/]+|root)/(\.sdkman/candidates/java|\.jdks|\.asdf/installs/java|\.gradle/jdks|\.jabba/jdk|\.vscode(-server)?/extensions)/' }
      - { field: image_path, op: matches, value: '^/(usr/bin|bin|etc/alternatives)/java( |$)' }
    label:
      ko: "이 룰이 보는 자리 밖의 Java 를 띄우는 서비스입니다"
      en: "a service that starts a Java outside the places this rule reads"

  # 패키지를 올리면 옛 파일이 지워지고, 커널은 그 파일을 실은 프로세스의 경로에 ` (deleted)` 를 붙인다 — 고친 판을 깔고
  # 다시 시작하지 않은 JVM 이 그 꼴이다. 그 프로세스는 여전히 고치기 전 코드를 실은 채 돈다.
  - id: stale_running
    subject: process
    where:
      - { field: image_path, op: matches, value: '/bin/java \(deleted\)$' }
    label:
      ko: "지워진 Java 실행 파일을 실은 채 돌고 있습니다 — 올린 뒤 다시 시작하지 않았습니다"
      en: "running with a deleted Java executable - it was not restarted after the upgrade"

verdict:
  require: "java_bin and (affected or epp_affected or graalvm_ee_affected or eol_line)"
  unconfirmed:
    - when: "java_bin and future_line"
      why:
        ko: "아직 개발 중인 Java 판입니다(위 경로) — 이 결함의 수정이 소스에는 들어갔지만 그것을 담은 빌드 번호가 아직 공개되지 않아 이 빌드가 고쳐졌는지 말할 수 없습니다. 지원되는 판(17 · 21 · 25)의 고친 판으로 옮기십시오"
        en: "a Java release still in development (path above) - the fix is in the source but the number of the build that carries it is not published yet, so whether this build is fixed cannot be stated; move to a fixed release of a supported line (17, 21, 25)"
    - when: "java_bin and no_version"
      why:
        ko: "Java 런타임(위 경로)의 release 파일에서 판을 읽지 못했습니다 — 그 홈의 bin/java -version 으로 판을 확인하십시오(17.0.21.0.3 · 21.0.13.0.3 · 25.0.5.0.3 · 27.0.1.0.3 · Java 8 EPP 8u511-perf 이하면 CVE-2026-114938 의 영향을 받습니다)"
        en: "the version could not be read from the release file of the Java runtime above - check it with that home's bin/java -version (at or below 17.0.21.0.3, 21.0.13.0.3, 25.0.5.0.3, 27.0.1.0.3 or Java 8 EPP 8u511-perf is affected by CVE-2026-114938)"
    - when: "java_bin and not release_file"
      why:
        ko: "Java 런타임(위 경로)에 판이 적힌 release 파일이 없습니다 — 그 홈의 bin/java -version 으로 판을 확인하십시오"
        en: "the Java runtime above has no release file recording its version - check it with that home's bin/java -version"
    - when: "outside_process or outside_service"
      why:
        ko: "이 룰이 보는 자리(/usr/lib/jvm · /opt · /usr/local · /usr/java · Jenkins 가 받은 JDK · 사용자 홈의 SDKMAN · .jdks · asdf · Gradle · VS Code 확장 등) 밖의 Java(위 경로)가 돌고 있거나 서비스로 등록돼 그 판을 보지 않았습니다 — 그 경로의 bin/java -version 으로 확인하십시오"
        en: "a Java outside the places this rule reads (/usr/lib/jvm, /opt, /usr/local, /usr/java, JDKs Jenkins downloaded, SDKMAN, .jdks, asdf, Gradle and VS Code extensions under user homes, and the like) is running or registered as a service, so its version was not checked - check it with that path's bin/java -version"
    - when: "stale_running"
      why:
        ko: "지워진 Java 실행 파일을 실은 프로세스가 돌고 있습니다(위 경로) — 고친 판을 깔았어도 그 프로세스는 고치기 전 코드로 돕니다. 그 서비스를 다시 시작하십시오"
        en: "a process is running with a deleted Java executable (path above) - even with a fixed build installed, that process runs the code from before; restart that service"

# 판을 읽을 바이트는 수집 시점에 담겨 있어야 한다. `release` 는 1 ~ 15 KB 다(실측).
collect_extra:
  - { ref: release_file, content: true }
