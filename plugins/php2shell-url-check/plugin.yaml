# PHP2Shell 원격 점검 — 웹서버 응답 헤더 (CVE-2026-109618 · CVE-2026-109619)
#
# **이 기계를 보지 않는다.** 적어 준 주소(URL)의 웹서버가 응답 헤더(`Server` · `X-Powered-By`)로 알리는
# PHP 버전을 수정 버전과 견준다. 점검 대상은 바깥의 서버이고, 이 룰을 돌리는 기계는 요청을 보내는 자리다.
#
# # 누가 통신하는가
#
# 본체(`remedy`)에는 통신 코드가 없다. 이 룰은 `network: url` 을 선언하고, 본체는 그것을 보고 실행 파일
# 옆의 **동반 프로그램 `remedy-net`** 을 띄워 맡긴다 — 서명이 맞는 것만, 네트워크를 쓴다고 알린 뒤에.
# 무엇을 어떻게 보는지(HEAD 한 번 · 요청 사이 2초 · URL 하나에 10초 · 리다이렉트를 따르지 않음)와 약관은
# 그 프로그램이 정하고 화면에 적는다. `remedy-net` 폴더를 지운 자리에서는 이 룰이 서지 않는다.
#
# # 판정
#
# - 헤더가 알리는 버전이 영향 버전이면 **취약(2)** — 다만 헤더는 남이 적은 글자다. 실제 설치 버전과
#   백포트 패치는 확인하지 못했다고 함께 적는다.
# - 그 밖은 전부 **확인 필요(6)** — 고친 버전을 알려도, 버전을 숨겨도 헤더로는 패치를 가릴 수 없다.
#   **양호(0)는 내지 않는다.** 확인은 그 서버에서 이 기계를 보는 룰(`php2shell-check-linux` ·
#   `php2shell-check-windows`)로 한다.
#
# 수정 버전은 `php2shell-check-linux` 와 같은 표다(상류 8.2.35 · 8.3.36 · 8.4.27 · 8.5.12 · Ubuntu · Debian
# 줄) — 동반 프로그램에 들어 있고, 그 프로그램의 시험이 두 표가 같은지 본다.
#
# # 이 룰이 보지 않는 것
#
# - 헤더를 숨긴 서버(`expose_php = Off`)의 버전 · 리버스 프록시 뒤의 실제 서버 · 응답 본문.
# - PHP 세션 설정(CVE-2026-115560) — 바깥에서는 볼 수 없다. 그 서버에서 `php-session-check-*` 로 본다.
# - 적지 않은 주소. CIDR · 목록 파일을 펼치지 않고, 리다이렉트가 가리키는 곳에도 가지 않는다.
schema_version: 1
id: php2shell-url-check
version: 0.1.0
min_core: "1.4.0"   # network 가 1.4.0 부터 있다
platforms: [windows, linux]

kind: check
network: url

name:
  ko: "PHP2Shell 원격 점검 (웹서버 응답 헤더)"
  en: "PHP2Shell remote check (web server headers)"

references:
  - "https://www.php.net/archive/2026.php"
  - "CVE-2026-109618"
  - "CVE-2026-109619"
  - "https://ubuntu.com/security/notices/USN-8948-1"
  - "https://ubuntu.com/security/notices/USN-8948-2"
  - "https://security-tracker.debian.org/tracker/CVE-2026-109618"

# 이 기계에서 읽는 것이 없다 — 네트워크 점검 룰은 아래 셋을 비워 둔다(채우면 로드가 거부한다).
scan_roots: []
subjects: []
detect: []
