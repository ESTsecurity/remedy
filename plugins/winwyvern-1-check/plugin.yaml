# WinWyvern — 보안 제품을 무력화하는 악성 드라이버 WinWyvern 을 올리려고 악성코드가 심는 취약 드라이버 NeacSafe64
# (CVE-2025-45737)의 흔적을 **찾기만** 한다.
#
# 1차 출처는 ASEC 의 보고 하나다(references 두 줄 — 한국어판 · 영문판). 정상 AI 도구(Ollama) 배포 페이지로 위장한 사이트의
# 설치 파일이, 가상 환경이 아닐 때 정상 서명된 안티치트 드라이버 NeacSafe64.sys 를 `C:\Windows\System32\neacsafe64.sys` 에
# 쓰고 서비스 `NeacSafe64` 를 파일 시스템 드라이버 · 자동 시작으로 등록한다. 그 뒤의 것 — 대체 데이터 스트림에 숨긴 DLL ·
# 커널 메모리에만 올린 WinWyvern 드라이버 — 은 엔진이 보지 못한다(RELEASE.md *이 룰이 보지 않는 것*).
#
# 치료는 따로 낸다(`winwyvern-2-clean` — 다음 차수). 폴더 이름의 숫자는 안내 모드가 늘어놓는 차례다 — 점검 먼저, 치료
# 나중(24-check-plugins.md 규약 6).
#
# **`kind: check` 를 적지 않는다.** 그 선언은 취약한 *상태* 를 위한 것이라 감염의 흔적에 붙이면 화면이 "취약" 이라고
# 부른다(cwpdoor-1-check 와 같은 경우). `remediate` 도 없다. 종료 코드: 2 위협 발견(치료하지 않았다) · 0 위협 없음 · 6 다
# 보지 못했다.
schema_version: 1
id: winwyvern-1-check
version: 0.1.0
min_core: "1.25.0"  # added 는 1.25.0 · label 은 1.13.0 · 글롭 뿌리(`…\System32\neacsafe64*.sys`)는 1.2.0
platforms: [windows]
added: "2026-11-24"
name:
  ko: "WinWyvern 점검 (탐지만 · CVE-2025-45737)"
  en: "WinWyvern check (detect only, CVE-2025-45737)"
references:
  - "https://asec.ahnlab.com/ko/96707/"
  - "https://asec.ahnlab.com/en/96708/"

# ── 권한 상한 ──────────────────────────────────────────────
# 파일은 `%SystemRoot%\System32` **바로 아래**에서 이름이 `neacsafe64*.sys` 인 것만 읽는다(글롭 뿌리 — 하위 폴더로 내려가지
# 않고, 폴더 자체는 상한 밖이다). 글롭으로 적는 까닭이 있다 — 뿌리가 있는지는 **그 폴더**로 묻는다
# (`crates/remedy-collect/src/lib.rs` 의 `root_look`). System32 는 어느 Windows 에나 있으므로 깨끗한 기계가 '선언한 자리가
# 전부 없다'(6)로 끝나지 않고 0 이다. 파일 경로 그대로(`…\System32\neacsafe64.sys`)를 뿌리로 적으면 그 파일이 없는 기계 —
# 거의 모든 기계 — 가 6 이다(위협 룰은 선언한 자리가 전부 없으면 6 · 24-check-plugins.md).
#
# `%FIXED_DISKS%` 를 쓰지 않는다 — 빠른 검사에 남는다(docs/긴급-대응.md *1차 범위*).
#
# **서비스는 여기 적지 않는다.** `service` 는 `scan_roots` 와 무관하게 레지스트리의 서비스 키
# (`HKLM\SYSTEM\CurrentControlSet\Services`) 전부에서 모인다(10-manifest.md).
scan_roots:
  - "%SystemRoot%\\System32\\neacsafe64*.sys"
subjects: [service, file]

detect:
  # 근거 1 — 서비스 `NeacSafe64` 가 **자동 시작**이고 그 ImagePath 가 System32 **바로 아래**의 neacsafe64.sys 를 가리킨다
  # (ASEC [표 2] — 시작 유형 자동 시작 · 경로 C:\Windows\System32\neacsafe64.sys).
  #
  # ImagePath 는 레지스트리의 글자 그대로 온다(`crates/remedy-collect/src/registry.rs` 의 `services` — REG_SZ ·
  # REG_EXPAND_SZ 모두 글자로 담고 환경 변수를 펴지 않는다). 드라이버를 등록하는 길(CreateService · 레지스트리에 바로)마다
  # 꼴이 달라 아래 꼴을 받는다(ASEC 의 흐름은 서비스 관리자를 거쳐 `\??\` 꼴로 남는다 — 하네스 A1):
  #   \SystemRoot\System32\neacsafe64.sys       커널의 꼴
  #   System32\neacsafe64.sys                   %SystemRoot% 를 기준으로 한 상대 경로
  #   %SystemRoot%\System32\… · %windir%\…      펴지 않은 환경 변수(REG_EXPAND_SZ)
  #   \??\C:\Windows\System32\neacsafe64.sys    NT 경로 · \\?\ 꼴도. 청정 코퍼스(`win10x64-full-declared`)에서 System32
  #                                             바로 아래의 드라이버 8개가 모두 이 꼴이다(하네스 A1 이 sc.exe 등록의 꼴을 적는다)
  #   C:\Windows\System32\neacsafe64.sys        Win32 전체 경로 · 따옴표로 감싼 꼴
  # 전체 경로의 Windows 폴더는 이름을 묻지 않는다(`<드라이브>:\<한 칸>\System32`) — `%SystemRoot%` 가 C:\Windows 가 아닌
  # 기계(D:\Windows · C:\WINNT)에서도 선다. 그 경로가 그 기계의 SystemRoot 인지는 따로 묻지 않는다 — 판정은
  # `%SystemRoot%\System32` 의 그 파일(근거 2)이 함께 서야 선다. 대소문자는 가리지 않는다(서비스 이름 · 경로 모두).
  #
  # 맞지 않는 것 — 수동 · 사용 안 함 · 시스템 · 부팅 시작, `System32\drivers` · `SysWOW64` 같은 다른 자리. 공개 PoC 는 수동
  # 시작이고 정상 설치의 자리 · 시작 유형은 ASEC 에 없어 정상 설치와 가르지 못한다(RELEASE.md *0 을 내는 갈래*).
  #
  # 서비스 유형(파일 시스템 드라이버)과 미니필터 값(ASEC [표 3])은 보지 않는다 — 엔진이 서비스의 유형 칸을 모으지 않고,
  # 미니필터 값은 공개 PoC 의 INF 와 거의 같아 정상 설치와 가르는 데 쓰지 못한다.
  - id: service
    subject: service
    where:
      - { field: id,         op: equals,  value: "NeacSafe64" }
      - { field: start_type, op: equals,  value: "auto" }
      - { field: image_path, op: matches, value: '(?i)^"?(?:(?:\\\?\?\\|\\\\\?\\)?[a-z]:\\[^\\"]+\\|\\SystemRoot\\|%SystemRoot%\\|%windir%\\)?System32\\neacsafe64\.sys"?$' }
    label: { ko: "취약 드라이버 NeacSafe64 를 자동으로 시작하는 서비스 — CVE-2025-45737", en: "Service that starts the vulnerable driver NeacSafe64 automatically - CVE-2025-45737" }

  # 근거 2 — 그 파일 `%SystemRoot%\System32\neacsafe64.sys`(ASEC [표 2]). 위 `scan_roots` 의 글롭 뿌리가 System32 바로 아래만
  # 읽으므로 경로의 끝으로 고른다 — 같은 꼴의 다른 이름(`neacsafe64_x.sys`)은 맞지 않는다.
  - id: driver-file
    subject: file
    where:
      - { field: path, op: ends_with, value: '\System32\neacsafe64.sys' }
    label: { ko: "취약 드라이버 NeacSafe64 파일 — CVE-2025-45737", en: "Vulnerable driver NeacSafe64 file - CVE-2025-45737" }

# ── 판정 ──────────────────────────────────────────────────
# 독립적인 두 근거(레지스트리의 서비스 · 디스크의 파일)의 논리곱이다. 둘 가운데 하나만 남은 기계는 흔적으로 적고 0 이다 —
# 승인 담당이 정했다(RELEASE.md *이 룰이 보지 않는 것*). 각 규칙은 따로 서므로 그 하나는 화면의 '흔적' 에 센다.
verdict:
  require: "service and driver-file"
