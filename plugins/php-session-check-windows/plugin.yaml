# PHP 세션 업로드 진행 설정 점검 — Windows (CVE-2026-115560 · php.net 2026-10-23 공지)
#
# **판 번호로 답할 수 없다.** 공지는 수정 판을 내지 않았고(다음 정기 판에서 고친다), 위험은 세
# 조건이 겹칠 때뿐이다 — `session.upload_progress.enabled` 가 켜져 있고, 서버 설정의
# `session.serialize_handler` 가 `php_binary` · `php_serialize` 이며, **앱이 `session_start()` 전에
# `ini_set()` 으로 그것을 `php` 로 바꾼다.** 셋째는 앱 코드라 이 도구가 보지 못한다. 그래서 이 룰은
# **판정(2)을 세우지 않고** PHP 가 있으면 늘 *확인 필요(6)* 로, 설정 상태에 따라 까닭을 갈라 적는다.
#
# 권고(공지): 다음 정기 판까지 `session.upload_progress.enabled=0`. 실행 중에 handler 를 바꾸지 않는
# 앱은 켜 둬도 된다. 바꾼 값은 IIS · Apache · PHP 를 다시 시작해야 실린다.
#
# **선언한 자리 밖의 PHP 는 찾아서 알린다** (0.2.0) — IIS 설정(FastCGI · 핸들러)과 실행 중 프로세스로
# 찾으면 *확인 필요* 로 그 경로를 적는다. 그 PHP 의 설정은 열지 않는다(PHP2Shell Windows 룰과 같은 규칙).
schema_version: 1
id: php-session-check-windows
version: 0.2.0
min_core: "1.6.0"   # IIS 설정(XML 구조적 설정)을 1.6.0 부터 편다 · verdict.unconfirmed 는 1.3.0
platforms: [windows]

kind: check

name:
  ko: "PHP 세션 업로드 진행 설정 점검 (CVE-2026-115560)"
  en: "PHP session upload progress setting check (CVE-2026-115560)"

references:
  - "https://www.php.net/archive/2026.php"
  - "CVE-2026-115560"

# PHP2Shell Windows 룰과 같은 설치 자리 + WampServer 의 Apache 가 읽는 `php.ini`
# (`C:\wamp64\bin\apache\apache2.4.x\bin\php.ini`). 린트의 *깊이 2* 경고는 그 룰과 같은 까닭으로 남긴다
# — 수동 설치는 `C:\php` 바로 아래에 둔다.
scan_roots:
  - 'C:\php'
  - 'C:\Program Files\PHP'
  - 'C:\Program Files (x86)\PHP'
  - 'C:\xampp\php'
  - 'C:\wamp64\bin\php'
  - 'C:\wamp64\bin\apache'
  - 'C:\wamp\bin\php'
  - 'C:\wamp\bin\apache'
  - 'C:\laragon\bin\php'
  - 'C:\tools\php85'
  - 'C:\tools\php84'
  - 'C:\tools\php83'
  - 'C:\tools\php82'
  - 'C:\tools\php81'
  - 'C:\tools\php80'
  - 'C:\tools\php74'
  # IIS 가 PHP 를 어디서 띄우는지 적힌 자리 — 선언 밖 PHP 를 찾는 곳이다.
  - 'C:\Windows\System32\inetsrv\config'

subject_roots:
  structured_config: ['C:\Windows\System32\inetsrv\config']

subjects: [file, text_config, structured_config, process]

detect:
  - id: upload_on
    subject: text_config
    where:
      all:
        - { field: key, op: equals, value: "session.upload_progress.enabled" }
        - { field: value, op: matches, value: '(?i)^\s*"?(on|1|true|yes)"?\s*$' }
  - id: upload_off
    subject: text_config
    where:
      all:
        - { field: key, op: equals, value: "session.upload_progress.enabled" }
        - { field: value, op: matches, value: '(?i)^\s*"?(off|0|false|no|none)?"?\s*$' }
  # PHP 가 있는가 — 코어 DLL(확장 DLL 은 PHP 가 아니다).
  - id: php_core
    subject: file
    where:
      - { field: path, op: matches, value: '(?i)\\php[5-8](ts)?\.dll$' }

  # ── 선언한 자리 밖의 PHP (0.2.0) — PHP2Shell Windows 룰과 같은 세 규칙 ──────────────
  - id: iis_php
    subject: structured_config
    where:
      - { field: key_path, op: matches, value: '(?i)/(fastCgi\[\d+\]/application\[\d+\]/@fullPath|handlers\[\d+\]/add\[\d+\]/@scriptProcessor)$' }
      - { field: value, op: matches, value: '(?i)\\php(-cgi)?\.exe(\|.*)?$' }
    exclude:
      - { field: value, op: matches, value: '(?i)^((c:|%systemdrive%)\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82|81|80|74))|(c:\\program files( \(x86\))?|%programfiles%|%programfiles\(x86\)%|%programw6432%)\\php)\\' }

  - id: iis_shared
    subject: structured_config
    where:
      - { field: key_path, op: matches, value: '(?i)/configurationRedirection\[\d+\]/@enabled$' }
      - { field: value, op: matches, value: '(?i)^true$' }

  - id: running_php
    subject: process
    where:
      - { field: image_path, op: matches, value: '(?i)\\php(-cgi|-win)?\.exe$' }
    exclude:
      - { field: image_path, op: matches, value: '(?i)^(c:\\(php|xampp\\php|wamp64\\bin\\php|wamp\\bin\\php|laragon\\bin\\php|tools\\php(85|84|83|82|81|80|74))|c:\\program files( \(x86\))?\\php)\\' }

# **판정(2)은 세우지 않는다** — 위 머리말의 까닭. `require` 는 문법상 있어야 하므로 늘 거짓인 식을
# 적는다(`count(x) >= 0` 은 늘 참이다).
verdict:
  require: "not (count(php_core) >= 0) and not (count(upload_on) >= 0)"
  unconfirmed:
    # PHP 가 있을 때만 본다 — 지운 PHP 의 설정 파일이 남은 기계는 해당 없음이다.
    - when: "upload_on and php_core"
      why:
        ko: "session.upload_progress.enabled 가 켜져 있습니다 — 앱이 실행 중에 session.serialize_handler 를 php 로 바꾼다면(ini_set) 0 으로 두고 웹 서버와 PHP 를 다시 시작하십시오(php.net 공지)"
        en: "session.upload_progress.enabled is on - if the application switches session.serialize_handler to php at run time (ini_set), set it to 0 and restart the web server and PHP (php.net advisory)"
    - when: "upload_off and not upload_on and php_core"
      why:
        ko: "session.upload_progress.enabled 를 끈 설정이 있습니다 — 실행 중인 PHP 에 반영됐는지(다시 시작했는지)는 이 도구가 보지 못합니다"
        en: "a setting turns session.upload_progress.enabled off - whether the running PHP has picked it up (restarted) cannot be seen by this tool"
    - when: "php_core and not upload_on and not upload_off"
      why:
        ko: "session.upload_progress.enabled 설정을 찾지 못했습니다(기본값은 켜짐) — 앱이 실행 중에 session.serialize_handler 를 바꾸는지 확인하십시오(php.net 공지)"
        en: "no session.upload_progress.enabled setting was found (the default is on) - check whether the application changes session.serialize_handler at run time (php.net advisory)"
    - when: "iis_php or running_php"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 를 IIS 가 쓰거나 그 PHP 가 실행 중입니다(아래 경로) — 그 PHP 의 설정은 보지 않았습니다. 그 PHP 의 session.upload_progress.enabled 를 확인하십시오(기본값은 켜짐)"
        en: "IIS uses, or there is running, a PHP outside the places this check reads (path below) - its settings were not read; check session.upload_progress.enabled for that PHP (the default is on)"
    - when: "iis_shared"
      why:
        ko: "IIS 가 공유 설정을 씁니다 — 다른 자리에 있는 그 설정이 가리키는 PHP 와 그 설정은 보지 않았습니다"
        en: "IIS uses a shared configuration - PHP referenced from that configuration elsewhere, and its settings, were not read"
