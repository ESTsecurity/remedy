# PHP 세션 업로드 진행 설정 점검 — 리눅스 (CVE-2026-115560 · php.net 2026-10-23 공지)
#
# **판 번호로 답할 수 없다.** 공지는 수정 판을 내지 않았고(다음 정기 판에서 고친다), 위험은 세
# 조건이 겹칠 때뿐이다 — `session.upload_progress.enabled` 가 켜져 있고, 서버 설정의
# `session.serialize_handler` 가 `php_binary` · `php_serialize` 이며, **앱이 `session_start()` 전에
# `ini_set()` 으로 그것을 `php` 로 바꾼다.** 셋째는 앱 코드라 이 도구가 보지 못한다. 그래서 이 룰은
# **판정(2)을 세우지 않고** PHP 가 있으면 늘 *확인 필요(6)* 로, 설정 상태에 따라 까닭을 갈라 적는다.
#
# 권고(공지): 다음 정기 판까지 `session.upload_progress.enabled=0`. 실행 중에 handler 를 바꾸지 않는
# 앱은 켜 둬도 된다. 바꾼 값은 PHP 를 다시 시작해야 실린다 — 그것도 이 도구는 보지 못한다.
#
# **선언한 자리 밖에서 실행 중인 PHP 는 찾아서 알린다** (0.2.0) — *확인 필요* 로 그 경로를 적고, 그 PHP 의
# 설정은 열지 않는다(PHP2Shell 리눅스 룰과 같은 규칙).
#
# **직접 빌드의 흔한 접두사 `/usr/local/php` · `/opt/php` 도 선언한 자리다** (0.3.0) — 그 아래의 PHP 실행 파일과
# 설정(`lib/php.ini` · `etc/php.ini` · `etc/conf.d` 등 — `.ini` · `.conf` 만 읽는다)을 본다(PHP2Shell 리눅스 룰 0.4.0
# 과 같은 자리).
schema_version: 1
id: php-session-check-linux
version: 0.4.0
min_core: "1.3.0"   # verdict.unconfirmed 가 1.3.0 부터 있다
platforms: [linux]

kind: check

name:
  ko: "PHP 세션 업로드 진행 설정 점검 (CVE-2026-115560)"
  en: "PHP session upload progress setting check (CVE-2026-115560)"

references:
  - "https://www.php.net/archive/2026.php"
  - "CVE-2026-115560"

# 설정은 배포판마다 자리가 다르다 — Debian 계열 `/etc/php/<판>/<SAPI>/` · RPM 계열 `/etc/php.ini` 와
# `/etc/php.d` · Alpine `/etc/phpNN` · 공식 Docker 이미지 `/usr/local/etc/php`. RPM 계열의 주 설정은
# `/etc` 바로 아래 **파일 하나**라 글롭 뿌리(`/etc/php*.ini` — 그 폴더 바로 아래의 이름만 본다)로 적는다.
# PHP 자체는 PHP2Shell 룰과 같은 자리에서 찾는다(설정 파일이 아예 없는 기계도 PHP 가 있으면 확인 필요다).
scan_roots:
  - "/etc/php"
  - "/etc/php*.ini"
  - "/etc/php.d"
  - "/etc/php8"
  - "/etc/php81"
  - "/etc/php82"
  - "/etc/php83"
  - "/etc/php84"
  - "/etc/php85"
  - "/usr/local/etc/php"
  - "/usr/local/bin"
  - "/usr/local/sbin"
  - "/usr/bin"
  - "/usr/sbin"
  - "/usr/lib64/httpd/modules"
  - "/usr/local/php"
  - "/opt/php"

subjects: [package, file, text_config, process, service]

detect:
  - id: upload_on
    subject: text_config
    where:
      all:
        - { field: key, op: equals, value: "session.upload_progress.enabled" }
        - { field: value, op: matches, value: '(?i)^\s*"?(on|1|true|yes)"?\s*$' }
  - id: upload_off
    subject: text_config
    where:
      all:
        - { field: key, op: equals, value: "session.upload_progress.enabled" }
        - { field: value, op: matches, value: '(?i)^\s*"?(off|0|false|no|none)?"?\s*$' }
  # PHP 가 있는가 — 배포판 런타임 패키지 또는 PHP 실행 파일.
  - id: php_pkg
    subject: package
    where:
      - { field: name, op: matches, value: '^(php[0-9.]*-(cli|cgi|fpm|apache2)|libapache2-mod-php[0-9.]*|php[0-9]+)$' }
  - id: php_bin
    subject: file
    where:
      - { field: path, op: matches, value: '^(/usr/local/(bin/php(-cgi)?|sbin/php-fpm)|/usr/(bin/php(-cgi)?|sbin/php-fpm)|/usr/lib64/httpd/modules/libphp[0-9]?\.so|/(usr/local|opt)/php/(.+/)?(s?bin/(php|php-cgi|php-fpm)[0-9.]*|lib(64)?/libphp[0-9.]*\.so))$' }

  # ── 선언한 자리 밖에서 실행 중인 PHP (0.2.0) — PHP2Shell 리눅스 룰과 같은 규칙 ─────────────
  - id: running_php
    subject: process
    where:
      - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
    exclude:
      - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }

  # 서비스로 등록된 선언 밖의 PHP (0.4.0) — systemd 유닛의 `ExecStart` 첫 낱말(`php2shell-check-linux` 0.5.0 과
  # 같은 규칙). 돌고 있지 않아도 유닛 파일이 남는다.
  - id: service_php
    subject: service
    where:
      - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
    exclude:
      - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }

# **판정(2)은 세우지 않는다** — 위 머리말의 까닭. `require` 는 문법상 있어야 하므로 늘 거짓인 식을
# 적는다(`count(x) >= 0` 은 늘 참이다).
verdict:
  require: "not (count(php_pkg) >= 0) and not (count(php_bin) >= 0)"
  unconfirmed:
    # PHP 가 있을 때만 본다 — 지운 PHP 의 설정 파일이 남은 기계는 해당 없음이다.
    - when: "upload_on and (php_pkg or php_bin)"
      why:
        ko: "session.upload_progress.enabled 가 켜져 있습니다 — 앱이 실행 중에 session.serialize_handler 를 php 로 바꾼다면(ini_set) 0 으로 두고 PHP 를 다시 시작하십시오(php.net 공지)"
        en: "session.upload_progress.enabled is on - if the application switches session.serialize_handler to php at run time (ini_set), set it to 0 and restart PHP (php.net advisory)"
    - when: "upload_off and not upload_on and (php_pkg or php_bin)"
      why:
        ko: "session.upload_progress.enabled 를 끈 설정이 있습니다 — 실행 중인 PHP 에 반영됐는지(다시 시작했는지)는 이 도구가 보지 못합니다. 바꾼 뒤 다시 시작하지 않았다면 PHP(웹 서버 · PHP-FPM)를 다시 시작하십시오"
        en: "a setting turns session.upload_progress.enabled off - whether the running PHP has picked it up (restarted) cannot be seen by this tool; if it was not restarted after the change, restart PHP (web server, PHP-FPM)"
    - when: "(php_pkg or php_bin) and not upload_on and not upload_off"
      why:
        ko: "session.upload_progress.enabled 설정을 찾지 못했습니다(기본값은 켜짐) — 앱이 실행 중에 session.serialize_handler 를 php 로 바꾼다면(ini_set) 0 으로 두고 PHP 를 다시 시작하십시오(php.net 공지)"
        en: "no session.upload_progress.enabled setting was found (the default is on) - if the application switches session.serialize_handler to php at run time (ini_set), set it to 0 and restart PHP (php.net advisory)"
    - when: "running_php"
      why:
        ko: "이 점검이 보는 자리 밖에서 PHP 가 실행 중입니다(위 경로) — 그 PHP 의 설정은 보지 않았습니다. 그 PHP 의 session.upload_progress.enabled 를 확인하십시오(기본값은 켜짐)"
        en: "a PHP is running outside the places this check reads (path above) - its settings were not read; check session.upload_progress.enabled for that PHP (the default is on)"
    - when: "service_php"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 를 띄우는 서비스가 있습니다(위 유닛 · 괄호 안이 그 실행 파일) — 그 PHP 의 설정은 보지 않았습니다. 그 PHP 의 session.upload_progress.enabled 를 확인하십시오(기본값은 켜짐)"
        en: "a service starts a PHP outside the places this check reads (unit above; the executable is in brackets) - its settings were not read; check session.upload_progress.enabled for that PHP (the default is on)"
