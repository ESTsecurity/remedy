        en: "a setting turns session.upload_progress.enabled off - whether the running PHP has picked it up (restarted) cannot be seen by this tool; if it was not restarted after the change, restart PHP (web server, PHP-FPM). A PHP not counted as fixed is present - if it predates the fix, upgrade to the fixed release of its line (8.5.13, 8.4.28, 8.3.37, 8.2.36) or later (8.1 and older have no fixed release - move to 8.2 or later; for a distribution package follow that distribution's fixed package and advisory); for a pre-release build, a file that differs from its package record or a PHP not restarted after the upgrade, follow the PHP November security update check"
