    - when: "upload_on and (php_pkg or php_bin or rpm_php) and (deb_vuln_85 or deb_vuln_84 or deb_vuln_83 or deb_vuln_82 or deb_eol or apk_vuln or rpm_vuln or bin_vuln or bin_version_unknown or (bin_rpm and not rpm_php) or bin_rpm_unowned or (sbin_fpm_unowned and not bin_fpm_owned) or pkg_bin_changed or stale_php or (php_bin and not (php_pkg or rpm_php or bin_php or bin_rpm)))"
      why:
        ko: "session.upload_progress.enabled 가 켜져 있습니다 — 앱이 실행 중에 session.serialize_handler 를 php 로 바꾼다면(ini_set) 0 으로 두고 PHP 를 다시 시작하십시오. 고친 버전으로 세지 않은 PHP 가 있습니다 — 고치기 전 버전이면 그 계열의 고친 버전(8.5.13 · 8.4.28 · 8.3.37 · 8.2.36) 이상으로 올리십시오(8.1 이하는 고친 버전이 없어 8.2 이상으로 옮기고, 배포판 패키지는 그 배포판의 고친 패키지 · 공지를 따릅니다). 정식 출시 전 버전 · 패키지 기록과 다른 파일 · 고친 뒤 다시 시작하지 않은 PHP 는 PHP 11월 보안 업데이트 점검 항목의 안내를 따르십시오(php.net 공지)"
        en: "session.upload_progress.enabled is on - if the application switches session.serialize_handler to php at run time (ini_set), set it to 0 and restart PHP. A PHP not counted as fixed is present - if it predates the fix, upgrade to the fixed release of its line (8.5.13, 8.4.28, 8.3.37, 8.2.36) or later (8.1 and older have no fixed release - move to 8.2 or later; for a distribution package follow that distribution's fixed package and advisory); for a pre-release build, a file that differs from its package record or a PHP not restarted after the upgrade, follow the PHP November security update check (php.net advisory)"
    - when: "upload_on and (php_pkg or php_bin or rpm_php) and not (deb_vuln_85 or deb_vuln_84 or deb_vuln_83 or deb_vuln_82 or deb_eol or apk_vuln or rpm_vuln or bin_vuln or bin_version_unknown or (bin_rpm and not rpm_php) or bin_rpm_unowned or (sbin_fpm_unowned and not bin_fpm_owned) or pkg_bin_changed or stale_php or (php_bin and not (php_pkg or rpm_php or bin_php or bin_rpm)))"
