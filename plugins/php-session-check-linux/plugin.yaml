# PHP 세션 업로드 진행 설정 점검 — 리눅스 (CVE-2026-115560 · php.net 2026-10-23 공지)
#
# **판정(2)은 세우지 않는다.** 위험은 세 조건이 겹칠 때뿐이다 — `session.upload_progress.enabled` 가 켜져 있고, 서버
# 설정의 `session.serialize_handler` 가 `php_binary` · `php_serialize` 이며, **앱이 `session_start()` 전에 `ini_set()` 으로
# 그것을 `php` 로 바꾼다**(또는 같은 세션을 쓰는 설정끼리 직렬화기가 다르다). 셋째는 앱 코드라 이 도구가 보지 못한다.
# 그래서 PHP 가 있으면 *확인 필요(6)* 로, 설정 상태에 따라 까닭을 갈라 적는다.
#
# **고친 판(0.6.0)** — 2026-10-23 공지 때는 고친 판이 없었고, 2026-11-19 보안 업데이트(8.2.36 · 8.3.37 · 8.4.28 · 8.5.13)가
# 이 결함을 고쳤다(GHSA-658j-r8rw-q6mx — 기본값을 꺼짐으로 바꾸고, 켜진 동안 실행 중에 직렬화기를 바꾸지 못하게 한다). 그래서
# **찾은 PHP 가 모두 고친 판 이상이고 직접 켠 설정이 없으면 0** 이다. 판 사실은 PHP 11월 보안 업데이트 점검
# (`php-2026-11-check-linux` 0.1.1)과 같은 규칙으로 읽는다 — 배포판 패키지는 상류 판으로(백포트는 고친 판으로 세지 않는다),
# 패키지 밖의 실행 파일은 판 문자열로, 정식 판을 읽지 못하면 고친 판으로 세지 않는다. 고친 판이어도 직접 켰다면 설정끼리 다른
# 직렬화기는 막지 않으므로 *확인 필요* 로 남는다.
#
# 권고(공지): 고친 판으로 올린다. 그 전에는 `session.upload_progress.enabled=0`. 바꾼 값은 PHP 를 다시 시작해야 실린다 —
# 그것도 이 도구는 보지 못한다.
#
# **선언한 자리 밖에서 실행 중인 PHP 는 찾아서 알린다** (0.2.0) — *확인 필요* 로 그 경로를 적고, 그 PHP 의
# 설정은 열지 않는다(PHP2Shell 리눅스 룰과 같은 규칙).
#
# **직접 빌드의 흔한 접두사 `/usr/local/php` · `/opt/php` 도 선언한 자리다** (0.3.0) — 그 아래의 PHP 실행 파일과
# 설정(`lib/php.ini` · `etc/php.ini` · `etc/conf.d` 등 — `.ini` · `.conf` 만 읽는다)을 본다(PHP2Shell 리눅스 룰 0.4.0
# 과 같은 자리).
#
# **멈춰 있어도 남는 자리 둘을 더 본다**(0.5.0) — SysV · OpenRC · Upstart 의 시작 스크립트가 띄우는 실행 파일(코어
# 1.10.0)과 Apache 설정의 `LoadModule php_module` 줄(PHP2Shell 리눅스 룰 0.6.0 과 같은 규칙).
schema_version: 1
id: php-session-check-linux
version: 0.6.1
min_core: "1.21.0"  # product 는 1.21.0 · 시작 스크립트의 서비스는 1.10.0 · package_match 는 1.7.0 · verdict.unconfirmed 는 1.3.0
platforms: [linux]

kind: check
product: PHP

name:
  ko: "PHP 세션 업로드 진행 설정 점검 (CVE-2026-115560)"
  en: "PHP session upload progress setting check (CVE-2026-115560)"

references:
  - "https://www.php.net/archive/2026.php"
  - "CVE-2026-115560"

# 설정은 배포판마다 자리가 다르다 — Debian 계열 `/etc/php/<판>/<SAPI>/` · RPM 계열 `/etc/php.ini` 와
# `/etc/php.d` · Alpine `/etc/phpNN` · 공식 Docker 이미지 `/usr/local/etc/php`. RPM 계열의 주 설정은
# `/etc` 바로 아래 **파일 하나**라 글롭 뿌리(`/etc/php*.ini` — 그 폴더 바로 아래의 이름만 본다)로 적는다.
# PHP 자체는 PHP2Shell 룰과 같은 자리에서 찾는다(설정 파일이 아예 없는 기계도 PHP 가 있으면 확인 필요다).
scan_roots:
  - "/etc/php"
  - "/etc/php*.ini"
  - "/etc/php.d"
  # PHP-FPM 풀 설정(0.6.0) — RPM 계열 `/etc/php-fpm.d` · `/etc/php-fpm.conf`, 공식 Docker 이미지 `/usr/local/etc/php-fpm.d`
  # · `/usr/local/etc/php-fpm.conf`(Debian 은 `/etc/php/<판>/fpm/pool.d` · Alpine 은 `/etc/phpNN/php-fpm.d` 로 위 자리 안이다).
  - "/etc/php-fpm.d"
  - "/etc/php-fpm*.conf"
  - "/usr/local/etc/php-fpm.d"
  - "/usr/local/etc/php-fpm*.conf"
  - "/etc/php7"
  - "/etc/php8"
  - "/etc/php81"
  - "/etc/php82"
  - "/etc/php83"
  - "/etc/php84"
  - "/etc/php85"
  - "/usr/local/etc/php"
  - "/usr/local/bin"
  - "/usr/local/sbin"
  - "/usr/local/lib"
  - "/usr/lib/apache2/modules"
  - "/usr/bin"
  - "/usr/sbin"
  - "/usr/lib64/httpd/modules"
  - "/usr/local/php"
  - "/opt/php"
  # Apache 가 어느 PHP 를 싣는지 적힌 자리(0.5.0) — PHP2Shell 리눅스 룰 0.6.0 과 같은 자리다.
  - "/etc/apache2"
  - "/etc/httpd"
  - "/usr/local/apache2/conf"
  - "/opt/lampp/etc"

# 파일은 PHP 자리만 본다 — Apache 설정 폴더는 줄로만 읽는다. Debian 의 모듈 줄은 `mods-available/*.load` 에 있다
# (`mods-enabled` 는 그 파일로 가는 링크라 수집기가 따라가지 않는다).
subject_roots:
  file:
    - "/usr/local/bin"
    - "/usr/local/sbin"
    - "/usr/local/lib"
    - "/usr/lib/apache2/modules"
    - "/usr/bin"
    - "/usr/sbin"
    - "/usr/lib64/httpd/modules"
    - "/usr/local/php"
    - "/opt/php"
text_config_dirs: ["/etc/apache2/mods-available"]

subjects: [package, file, text_config, process, service]

detect:
  # 켬 · 끔은 세 꼴로 읽는다(0.6.0) — php.ini 꼴 `키 = 값`, PHP-FPM 풀의 `php_admin_flag[키] = 값` 꼴(수집기가 `=` 로
  # 갈라 key 에 대괄호 꼴이 온다), Apache 설정의 `php_admin_flag 키 값` 꼴(`=` 가 없어 key · value 가 비고 line 만 온다).
  # 값 뒤의 `; 주석` 도 받는다(수집기는 줄 머리의 주석만 버린다). 고친 판에서는 켬을 놓치면 0 이 되므로 셋을 다 본다.
  - id: upload_on
    subject: text_config
    where:
      any:
        - all:
            - { field: key, op: matches, value: '^(session\.upload_progress\.enabled|php(_admin)?_(value|flag)\[\s*session\.upload_progress\.enabled\s*\])$' }
            - { field: value, op: matches, value: '(?i)^\s*"?(on|1|true|yes)"?\s*(;.*)?$' }
        - { field: line, op: matches, value: '^(?i:php(_admin)?_(value|flag))\s+"?session\.upload_progress\.enabled"?\s+"?(?i:on|1|true|yes)"?(\s|$)' }
  - id: upload_off
    subject: text_config
    where:
      any:
        - all:
            - { field: key, op: matches, value: '^(session\.upload_progress\.enabled|php(_admin)?_(value|flag)\[\s*session\.upload_progress\.enabled\s*\])$' }
            - { field: value, op: matches, value: '(?i)^\s*"?(off|0|false|no|none)?"?\s*(;.*)?$' }
        - { field: line, op: matches, value: '^(?i:php(_admin)?_(value|flag))\s+"?session\.upload_progress\.enabled"?\s+"?(?i:off|0|false|no|none)"?(\s|$)' }
  # PHP 가 있는가 — 배포판 런타임 패키지 또는 PHP 실행 파일 · 모듈(판 사실이 보는 모듈 자리 둘도 — 0.6.0).
  - id: php_pkg
    subject: package
    where:
      - { field: name, op: matches, value: '^(php[0-9.]*-(cli|cgi|fpm|apache2)|libapache2-mod-php[0-9.]*|php[0-9]+)$' }
  - id: php_bin
    subject: file
    where:
      - { field: path, op: matches, value: '^(/usr/local/(bin/php(-cgi)?|sbin/php-fpm|lib/libphp[0-9]*\.so)|/usr/(bin/php(-cgi)?|sbin/php-fpm)|/usr/lib/apache2/modules/libphp\.so|/usr/lib64/httpd/modules/libphp[0-9]?\.so|/(usr/local|opt)/php/(.+/)?(s?bin/(php|php-cgi|php-fpm)[0-9.]*|lib(64)?/libphp[0-9.]*\.so))$' }

  # ── 선언한 자리 밖에서 실행 중인 PHP (0.2.0) — PHP2Shell 리눅스 룰과 같은 규칙 ─────────────
  - id: running_php
    subject: process
    where:
      - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
    exclude:
      - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }

  # 서비스로 등록된 선언 밖의 PHP (0.4.0) — systemd 유닛의 `ExecStart` 첫 낱말(`php2shell-check-linux` 0.5.0 과
  # 같은 규칙). 돌고 있지 않아도 유닛 파일이 남는다. 0.5.0 부터 시작 스크립트가 띄우는 실행 파일도 온다.
  - id: service_php
    subject: service
    where:
      - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
    exclude:
      - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }

  # Apache 설정이 싣는 선언 밖의 PHP 모듈 (0.5.0) — `php2shell-check-linux` 0.6.0 의 같은 이름 규칙 둘과 같은 식이다.
  - id: apache_php
    subject: text_config
    where:
      - { field: path, op: matches, value: '^/(etc/apache2|usr/local/apache2/conf|opt/lampp/etc)/' }
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s' }
    exclude:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s+"?(/usr/lib(64)?/(apache2|httpd)[^/]*/|/usr/local/lib/|/(usr/local|opt)/php/)' }
  - id: apache_php_rpm
    subject: text_config
    where:
      - { field: path, op: matches, value: '^/etc/httpd/' }
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s' }
    exclude:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s+"?(/usr/lib(64)?/(apache2|httpd)[^/]*/|/usr/local/lib/|/(usr/local|opt)/php/|modules/)' }

  # ── 판 사실(0.6.0) — PHP 11월 보안 업데이트 점검(`php-2026-11-check-linux` 0.1.1)과 같은 규칙 ─────────────────
  #
  # 이 룰에서는 판정이 아니라 **'고치지 않은 PHP 가 있는가'** 를 가르는 데만 쓴다(그래서 label 이 없다). 아래 가운데 하나라도
  # 맞으면 고친 판으로 세지 않는다 — 고친 판 아래 · 지원이 끝난 8.1 이하 · 정식 판을 읽지 못함 · RPM 의 자리에 패키지가 깔지
  # 않은 PHP · 패키지 기록과 다른 실행 파일 · 고친 뒤 다시 시작하지 않은 PHP. 배포판 패키지는 상류 판으로 센다(백포트한
  # 패키지는 고친 판으로 세지 않는다 — 11월 점검과 같은 정책).
  - id: deb_vuln_85
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(php8\.5-(cli|cgi|fpm)|libapache2-mod-php8\.5)$' }
        - { field: version, op: matches, value: '^8\.5\.' }
        - { field: version, op: pkg_version_lt, value: "8.5.13" }
  - id: deb_vuln_84
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(php8\.4-(cli|cgi|fpm)|libapache2-mod-php8\.4)$' }
        - { field: version, op: matches, value: '^8\.4\.' }
        - { field: version, op: pkg_version_lt, value: "8.4.28" }
  - id: deb_vuln_83
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(php8\.3-(cli|cgi|fpm)|libapache2-mod-php8\.3)$' }
        - { field: version, op: matches, value: '^8\.3\.' }
        - { field: version, op: pkg_version_lt, value: "8.3.37" }
  - id: deb_vuln_82
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(php8\.2-(cli|cgi|fpm)|libapache2-mod-php8\.2)$' }
        - { field: version, op: matches, value: '^8\.2\.' }
        - { field: version, op: pkg_version_lt, value: "8.2.36" }
  - id: deb_eol
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: dpkg }
        - { field: name, op: matches, value: '^(php[0-9.]+-(cli|cgi|fpm)|libapache2-mod-php[0-9.]+|php5|libapache2-mod-php5)$' }
        - { field: version, op: matches, value: '^([0-9]+:)?([5-7]\.|8\.[01]\.)' }
  - id: apk_vuln
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: apk }
        - { field: name, op: matches, value: '^php[0-9]+(-(cgi|fpm|apache2))?$' }
        - any:
            - all:
                - { field: version, op: matches, value: '^8\.5\.' }
                - { field: version, op: apk_version_lt, value: "8.5.13-r0" }
            - all:
                - { field: version, op: matches, value: '^8\.4\.' }
                - { field: version, op: apk_version_lt, value: "8.4.28-r0" }
            - all:
                - { field: version, op: matches, value: '^8\.3\.' }
                - { field: version, op: apk_version_lt, value: "8.3.37-r0" }
            - all:
                - { field: version, op: matches, value: '^8\.2\.' }
                - { field: version, op: apk_version_lt, value: "8.2.36-r0" }
            - { field: version, op: matches, value: '^([5-7]\.|8\.[01]\.)' }
  - id: rpm_vuln
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: rpm }
        - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }
        - any:
            - all:
                - { field: version, op: matches, value: '^(?:0:)?8\.5\.' }
                - { field: version, op: rpm_version_lt, value: "0:8.5.13" }
            - all:
                - { field: version, op: matches, value: '^(?:0:)?8\.4\.' }
                - { field: version, op: rpm_version_lt, value: "0:8.4.28" }
            - all:
                - { field: version, op: matches, value: '^(?:0:)?8\.3\.' }
                - { field: version, op: rpm_version_lt, value: "0:8.3.37" }
            - all:
                - { field: version, op: matches, value: '^(?:0:)?8\.2\.' }
                - { field: version, op: rpm_version_lt, value: "0:8.2.36" }
            - { field: version, op: matches, value: '^(?:0:)?([5-7]\.|8\.[01]\.)' }
  - id: rpm_php
    subject: package
    where:
      all:
        - { field: manager, op: equals, value: rpm }
        - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }
  - id: bin_vuln
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^(/usr/local/(bin/php(-cgi)?|sbin/php-fpm|lib/libphp[0-9]*\.so)|/usr/lib/apache2/modules/libphp\.so|/(usr/local|opt)/php/(.+/)?(s?bin/(php|php-cgi|php-fpm)[0-9.]*|lib(64)?/libphp[0-9.]*\.so))$' }
        - { yara: "rules/php.yar:php_version_affected" }
    exclude:
      - { field: package, op: matches, value: '.' }
  - id: bin_php
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^(/usr/local/(bin/php(-cgi)?|sbin/php-fpm|lib/libphp[0-9]*\.so)|/usr/lib/apache2/modules/libphp\.so|/(usr/local|opt)/php/(.+/)?(s?bin/(php|php-cgi|php-fpm)[0-9.]*|lib(64)?/libphp[0-9.]*\.so))$' }
        - { field: sha256, op: exists }
    exclude:
      - { field: package, op: matches, value: '.' }
  # 정식 판을 읽지 못한 실행 파일 — 파일마다 가른다(0.6.0). 기계 단위 식(`bin_php and not 판을 읽음`)은 판을 읽은 다른
  # 실행 파일 하나가 RC · 개발 빌드 · 판 없는 실행 파일을 가렸다. 본문을 담지 못하면 YARA 가 '모름' 이라 빼지 못해 남는다.
  - id: bin_version_unknown
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^(/usr/local/(bin/php(-cgi)?|sbin/php-fpm|lib/libphp[0-9]*\.so)|/usr/lib/apache2/modules/libphp\.so|/(usr/local|opt)/php/(.+/)?(s?bin/(php|php-cgi|php-fpm)[0-9.]*|lib(64)?/libphp[0-9.]*\.so))$' }
        - { field: sha256, op: exists }
    exclude:
      - { field: package, op: matches, value: '.' }
      - { yara: "rules/php.yar:php_version_string" }
  - id: bin_rpm
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^/usr/(bin/php(-cgi)?|sbin/php-fpm|lib64/httpd/modules/libphp[0-9]?\.so)$' }
        - { field: sha256, op: exists }
  # 같은 자리의 정규 파일 가운데 어느 패키지도 깔지 않은 것(0.6.1 · 11월 점검 0.1.2 와 같은 줄) — RPM 의 PHP 패키지가 고친
  # 판이어도 그 옆에 따로 놓은 파일은 고친 판으로 세지 않는다. 0.6.0 은 `not rpm_php` 로 그 파일을 패키지의 것으로 보아 0 이었다.
  # `/usr/sbin/php-fpm` 은 같은 이름의 `/usr/bin/php-fpm` 을 패키지가 깔았으면 세지 않는다 — `/usr/sbin` 이 `bin` 으로 가는
  # 링크인 기계(Fedora 42 이후의 합친 bin)는 패키지가 깐 그 파일이 소유 없는 `/usr/sbin/php-fpm` 으로 한 번 더 온다.
  - id: bin_rpm_unowned
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^/usr/(bin/php(-cgi)?|lib64/httpd/modules/libphp[0-9]?\.so)$' }
        - { field: sha256, op: exists }
    exclude:
      - { field: package, op: matches, value: '.' }
  - id: sbin_fpm_unowned
    subject: file
    where:
      all:
        - { field: path, op: equals, value: "/usr/sbin/php-fpm" }
        - { field: sha256, op: exists }
    exclude:
      - { field: package, op: matches, value: '.' }
  - id: bin_fpm_owned
    subject: file
    where:
      all:
        - { field: path, op: equals, value: "/usr/bin/php-fpm" }
        - { field: package, op: matches, value: '.' }
  - id: stale_php
    subject: process
    where:
      any:
        - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]* \(deleted\)$' }
        - { field: modules, op: matches, value: '/libphp[0-9.]*\.so \(deleted\)"' }
  - id: pkg_bin_changed
    subject: file
    where:
      - { field: path, op: matches, value: '^/usr/(bin/php(-cgi|-fpm)?[0-9.]*|sbin/php-fpm[0-9.]*|lib/apache2/modules/libphp[0-9.]*\.so|lib64/httpd/modules/libphp[0-9]?\.so)$' }
      - { field: package, op: matches, value: '.' }
      - { field: package_match, op: in, value: [different, unrecorded, unreadable] }

# YARA 는 본문을 본다 — 패키지 밖 PHP 의 실행 파일 자리만 담는다(11월 점검과 같은 자리 · 전부 `glob` 형 — 없으면 담을 것이
# 없는 것이지 미해소가 아니다). 판마다 하위 폴더를 두는 직접 빌드(`/opt/php/8.3/bin`)는 담지 못해 정식 판을 읽지 못한다 —
# 고친 판으로 세지 않는다.
collect_extra:
  - { glob: "/usr/local/bin/php", max_size: 64MB }
  - { glob: "/usr/local/bin/php-cgi", max_size: 64MB }
  - { glob: "/usr/local/sbin/php-fpm", max_size: 64MB }
  - { glob: "/usr/local/lib/libphp*.so", max_size: 64MB }
  - { glob: "/usr/lib/apache2/modules/libphp.so", max_size: 64MB }
  - { glob: "/usr/local/php/bin/php*", max_size: 64MB }
  - { glob: "/usr/local/php/sbin/php-fpm*", max_size: 64MB }
  - { glob: "/usr/local/php/lib/libphp*.so", max_size: 64MB }
  - { glob: "/opt/php/bin/php*", max_size: 64MB }
  - { glob: "/opt/php/sbin/php-fpm*", max_size: 64MB }
  - { glob: "/opt/php/lib/libphp*.so", max_size: 64MB }

# **판정(2)은 세우지 않는다** — 위 머리말의 까닭. `require` 는 문법상 있어야 하므로 늘 거짓인 식을
# 적는다(`count(x) >= 0` 은 늘 참이다). 고치지 않은 PHP 가 있는가는 위 판 사실의 합이다(0.6.0) — 아래 when 의
# `(deb_vuln_85 or … or stale_php or (php_bin and not …))` 덩이가 같은 식이다. 마지막 항은 PHP 가 있다는 문(php_bin)은
# 섰는데 판을 볼 규칙(패키지 · 패키지 밖 실행 파일 · RPM 자리)이 하나도 서지 않은 PHP 다 — 대상이 자리 밖인 링크만 있거나,
# 판 줄이 모르는 이름의 패키지가 깐 PHP. 문은 RPM 의 PHP 패키지(SCL 이름 포함 · rpm_php)도 연다.
