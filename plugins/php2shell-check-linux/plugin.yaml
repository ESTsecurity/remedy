  #
  # 공식 Docker 이미지는 PHP 를 `/usr/local` 에 직접 빌드해 둔다(패키지가 아니다). Apache 이미지의
  # 모듈은 `/usr/lib/apache2/modules/libphp.so` 다 — Debian 패키지의 모듈은 이름에 판이 붙는다
