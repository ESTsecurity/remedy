          - "ea386c64c65dcd1ec432a1cdc356ef07bc943b33f89d301b7683382a884bef98"   # 8.3.36 linux/amd64 fpm /usr/local/bin/php
          - "c05fc7b4fa52c240c93ee21f2497bf897bd0bcdea3da0166c18cb06354ee4cdb"   # 8.3.36 linux/amd64 fpm /usr/local/sbin/php-fpm

  # ── 3. RPM 계열 — 이 코어가 아직 읽지 못하는 자리 ─────────────────────────
  #
  # **정규 파일만 본다**(`sha256` 이 있다). Debian 계열의 `/usr/bin/php` · `/usr/bin/php-cgi` 는
  # 대안(alternatives) 링크라 해시가 없고, 실행 파일은 판이 붙은 이름(`php8.2` · `php-fpm8.2`)이라
  # 이 자리에 오지 않는다 — 그쪽은 위 패키지 줄이 본다.
  - id: bin_rpm
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^/usr/(bin/php(-cgi)?|sbin/php-fpm|lib64/httpd/modules/libphp[0-9]?\.so)$' }
        - { field: sha256, op: exists }

verdict:
  require: "deb12_vuln or deb13_vuln or u1404_vuln or u1604_vuln or u1804_vuln or u2004_vuln or u2204_vuln or u2404_vuln or u2604_vuln or u2610_vuln or official_vuln"
  unconfirmed:
    - when: "pkg_unknown"
      why:
        ko: "공급사 수정 판 기준이 없는 PHP 패키지입니다(다른 저장소이거나 기준에 없는 배포판) — 그 공급사에 두 CVE 의 패치 여부를 확인하십시오"
        en: "a PHP package with no vendor fix baseline (another repository or an uncovered distribution) - confirm with that vendor whether both CVEs are patched"
    - when: "bin_unmanaged"
      why:
        ko: "패키지 밖의 PHP(공식 이미지 · 직접 빌드)가 공식 빌드의 해시와 맞지 않아 패치 여부를 가리지 못했습니다 — 판과 받은 곳을 확인하십시오"
        en: "a PHP outside any package (official image or own build) does not match an official build hash, so its patch status cannot be told - check its version and origin"
    - when: "bin_rpm"
      why:
        ko: "RPM 계열의 PHP 입니다 — 이 판은 RPM 패키지 DB 를 아직 읽지 못합니다. rpm -q php 로 판을 확인하고 공급사 공지와 견주십시오"
        en: "a PHP on an RPM-based system - this version cannot read the RPM package database yet; check the version with rpm -q php against the vendor advisory"
