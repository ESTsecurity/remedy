          - "267a37974e22a5465122bbb902bc5f695e0647d0f87baaf6cfa61953f7903195"   # 8.3.35 linux/amd64 cli /usr/local/bin/php
          - "f2aa4be1186eba05e5f06fd423bc80ca67e361c76191cd64cf9e1389e77c5da3"   # 8.3.35 linux/amd64 cli /usr/local/bin/php-cgi
          - "16f362ece2eb58b7ac21fca1797eecbf4640f471a25d7d384cc00f95260a2121"   # 8.3.35 linux/amd64 cli /usr/local/lib/libphp.so
          - "e2f7e40577da6ca4682ef982635642c4cac4f4313a1982499b090b3964c089aa"   # 8.3.35 linux/amd64 fpm /usr/local/bin/php
