# PHP2Shell 점검 — 리눅스 (CVE-2026-109618 · CVE-2026-109619)
#
# **고치지 않는다.** 원인은 OOM 상황의 요청 데이터 미초기화이고 메우는 것은 공급사의 일이다.
# 설정으로 완화할 수도 없다 — 점검의 답은 **판 하나**다.
#
# # 세 갈래로 본다
#
# 1. **배포판 패키지** — 공급사 공지의 수정 판과 견준다. 공지 하나가 *같은 계열의 판* 만 견줄 뜻이
#    있으므로, 줄마다 **계열(정규식) → 판(`pkg_version_lt`)** 순으로 못박는다. 줄 밖의 PHP 패키지
#    (다른 저장소 · 기준에 없는 배포판)는 **확인 필요** 다 — 판이 높아 보여도 공급사가 고쳤는지
#    알 근거가 없다.
# 2. **패키지 밖의 PHP**(공식 Docker 이미지 · 직접 빌드) — 공식 빌드의 SHA-256 으로만 판정한다.
#    맞으면 그 판이 판정이고, 맞지 않으면 **확인 필요** 다.
# 3. **RPM 패키지**(코어 1.3.0) — 줄마다 **공급사(`vendor`) → 계열(정규식) → 판(`rpm_version_lt`)**.
#    공급사가 먼저다 — Rocky · Alma 는 RHEL 의 판 문자열을 **그대로** 적으므로 판만으로는 누구의 빌드인지
#    모르고, 공지는 그 공급사의 빌드에만 말한다. 공지가 없는 공급사(Rocky · Alma · CentOS · openSUSE ·
#    Remi 등)와 줄 밖의 계열은 **확인 필요** 다. RPM 의 자리에 PHP 실행 파일이 있는데 RPM 의 PHP
#    패키지가 없으면(패키지가 깔지 않은 PHP) 그것도 **확인 필요** 다.
#
# # 수정 판의 출처 (공개 공지)
#
# - 상류: 8.2.35 · 8.3.36 · 8.4.27 · 8.5.12 — https://www.php.net/archive/2026.php
# - Ubuntu: USN-8948-1(22.04 · 24.04 · 26.04 · 26.10) · USN-8948-2(ESM 14.04 · 16.04 · 18.04 · 20.04)
# - Debian: security-tracker CVE-2026-109618(12 · 13)
# - RHEL: RHSA-2026:87080(8.10 php:7.4) · RHSA-2026:87073(8.10 php:8.2) · RHSA-2026:87151(9.8) ·
#   RHSA-2026:88693(7.9 — **CVE-2026-109619 만** 고친다)
# - Oracle Linux: ELSA-2026-87080(8.10 php:7.4) · ELSA-2026-87151(9.8)
# - SUSE: SUSE-SU-2026:4844-1(SLES 15 SP7 php8)
# - 공식 빌드 해시: Docker 공식 이미지 `php:8.3.35-*` · `php:8.3.36-*`(amd64 · 386 — cli · fpm · apache)
#   와 지원이 끝난 `php:5.6.40-cli` · `php:7.4.33-cli`(amd64)의 실행 파일 · 코어 라이브러리
#
# # 이 룰이 보지 않는 것
#
# - 실행 중인 PHP 가 고친 판을 실었는가(재시작) — 옛 파일이 **지워지지 않고** 남은 채 오래 떠 있는 php-fpm
#   은 가리지 못한다. 고친 뒤에는 PHP 와 웹 서버를 다시 시작한다. 옛 파일이 지워졌으면 아래 `stale_php` 가 본다.
# - 선언한 자리 밖에 놓였을 뿐 실행 중이 아닌 PHP(예: `/srv` 아래 직접 빌드 · RHEL 의 Software
#   Collections). **실행 중이면 찾아서 *확인 필요* 로 그 경로를 적는다**(0.2.0) — 그 파일은 열지 않는다.
#
# **패키지가 깐 PHP 실행 파일은 패키지 기록과 대조한다**(0.3.0) — 다르면 그 패키지 버전으로 판정하지 않고 *확인
# 필요* 로 그 경로를 적는다(아래 `pkg_bin_changed`). 대조하는 것은 PHP 실행 파일 자리뿐이다 — 같은 폴더의 다른 패키지
# 파일은 이 룰의 판정에 들지 않는다.
#
# **고친 뒤 다시 시작하지 않은 PHP 를 알린다**(0.4.0) — 패키지를 올리면 옛 파일이 지워지고 새 파일이 그 이름에
# 들어선다. 커널은 지워진 파일을 실은 프로세스의 실행 파일 · 실린 모듈 경로에 ` (deleted)` 를 붙이므로, 그
# 꼬리가 붙은 PHP 는 고치기 전 코드를 실은 채 돈다(아래 `stale_php`). 직접 빌드를 흔히 두는 `/usr/local/php` ·
# `/opt/php` 도 선언한 자리로 읽는다(0.4.0 — 사내 runtime-scanner 의 기본 자리와 같다).
#
# **멈춰 있어도 남는 자리 둘을 더 본다**(0.6.0 · 목표 결정 28) — SysV · OpenRC · Upstart 의 시작 스크립트가 띄우는
# 실행 파일(코어 1.10.0 이 스크립트를 실행하지 않고 풀어 서비스로 낸다)과 **Apache 설정**의 `LoadModule php_module`
# 줄. 선언한 자리 밖이면 *확인 필요* 로 그 경로를 적는다 — 그 파일은 열지 않는다.
schema_version: 1
id: php2shell-check-linux
version: 0.6.0
min_core: "1.10.0"  # 시작 스크립트의 서비스는 1.10.0 · 패키지 파일 대조(file.package · package_match)는 1.7.0
platforms: [linux]

kind: check

name:
  ko: "PHP2Shell 점검 (CVE-2026-109618 · 109619)"
  en: "PHP2Shell check (CVE-2026-109618, 109619)"

references:
  - "https://www.php.net/archive/2026.php"
  - "CVE-2026-109618"
  - "CVE-2026-109619"
  - "https://ubuntu.com/security/notices/USN-8948-1"
  - "https://ubuntu.com/security/notices/USN-8948-2"
  - "https://security-tracker.debian.org/tracker/CVE-2026-109618"
  - "https://access.redhat.com/errata/RHSA-2026:87080"
  - "https://access.redhat.com/errata/RHSA-2026:87073"
  - "https://access.redhat.com/errata/RHSA-2026:87151"
  - "https://access.redhat.com/errata/RHSA-2026:88693"
  - "https://linux.oracle.com/errata/ELSA-2026-87080.html"
  - "https://linux.oracle.com/errata/ELSA-2026-87151.html"
  - "https://www.suse.com/support/update/announcement/2026/suse-su-20264844-1/"

# 패키지 DB 는 자리가 정해져 있어 `scan_roots` 를 보지 않는다. 파일은 PHP 실행 파일이 놓이는 자리만
# 읽는다 — 공식 이미지(`/usr/local`) · Debian 계열 Apache 모듈 · RPM 계열(`/usr/bin` · `/usr/sbin` ·
# httpd 모듈) · 직접 빌드의 흔한 접두사(`/usr/local/php` · `/opt/php` — 0.4.0).
scan_roots:
  - "/usr/local/bin"
  - "/usr/local/sbin"
  - "/usr/local/lib"
  - "/usr/lib/apache2/modules"
  - "/usr/bin"
  - "/usr/sbin"
  - "/usr/lib64/httpd/modules"
  - "/usr/local/php"
  - "/opt/php"
  # Apache 가 어느 PHP 를 싣는지 적힌 자리(0.6.0) — 판정할 PHP 가 아니라 **선언 밖 PHP 를 찾는 곳**이다. Debian
  # 계열 `/etc/apache2` · RPM 계열 `/etc/httpd` · 직접 빌드 `/usr/local/apache2/conf` · XAMPP `/opt/lampp/etc`.
  - "/etc/apache2"
  - "/etc/httpd"
  - "/usr/local/apache2/conf"
  - "/opt/lampp/etc"

# 파일은 PHP 자리만, 줄 단위 설정은 Apache 설정만 읽는다. Debian 의 모듈 줄은 `mods-available/*.load` 에 있다 —
# 켠 것을 가리키는 `mods-enabled` 는 그 파일로 가는 링크라 수집기가 따라가지 않으므로, 켜지 않은 모듈의 줄도
# 함께 읽힌다(배포판 모듈이면 아래 `exclude` 가 뺀다).
subject_roots:
  file:
    - "/usr/local/bin"
    - "/usr/local/sbin"
    - "/usr/local/lib"
    - "/usr/lib/apache2/modules"
    - "/usr/bin"
    - "/usr/sbin"
    - "/usr/lib64/httpd/modules"
    - "/usr/local/php"
    - "/opt/php"
  text_config:
    - "/etc/apache2"
    - "/etc/httpd"
    - "/usr/local/apache2/conf"
    - "/opt/lampp/etc"
text_config_dirs: ["/etc/apache2/mods-available"]

subjects: [package, file, process, service, text_config]

detect:
  # ── 1. 배포판 패키지 — 줄마다 계열 → 판 ─────────────────────────────────
  #
  # 런타임 패키지만 본다(CLI · CGI · FPM · Apache 모듈). 같은 원본의 확장 패키지는 판이 같아
  # 화면만 길어진다.
  - id: deb12_vuln
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php8.2" }
        - { field: name, op: matches, value: '^(php8\.2-(cli|cgi|fpm)|libapache2-mod-php8\.2)$' }
        - { field: version, op: matches, value: '^8\.2\.[0-9]+-[0-9]+([~+]deb12u[0-9]+)?(\+b[0-9]+)?$' }
        - { field: version, op: pkg_version_lt, value: "8.2.35-1~deb12u1" }
  - id: deb13_vuln
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php8.4" }
        - { field: name, op: matches, value: '^(php8\.4-(cli|cgi|fpm)|libapache2-mod-php8\.4)$' }
        - { field: version, op: matches, value: '^8\.4\.[0-9]+-[0-9]+([~+]deb13u[0-9]+)?(\+b[0-9]+)?$' }
        - { field: version, op: pkg_version_lt, value: "8.4.27-1~deb13u1" }
  - id: u1404_vuln
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php5" }
        - { field: name, op: matches, value: '^(php5-(cli|cgi|fpm)|libapache2-mod-php5)$' }
        - { field: version, op: matches, value: '^5\.5\.9\+dfsg-1ubuntu4(\.[0-9]+)?(\+esm[0-9]+)?$' }
        - { field: version, op: pkg_version_lt, value: "5.5.9+dfsg-1ubuntu4.29+esm18" }
  - id: u1604_vuln
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php7.0" }
        - { field: name, op: matches, value: '^(php7\.0-(cli|cgi|fpm)|libapache2-mod-php7\.0)$' }
        - { field: version, op: matches, value: '^7\.0\.33-0ubuntu0\.16\.04(\.[0-9]+)?(\+esm[0-9]+)?$' }
        - { field: version, op: pkg_version_lt, value: "7.0.33-0ubuntu0.16.04.16+esm22" }
  - id: u1804_vuln
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php7.2" }
        - { field: name, op: matches, value: '^(php7\.2-(cli|cgi|fpm)|libapache2-mod-php7\.2)$' }
        - { field: version, op: matches, value: '^7\.2\.24-0ubuntu0\.18\.04(\.[0-9]+)?(\+esm[0-9]+)?$' }
        - { field: version, op: pkg_version_lt, value: "7.2.24-0ubuntu0.18.04.17+esm14" }
  - id: u2004_vuln
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php7.4" }
        - { field: name, op: matches, value: '^(php7\.4-(cli|cgi|fpm)|libapache2-mod-php7\.4)$' }
        - { field: version, op: matches, value: '^7\.4\.3-4ubuntu2(\.[0-9]+)?(\+esm[0-9]+)?$' }
        - { field: version, op: pkg_version_lt, value: "7.4.3-4ubuntu2.29+esm5" }
  - id: u2204_vuln
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php8.1" }
        - { field: name, op: matches, value: '^(php8\.1-(cli|cgi|fpm)|libapache2-mod-php8\.1)$' }
        - { field: version, op: matches, value: '^8\.1\.2-1ubuntu2(\.[0-9]+)?$' }
        - { field: version, op: pkg_version_lt, value: "8.1.2-1ubuntu2.28" }
  - id: u2404_vuln
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php8.3" }
        - { field: name, op: matches, value: '^(php8\.3-(cli|cgi|fpm)|libapache2-mod-php8\.3)$' }
        - { field: version, op: matches, value: '^8\.3\.6-0ubuntu0\.24\.04(\.[0-9]+)?$' }
        - { field: version, op: pkg_version_lt, value: "8.3.6-0ubuntu0.24.04.13" }
  - id: u2604_vuln
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php8.5" }
        - { field: name, op: matches, value: '^(php8\.5-(cli|cgi|fpm)|libapache2-mod-php8\.5)$' }
        - { field: version, op: matches, value: '^8\.5\.4-0ubuntu1(\.[0-9]+)?$' }
        - { field: version, op: pkg_version_lt, value: "8.5.4-0ubuntu1.5" }
  - id: u2610_vuln
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php8.5" }
        - { field: name, op: matches, value: '^(php8\.5-(cli|cgi|fpm)|libapache2-mod-php8\.5)$' }
        - { field: version, op: matches, value: '^8\.5\.9-0ubuntu2(\.[0-9]+)?$' }
        - { field: version, op: pkg_version_lt, value: "8.5.9-0ubuntu2.1" }

  # 위 줄 밖의 PHP 런타임 패키지 — **다른 저장소 · 기준에 없는 배포판**(Alpine 포함). 판이 높아
  # 보여도 공급사가 고쳤는지 알 근거가 없다. 위 줄의 계열은 모두 뺀다(그쪽은 취약이거나 고쳤다).
  # dpkg · apk 만 본다 — RPM 은 같은 판 문자열을 여러 공급사가 내므로 아래에서 공급사별로 가른다.
  #
  # **Debian · Ubuntu 의 메타 패키지는 세지 않는다**(0.3.0) — `apt install php-cli` 가 까는 `php-cli` ·
  # `php-fpm` · `php-cgi` · `libapache2-mod-php`(원본 `php-defaults`, 버전 `2:8.2+93` 꼴)는 실행 파일이 없고, 판
  # 붙은 패키지(`php8.2-cli` 등)를 끌어올 뿐이다 — 판정은 그쪽이 한다. 0.2.0 은 이것을 *기준 없는 PHP 패키지*
  # 로 세어, 고친 버전을 그렇게 깐 서버가 확인 필요(6)였다(rc 실측: Debian 12 · Ubuntu 24.04).
  - id: pkg_unknown
    subject: package
    where:
      all:
        - { field: manager, op: in, value: ["dpkg", "apk"] }
        - { field: name, op: matches, value: '^(php[0-9.]*-(cli|cgi|fpm|apache2)|libapache2-mod-php[0-9.]*|php[0-9]+)$' }
    exclude:
      - { field: source, op: equals, value: "php-defaults" }
      - { field: version, op: matches, value: '^8\.2\.[0-9]+-[0-9]+([~+]deb12u[0-9]+)?(\+b[0-9]+)?$' }
      - { field: version, op: matches, value: '^8\.4\.[0-9]+-[0-9]+([~+]deb13u[0-9]+)?(\+b[0-9]+)?$' }
      - { field: version, op: matches, value: '^5\.5\.9\+dfsg-1ubuntu4(\.[0-9]+)?(\+esm[0-9]+)?$' }
      - { field: version, op: matches, value: '^7\.0\.33-0ubuntu0\.16\.04(\.[0-9]+)?(\+esm[0-9]+)?$' }
      - { field: version, op: matches, value: '^7\.2\.24-0ubuntu0\.18\.04(\.[0-9]+)?(\+esm[0-9]+)?$' }
      - { field: version, op: matches, value: '^7\.4\.3-4ubuntu2(\.[0-9]+)?(\+esm[0-9]+)?$' }
      - { field: version, op: matches, value: '^8\.1\.2-1ubuntu2(\.[0-9]+)?$' }
      - { field: version, op: matches, value: '^8\.3\.6-0ubuntu0\.24\.04(\.[0-9]+)?$' }
      - { field: version, op: matches, value: '^8\.5\.4-0ubuntu1(\.[0-9]+)?$' }
      - { field: version, op: matches, value: '^8\.5\.9-0ubuntu2(\.[0-9]+)?$' }

  # ── 1b. RPM 패키지 — 줄마다 공급사 → 계열 → 판 ──────────────────────────
  #
  # 계열 정규식은 공급사 기준의 범위 그대로다 — RHEL 8 은 모듈 빌드(`module+el8.10.0+…`)가 스트림을,
  # RHEL 9 · Oracle Linux 9 은 `el9_8` 이 마이너 판을 못박는다(이전 마이너의 빌드 · 모듈 스트림은 줄
  # 밖이다). 이름은 런타임 패키지 전부다 — 같은 빌드의 하위 패키지는 판이 같다. 판은 rpm 이 적는
  # 그대로(epoch 0 은 적지 않는다)라 정규식이 `0:` 를 받기도 하고 안 받기도 한다.
  - id: rhel8_74_vuln
    subject: package
    where:
      all:
        - { field: vendor, op: equals, value: "Red Hat, Inc." }
        - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }
        - { field: version, op: matches, value: '^(?:0:)?7\.4\.[0-9]+-[0-9]+\.module\+el8\.10\.0\+[0-9]+\+[0-9a-f]{8}$' }
        - { field: version, op: rpm_version_lt, value: "0:7.4.33-8.module+el8.10.0+25117+30337cca" }
  - id: rhel8_82_vuln
    subject: package
    where:
      all:
        - { field: vendor, op: equals, value: "Red Hat, Inc." }
        - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }
        - { field: version, op: matches, value: '^(?:0:)?8\.2\.[0-9]+-[0-9]+\.module\+el8\.10\.0\+[0-9]+\+[0-9a-f]{8}$' }
        - { field: version, op: rpm_version_lt, value: "0:8.2.35-1.module+el8.10.0+25110+f67151d2" }
  - id: rhel9_vuln
    subject: package
    where:
      all:
        - { field: vendor, op: equals, value: "Red Hat, Inc." }
        - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }
        - { field: version, op: matches, value: '^(?:0:)?8\.0\.[0-9]+-[0-9]+\.el9_8(?:\.[0-9]+)?$' }
        - { field: version, op: rpm_version_lt, value: "0:8.0.30-8.el9_8.1" }
  # RHEL 7.9 — 공지가 **CVE-2026-109619 만** 고친다. 고친 판 미만은 둘 다 열려 있어 취약이고, 그 이상은
  # 109618 을 가릴 근거가 없어 확인 필요다(아래 `rhel7_partial`).
  - id: rhel7_vuln
    subject: package
    where:
      all:
        - { field: vendor, op: equals, value: "Red Hat, Inc." }
        - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }
