  # ── 3. RPM 의 자리에 놓인 PHP — 패키지가 깔지 않았다면 확인 필요 ───────────
  #
  # **정규 파일만 본다**(`sha256` 이 있다). Debian 계열의 `/usr/bin/php` · `/usr/bin/php-cgi` 는
  # 대안(alternatives) 링크라 해시가 없고, 실행 파일은 판이 붙은 이름(`php8.2` · `php-fpm8.2`)이라
  # 이 자리에 오지 않는다 — 그쪽은 위 패키지 줄이 본다. RPM 의 PHP 패키지가 있으면 그 파일은 그
  # 패키지의 것으로 보고(`verdict` 의 `not rpm_php`) 판정은 위 RPM 줄이 한다.
  - id: bin_rpm
    subject: file
    where:
      all:
        - { field: path, op: matches, value: '^/usr/(bin/php(-cgi)?|sbin/php-fpm|lib64/httpd/modules/libphp[0-9]?\.so)$' }
        - { field: sha256, op: exists }

  # ── 선언한 자리 밖에서 실행 중인 PHP (0.2.0) ──────────────────────────────────
  #
  # `exclude` 의 정규식이 위 `scan_roots` 의 실행 파일 자리다(`/usr/local/php` · `/opt/php` 아래는 0.4.0). 바뀐 뒤
  # 다시 시작하지 않은 프로세스의 실행 파일에는 ` (deleted)` 가 붙어 이 이름 꼴에 맞지 않는다 — 그것은 아래
  # `stale_php` 가 본다.
  - id: running_php
    subject: process
    where:
      - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
    exclude:
      - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }

  # 서비스로 등록된 선언 밖의 PHP (0.5.0) — systemd 유닛의 `ExecStart` 첫 낱말이다. 돌고 있지 않아도
  # 유닛 파일이 남는다(목표 결정 28). 셸로 감싼 `ExecStart=/bin/sh -c …` 는 그 셸이 첫 낱말이라 보지 못한다.
  # 0.6.0 부터 SysV · OpenRC · Upstart 의 시작 스크립트가 띄우는 실행 파일도 같은 레코드로 온다(코어 1.10.0).
  - id: service_php
    subject: service
    where:
      - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
    exclude:
      - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }

  # Apache 설정이 싣는 선언 밖의 PHP 모듈 (0.6.0) — Apache 가 멈춰 있어도 설정의 `LoadModule` 줄이 남는다(Windows
  # 룰 0.3.0 의 같은 이름 규칙과 같은 식). 선언한 자리는 위 파일 자리와 **배포판 패키지가 모듈을 두는 자리**
  # (`/usr/lib(64)/apache2*` · `httpd*` — SUSE 는 `/usr/lib64/apache2/mod_php8.so`)다 — 그 PHP 는 패키지 규칙이
  # 판정한다. 직접 빌드 · XAMPP 의 `modules/` 는 그 Apache 아래(`/usr/local/apache2/modules` · `/opt/lampp/modules`)라
  # 선언한 자리가 아니다.
  - id: apache_php
    subject: text_config
    where:
      - { field: path, op: matches, value: '^/(etc/apache2|usr/local/apache2/conf|opt/lampp/etc)/' }
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s' }
    exclude:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s+"?(/usr/lib(64)?/(apache2|httpd)[^/]*/|/usr/local/lib/|/(usr/local|opt)/php/)' }
  # RPM 계열은 `ServerRoot`(`/etc/httpd`) 기준의 `modules/` 로 적는다 — `/etc/httpd/modules` 는 배포판 모듈 자리로 가는
  # 링크다.
  - id: apache_php_rpm
    subject: text_config
    where:
      - { field: path, op: matches, value: '^/etc/httpd/' }
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s' }
    exclude:
      - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s+"?(/usr/lib(64)?/(apache2|httpd)[^/]*/|/usr/local/lib/|/(usr/local|opt)/php/|modules/)' }

  # ── 고친 뒤 다시 시작하지 않은 PHP (0.4.0) ────────────────────────────────────
  #
  # 커널은 지워진 파일을 실은 프로세스의 실행 파일 · 실린 모듈 경로 끝에 ` (deleted)` 를 붙인다. 패키지를 올리면
  # 옛 파일이 지워지고 새 파일이 같은 이름에 들어서므로, 그 꼬리가 붙은 PHP 는 **고치기 전 코드를 실은 채** 돈다 —
  # 디스크의 파일로 서는 판정(패키지 버전 · 해시)이 그 프로세스를 말하지 않는다(사내 runtime-scanner 의 *삭제된
  # 실행 파일이 계속 실행 중입니다*). 자리는 가리지 않는다. 실린 모듈은 목록을 JSON 글자로 견주므로 꼬리 뒤의
  # `"` 가 그 항목의 끝이다(아파치에 실린 `libphp*.so`). Windows 는 실행 중인 파일을 지울 수 없어 이 신호가 없다.
  - id: stale_php
    subject: process
    where:
      any:
        - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]* \(deleted\)$' }
        - { field: modules, op: matches, value: '/libphp[0-9.]*\.so \(deleted\)"' }

  # ── 패키지가 깐 실행 파일이 그 기록과 다르다 (0.3.0) ──────────────────────────
  #
  # 패키지 버전으로 판정하는 줄은 그 패키지가 깐 실행 파일이 **패키지 기록(dpkg `.md5sums` · RPM 파일 다이제스트)과
  # 같을 때만** 믿는다 — 바꾼 파일은 패키지 DB 의 버전이 말하지 않는다(실측: Oracle Linux 8 에서 패키지가 깐
  # `/usr/bin/php` 를 바꿔도 0.2.0 은 0). 다르거나 · 기록이 없거나 · 끝까지 못 읽었으면 패키지 버전으로 판정하지
  # 않고 확인 필요로 낸다 — 사내 runtime-scanner 의 `packageFileProblem` 과 같은 규칙(목표 결정 24). 공식 빌드
  # 해시로 서는 판정(`official_vuln`)은 패키지 밖의 파일이라 그대로다.
  #
  # **PHP 실행 파일 자리만 본다** — 선언한 자리(`/usr/bin` · `/usr/sbin` …)에는 다른 패키지의 파일도 있고, 그 가운데
  # 해시 상한을 넘는 것(`dockerd` 등)은 늘 `unreadable` 이다. 그것으로 PHP 판정을 막으면 PHP 와 상관없는 파일
  # 하나가 모든 기계를 확인 필요로 만든다. 자리: Debian 계열 `php8.2` · `php-cgi8.2` · `php-fpm8.2` · Apache 모듈
  # `libphp8.2.so`, RPM 계열 `php` · `php-cgi` · `php-fpm` · httpd 모듈 `libphp*.so`. 하나라도 기록과 다르면 이 기계의
  # 패키지 판정을 모두 세우지 않는다 — 판정 묶음이 하나다.
  - id: pkg_bin_changed
    subject: file
    where:
      - { field: path, op: matches, value: '^/usr/(bin/php(-cgi)?[0-9.]*|sbin/php-fpm[0-9.]*|lib/apache2/modules/libphp[0-9.]*\.so|lib64/httpd/modules/libphp[0-9]?\.so)$' }
      - { field: package, op: matches, value: '.' }
      - { field: package_match, op: in, value: [different, unrecorded, unreadable] }

verdict:
  require: "((deb12_vuln or deb13_vuln or u1404_vuln or u1604_vuln or u1804_vuln or u2004_vuln or u2204_vuln or u2404_vuln or u2604_vuln or u2610_vuln or rhel8_74_vuln or rhel8_82_vuln or rhel9_vuln or rhel7_vuln or ol8_74_vuln or ol9_vuln or sles157_vuln) and not pkg_bin_changed) or official_vuln"
  unconfirmed:
    - when: "pkg_unknown or rpm_rh_unknown or rpm_ol_unknown or rpm_suse_unknown or rpm_other"
      why:
        ko: "공급사의 고친 버전 기준이 없는 PHP 패키지입니다(다른 저장소이거나 기준에 없는 배포판 · 계열) — 그 공급사에 두 CVE 의 패치 여부를 확인하십시오"
        en: "a PHP package with no vendor fix baseline (another repository, or an uncovered distribution or line) - confirm with that vendor whether both CVEs are patched"
    - when: "rhel7_partial"
      why:
        ko: "RHEL 7 의 공급사 공지(RHSA-2026:88693)는 CVE-2026-109619 만 고칩니다 — CVE-2026-109618 의 패치 여부를 공급사에 확인하십시오"
        en: "the RHEL 7 vendor advisory (RHSA-2026:88693) fixes only CVE-2026-109619 - confirm the CVE-2026-109618 status with the vendor"
    - when: "bin_unmanaged"
      why:
        ko: "패키지 밖의 PHP(공식 이미지 · 직접 빌드)가 공식 빌드의 해시와 맞지 않아 패치 여부를 가리지 못했습니다 — 버전과 받은 곳을 확인하고, 쓰는 계열의 고친 버전(8.2 는 8.2.35 · 8.3 은 8.3.36 · 8.4 는 8.4.27 · 8.5 는 8.5.12, 8.1 이하는 고친 버전 없음) 이상인지 보십시오"
        en: "a PHP outside any package (official image or own build) does not match an official build hash, so its patch status cannot be told - check its version and origin, and whether it is at or above the fixed release of its line (8.2.35 for 8.2, 8.3.36 for 8.3, 8.4.27 for 8.4, 8.5.12 for 8.5; 8.1 and older have no fix)"
    - when: "bin_rpm and not rpm_php"
      why:
        ko: "RPM 계열의 자리에 패키지가 깔지 않은 PHP 가 있습니다(RPM 의 PHP 패키지가 없습니다) — 버전과 받은 곳을 확인하십시오"
        en: "a PHP that no RPM package installed sits in an RPM system location (no RPM PHP package is present) - check its version and origin"
    - when: "running_php"
      why:
        ko: "이 점검이 보는 자리 밖에서 PHP 가 실행 중입니다(위 경로) — 그 PHP 는 판정하지 않았습니다. 그 PHP 의 버전과 받은 곳(패키지 · 공급사 · 직접 빌드)을 확인하십시오"
        en: "a PHP is running outside the places this check reads (path above) - that PHP was not judged; check its version and origin (package, vendor or own build)"
    # 서비스와 Apache 설정은 멈춰 있어도 남는 자리라 같은 PHP 가 함께 설 수 있다 — 한 칸으로 둔다(Windows 룰과 같은 꼴).
    - when: "service_php or apache_php or apache_php_rpm"
      why:
        ko: "이 점검이 보는 자리 밖의 PHP 를 서비스가 띄우거나 Apache 설정이 싣습니다(위 서비스 · 설정 줄의 경로) — 그 PHP 는 판정하지 않았습니다. 그 PHP 의 버전과 받은 곳(패키지 · 공급사 · 직접 빌드)을 확인하십시오"
        en: "a service starts, or the Apache configuration loads, a PHP outside the places this check reads (the path in the service or configuration line above) - that PHP was not judged; check its version and origin (package, vendor or own build)"
    - when: "pkg_bin_changed"
      why:
        ko: "패키지가 깐 PHP 실행 파일이 패키지 기록과 같은지 확인되지 않습니다(위 경로) — 내용이 다르거나 기록이 없어 그 패키지의 버전으로 판정하지 않았습니다. 누가 그 파일을 바꿨는지 확인하고, 패키지를 다시 설치한 뒤 다시 검사하십시오"
        en: "a PHP executable installed by a package cannot be confirmed to match the package record (path above) - its content differs or there is no record, so it was not judged by the package version; check who changed it, reinstall the package and scan again"
    - when: "stale_php"
      why:
        ko: "고친 뒤 다시 시작하지 않은 PHP 가 실행 중입니다(위 경로) — 그 프로세스가 지워진 옛 PHP 파일(실행 파일 · 모듈)을 실은 채 돌고 있어 디스크의 버전으로 판정하지 않았습니다. 그 PHP 를 쓰는 서비스(PHP-FPM · 웹 서버)를 다시 시작한 뒤 다시 검사하십시오"
        en: "a PHP that was not restarted after an update is running (path above) - the process still runs a deleted old PHP file (executable or module), so it was not judged by the version on disk; restart the service using that PHP (PHP-FPM, web server) and scan again"
