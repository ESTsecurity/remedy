[package]
name = "remedy-collect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
remedy-sdk = { path = "../remedy-sdk" }
remedy-artifacts = { path = "../remedy-artifacts" }
remedy-platform = { path = "../remedy-platform" }
# RPM 패키지 DB 판독기 (`package.rs` 가 쓴다). 이 크레이트의 모듈이었는데, 동반 모듈 `remedy-net` 도 이미지 안의
# DB 를 같은 판독기로 읽어야 하고 그쪽은 `remedy-platform` 을 링크하지 못해(설계-04 §1) 의존 없는 크레이트로 뺐다.
remedy-rpmdb = { path = "../remedy-rpmdb" }
sha2.workspace = true
# 인증서 지문. **보안 속성이 아니라 식별자다** — 루트 Cargo.toml 의 주석 참조.
sha1.workspace = true
# 패키지 파일 대조(`owner.rs`) — dpkg 의 `.md5sums` 와 옛 RPM 의 MD5 다이제스트가 그 값이다. 출처 인증이 아니라
# 기록과 파일이 같은지만 본다. 동반 모듈의 이미지 점검과 같은 크레이트 · 판이라 의존이 늘지 않는다.
md-5.workspace = true
quick-xml.workspace = true
serde_json.workspace = true
base64.workspace = true
# 2층 신뢰 서명 검증 (설계-03 §3). 저장소에서 unsafe 를 쓰는 두 크레이트 중
# 하나이고, 그 이유는 그쪽 문서에 있다.
remedy-wintrust = { path = "../remedy-wintrust" }
# 실행 파일의 버전 리소스를 읽는다 (C-1b). 버전 리소스는 `.rsrc` 안의
# 자기완결 구조라 OS 에 묻지 않아도 되고, 그래서 이 크레이트는 `forbid(unsafe_code)`
# 를 유지한다 — 서명과 달리 안전한 코드가 **맞는** 답을 낸다(`peversion` 문서).
# yara-x 가 이미 끌어오는 크레이트라 새 의존이 늘지 않는다.
object.workspace = true
# 아카이브(jar · war · ear) 안의 deflate 항목을 푼다(`archive.rs` · 코어 1.11.0). zip 해석은 직접 하고 풀기만
# 맡긴다. yara-x · 동반 모듈이 이미 같은 판을 쓰므로 새 의존이 늘지 않는다.
flate2.workspace = true

[dev-dependencies]
serde_yaml_ng.workspace = true
