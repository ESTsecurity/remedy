[package]
name = "remedy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# 동반 모듈 — 네트워크가 필요한 점검(url · image · container)을 본체 밖의 바이너리에 둔다. 본체(`remedy`)는
# 이 크레이트를 **링크하지 않는다** — 네트워크 점검 룰을 고르면 서명을 확인한 이 실행 파일을 띄워 맡기고
# 종료 코드만 받는다(2026-11-10). 그 선과, 이 크레이트가 파괴 경로를 링크하지 않는다는 것은 설계-04 §1 의
# 금지 표를 `cargo xtask arch` 가 지킨다.
#
# 라이브러리 쪽(`src/lib.rs`)은 실행 파일과 `xtask`(결과 JSON 스키마 생성)가 함께 쓴다.
[[bin]]
name = "remedy-net"
path = "src/main.rs"

[dependencies]
remedy-sdk = { path = "../remedy-sdk" }
# 제품 이름의 한 자리(`brand`). 문자열만 만드는 크레이트라(`remedy-sdk` 말고 내부 의존이 없다) 파괴
# 경로도 통신도 들이지 않는다. 점검 결과 줄을 본체의 점검 룰과 같은 문장으로 낼 때도 이것을 쓴다.
remedy-report = { path = "../remedy-report" }
# RPM 패키지 DB 판독기 — 이미지 · 컨테이너에서 꺼낸 DB 를 `read_untrusted` 로 읽는다. std 뿐인 잎 크레이트라
# OS 에도 통신에도 닿지 않는다(설계-04 §1 의 `remedy-rpmdb ↛ remedy-platform`).
remedy-rpmdb = { path = "../remedy-rpmdb" }
# 판정 기준의 서명 확인 — 데이터 룰 `remedy-net-criteria` 를 본체가 룰 폴더를 확인하는 것과 같은 사슬로 본다
# (코어 1.12.0 · `src/criteria.rs`). 검증만 하는 크레이트다(`minisign-verify`) — 서명 능력은 들이지 않는다.
remedy-trust = { path = "../remedy-trust" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
regex.workspace = true
# 줄 입력 중의 Ctrl+C — 받지 않으면 OS 가 프로세스를 끝내 결과 파일이 남지 않는다.
ctrlc.workspace = true
# 통신 — 고른 까닭은 워크스페이스 `Cargo.toml` 의 "동반 모듈 remedy-net 의 통신" 절.
rustls.workspace = true
httparse.workspace = true
rustls-native-certs.workspace = true
webpki-roots.workspace = true
# 이미지 점검 — 레이어의 압축(gzip · zstd)과 실행 파일의 MD5 대조. 고른 까닭은 워크스페이스 `Cargo.toml` 의
# "동반 모듈 remedy-net 의 이미지 점검" 절. 이미지 안의 RPM DB 는 위의 `remedy-rpmdb` 가 읽는다.
flate2.workspace = true
ruzstd.workspace = true
md-5.workspace = true

# 사용자 로케일(언어 판단의 Windows 갈래). 본체는 `remedy-platform` 으로 읽지만 동반 모듈은 그
# 크레이트를 링크하지 않는다(금지 줄) — 같은 값을 같은 자리에서 읽기만 한다. 새 의존이 아니다.
[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[dev-dependencies]
rcgen.workspace = true
socket2.workspace = true
# 이미지 시험의 tar 픽스처 — 판독은 이 크레이트가 직접 한다(워크스페이스 `Cargo.toml` 의 그 줄).
tar.workspace = true
# 시험의 기준 폴더를 일회용 키로 서명한다 — 시험 빌드에만 링크된다(제품은 서명 능력이 없다 · 루트
# `Cargo.toml` 의 `minisign` 주석).
minisign = { workspace = true }
