# 파괴 동작을 다루는 코드다. 인지 복잡도를 낮게 유지한다 (순환복잡도 10).
cognitive-complexity-threshold = 15
too-many-arguments-threshold = 6

# `std::env::args()` 는 UTF-8 이 아닌 인자(건너뛴 argv[0] 까지)에서 패닉하고, 배포 빌드는 `panic = "abort"` 라
# 그대로 죽는다(리눅스 1.22.0 실측 SIGABRT · 134). 제품은 `remedy_sdk::cmdline::utf8_args()` 나 `args_os()` 를
# 쓴다. 사람이 인자를 주는 개발 도구(xtask · 진단 예제)는 크레이트 머리에서 허용한다.
disallowed-methods = [
    { path = "std::env::args", reason = "UTF-8 이 아닌 인자에서 패닉한다 — remedy_sdk::cmdline::utf8_args() 나 std::env::args_os() 를 쓴다" },
]
