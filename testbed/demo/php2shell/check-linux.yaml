# PHP2Shell 점검 — 리눅스 (CVE-2026-109618 · CVE-2026-109619)
#
# **고치지 않는다.** 이 결함의 원인은 OOM 상황의 요청 데이터 미초기화이고 그것을
# 메우는 것은 공급사의 일이다(설계-00 §3). 그리고 **설정으로 완화할 수도 없다** —
# 기능 하나를 끄면 막히는 종류가 아니다. 그래서 점검의 답은 **판 하나**다.
#
# # 수정 판 번호는 자리 표시다
#
# 공급사 공지 값이 아직 오지 않았다. 아래 `value` 는 **시연용 자리 표시**이고,
# 그 사실을 `name` 이 화면 첫 줄에 적는다 — 지어낸 숫자를 참인 것처럼 내보내지
# 않는다. 번호가 오면 고치는 자리는 **룰 한 줄**이다.
#
# # 왜 한 룰 안에 셋을 함께 적는가
#
# `source` · `upstream_version` · `version` 을 **같은 레코드**에서 봐야 한다.
# 둘로 나누어 `verdict` 에서 `and` 로 묶으면 **다른 설치본의 사실로** 판정이 설
# 수 있다(`24-check-plugins.md` §한 기계에 여럿). 그리고 `where` 에는 부정이
# 없으므로(부정은 `verdict` 에만) *"고쳐진 것을 뺀다" 가 아니라 "낮은 것을
# 고른다"* 로 적는다.
#
# # 계열을 먼저 못박는 이유
#
# 배포판 판 문자열은 **계열 안에서만** 견줄 뜻이 있다. ubuntu 의
# `8.1.2-1ubuntu2.28` 과 debian 의 `8.2.28-1~deb12u1` 을 견주면 기계적으로 답은
# 나오지만 그 답에 뜻이 없다. 그래서 `upstream_version` 으로 계열을 고정한 뒤
# 개정을 견준다.
schema_version: 1
id: demo-php2shell-check-linux
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]

# 점검 전용이다. 이 한 줄이 둘을 준다 — 선언한 자리가 전부 없으면 *확인 필요* 가
# 아니라 **해당 없음**(종료 0), 그리고 화면이 *위협* 이 아니라 **취약**이라고 말한다.
kind: check

name:
  ko: "PHP2Shell 점검 — 배포판이 고친 판보다 낮다 (수정 판 번호는 시연용 자리 표시)"
  en: "PHP2Shell check - below the distro's fixed build (fixed version is a demo placeholder)"

references:
  - "CVE-2026-109618"
  - "CVE-2026-109619"

# 패키지 DB 는 자리가 정해져 있어 `scan_roots` 를 보지 않는다. 그래도 상한을
# 적는 것은 규율이다 — 점검도 읽기 권한의 상한을 선언한다.
scan_roots:
  - "/etc/php"

subjects: [package]

detect:
  # ── ubuntu 22.04 계열 (상류 8.1.2) ────────────────────────────────
  #
  # **이 기계가 그 계열인지부터 본다.** 그다음 개정을 견준다 — `pkg_version_lt`
  # 는 dpkg 의 규칙으로 꼬리까지 본다(데비안 정책 §5.6.12).
  #
  # 실측(2026-10-27 · ubuntu:22.04 + apt): `php8.1-cli` = `8.1.2-1ubuntu2.28`,
  # `source` = `php8.1`, `upstream_version` = `8.1.2`. 상류만 보면 이 기계도
  # 취약으로 걸린다 — **이미 고쳤는데도** 그렇다. 그것이 이 룰이 있는 이유다.
  - id: ubuntu2204_below_fix
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php8.1" }
        - { field: upstream_version, op: equals, value: "8.1.2" }
        # 자리 표시 — 공지 값이 오면 이 한 줄을 고친다.
        - { field: version, op: pkg_version_lt, value: "8.1.2-1ubuntu2.99" }

  # ── debian 12 계열 (상류 8.2.x) ───────────────────────────────────
  #
  # 계열이 다르면 개정 모양도 다르다(`-1~deb12uN`). 같은 룰에 넣지 않는 이유는
  # 위 주석의 "계열 안에서만 견줄 뜻이 있다" 그대로다.
  - id: debian12_below_fix
    subject: package
    where:
      all:
        - { field: source, op: equals, value: "php8.2" }
        - { field: upstream_version, op: equals, value: "8.2.28" }
        - { field: version, op: pkg_version_lt, value: "8.2.28-1~deb12u99" }

  # ── 배포판이 아닌 PHP (직접 빌드·공식 이미지) ────────────────────
  #
  # 개정이 없으면 배포판이 손댄 것이 아니므로 **상류 판만으로 판정이 선다.**
  # `revision` 이 빈 문자열인 것이 그 표시다.
  - id: upstream_below_fix
    subject: package
    where:
      all:
        - { field: source, op: matches, value: '^php[0-9.]*$' }
        - { field: revision, op: equals, value: "" }
        - { field: upstream_version, op: version_lt, value: "8.2.99" }

# 셋 중 하나라도 서면 취약하다. **`or` 뿐인 판정이 아니다** — 각 룰이 제 안에서
# 계열과 판을 함께 못박았으므로 근거가 하나인 것과 다르다.
verdict:
  require: "ubuntu2204_below_fix or debian12_below_fix or upstream_below_fix"
