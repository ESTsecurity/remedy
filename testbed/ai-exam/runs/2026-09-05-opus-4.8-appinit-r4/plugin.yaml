# AppInit_DLLs 원격 임플란트 탐지·치료 규칙 (remedy 전용백신 플러그인)
#
# 검체는 Windows 의 AppInit_DLLs 기구로 자기 DLL 을 UI 를 쓰는 거의 모든
# 프로세스에 로드시키고, 원격 접속 실행 파일과 인바운드 방화벽 규칙을 두며,
# 정상 관리 에이전트의 설정 파일에 로더 항목 하나를 끼워 넣는다.
# (기법: MITRE ATT&CK T1546.010 — AppInit DLLs)
#
# 오탐을 부르지 않기 위한 핵심:
#  · 주입 값이 사는 레지스트리 키에는 원래 있던 값 17개가 함께 산다.
#    키가 아니라 **값 두 개**(AppInit_DLLs·LoadAppInit_DLLs)만 지운다.
#  · 에이전트 설정 파일은 정상 제품의 것이다. 파일이 아니라 **끼워 넣은
#    항목 하나**(modules.remote)만 지운다.
#  · 방화벽에는 정상 규칙이 섞여 있다. 우리 페이로드를 가리키는 인바운드
#    허용 규칙 하나만 되돌린다.
#  · 페이로드 폴더 이름은 검체마다 다를 수 있으므로 리터럴로 적지 않고
#    주입 값에서 파생한다.

schema_version: 1
id: appinit-dll-remote-implant
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "AppInit_DLLs 원격 임플란트 제거"
  en: "AppInit_DLLs remote implant removal"

# ── 읽기 권한 상한 ─────────────────────────────────────────────────────
# registry_value 는 scan_roots 에 레지스트리 키를 적어야 모인다. 값 수집은
# 재귀하지 않으므로 이 키의 직속 값만 읽는다 — AppInit 두 값은 이 키의 직속
# 값이라 끝의 `\*` 는 필요 없다(하위 키가 아니다).
#
# 페이로드 폴더는 주입 값에서 파생되며 이름이 검체마다 다를 수 있으므로,
# 그 값이 놓일 수 있는 %PROGRAMDATA% 를 파일 상한으로 둔다. 이 상한이 곧
# 오탐 방어선이다 — AppInit 이 System32 등을 가리키면 파생 폴더가 이 상한
# 밖이라 그 그룹 전체가 제외된다(서명 단계에서 이 넓이의 사유를 적는다).
scan_roots:
  - "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Windows"
  - "%PROGRAMDATA%"

# structured_config 를 %PROGRAMDATA% 전체에 펴면 JSON 잎이 상한(50,000)에
# 걸려 관측 불완전(종료 코드 6)이 된다. 대상 에이전트 폴더로만 좁힌다.
# (좁히는 것은 수집 비용을 줄일 뿐 삭제 상한은 여전히 scan_roots 다.)
subject_roots:
  structured_config: ["%PROGRAMDATA%\\Acme\\Agent"]

subjects: [registry_value, file, firewall_rule, structured_config]

detect:
  # ── 주입 (레지스트리) ────────────────────────────────────────────────
  # AppInit_DLLs — 검체가 채운 DLL 경로. 정상 기계에서는 비어 있다.
  # 값이 어디를 가리키는가로 페이로드 폴더를 파생한다.
  - id: appinit
    subject: registry_value
    where:
      all:
        - { field: hive, op: equals, value: "HKLM" }
        - { field: key,  op: equals, value: "SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Windows" }
        - { field: name, op: equals, value: "AppInit_DLLs" }
        # 비어 있지 않고 DLL 을 가리킨다 — 정상 기계의 빈 값은 걸리지 않는다.
        - { field: data, op: matches, value: '(?i)\.dll' }
    capture:
      dll: "data | first_path"       # 주입된 DLL 의 전체 경로
      dir: "${dll} | dirname"        # 그 DLL 이 있는 폴더 (= 페이로드 폴더)
      key_norm: "key | lower"        # 같은 키의 다른 값을 같은 증거 그룹으로 묶기 위한 키 경로

  # LoadAppInit_DLLs — 검체가 켠 스위치(1). 정상 기계에서는 0.
  # 위 AppInit 값과 **같은 키**임을 확인해 하나의 주입으로 함께 묶는다.
  # (경로만 지우고 이 스위치를 남기면 값만 다시 써도 곧바로 실행된다.)
  - id: loadflag
    subject: registry_value
    where:
      all:
        - { field: hive, op: equals, value: "HKLM" }
        - { field: key,  op: equals, value: "${appinit.key_norm}" }
        - { field: name, op: equals, value: "LoadAppInit_DLLs" }
        - { field: data, op: equals, value: "1" }

  # ── 페이로드 (파일) ──────────────────────────────────────────────────
  # 주입 값이 가리킨 폴더 **안에서만** 찾는다. 그 폴더가 상한 밖이면 이
  # 그룹은 경고가 아니라 제외된다(파생 경로 안전장치).
  - id: payload-dll
    subject: file
    from: "${appinit.dir}"
    where:
      - { field: path, op: ends_with, value: ".dll" }

  # 같은 폴더의 원격 접속 실행 파일.
  - id: payload-exe
    subject: file
    from: "${appinit.dir}"
    where:
      - { field: path, op: ends_with, value: ".exe" }

  # ── 열어 둔 인바운드 (방화벽) ────────────────────────────────────────
  # 우리 페이로드 폴더의 실행 파일을 허용하는 인바운드 규칙만 짚는다.
  # Windows 자신의 규칙(System32)과 에이전트의 나가는(Out) 규칙은 걸리지 않는다.
  - id: fw
    subject: firewall_rule
    where:
      all:
        - { field: direction,   op: equals,   value: "In" }
        - { field: action,      op: equals,   value: "Allow" }
        - { field: application, op: contains, value: "${appinit.dir}" }

  # ── 정상 에이전트 설정에 끼워 넣은 항목 (구조적 설정) ────────────────
  # modules.remote 가 우리 페이로드 폴더의 DLL 을 가리키는 경우만.
  # 정상 항목(inventory·endpoint·intervalSeconds)은 짚지 않는다 — 값이
  # 어디를 가리키는가가 정상과 악성을 가른다.
  - id: config
    subject: structured_config
    where:
      all:
        - { field: path,     op: ends_with, value: "\\agent-config.json" }
        - { field: key_path, op: equals,    value: "modules.remote" }
        - { field: value,    op: contains,  value: "${appinit.dir}" }

# ── 판정 ───────────────────────────────────────────────────────────────
# 되살리는 지속성(AppInit 주입)이 반드시 있어야 하고, 그것이 실재하는
# 페이로드나 설정 주입 중 **하나**로 확증돼야 한다. 두 근거가 서로 다른
# 대상(레지스트리 / 파일·설정)에서 오므로 독립적이다. 바이너리만 이미
# 지워진 기계에서도 (payload-dll 대신 config 로) 판정이 서서 남은 주입을
# 치료한다.
verdict:
  require: "appinit and (payload-dll or config)"

# ── 치료 ───────────────────────────────────────────────────────────────
# 순서는 적지 않는다 — 코어가 유발자(레지스트리 값)를 산출물보다 먼저 놓는다.
# 전부 되돌릴 수 있고 격리 컨테이너에 담긴다.
remediate:
  remove:
    - { ref: appinit }        # registry.delete_value — 주입 값만 삭제 (같은 키의 다른 17개 값은 그대로)
    - { ref: loadflag }       # registry.delete_value — 스위치만 삭제
    - { ref: payload-dll }    # file.quarantine_only
    - { ref: payload-exe }    # file.quarantine_only
    - { ref: config }         # structured_config.remove_key — 끼워 넣은 항목 하나만 제거 (파일·다른 항목은 보존)
  restore:
    - firewall                # firewall.restore_rule — 검체가 연 인바운드 규칙만 되돌린다
  verify:
    after_reboot: true        # 재부팅 뒤 재판정 — 놓친 지속성이 있으면 재발로 보고되어 사람이 본다

# 손으로 support-bundle 을 올리는 사람에게 남기는 힌트 (자동 제출은 없다).
submit_hint:
  samples: [payload-dll, payload-exe]
  confidentiality_min: 1
