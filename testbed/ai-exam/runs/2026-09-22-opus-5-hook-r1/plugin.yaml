# ─────────────────────────────────────────────────────────────────────────
# hook-implant — BuildKit 훅 폴더에 끼어든 스크립트 하나
#
# 관측(감염 Windows 10):
#   `%PROGRAMDATA%\BuildKit\hooks` 에 `.js` 셋이 있고 **자리·이름꼴·크기·시각이
#   서로를 가르지 못한다**(같은 시각, 39 바이트 안). 셋 가운데 하나에만 분석가가
#   검체에서 뽑은 표지 문자열 셋이 함께 들어 있다. 로그온 항목 열여덟 중 둘이 이
#   폴더를 부르는데 **앞의 하나는 벤더 제품이 설치한 정상 항목**이다.
#
#   그래서 가르는 자리는 **파일 안뿐**이다. 이 매니페스트는 폴더의 `.js` 셋을
#   **본문을 담을 범위**로만 쓰고, **치울 대상은 YARA 가 짚은 하나**로 좁힌다.
#   둘을 같은 규칙으로 쓰면 정상 훅 둘이 함께 사라진다.
#
# 이 플러그인이 하지 못하는 것 — 없는 것을 지어내지 않고 여기 적는다:
#   **파일이 이미 지워지고 로그온 항목만 남은 기계는 잡지 못한다.**
#   `autorun.command` 는 `wscript.exe "…\telemetry.js"` 가 한 문자열이고
#   `args` 필드가 없다. capture 함수에 **두 번째 경로를 집는 것이 없어**
#   (`first_path` 는 `wscript.exe` 를 집는다) `autorun` 을 부모로 세울 수 없다
#   — `20-detect-recipes.md` §경로가 아닌 것을 부모에 묶는 법의 그 한계다.
#   항목 **이름**으로 가르는 것은 답이 아니다. 벤더 제품의 정상 항목이 같은
#   폴더를 같은 이름꼴로 부른다.
# ─────────────────────────────────────────────────────────────────────────

schema_version: 1
id: buildkit-hook-implant
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "BuildKit 훅 폴더 스크립트 임플란트 제거"
  en: "BuildKit hook folder script implant removal"

# 권한 상한. 관측된 훅 폴더 **하나만** 연다.
#   - 폴더 이름이 감염마다 바뀌지 않으므로 증거에서 파생할 것이 없다.
#     안 바뀌는 것은 `scan_roots` 가 정한다.
#   - 분석가의 룰을 전역에 풀지 않는 것도 이 상한이 맡는다
#     (`20-detect-recipes.md` §룰을 전역에 풀지 않는다). 여기서는 부모가 가리킬
#     디렉터리가 따로 없으므로 `from` 이 아니라 상한이 그 자리를 막는다.
#   - **로그온 항목 자리는 적지 않는다.** `autorun` 은 이 상한과 무관하게
#     수집되고, `HKCU\…\Run` 을 적어도 아무 효과가 없다(`10-manifest.md` 의 표).
scan_roots:
  - "%PROGRAMDATA%\\BuildKit\\hooks"

subjects: [file, autorun]

detect:
  # ── 범위 규칙 ─────────────────────────────────────────────────────────
  # 폴더의 스크립트 **셋을 전부** 가리킨다. 본문을 담기 위한 것이고
  # **치료 대상이 아니다** — 이것을 `remediate` 에 넣으면 정상 훅 둘이 함께
  # 사라진다. 경로만 보므로 본문 없이 1차 평가에서 서고, 그래서
  # `collect_extra` 가 이것을 가리킬 수 있다(`30-antipatterns.md` 1번의 순환).
  - id: hook-script
    subject: file
    where:
      - { field: path, op: ends_with, value: ".js" }

  # ── 근거 1 — 파일 안 ──────────────────────────────────────────────────
  # 분석가가 검체에서 도출한 룰. 표지 셋이 한 파일에 모여 있는지만 본다.
  # 위협 설명만으로는 다시 만들 수 없는 것이라 **그 파일을 고치지 않고** 부른다.
  #
  # `.js` 조건을 **다시** 건다. 본문이 담기는 범위와 YARA 가 도는 범위가 같아야
  # 폴더의 다른 파일이 "안 맞았다" 가 아니라 **"재지 못했다"**(관측 불완전,
  # 종료 코드 6)가 되지 않는다.
  - id: implant
    subject: file
    where:
      all:
        - { field: path, op: ends_with, value: ".js" }
        - { yara: "rules/hook-implant.yar:hook_implant_marks" }
    capture:
      # 로그온 항목을 **이 파일 하나**에 묶기 위한 값.
      # 값이 경로 하나이므로 `first_path` 는 그 경로를 그대로 낸다.
      script: "path | first_path"

  # ── 근거 2 — 그것을 부르는 로그온 항목 ────────────────────────────────
  # `autorun` 에는 `path` 필드가 없어 `from` 이 통하지 않는다. `where` 값에
  # `${…}` 를 넣어 부모 그룹에 묶는다.
  #
  # **로그온 항목의 유무로 가르지 않는다.** 둘이 걸려 있고 하나는 정상이다.
  # 가르는 것은 그 항목이 **무엇을 부르는가** 이고, 보간이 그 하나만 가리킨다.
  # 리터럴 경로 조각(`\BuildKit\hooks\`)으로 적으면 정상 항목까지 붙는다.
  - id: launcher
    subject: autorun
    where:
      - { field: command, op: contains, value: "${implant.script}" }

# 파일 안의 표지와, 그 파일을 부르는 로그온 항목. **서로 다른 대상에서 온**
# 독립적인 두 근거의 논리곱이다. 점수 임계값 문법은 없다.
verdict:
  require: "implant and launcher"

# YARA 는 본문이 있어야 돈다. **경로로 매치되는** `hook-script` 를 가리킨다 —
# `implant` 자신을 가리키면 순환이라 실기기에서 판정이 영영 서지 않는다.
# 셋의 본문이 담겨야 어느 것이 검체인지 판정할 수 있다.
collect_extra:
  - { ref: hook-script, content: true }

remediate:
  remove:
    # 로그온 항목이 **유발자**다. 파일만 치우면 공격자가 같은 자리에 다시
    # 떨어뜨렸을 때 그대로 다시 돈다. **차례는 적지 않는다** — 계획기가
    # 유발자를 산출물보다 먼저 놓는다.
    - { ref: launcher }     # autorun.remove — 벤더 항목과 정상 열여섯은 안 걸린다
    - { ref: implant }      # file.quarantine_only — 되돌릴 수 있다
    #
    # 여기 **없는** 것 둘, 그리고 그 이유:
    #   `hook-script`          — 정상 훅 둘이 거기 걸린다. 범위 규칙이지 대상이 아니다.
    #   `dir.delete_recursive` — 이 폴더는 벤더 빌드 도구의 것이다. 폴더 전체가
    #                            검체의 것이라는 관측 근거가 없고, 통째로 지우면
    #                            빌드 도구가 깨진다.
  verify:
    # 로그온마다 도는 위협이다. 재부팅 뒤 같은 플러그인이 다시 판정하는지 본다 —
    # 다시 서면 우리가 놓친 지속성 경로가 있다는 신호다.
    after_reboot: true

submit_hint:
  samples: [implant]
  # 스냅샷에 사내 빌드 도구의 훅 스크립트 본문이 함께 담긴다(사내 저장소 주소
  # 등이 들어 있을 수 있다). 기본값 0(공개)으로 다루지 않는다.
  confidentiality_min: 1
