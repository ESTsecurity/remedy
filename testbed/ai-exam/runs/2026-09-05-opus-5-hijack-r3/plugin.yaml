schema_version: 1
id: webboost-search-hijack
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "WebBoost 검색 가로채기 광고 임플란트 제거"
  en: "WebBoost search-hijacking ad implant removal"

# ── 권한 상한 ────────────────────────────────────────────────────────────
# 성능 설정이 아니라 읽기·삭제 권한의 상한이다. 좁을수록 좋다.
scan_roots:
  # 페이로드 폴더. 폴더 이름이 감염마다 바뀌지 않으므로 상한이 정한다
  # (20-detect-recipes.md §자주 막히는 곳 — "안 바뀌는 것은 scan_roots 가
  # 이미 정한다"). 재귀 삭제를 쓰지 않으므로 조건 5(대상이 상한 자체)에
  # 걸리지 않는다.
  - "%PROGRAMDATA%\\WebBoost"

  # browser_extension 은 scan_roots 가 범위를 정한다 (10-manifest.md 의 표).
  #
  # 확장 폴더까지만 내려간다. `User Data` 를 통째로 잡으면 쿠키·기록·로그인
  # 정보가 읽기 상한에 들어온다 (10-manifest.md §이름을 미리 알 수 없는
  # 경로 조각). 관측이 "두 브라우저의 **기본 프로필**" 이라고 못박았으므로
  # Default 하나로 충분하다.
  #
  # %ALLUSERPROFILES% 를 쓰는 이유: 브라우저 확장은 사용자 프로필마다
  # 설치되는 것이라, %LOCALAPPDATA%(현재 사용자 하나)로 잡으면 다중 사용자
  # 기계에서 나머지 사용자가 감염된 채 남는다. 그만큼 삭제가 닿는 범위가
  # 넓어지므로 이 이유를 여기 적는다 (10-manifest.md §지정 확장 토큰).
  - "%ALLUSERPROFILES%\\AppData\\Local\\Google\\Chrome\\User Data\\Default\\Extensions"
  - "%ALLUSERPROFILES%\\AppData\\Local\\Microsoft\\Edge\\User Data\\Default\\Extensions"

  # registry_value 도 이 상한을 받는다. 레지스트리 루트를 하나도 적지 않으면
  # 이 subject 는 언제나 0건이고, 그 위에서 도는 룰은 아무것도 맞히지 못한 채
  # 초록이 된다 (10-manifest.md · 32-lint-errors.md).
  #
  # 값 수집은 재귀하지 않아 적은 키의 **직속 값**만 읽는다. BootExecute 는
  # Session Manager 직속이고 Path 는 그 아래 Environment 직속이므로 둘을
  # 각각 적는다. 끝의 `\*` 는 하위 키 이름을 모를 때 쓰는 것이라 여기서는
  # 필요 없다 — 두 키 이름을 다 안다.
  - "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager"
  - "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Environment"

# proxy_config · process 는 scan_roots 와 무관하게 수집된다 (10-manifest.md 의
# 표). 그래서 그쪽 경로는 여기 적지 않는다 — 적어도 얻는 것 없이 상한만 넓어진다.

subjects: [file, browser_extension, registry_value, proxy_config, process]

detect:
  # ── 페이로드 ───────────────────────────────────────────────────────────
  # 상한이 이미 검체 폴더 하나이므로 파일 이름만 본다. 두 파일 다 잡아야
  # 한쪽이 이미 지워진 기계에서도 폴더 경로가 풀린다.
  - id: payload
    subject: file
    where:
      any:
        - { field: path, op: ends_with, value: "\\wbsvc.exe" }
        - { field: path, op: ends_with, value: "\\wbboot.exe" }
    capture:
      # 제거·편집 대상이 될 경로는 리터럴로 적을 수 없다. 증거에서 뽑는다.
      dir: "path | dirname"
    score: 80

  # 부팅 목록에서 **뺄 문자열**을 증거에서 뽑기 위한 규칙. `edit` 의 value 는
  # 증거에서 파생돼야 하고(22-remediate-recipes.md §edit), 여러 값을
  # 줄바꿈으로 이어 붙인 data 에서 한 줄만 집어내는 capture 함수는 카탈로그에
  # 없다. 그래서 그 이름을 파일 증거의 basename 에서 가져온다.
  - id: bootbin
    subject: file
    from: "${payload.dir}"
    where:
      - { field: path, op: ends_with, value: "\\wbboot.exe" }
    capture:
      entry: "path | basename"

  # ── 브라우저 확장 ──────────────────────────────────────────────────────
  # **브라우저·프로필 이름으로 고르지 않는다.** 같은 자리에 정상 확장이 함께
  # 살고, 청정 기계에도 그중 하나가 두 브라우저에 같이 설치돼 있다. 확장
  # 식별자 하나가 두 브라우저의 그 확장만 정확히 짚는다 — 증거도 둘이 되고
  # 제거도 둘로 나간다.
  #
  # name·version 은 조건에 넣지 않는다. 관측된 값이지만 판이 3.2.1 로만 바뀌어도
  # 룰이 오류 없이 조용히 안 맞는다 (30-antipatterns.md 10번).
  - id: ext
    subject: browser_extension
    where:
      - { field: ext_id, op: equals, value: "pknbjlbmgcodmfilnjadgpkcnkmlpkkn" }
    score: 90

  # ── 실행 경로 앞자리 ───────────────────────────────────────────────────
  # registry_value 에는 path 필드가 없어 from 이 통하지 않는다. where 값 보간으로
  # 부모에 묶는다 (20-detect-recipes.md §경로가 아닌 것을 부모에 묶는 법).
  # 확인된 페이로드 폴더를 실제로 가리킬 때만 걸린다 — 목록에 항목이 많다는
  # 사실만으로는 아무 기계도 매치하지 않는다.
  - id: pathhijack
    subject: registry_value
    where:
      all:
        - { field: hive, op: equals,   value: "HKLM" }
        - { field: key,  op: equals,   value: "SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Environment" }
        - { field: name, op: equals,   value: "Path" }
        - { field: data, op: contains, value: "${payload.dir}" }

  # ── 부팅 목록 ──────────────────────────────────────────────────────────
  # **이것이 나머지를 되살리는 지속성이다.** 그래서 파일 증거에 묶지 않는다 —
  # 다른 백신이 바이너리만 잡아간 기계에서도 판정이 서야 하고, 그 기계를
  # 놓치면 다음 부팅에 전부 돌아온다 (40-review-checklist.md 2번).
  #
  # REG_MULTI_SZ 의 여러 값은 data 에 줄바꿈으로 이어 붙어 온다
  # (machine/subjects.json §registry_value.type). 그래서 contains 로 본다.
  - id: bootexec
    subject: registry_value
    where:
      all:
        - { field: hive, op: equals,   value: "HKLM" }
        - { field: key,  op: equals,   value: "SYSTEM\\CurrentControlSet\\Control\\Session Manager" }
        - { field: name, op: equals,   value: "BootExecute" }
        - { field: data, op: contains, value: "wbboot.exe" }
    score: 90

  # ── 프록시 ─────────────────────────────────────────────────────────────
  # 자리가 아니라 **무엇을 가리키는지**로 가른다. 프록시 설정 자체는 정상
  # 기계에도 있고, 개발 기계에는 로컬 프록시가 실제로 떠 있다.
  # restore: [proxy] 가 되돌릴 증거를 잡는 규칙이기도 하다 —
  # 이 규칙이 없으면 Action 이 아예 만들어지지 않는다.
  - id: proxy
    subject: proxy_config
    where:
      all:
        - { field: scope,  op: equals,   value: "user" }
        - { field: server, op: contains, value: "127.0.0.1:8899" }

  # ── 상주 프로세스 ──────────────────────────────────────────────────────
  # 경로 제약 없는 프로세스 매칭은 거부된다 (30-antipatterns.md 8번).
  # 확인된 페이로드 폴더에서 도는 것만 짚는다. 판정에는 쓰지 않는다 —
  # 상주 프로세스가 파일을 물고 있으면 격리가 실패하기 때문에 둔다.
  - id: proc
    subject: process
    where:
      - { field: image_path, op: starts_with, value: "${payload.dir}" }

# ── 판정 ─────────────────────────────────────────────────────────────────
# 서로 다른 subject 에서 온 독립 근거 셋 — 확장 식별자(browser_extension) ·
# 떨어진 실행 파일(file) · 부팅 목록 항목(registry_value) — 중 **둘**이 서야
# 한다. 점수 임계값 문법은 없다.
#
# 왜 "a and b" 하나가 아닌가: 두 번째 근거를 하나로 못박으면 그 근거가 이미
# 사라진 기계에서 판정이 서지 않는다 (31-nonexistent.md §판정 문법 ·
# 40-review-checklist.md 2번). 셋 중 어느 하나가 먼저 지워진 기계도 치료된다.
verdict:
  require: "(ext and payload) or (ext and bootexec) or (payload and bootexec)"

# ── 제거 ─────────────────────────────────────────────────────────────────
# 순서를 적지 않는다. 유발자·종료·백업·삭제의 차례는 코어가 정한다.
remediate:
  remove:
    # browser_ext.remove — 증거가 짚은 확장만. 두 브라우저에 하나씩 있으므로
    # 증거도 둘이고 제거도 둘이다. 정상 확장 넷은 증거가 아니라 손대지 않는다.
    - { ref: ext }

    # file.quarantine_only — 두 실행 파일. 격리는 삭제가 아니라 옮기는 것이라
    # 오탐이어도 `remedy restore --run <id>` 로 되돌아온다.
    - { ref: payload }

    # process.kill — 확인된 폴더에서 도는 것만.
    - { ref: proc }

  # 통째로 지우면 기계를 못 쓰게 되는 값 둘. 검체가 덧붙인 부분만 뺀다.
  edit:
    # env.strip_path — 끼어든 항목 **하나만**. 나머지 다섯은 이 기계가 원래
    # 갖고 있던 것이고, 목록을 비우면 명령 하나도 찾지 못한다.
    - { ref: pathhijack, op: strip, value: "${payload.dir}" }

    # registry.strip_value — 덧붙은 줄 **하나만**. 짚는 문자열이 증거에서
    # 나온 `wbboot.exe` 하나이므로 `autocheck autochk *`(Windows 자신의 것)와
    # `bootalyac.exe`(설치된 보안 제품의 것)는 대상이 되지 않는다.
    - { ref: bootexec, op: strip, value: "${bootbin.entry}" }

  # proxy.restore — proxy_config 증거를 되돌린다. **룰이 짚은 것만** 되돌리므로
  # 사용자가 넣은 예외 목록(bypass)은 그대로 남는다. 통째로 비우는 것은
  # 원복이 아니라 파괴다 (22-remediate-recipes.md §원복은 파괴가 아니다).
  restore:
    - proxy

  # wbboot.exe 가 부팅 때 나머지를 되살린다. 경로 확인이 아니라 재판정이다 —
  # 같은 플러그인이 다시 판정하면 우리가 놓친 지속성 경로가 있다는 뜻이다.
  verify:
    after_reboot: true

submit_hint:
  samples: [payload]
  # 확장 경로에 사용자 계정명이 들어간다.
  confidentiality_min: 1

# signed_malware 는 두지 않는다. 서명 주체를 모르는 채 예외를 여는 것보다,
# 서명된 대상을 만나 삭제가 막히고 그 사실이 deferred 로 보고되는 쪽이 옳은
# 실패 방향이다 (22-remediate-recipes.md §신뢰 서명).
