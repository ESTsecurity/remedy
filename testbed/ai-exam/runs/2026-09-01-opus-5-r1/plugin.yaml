# ProgramData 아래 폴더에 자리잡은 서비스 + Winlogon Userinit 이어붙이기 로더
#
# 관측된 지속성이 둘이다. 하나만 처리하면 나머지가 되살린다.
#   1) 자동 시작 서비스 → image_path 가 %ProgramData%\<랜덤폴더>\<exe>
#   2) HKLM\…\Winlogon\Userinit 끝에 그 exe 가 덧붙음
# 폴더 이름의 꼬리는 감염마다 바뀐다. 고정된 것은 **자리** 뿐이므로
# 서비스 이름·표시 이름·폴더 이름을 리터럴로 적지 않는다.

schema_version: 1
id: programdata-service-userinit-loader
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "ProgramData 서비스 + Userinit 로더 제거"
  en: "ProgramData service + Userinit loader removal"

# 읽기 권한 상한. registry_value·service·process 는 path 가 없어 이 검사를
# 거치지 않는다 — 여기 적은 것은 **파일 규칙**의 상한이다.
#
# 폴더 이름이 감염마다 바뀌므로 %ProgramData% 보다 좁게 적을 수 없다.
# 더 좁히면 페이로드가 수집되지 않아 룰이 통째로 죽고, 그쪽은 아무도
# 경고하지 않는다 (40-review-checklist.md §5). 넓다는 린트 경고가 나오면
# 이 이유를 서명 단계에서 설명한다.
scan_roots:
  - "%ProgramData%"

subjects: [service, registry_value, file, process]

detect:
  # ── 부모 ──────────────────────────────────────────────
  # 서비스 하나마다 독립된 그룹이 생긴다. 아래 자식들은 자기 그룹의
  # capture 로만 풀리므로 다른 감염·다른 벤더 서비스와 섞이지 않는다.
  - id: svc
    subject: service
    where:
      # 정규식은 작은따옴표로 적는다 — YAML 이 역슬래시를 그대로 넘긴다.
      #
      # `\ProgramData\<폴더 최소 하나>\<파일>.exe` 형태만 매치한다.
      # 폴더 한 겹을 조건에 넣는 이유: 넣지 않으면 dirname 이
      # %ProgramData% 자체(= scan_roots 상한)로 풀려 재귀 삭제가 실행
      # 직전에 멈춘다 (22-remediate-recipes.md §조건 5).
      - { field: image_path, op: matches,
          value: '(?i)\\ProgramData\\[^"]+\\[^\\"]+\.exe("|\s|$)' }
    capture:
      # 리터럴로 적을 수 없는 것은 증거에서 뽑는다.
      exe: "image_path | first_path"
      dir: "${exe} | dirname"

  # ── 로그온 경로 ────────────────────────────────────────
  # hive·key·name 을 전부 equals 로 못박아야 린트가 restore_default
  # 카탈로그에 있는 대상인지 확인할 수 있다 (22-remediate-recipes.md).
  # data 조건이 이 값을 **이 감염**에 묶는다 — 정상 기계의 Userinit 은
  # `…\userinit.exe,` 로 끝나므로 매치되지 않는다.
  - id: userinit
    subject: registry_value
    where:
      all:
        - { field: hive, op: equals, value: "HKLM" }
        - { field: key,  op: equals,
            value: "SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon" }
        - { field: name, op: equals, value: "Userinit" }
        - { field: data, op: contains, value: "${svc.exe}" }

  # ── 페이로드 ──────────────────────────────────────────
  # 서비스가 가리키는 파일이 실제로 있어야 한다. 등록만 남고 파일이 없는
  # 잔해로 삭제를 열지 않는다.
  - id: payload
    subject: file
    from: "${svc.dir}"
    where:
      - { field: path, op: equals, value: "${svc.exe}" }

  # 같은 폴더의 나머지(관측된 cache.db 등). **판정에는 쓰지 않는다.**
  # 폴더 전체가 검체가 만든 것이므로 함께 격리해 둔다 — 재귀 삭제가
  # 가드에 걸려 보류되어도 남지 않는다 (22-remediate-recipes.md).
  - id: companion
    subject: file
    from: "${svc.dir}"
    where:
      - { field: path, op: not_equals, value: "${svc.exe}" }

  # 실행 중인 페이로드. 판정 근거가 아니다 — 서비스 레코드와 같은 사실이다.
  # 제거 대상으로만 둔다.
  - id: payload-process
    subject: process
    where:
      - { field: image_path, op: equals, value: "${svc.exe}" }

# 서로 독립적인 세 근거의 논리곱 — 서비스 등록 · 다른 레지스트리 값 · 디스크의 파일.
# 서비스 하나만으로 판정하면 ProgramData 를 쓰는 정상 벤더 서비스가 곧바로
# 오탐이 된다. 그 둘을 가르는 것은 **로그온 값이 같은 exe 를 가리키는가**다.
verdict:
  require: "svc and userinit and payload"

remediate:
  # 차례를 적지 않는다. 유발자(서비스)를 산출물보다 먼저 놓는 것도,
  # 서비스의 복구설정 해제 → 중지 → 비활성화 → 삭제 차례도 코어가 정한다.
  remove:
    - { ref: svc }
    - { ref: payload-process }
    - { ref: payload }
    - { ref: companion }
    # 폴더 전체가 검체가 만든 것이라는 관측이 있어 재귀 삭제를 연다.
    # guard 는 그 폴더 **안에서** 악성 판정된 증거를 가리킨다.
    # 위의 파일 ref 들과 대체가 아니라 겹침이다 — 이것이 보류되어도
    # 페이로드는 격리된다.
    - { path: "${svc.dir}", recursive: true, guard: payload }

  restore:
    # Userinit 을 **지우면 로그인이 안 된다.** 삭제가 아니라 원복이다.
    # 대상이 restore_default 카탈로그에 있다 → `C:\Windows\system32\userinit.exe,`
    - { ref: userinit, to: default }

  # 지속성이 둘이라 하나가 남으면 재감염된다. 경로 확인이 아니라
  # 같은 플러그인의 **재판정**이므로 다른 랜덤 이름으로 돌아와도 잡힌다.
  verify:
    after_reboot: true

submit_hint:
  samples: [payload, companion]
  confidentiality_min: 1
