# ============================================================================
# EvilAI (Locust / meadowlocust) — Windows
#
# 정상 서명된 node.exe 를 빌려 쓰는 위협(LOLBin)이다. 실행 파일 자체는 위협이
# 아니므로 지우지 않는다. 지우면 정상 개발 환경이 깨진다. 정상과 악성을 가르는
# 것은 "무엇을 실행하는가"다:
#   · 예약 작업이 \Microsoft\Windows\ 아래 숨어 있고
#   · 그 인자가 사용자 AppData\Local\Programs\<랜덤폴더>\<랜덤>.js 를 가리키며
#   · 그 .js 본문이 분석가 YARA 룰(evilai_locust_js)에 걸린다
#
# 판정은 독립적인 두 근거의 논리곱이다:
#   task    = 예약 작업(지속성)          ← 근거 1
#   payload = .js 본문(파일 내용/YARA)   ← 근거 2  (다른 대상에서 온다)
#
# 폴더 이름·스크립트 이름은 감염마다 바뀐다. 리터럴로 적지 않고 증거에서 뽑는다.
# 분석가 경고에 따라 YARA 는 전역이 아니라 악성 증거가 가리킨 폴더 안에서만
# 돈다(from: ${task.dir}).
# ============================================================================

schema_version: 1
id: evilai-locust
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "EvilAI (Locust) 제거"
  en: "EvilAI (Locust) removal"

references:
  - "VirusTotal engines:meadowlocust"

# 읽기 권한 상한. 파생 경로(${task.dir})가 놓일 수 있는 범위만 담는다.
# persistence·autorun·process·av_exclusion 은 path 가 없어 이 상한을 거치지
# 않으므로 여기 적지 않는다(적어도 효과 없음). 상한에 걸리는 건 payload .js 뿐.
#
# %ALLUSERPROFILES% 를 쓰는 이유: 이 위협은 사용자별 위치(AppData\Local·HKCU)
# 에 설치된다. %LOCALAPPDATA% 로 좁히면 다중 사용자 기계에서 스캔한 사용자만
# 치료되고 나머지는 감염된 채 남는다(단일 사용자면 %LOCALAPPDATA% 와 동일하게
# 전개된다). 각 프로필의 Programs 하위로만 한정해 범위를 넓히지 않으면서 전
# 사용자를 덮는다.
scan_roots:
  - "%ALLUSERPROFILES%\\AppData\\Local\\Programs"

subjects: [persistence, file, autorun, process, av_exclusion]

detect:
  # ── 근거 1 · 부모 ─────────────────────────────────────────────────────
  # 예약 작업. \Microsoft\Windows\ 조건이 정상 Node 개발용 예약 작업과 가른다
  # (정상 도구의 업데이트 작업은 자기 벤더 폴더에 등록되지 OS 트리에 숨지 않는다).
  # 정규식은 작은따옴표로 적어 역슬래시를 그대로 전달한다.
  # args 정규식은 Programs\<폴더>\<파일>.js 처럼 폴더를 한 겹 요구한다 — 그래야
  # dirname 이 상한(...\Programs) 자체로 풀려 정상 프로그램 폴더를 겨누는 일이 없다.
  - id: task
    subject: persistence
    where:
      all:
        - { field: win.task.register_path, op: starts_with, value: '\Microsoft\Windows\' }
        - { field: command,                op: matches,     value: '(?i)\\node\.exe$' }
        - { field: args,                   op: matches,     value: '(?i)\\AppData\\Local\\Programs\\[^"]+\\[^\\"]+\.js("|\s|$)' }
    capture:
      # 폴더 이름이 감염마다 바뀌므로 증거에서 뽑는다. 선언 순서에 기대지 않는다.
      script: "args | first_path"
      dir: "${script} | dirname"

  # ── 본문 수집용(경로로 매치, 본문 없이 선다) ─────────────────────────
  # collect_extra 의 ref 는 본문 없이 매치되는 규칙을 가리켜야 한다(순환 방지).
  - id: payload-file
    subject: file
    from: "${task.dir}"
    where:
      - { field: path, op: ends_with, value: ".js" }

  # ── 근거 2 · 자식(파일 본문/YARA) ────────────────────────────────────
  # 본문이 담기는 범위(.js)와 같은 범위로 YARA 를 건다 — 아니면 폴더의 다른
  # 파일이 "미평가"가 되어 관측 불완전(종료 코드 6)으로 빠진다.
  - id: payload
    subject: file
    from: "${task.dir}"
    where:
      - { field: path, op: ends_with, value: ".js" }
      - { yara: "rules/evilai.yar:evilai_locust_js" }

  # ── 자동 실행(HKCU\...\Run) — 이 폴더를 가리키는 것만 ────────────────
  # 둘 중 하나만 지우면 나머지가 살리므로 함께 잡는다. from 이 안 통하는
  # subject 라 where 값 보간으로 같은 감염 그룹에 묶는다(리터럴 경로 조각으로
  # 대신하면 다른 인스턴스 항목까지 붙는다).
  - id: runkey
    subject: autorun
    where:
      - { field: command, op: contains, value: "${task.dir}" }

  # ── 실행 중 프로세스 — 이 페이로드를 물고 있는 node.exe 만 ────────────
  # 스냅샷에 있을 수도 없을 수도 있다. 있으면 잡혀 종료되고(코어가 파일 삭제보다
  # 먼저 처리), 없으면 0건이라 Action 이 안 생긴다. 둘 다 처리된다. 신뢰할 만큼
  # 항상 있지는 않으므로 판정에는 쓰지 않는다.
  - id: proc
    subject: process
    where:
      all:
        - { field: image_path, op: matches,  value: '(?i)\\node\.exe$' }
        - { field: args,       op: contains, value: "${task.dir}" }

  # ── Defender 경로 예외 — 이 폴더가 등록된 것만 ───────────────────────
  # restore: av_exclusions 가 되돌릴 증거. 이 규칙이 없으면 되돌릴 것이 안 잡히고
  # Action 이 아예 만들어지지 않는다(계획은 초록인데 예외는 남는다).
  - id: av-exclusion
    subject: av_exclusion
    where:
      - { field: value, op: contains, value: "${task.dir}" }

# 독립적인 두 근거의 논리곱. 예약 작업만으로는(근거 하나) 지우지 않는다.
verdict:
  require: "task and payload"

# YARA 가 훑을 본문을 스냅샷에 담는다. 경로로 매치되는 payload-file 을 가리킨다
# (payload 자신을 가리키면 순환이라 본문이 영영 안 담긴다).
collect_extra:
  - { ref: payload-file, content: true }

remediate:
  # 순서는 적지 않는다 — 프로세스 종료·비활성화·백업·삭제의 차례는 코어가 정한다.
  # 유발자(예약 작업·Run 값)는 산출물(.js)보다 먼저 처리되어 재생성을 끊는다.
  remove:
    - { ref: task }                                              # persistence.disable + persistence.delete
    - { ref: runkey }                                            # autorun.remove
    - { ref: proc }                                              # process.kill (있을 때만)
    - { ref: payload }                                           # file.quarantine_only (악성 .js — 재귀 삭제 보류 대비 겹침)
    - { path: "${task.dir}", recursive: true, guard: payload }   # dir.delete_recursive (검체가 만든 폴더 통째)
  restore:
    - av_exclusions                                              # av.restore_exclusions (Defender 경로 예외 원복 — 우리 폴더만)
  verify:
    after_reboot: true                                           # 이중 지속성 — 재부팅 뒤 재판정으로 재발 확인

# 손으로 support-bundle 을 올리는 사람에게 남기는 말(자동 제출은 없다).
# 경로에 사용자 계정명이 들어가므로 기밀 하한을 대외비로 올린다.
submit_hint:
  samples: [payload]
  confidentiality_min: 1
