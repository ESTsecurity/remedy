schema_version: 1
id: linux-ssh-backdoor-reinstaller
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "SSH 원격 접속 백도어(cron 재설치형) 제거"
  en: "SSH remote-access backdoor (cron reinstaller) removal"

# 읽기·삭제 권한 상한. 검체가 자리잡은 세 곳만 연다 — 그 밖은 읽지도 지우지도 못한다.
#   /etc/ssh          : sshd 드롭인 조각과, 조각이 가리키는 숨김 열쇠 목록
#   /etc/cron.d       : 재설치를 거는 정기 작업 정의 파일
#                       (persistence 는 상한과 무관하게 수집되지만, 정의 파일을
#                        '파일째' 치우려면 file 규칙이 여기에 닿아야 한다)
#   /usr/local/sbin   : 페이로드
scan_roots:
  - "/etc/ssh"
  - "/etc/cron.d"
  - "/usr/local/sbin"

subjects: [persistence, text_config, file]

detect:
  # ── 근거 A-1 : sshd 조각이 열쇠 목록을 /etc/ssh 아래 '숨김' 경로로 지정한다 ──
  # 정상 강화 조각(10-hardening.conf)과 이름·자리·확장자가 같다. 가르는 것은 이 한 줄뿐:
  # AuthorizedKeysFile 이 /etc/ssh/.<숨김> 을 가리킨다. 정상 설정은 %h/.ssh 나
  # /etc/ssh/authorized_keys 를 쓰지 /etc/ssh 아래 숨김 폴더를 쓰지 않는다.
  # 공백 구분 sshd_config 의 key/value 파싱에 기대지 않도록 `line` 전체를 본다.
  - id: sshd-hook
    subject: text_config
    where:
      all:
        - { field: path, op: starts_with, value: "/etc/ssh/sshd_config.d/" }
        - { field: line, op: matches,     value: '(?i)^\s*authorizedkeysfile\s+/etc/ssh/\.' }
    capture:
      conf_dir:  "path | dirname"        # /etc/ssh/sshd_config.d
      conf_file: "path | first_path"     # /etc/ssh/sshd_config.d/99-maint.conf
      keyfile:   "line | first_path"     # /etc/ssh/.maint/keys
      keydir:    "${keyfile} | dirname"  # /etc/ssh/.maint

  # ── 근거 A-2 : 그 조각이 가리킨 열쇠 목록 파일이 실재한다 ──
  # 설정이 경로를 '선언' 한 것과 그 자리에 파일이 '있다' 는 것은 독립한 두 사실이다.
  - id: sshd-key
    subject: file
    from: "${sshd-hook.keydir}"
    where:
      - { field: path, op: equals, value: "${sshd-hook.keyfile}" }

  # ── 제거 전용 : sshd 조각 '파일 전체' ──
  # 조각 전체가 검체의 것이므로 줄만 빼면 나머지(PermitRootLogin yes 등)가 남아
  # 관리자 접속 허용이 유지된다. 줄 제거(text_config.remove_line)가 아니라
  # 파일째 치우려고 file 규칙을 따로 둔다. 경로가 sshd-hook 증거에서 나오므로
  # 정상 조각(10-hardening.conf)은 결코 이 대상이 되지 않는다.
  - id: sshd-conf-file
    subject: file
    from: "${sshd-hook.conf_dir}"
    where:
      - { field: path, op: equals, value: "${sshd-hook.conf_file}" }

  # ── 근거 B-1 : /etc/cron.d 의 정기 작업이 '숨김 페이로드' 를 부른다 ──
  # 정상 정기 작업(logrotate-custom)과 틀·주기·실행 계정(root)이 같다.
  # 가르는 것은 '무엇을 실행하는가' 뿐 — /usr/local/sbin 아래 점으로 시작하는
  # (숨김) 실행 파일. vendor-backup 은 숨김이 아니라 걸리지 않는다.
  - id: cron-hook
    subject: persistence
    where:
      all:
        - { field: source,  op: starts_with, value: "/etc/cron.d/" }
        - { field: command, op: matches,     value: '/usr/local/sbin/\.[^/ ]+' }
    capture:
      payload:     "command | first_path"  # /usr/local/sbin/.sshd-maint
      payload_dir: "${payload} | dirname"  # /usr/local/sbin
      cron_file:   "source | first_path"   # /etc/cron.d/ssh-maint
      cron_dir:    "source | dirname"      # /etc/cron.d

  # ── 근거 B-2 : 그 정기 작업이 부르는 페이로드가 실재한다 ──
  - id: cron-payload
    subject: file
    from: "${cron-hook.payload_dir}"
    where:
      - { field: path, op: equals, value: "${cron-hook.payload}" }

  # ── 제거 전용 : 정기 작업 정의 '파일 전체' ──
  # 정의 파일 하나가 통째로 검체의 것이라, 그 안의 줄만 지우면 빈 파일이 남는다.
  # cron 의 persistence 제거는 '줄만' 빼므로, 파일째 치우려고 file 로 닿는다.
  - id: cron-file
    subject: file
    from: "${cron-hook.cron_dir}"
    where:
      - { field: path, op: equals, value: "${cron-hook.cron_file}" }

# 두 갈래가 각각 '독립한 두 근거의 논리곱' 이다. and 로 묶어 한 근거의 오탐이
# 곧바로 삭제가 되지 않게 하고, 두 갈래를 or 로 이어 한쪽이 이미 지워진 기계
# (관리자가 조각만 지웠거나, 정기 작업만 지운 기계)에서도 남은 갈래가 스스로
# 서서 자기 몫을 치우게 한다 — 되살리는 지속성도, 접속을 여는 조각도 각각 판정에 든다.
verdict:
  require: "(sshd-hook and sshd-key) or (cron-hook and cron-payload)"

remediate:
  remove:
    # 재설치 고리 — 정의 파일 전체 + 페이로드
    - { ref: cron-file }
    - { ref: cron-payload }
    # 백도어 — sshd 조각 파일 전체 + 열쇠 목록
    - { ref: sshd-conf-file }
    - { ref: sshd-key }
  # 제거는 전부 격리(file.quarantine_only)로 가며 되돌릴 수 있다(restore).
  # 지속성이 있는 위협이므로 재부팅 뒤 같은 룰로 다시 판정되는지(재발) 확인한다.
  verify:
    after_reboot: true

# 손으로 올릴 때 볼 판단 근거. 자동 제출은 없다. 고객 PC 검체이므로 하한을 올려 둔다.
submit_hint:
  samples: [cron-payload, sshd-key]
  confidentiality_min: 1
