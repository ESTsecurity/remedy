schema_version: 1
id: ldso-searchpath-hijack
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "동적 링커 검색 경로 하이재킹 제거"
  en: "Remove dynamic-linker search-path hijack"

# 권한 상한(읽기). 여기 밖은 읽을 수도 지울 수도 없다.
# 쓰는 세 subject(text_config·file·shortcut)가 모두 path 를 가지므로 이 상한에 걸린다.
# 페이로드 폴더 이름은 감염마다 바뀌므로 상위 폴더까지만 좁힌다 — 삭제는 아래
# from 이 그 폴더 안으로 더 좁힌다.
scan_roots:
  - "/etc/ld.so.conf.d"        # 링커 설정 드롭인 — 덧붙은 줄이 있는 곳
  - "/usr/local/lib"           # 페이로드 폴더가 (랜덤 이름으로) 자리잡는 상위
  - "/usr/share/applications"  # 변조된 .desktop 항목

subjects: [text_config, file, shortcut]

detect:
  # ── 부모(유발자) ─────────────────────────────────────────────────────────
  # ld.so.conf.d 안의 한 줄이 검색 경로를 넓힌다. 청정 기계의 줄은 전부 보통
  # 경로이고(‘/usr/local/lib’, ‘/lib/x86_64-linux-gnu’ …), 검체가 덧붙인 줄만
  # ‘점으로 시작하는 성분’을 갖는다. 파일 자체는 배포판 것이므로 지우지 않는다.
  - id: hook
    subject: text_config
    where:
      all:
        - { field: path, op: starts_with, value: "/etc/ld.so.conf.d/" }
        # 경로 성분 하나가 ‘/.’ 로 시작한다(숨김 성분). 정상 라이브러리 경로에는
        # 없는 모양이다. 폴더 꼬리(-9d41)는 감염마다 바뀌므로 리터럴로 적지 않고
        # 이 모양만 본다. RE2 — 역참조·전방탐색 없음. 정규식은 작은따옴표로 적어
        # 역슬래시가 그대로 전달되게 한다.
        - { field: line, op: matches, value: '/\.[^/.]' }
    capture:
      # ld.so.conf 의 줄은 ‘파일’이 아니라 ‘디렉터리’다 — dirname 을 적용하지
      # 않는다. 이 줄이 곧 페이로드 폴더 경로다.
      dir: "line | first_path"

  # ── 자식: 판정의 두 번째 근거 ────────────────────────────────────────────
  # 그 폴더 안의 공유 라이브러리. 부모가 가리킨 디렉터리 안에서만 찾으므로,
  # /usr/local/lib 에 정상적으로 있는 libfoo.so.1 같은 파일에는 닿지 않는다.
  # 이름(libnsl_compat)까지 못박지 않는다 — 확인된 모양은 ‘.so 공유
  # 라이브러리’까지다(30-antipatterns §10). .so.2 처럼 버전 꼬리가 붙으므로
  # ends_with ".so" 로는 놓친다 → 정규식으로 잡는다.
  - id: payload
    subject: file
    from: "${hook.dir}"
    where:
      - { field: path, op: matches, value: '\.so(\.[0-9]+)*$' }

  # ── 자식: 제거 범위 ──────────────────────────────────────────────────────
  # 관측상 폴더 전체가 검체가 만든 것이고, 감염 전 사용자 파일이 섞인 경우는
  # 없었다. Linux 에는 dir.delete_recursive 가 없으므로(카탈로그: Linux ‘-’)
  # 폴더 통삭제 대신 그 안의 파일을 하나씩 격리한다. from 은 ‘어디’만 좁히고
  # ‘몇 개’는 좁히지 않으므로 린트가 경고한다 — 그 이유가 곧 ‘폴더 전체가
  # 검체의 것’이라는 관측이며, 서명 단계에서 남긴다
  # (22-remediate-recipes.md §재귀 삭제 — 파일 ref 함께 두기).
  - id: contents
    subject: file
    from: "${hook.dir}"
    where:
      - { field: path, op: exists }

  # ── 자식: 변조된 실행기 ──────────────────────────────────────────────────
  # .desktop 은 shortcut 이다. 실행 파일(target)은 정상이고 검체는 인자만
  # 덧붙였다. shortcut 은 /usr/share/applications 에 있어 from 으로는 페이로드
  # 폴더에 못 묶으므로, args 가 그 폴더를 가리키는 것만 값 보간으로 잡는다.
  # 인자가 %U 뿐인 정상 Viewer.desktop 은 걸리지 않는다.
  - id: launcher
    subject: shortcut
    where:
      - { field: args, op: contains, value: "${hook.dir}" }

# 독립적인 두 근거의 논리곱: 링커 설정 줄(설정)과 그 폴더의 공유 라이브러리
# (파일). 서로 다른 subject 에서 오므로 어느 하나의 오탐이 곧바로 삭제가 되지
# 않는다. .desktop 변조는 변종에서 없을 수도 있어 판정에 넣지 않고, 아래
# remediate 에서 있으면 고치고 없으면 무동작(companion 방식)으로 둔다.
verdict:
  require: "hook and payload"

remediate:
  remove:
    # 덧붙은 줄만 뺀다 → text_config.remove_line. 파일(libc.conf)은 남고 1·2번
    # 정상 줄도 남는다. 코어가 줄 번호가 아니라 내용까지 대조하고 지운다.
    - { ref: hook }
    # 덧붙은 인자만 뺀다 → shortcut 의 유일한 Op 인 shortcut.strip_args(위험
    # low·되돌림 가능). 항목 자체는 남으므로 응용이 메뉴에서 사라지지 않는다.
    - { ref: launcher }
    # 페이로드 폴더의 파일 전부 → file.quarantine_only(가장 덜 위험, 되돌림
    # 가능). .so 와 .seed 를 함께 격리한다. 오탐이면 remedy restore 로 되돌린다.
    - { ref: contents }

# 분석에 넘기면 유용한 검체 표시(자동 전송 기능은 제품에 없다). 대상은 시스템
# 경로(/usr/local/lib 등)라 개인정보가 실리지 않으므로 기밀 하한은 올리지 않는다.
submit_hint:
  samples: [payload]
