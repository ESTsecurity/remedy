schema_version: 1
id: ransom-cryptosvc-locker
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "CryptoSvc 랜섬웨어 제거"
  en: "CryptoSvc ransomware removal"

# ── 권한 상한 ──────────────────────────────────────────────
# 여기 밖은 읽을 수도 지울 수도 없다. 성능 설정이 아니다.
scan_roots:
  # 페이로드 폴더의 **이름**은 감염마다 바뀔 수 있으므로 리터럴로 적지 않는다.
  # 부모인 %PROGRAMDATA% 를 상한으로 두고 실제 폴더는 증거에서 뽑는다.
  - "%PROGRAMDATA%"

  # 협박문이 관측된 자리 둘. 사용자마다 떨어지는 산출물이므로
  # %ALLUSERPROFILES% 로 편다 — 현재 로그온 사용자만 치료하면 다른 사용자
  # 프로필의 협박문이 그대로 남는다 (10-manifest.md §지정 확장 토큰).
  # 프로필 루트가 아니라 **두 폴더까지 내려** 적는다. 프로필 루트를 상한으로
  # 두면 지울 수 있는 범위가 사용자 자료 전체로 넓어진다.
  - "%ALLUSERPROFILES%\\Documents"
  - "%ALLUSERPROFILES%\\Desktop"

  # registry_value 도 이 상한을 받는다. 적지 않으면 **언제나 0건**이고
  # 그 위에서 도는 룰은 아무것도 맞히지 못한 채 초록이 된다.
  # 값 수집은 재귀하지 않고 직속 값만 읽으므로 DisableTaskMgr 에는 끝의
  # `\*` 가 필요 없다(IFEO 처럼 하위 키에 들어 있는 값이 아니다).
  - "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System"

  # `HKCU\Control Panel\Desktop` 은 **일부러 적지 않는다.**
  # 바탕화면 값은 치료 범위 밖이므로 읽을 수 있는 범위에도 두지 않는다.

subjects: [autorun, file, registry_value]

detect:
  # ── 부모 ────────────────────────────────────────────────
  # 다시 돌게 하는 자리. 증거 하나마다 독립된 그룹이 생기므로, 정상 항목
  # 열여섯 중 하나가 이 조건에 걸려도 그 그룹은 아래 판정을 세우지 못한다.
  - id: autostart
    subject: autorun
    where:
      # ProgramData **하위 폴더** 안의 실행 파일을 로그온 때 띄운다.
      # 폴더 한 겹(`[^"]+\\`)을 조건에 넣어야 dirname 이 상한 자체
      # (%PROGRAMDATA%)가 되지 않는다 (22-remediate-recipes.md §조건 5).
      # 항목 이름(`CryptoSvc`)과 인자(`--resume`)는 조건에 넣지 않는다 —
      # 변종에서 바뀌면 오류 없이 조용히 안 맞는다 (30-antipatterns.md 10).
      - { field: command, op: matches, value: '(?i)\\ProgramData\\[^"]+\\[^\\"]+\.exe("|\s|$)' }
    capture:
      exe: "command | first_path"
      dir: "${exe} | dirname"

  # ── 자식: 그 항목이 가리키는 실행 파일 ────────────────────
  # 부모가 가리킨 폴더 **안에서만** 찾고, 그 안에서도 부모가 짚은 파일 하나다.
  - id: payload
    subject: file
    from: "${autostart.dir}"
    where:
      - { field: path, op: equals, value: "${autostart.exe}" }

  # ── 자식: 같은 폴더의 열쇠 파일 ──────────────────────────
  # 판정의 두 번째 근거이자 제거 대상. 그룹 안에 갇혀 있으므로
  # 다른 감염·다른 항목의 증거가 섞이지 않는다.
  - id: keyfile
    subject: file
    from: "${autostart.dir}"
    where:
      - { field: path, op: ends_with, value: "\\keys.bin" }

  # ── 협박문 ──────────────────────────────────────────────
  # 이름만으로 짚는다. 같은 폴더의 `*.locked` 와 `notes.txt` 는
  # 이 조건에 걸리지 않는다 — 자리나 시각이 아니라 **이름**이 가른다.
  - id: note
    subject: file
    where:
      - { field: path, op: ends_with, value: "\\HOW-TO-DECRYPT.txt" }

  # ── 작업 관리자 잠금 ────────────────────────────────────
  # **값 하나**를 짚는다. 자리(키)째 겨누면 같은 키에 있는 조직 설정
  # `HideFastUserSwitching` 이 함께 없어진다.
  # 검체가 **새로 만든** 값이므로 되돌림이 아니라 삭제다 — 청정 기계에
  # 없던 값이고, `restore_default` 카탈로그에도 없다.
  - id: taskmgr-lock
    subject: registry_value
    where:
      all:
        - { field: hive, op: equals, value: "HKCU" }
        - { field: key,  op: equals, value: "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System" }
        - { field: name, op: equals, value: "DisableTaskMgr" }

# ── 판정 ──────────────────────────────────────────────────
# 독립적인 두 근거의 논리곱이고, **둘 다 같은 그룹 안에서 풀린다.**
#   - 협박문(`note`)을 or 가지로 넣지 않는다: 그 규칙은 부모에 묶을 수
#     없어(협박문은 페이로드 폴더 밖에 있다) 모든 그룹에 함께 붙고,
#     그러면 ProgramData 를 쓰는 **정상 자동실행 항목의 그룹까지** 판정이
#     서서 그 항목과 그 실행 파일이 지워진다.
#   - `payload` 도 or 가지가 될 수 없다. "자동실행이 가리키는 파일이
#     실재한다" 는 청정 기계의 모든 정상 항목이 만족한다.
verdict:
  require: "autostart and keyfile"

# ── 제거 ──────────────────────────────────────────────────
# 순서를 적지 않는다. 유발자(autorun.remove · registry.delete_value)를
# 산출물보다 먼저 놓는 것은 계획기가 한다.
remediate:
  remove:
    - { ref: autostart }     # autorun.remove — 남으면 재부팅 뒤 다시 돈다
    - { ref: taskmgr-lock }  # registry.delete_value — 값 하나만
    - { ref: payload }       # file.quarantine_only — 되돌릴 수 있다
    - { ref: keyfile }       # file.quarantine_only
    - { ref: note }          # file.quarantine_only — 사용자에게 보이는 산출물
  # 재귀 삭제(`dir.delete_recursive`)를 쓰지 않는다. 그 폴더 전체가 검체가
  # 만든 것이라는 **관측 근거가 없다** (22-remediate-recipes.md §재귀 삭제).
  # 암호화된 사용자 문서·정상 문서·정상 프로그램은 어느 규칙에도 걸리지 않는다.
  # 바탕화면 값은 remove 에도 restore 에도 넣지 않는다 — 비우는 것은
  # 되돌리는 것이 아니라 또 한 번 덮어쓰는 것이다.
  verify:
    after_reboot: true

submit_hint:
  samples: [payload, keyfile]
  confidentiality_min: 1     # 경로에 사용자 계정명이 들어간다
