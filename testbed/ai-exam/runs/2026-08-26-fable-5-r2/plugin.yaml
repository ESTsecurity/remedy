schema_version: 1
id: evilai-locust
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "EvilAI (Locust) — 설치된 정상 Node.js 를 빌려 쓰는 JS 로더 제거"
  en: "EvilAI (Locust) - JavaScript loader abusing the installed Node.js runtime"

# 권한 상한. 여기 밖은 읽을 수도 지울 수도 없다.
# - 검체는 사용자 프로필마다 설치된다(AppData\Local\Programs 아래). %LOCALAPPDATA% 는
#   현재 사용자 하나뿐이라, 다중 사용자 기계에서 다른 프로필의 감염은 from 이 상한 밖이
#   되어 그룹째 제외된다. 그래서 %ALLUSERPROFILES% 를 쓴다 (10-manifest §지정 확장 토큰).
#   삭제가 닿는 범위도 그만큼 넓어지지만 대상은 언제나 증거에서 파생된 하위 폴더 하나다.
# - 예약 작업 정의 파일 자리는 참조 예제(ex01)와 같이 둔다. persistence 레코드에는
#   path 가 없어 이 상한을 거치지 않으며, 사용자 데이터가 없는 시스템 경로다.
scan_roots:
  - "%SystemRoot%\\System32\\Tasks"
  - "%ALLUSERPROFILES%\\AppData\\Local\\Programs"

subjects: [persistence, file, autorun, av_exclusion, process]

detect:
  # ── 부모: 예약 작업 ───────────────────────────────────────────────
  # 감염 인스턴스 하나마다 독립된 그룹이 생긴다. 아래 모든 규칙은 이 규칙이 뽑은
  # 폴더(${task.dir})에 묶인다 — from 또는 where 값 보간으로.
  - id: task
    subject: persistence
    where:
      all:
        # 관측: OS 작업 트리 안에 숨는다. 개발 도구의 작업(\DevTools\… 등)은 여기 없다.
        - { field: win.task.register_path, op: starts_with, value: '\Microsoft\Windows\' }
        # 관측: 이미 설치된 정상 node.exe 를 빌려 쓴다. 설치 위치는 PC 마다 다를 수
        # 있으므로 파일명만 본다. 이 실행 파일은 위협이 아니며 어디서도 제거 대상이 아니다.
        - { field: command, op: matches, value: '(?i)\\node\.exe"?$' }
        # 관측: 고정된 것은 자리뿐 — 사용자 프로필의 AppData\Local\Programs 아래
        # 검체가 만든 폴더(이름은 감염마다 바뀐다) 안의 .js.
        # Programs 와 .js 사이에 폴더가 최소 하나 있어야 한다. 그래야 ${task.dir} 가
        # Programs 자체가 될 수 없고, 아래 재귀 삭제가 사용자 프로그램 폴더 전체를 겨눌 수 없다.
        - { field: args, op: matches, value: '(?i)\\AppData\\Local\\Programs\\[^"]+\\[^\\"]+\.js("|\s|$)' }
    capture:
      script: "args | first_path"
      dir: "${script} | dirname"

  # ── 자식: 페이로드 파일 (경로) ───────────────────────────────────
  # 본문 없이 매치된다. collect_extra 가 이것을 가리켜 본문을 담는다 (YARA 순환 방지).
  - id: payload-file
    subject: file
    from: "${task.dir}"
    where:
      - { field: path, op: ends_with, value: ".js" }

  # ── 자식: 페이로드 파일 (본문) — 판정의 두 번째 근거 ────────────────
  # 분석가 경고: 이 룰을 전역에 풀지 않는다. 악성 판정된 작업이 가리킨 폴더 안에서만 돈다.
  # 본문은 .js 에만 담기므로 YARA 도 .js 에만 건다 — 본문 없는 레코드가 미평가로 남지 않게.
  - id: payload
    subject: file
    from: "${task.dir}"
    where:
      - { field: path, op: ends_with, value: ".js" }
      - { yara: "rules/evilai.yar:evilai_locust_js" }

  # ── 자식: 자동 실행(Run) — 그 폴더를 가리키는 값만 ──────────────────
  # path 가 없어 from 이 안 통한다. 값 보간으로 묶는다. 리터럴 경로 조각을 쓰면
  # 다른 감염 인스턴스의 항목까지 이 그룹에 붙는다.
  - id: runkey
    subject: autorun
    where:
      - { field: command, op: contains, value: "${task.dir}" }

  # ── 자식: Defender 제외 — 그 폴더가 등록된 항목만 ───────────────────
  # restore: [av_exclusions] 가 되돌리는 증거. 룰이 짚은 항목만 되돌린다 —
  # 사용자가 직접 넣은 다른 예외(개발 폴더 등)는 건드리지 않는다.
  - id: av-exclusion
    subject: av_exclusion
    where:
      - { field: value, op: contains, value: "${task.dir}" }

  # ── 자식: 그 스크립트를 물고 있는 프로세스 ──────────────────────────
  # 정상 Node 프로세스와 가르는 것은 실행 파일이 아니라 무엇을 실행하는가다.
  # 스냅샷에 없을 수 있다 — 판정에 넣지 않고, 있을 때만 제거 대상이 된다.
  - id: payload-process
    subject: process
    where:
      all:
        - { field: image_path, op: matches,  value: '(?i)\\node\.exe$' }
        - { field: args,       op: contains, value: "${task.dir}" }

# 독립적인 두 근거의 논리곱 — 작업 스케줄러 항목과 파일 본문(YARA).
# Run 값·제외 항목·프로세스는 없을 수도 있으므로 판정에 넣지 않는다 (있으면 함께 정리된다).
verdict:
  require: "task and payload"

remediate:
  remove:
    # 유발자 둘 — 코어가 산출물보다 먼저 처리한다. 하나만 지우면 나머지가 되살린다.
    - { ref: task }               # task.disable + task.delete
    - { ref: runkey }             # autorun.remove
    # 있을 때만. 프로세스 종료 → 삭제의 차례는 코어가 정한다.
    - { ref: payload-process }    # process.kill
    # 검체가 만든 폴더(관측: 사용자 파일이 섞이지 않는다). 네 조건 — 증거 파생 경로 ·
    # guard 가 그 안의 YARA 판정 파일 · 신뢰 서명 파일이 있으면 실행기가 거부 · 보호 목록.
    - { path: "${task.dir}", recursive: true, guard: payload }   # dir.delete_recursive
  restore:
    - av_exclusions               # av.restore_exclusions — av-exclusion 이 짚은 항목만
  verify:
    after_reboot: true            # 재판정 — 다른 랜덤 이름으로 되살아나는지 본다

# YARA 가 훑을 본문. 경로로 매치되는 규칙을 가리킨다 — YARA 규칙 자신을 가리키면 순환.
collect_extra:
  - { ref: payload-file, content: true }

# 제출은 P14 — 의도만 남긴다. 경로에 사용자 계정명이 들어가므로 하한을 대외비로 올린다.
submit_hint:
  samples: [payload]
  confidentiality_min: 1
