schema_version: 1
id: acmesync-svcstub-sideload
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "AcmeSync 폴더 사이드로드 — 로그온 실행 항목과 그것이 부르는 실행 파일 제거"
  en: "AcmeSync folder sideload - remove the logon-run entry and the executable it launches"

# ── 권한 상한 ────────────────────────────────────────────────
# 아래 file 규칙(dropped)이 볼 수 있는 범위다. autorun 은 scan_roots 와
# 무관하게 수집되므로(10-manifest.md 의 표) 여기 적지 않는다.
# C:\ProgramData\AcmeSync 는 이 제품의 고정 폴더다 — 감염마다 바뀌는 값이
# 아니라 제품 자체의 자리이므로 상한으로 못박는 것이 맞다(00-invariants
# "안 바뀌는 것은 scan_roots 가 이미 정한다"). 좁게 잡아 이 폴더 밖은
# 읽지도 지우지도 못하게 한다.
scan_roots:
  - "%PROGRAMDATA%\\AcmeSync"

subjects: [autorun, file]

detect:
  # ── 부모 · 유발자 ──────────────────────────────────────────
  # 로그온 실행 항목 중 명령이 AcmeSync 의 ProgramData 폴더 안을 가리키는 것.
  # 관측: 이 제품 자신은 로그온 항목을 쓰지 않는다("사용자가 열 때만 뜬다").
  # 따라서 이 폴더 안을 자동 실행하는 항목은 제품의 것이 아니다. 나머지 정상
  # 자동 실행 열여섯은 저마다 자기 제품 경로를 가리키므로 걸리지 않는다.
  - id: autostart
    subject: autorun
    where:
      - { field: command, op: contains, value: "\\ProgramData\\AcmeSync\\" }
    capture:
      # 명령에서 실행 파일 경로를 뽑는다. first_path 는 첫 토큰의 따옴표를
      # 벗긴다 — `"...\svcstub.exe" -q` → `...\svcstub.exe`. 파일 이름은
      # 검체마다 바뀔 수 있으므로 리터럴로 적지 않고 증거에서 뽑는다.
      exe: "command | first_path"
      dir: "${exe} | dirname"

  # ── 자식 · 독립 근거 ───────────────────────────────────────
  # 그 실행 항목이 가리키는 파일이 실제로 그 폴더 안에 있는가. 판정의 두 번째
  # 근거이며 대상이 다르다(레지스트리 자동 실행 ↔ 디스크 파일) — 40-review
  # -checklist 1번이 요구하는 '독립적인 근거'다.
  - id: dropped
    subject: file
    from: "${autostart.dir}"
    where:
      - { field: path, op: equals, value: "${autostart.exe}" }

# 자동 실행 항목 하나만으로 판정하지 않는다. 가리키는 파일이 실재해야 한다.
# (ex02·ex03 과 같은 형태 — 유발자 + 그것이 가리키는 파일의 논리곱)
verdict:
  require: "autostart and dropped"

remediate:
  remove:
    # 유발자 먼저 — 계획기가 autorun.remove 를 파일 격리보다 앞에 놓는다.
    # 남기면 로그온마다 다시 실행을 시도한다(요구 2).
    - { ref: autostart }
    # 실행 파일을 되돌릴 수 있게 격리한다(file.quarantine_only · low · 복구 가능).
    - { ref: dropped }
  verify:
    # 치료 뒤 재부팅해 같은 플러그인이 다시 판정하는지 본다. 다시 서면 놓친
    # 지속성 경로가 있다는 신호이므로 사람이 본다(경로 확인이 아닌 재판정).
    after_reboot: true

# 격리한 실행 파일을 분석에 넘기라는 표시. 고객 PC 에서 나온 검체이므로 기밀
# 하한을 올려 둔다. 자동 전송은 없다 — support-bundle 이 보여 줄 뿐이다.
submit_hint:
  samples: [dropped]
  confidentiality_min: 1

# ════════════════════════════════════════════════════════════
# 이 룰이 의도적으로 하지 않는 것 — 서명 검토자가 읽어야 한다
# ════════════════════════════════════════════════════════════
# 관측 보고의 핵심 요구는 "주 실행 파일보다 뒤에 놓였고(mtime) 어느 모듈보다
# 작은(size)" 두 성질을 함께 보아 검체 둘(svcstub.exe·netcache.dll)만 고르는
# 것이다. 그 기준(설치 시각·모듈 크기)은 기계마다 달라 리터럴로 적을 수 없고,
# 그 기계의 주 실행 파일에서 런타임에 얻어야 한다.
#
# 그런데 이 규격에는 그 상대 비교를 표현할 수단이 없다.
#   · size·mtime·ctime 필드와 gt·lt 연산자는 카탈로그에 있으나
#     (machine/REFERENCE.md·catalog.json), 이 문서·예제 어디에도 gt·lt 를
#     쓰는 사례가 하나도 없다.
#   · capture 함수 여덟(first_path·dirname·basename·lower·expand_env·
#     trim_quotes·base64_decode·hex_decode)은 전부 문자열·경로 변환이다.
#     숫자 필드(size·mtime)를 변수에 담는 예도, 그 값을 gt·lt 의 비교 대상
#     (${…})으로 넘기는 예도, 한 레코드의 필드를 다른 레코드의 필드와 견주는
#     수단도 문서 어디에도 정의되어 있지 않다.
# 즉 "주 실행 파일을 자로 삼아 재는" 상대 비교는 확인된 문법이 아니다.
# 리터럴 크기·시각을 적는 것은 위협 설명이 금지한다(다른 기계에서 0건).
# 지어내면 실기기에서 조용히 빗나가거나(관측 불완전) 엉뚱한 파일을 잡아 정상
# 폴더를 부술 수 있다. 붙인 문서의 규칙("없는 것이 필요하면 만들지 말고 그렇게
# 적어라", 20-detect §부모의 first_path 한계 "없는 함수를 지어내지 말고 이
# 한계를 적을 것")에 따라 지어내지 않고 여기 적어 둔다.
#
# 결과:
#   · svcstub.exe — 위 지속성 연결(확인된 증거)로 골라 격리한다.
#   · netcache.dll — 지속성이 직접 가리키지 않고, 그것을 고를 확인된 증거가
#     상대 비교뿐이라 이 룰로는 제거하지 않는다. 다만 svcstub.exe 와 그 로그온
#     항목이 사라지면 그것을 싣는 것이 없어 비활성 상태로 남는다. 정확히
#     제거하려면 분석가가 검체에서 만든 sha256 목록이나 YARA 규칙이 필요하다
#     (20-detect §알려진 지표 목록 / §YARA). 이 보고에는 그것이 없다 —
#     그래서 격리한 svcstub.exe 를 submit_hint 로 분석에 올려 다음 판을
#     닫도록 한다.
#   · 정상 파일 셋(AcmeSync.exe·ui.dll·core.dll)과 정상 자동 실행 열여섯은
#     어느 규칙에도 걸리지 않아 그대로 둔다. 기준으로 삼는 주 실행 파일을
#     지우는 위험 자체가 이 설계에는 없다.
