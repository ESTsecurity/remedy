# 정답 플러그인 — npm-posthook (패키지 설정에 끼어든 설치 훅 키 하나)
#
# **출제자의 답이지 응시자에게 주는 것이 아니다.** 기대 Op 이 도달 가능한지
# 확인하는 것이 목적이다.
#
# # 이 위협이 묻는 것
#
# **키 이름으로 가르지 않는가.** 설치 훅은 정상 패키지가 흔히 쓰는 자리이고,
# 옆의 `imgtools` 도 같은 키를 갖고 있다. 키 이름만 보는 답안은 정상 패키지의
# 빌드가 깨진다.
#
# 갈라지는 것은 그 값이 **무엇을 가리키는가**다 — 검체는 패키지 밖의 제 폴더를
# 부르고, 정상 패키지는 제 안의 스크립트를 부른다.
#
# # 파일을 지우지 않고 키 하나만 뺀다
#
# `package.json` 은 벤더 제품의 파일이다. 통째로 치우면 그 패키지가 깨지므로
# **검체가 더한 키 하나만** 뺀다 — 같은 파일의 `name` · `version` · `main` ·
# `scripts.build` · `scripts.test` 는 그대로 남아야 하고, 채점 자료의
# `key_path=` 매치가 실기기에서 그것을 잰다.
#
# # 자리를 리터럴로 적는 곳과 적지 않는 곳
#
# 검체의 폴더는 읽기 상한(`scan_roots`)에 적는다 — 그것이 이 subject 의 권한
# 상한이고, `cred-dump` 와 같은 판단이다. 반면 패키지 경로는 조건에 적지
# 않는다: 같은 검체가 다른 패키지에 끼어들어도 그 훅이 같은 폴더를 부르면
# 걸린다.

schema_version: 1
id: npm-posthook
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "패키지 설치 훅 주입 제거"
  en: "Package install-hook injection removal"

# 읽기 권한 상한.
#
# **구조적 설정은 여기 적어야 모인다** — `structured_config` 는 이 상한을 받는
# subject 다(10-manifest.md 의 표). 정상 패키지도 적는다: 적지 않으면 그 패키지가
# 평가에 들어오지 않아, 그것을 함께 건드리는 답안과 이 답안이 구별되지 않는다.
scan_roots:
  - "/usr/local/lib/node_modules/nodewatch-agent" # 검체가 키를 더한 패키지
  - "/usr/local/lib/node_modules/imgtools" # 같은 키를 가진 정상 패키지
  - "/var/tmp/.npm-cache" # 검체가 스크립트를 놓은 폴더

subjects: [file, structured_config]

detect:
  # ── 끼어든 설치 훅 ───────────────────────────────────
  # 키 이름은 좁히는 조건일 뿐이고, 가르는 것은 **그 값이 가리키는 곳**이다.
  # 정상 패키지의 훅은 제 폴더 안(`scripts/build-native.js`)을 부르므로
  # 두 번째 조건에서 떨어진다.
  - id: hook
    subject: structured_config
    where:
      all:
        - { field: key_path, op: equals, value: "scripts.postinstall" }
        - { field: value, op: contains, value: "/var/tmp/.npm-cache/" }

  # ── 그 훅이 부르는 스크립트 ──────────────────────────
  # 설정의 키만 빼고 파일을 남기면 다음 검체가 훅만 다시 써도 그대로 돈다.
  - id: payload
    subject: file
    where:
      - { field: path, op: starts_with, value: "/var/tmp/.npm-cache/" }

# 서로 다른 자리에서 온 두 근거의 논리곱 — 설정의 값과 디스크의 파일.
# 훅만으로 판정하면, 스크립트를 이미 치운 기계에서 설정 한 줄을 근거로
# 벤더 파일을 고치게 된다.
verdict:
  require: "hook and payload"

remediate:
  remove:
    - { ref: hook } # structured_config.remove_key — 그 키 하나만
    - { ref: payload } # file.quarantine_only

submit_hint:
  samples: [payload]
  confidentiality_min: 1
