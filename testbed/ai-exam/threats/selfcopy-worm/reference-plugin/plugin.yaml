# 정답 플러그인 — selfcopy-worm (리눅스 자기 복제 웜)
#
# # 이 위협이 묻는 것
#
# **이름이 아니라 내용으로 가르는가.**
#
# 복제본 다섯은 자리가 전부 다르고 이름은 숨김 파일 하나뿐이다. 옆에는 이름에
# `sync` 가 들어가는 정상 파일 넷이 나란히 있다:
#
#   /usr/local/bin/backup-sync         정상 동기화 도구
#   /usr/local/lib/libsync.so.1        정상 라이브러리
#   /opt/backup/vendor-archive.sh      정상 백업 스크립트
#   /srv/data/nightly-sync.log         정상 로그
#   /etc/cron.d/logrotate-sync         정상 정기 작업
#
# 이름이나 자리로 겨누면 그것들이 함께 걸린다. **복제본과 같은 폴더에 사는
# 것도 넷이다.** 갈라지는 지점은 **해시**다 — 복제본 다섯은 내용과 크기가
# 같아 해시가 같고, 정상 파일은 저마다 다르다.
#
# # 해시 값을 적지 않는다 (1.0.1 · 2026-10-02)
#
# 1.0.0 은 `infected/` 에서 읽은 리터럴 해시(`sha256 equals 311778ae…`)로 다섯을
# 집었다. 그 값은 **응시자가 가질 수 없다** — 위협 설명은 "다섯이 서로 같다" 는
# 사실만 주고 값은 주지 않는다(출제자 주의 4). 정답이 응시자가 닿을 수 없는
# 값으로 쓰여 있으면 "정답이 기준을 넘는가" 가 아무것도 말하지 않는다. worm-r1
# (09-22)과 worm-r3(10-01)가 같은 자리에 자리 표시를 두고 떨어지며 드러났다 —
# r1 때는 "값을 주지 않는 설계" 를 두기로 했고, 그 결정은 그대로다. 바뀐 것은
# 정답과 가이드가 **값 없이 닿는 길**을 보여 주는가다.
#
# 그래서 **지문을 기계에서 뽑는다.** 다시 뿌리는 정기 작업이 복제본 하나를
# 부른다 — 그 파일의 `sha256` 을 capture 해 나머지를 `equals` 로 모은다
# (`20-detect` §값을 모르는 지문). 자리를 나열하지 않으므로 여섯 번째 복제본도
# 함께 걸리고, 값을 몰라도 된다. 기대 Op 은 1.0.0 과 같다.
#
# # `c2-beacon` 과 무엇이 다른가
#
# 저쪽도 해시로 겨눈다. 그러나 저쪽은 **서로 다른 해시 여럿**을 위협 정보
# 피드에서 받아 대조하는 위협이고, 이 위협은 **하나의 해시가 여러 자리에**
# 있는 확산이다. 답안의 모양이 아니라 재는 성질이 다르다:
#
#   c2-beacon      해시 넷 중 둘이 이 기계에 있다     (목록 대조 — 값은 피드가 준다)
#   selfcopy-worm  해시 하나가 이 기계에 다섯 개 있다 (확산 추적 — 값은 기계에서 뽑는다)
#
# # 상한에 닿되 넘지 않는다
#
# 치료 대상이 최상위 디렉터리 다섯에 걸쳐 있다(`/usr` · `/opt` · `/var` ·
# `/srv` · `/etc`). `distinct_top_dirs` 상한이 5 이고 `guard.rs` 의
# `check_totals` 가 `> 5` 에서 거는 덕에 이 계획은 통과한다.
#
# **여섯 번째가 있었다면 무인 모드는 아무것도 치료하지 않고 멈춘다**(G5 ·
# 종료 코드 5). 그것이 옳은 동작이고 — 그만큼 퍼졌다면 룰이 과광범위할
# 가능성이 먼저다 — 그쪽은 `guards.rs` 의 조작 입력이 이미 재고 있다.

schema_version: 1
id: selfcopy-worm
version: 1.0.1
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "자기 복제 웜 제거"
  en: "Self-copying worm removal"

scan_roots:
  - "/usr/local/bin"
  - "/usr/local/lib"
  - "/opt/backup"
  - "/var/tmp"
  - "/srv/data"
  - "/etc/cron.d"

subjects: [file, persistence]

detect:
  # 다시 뿌리는 정기 작업. **복제본을 다 치워도 이것이 남으면 10분 뒤 돌아온다.**
  # 정상 정기 작업(`logrotate-sync`)과 같은 폴더 · 같은 틀 · 같은 root 다 —
  # 가르는 것은 무엇을 실행하는가뿐이다.
  - id: respawn
    subject: persistence
    where:
      all:
        - { field: source, op: starts_with, value: "/etc/cron.d/" }
        - { field: args,   op: contains,    value: "--spread" }
    capture:
      file: "source"    # 정의 파일 — 통째로 검체의 것이다
      exe: "command"    # 그것이 부르는 복제본 — 지문은 여기서 뽑는다

  # 정기 작업이 부르는 그 복제본. 값을 미리 알 필요가 없다.
  - id: seed
    subject: file
    where:
      - { field: path, op: equals, value: "${respawn.exe}" }
    capture:
      digest: "sha256"

  # 같은 지문을 가진 파일 전부 — 어디에 있든, 이름이 무엇이든. **자리를 적지 않는다.**
  - id: clones
    subject: file
    where:
      - { field: sha256, op: equals, value: "${seed.digest}" }

  # 정의 파일 자체. 파일 전체가 검체의 것이고 그 안에 검체의 줄 하나뿐이라
  # 줄을 빼면 빈 파일이 남는다 — 파일로 잡아 통째로 치운다(`ssh-backdoor` 와
  # 같은 판단).
  - id: cronfile
    subject: file
    where:
      - { field: path, op: equals, value: "${respawn.file}" }

# 해시 하나만으로는 "어디선가 받아 둔 같은 파일" 과 구별되지 않는다. 다시
# 뿌리는 자리가 함께 있을 때만 확산으로 선언한다.
verdict:
  require: "clones and respawn"

remediate:
  remove:
    - { ref: clones } # file.quarantine_only — 다섯 자리에 각각
    - { ref: cronfile } # file.quarantine_only — 정기 작업 파일 통째로

submit_hint:
  samples: [clones]
  confidentiality_min: 1
