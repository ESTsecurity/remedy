# 정답 플러그인 — hexcfg-loader (설정에 hex 로 감춰 둔 플러그인)
#
# **출제자의 답이지 응시자에게 주는 것이 아니다.** 기대 Op 이 도달 가능한지
# 확인하는 것이 목적이다.
#
# # 세 겹을 벗겨야 파일에 닿는다
#
# 설정에 경로가 평문으로 없다. 검체가 더한 값은 hex 이고, 풀면 경로가 나오고,
# 거기서 **이름만** 떼야 목록의 줄과 맞고, **접어야** 디스크의 파일과 맞는다:
#
#   value | hex_decode            ->  /usr/lib/nodewatch/plugins/libNetCache.so
#         | dirname               ->  /usr/lib/nodewatch/plugins
#         | basename | lower      ->  libnetcache.so
#
# **세 함수가 전부 일한다.** 하나라도 빼면 닿지 못한다 —
#
#   `hex_decode` 없이는 값이 무엇인지 알 수 없다.
#   `basename` 없이는 전체 경로를 목록의 이름과 견주게 된다(목록은 이름만 적는다).
#   `lower` 없이는 `libNetCache.so` 가 `libnetcache.so` 와 다른 것이 된다 —
#   **리눅스에서 비교는 대소문자를 구분한다**(`norm_for_compare` 는 Windows 에서만
#   접는다). 검체의 설정은 운영자가 적은 표기를 담고 있고 디스크와 목록은
#   소문자다.
#
# # 자리를 리터럴로 적지 않는다
#
# 폴더도 파일 이름도 매니페스트에 없다. 둘 다 그 기계의 값에서 나온다 — 같은
# 검체가 다른 폴더·다른 이름을 쓰더라도 같은 사슬로 닿는다.
#
# # 셋을 함께 치운다
#
# 설정만 고치면 파일과 목록 줄이 남아 에이전트가 계속 싣고, 파일만 치우면
# 목록이 없는 것을 부르며 에이전트가 오류를 낸다.

schema_version: 1
id: hexcfg-loader
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "감춘 설정 플러그인 로더 제거"
  en: "Hex-encoded plugin loader removal"

# 읽기 권한 상한. 벤더 에이전트의 설정 폴더와 플러그인 폴더 둘이다.
scan_roots:
  - "/etc/nodewatch"
  - "/usr/lib/nodewatch/plugins"

subjects: [file, text_config, structured_config]

detect:
  # ── 감춘 값 ───────────────────────────────────────────
  # 벤더 설정에 없던 항목이다. **값의 모양을 먼저 본다** — hex 가 아니면
  # 푸는 것 자체가 오류이므로, 모양 검사가 그것을 깨끗한 미매치로 만든다.
  - id: cfg
    subject: structured_config
    where:
      all:
        - { field: key_path, op: equals, value: "relay.module" }
        - { field: value, op: matches, value: "^[0-9a-fA-F]{32,}$" }
    capture:
      raw: "value | hex_decode"
      dir: "${raw} | dirname"
      libname: "${raw} | basename | lower"

  # ── 그 경로의 파일 ────────────────────────────────────
  # 푼 경로의 폴더 안에서 **접은 이름**으로 찾는다. 벤더 플러그인 둘은
  # 이름이 달라 걸리지 않는다.
  - id: payload
    subject: file
    from: "${cfg.dir}"
    where:
      - { field: path, op: ends_with, value: "/${cfg.libname}" }

  # ── 그것을 싣게 하는 목록 줄 ──────────────────────────
  # 목록은 **이름만** 적는다. 그래서 전체 경로로는 맞출 수 없고, 접은 이름이
  # 있어야 이 줄에 닿는다. 벤더 줄 둘(`inventory.so` · `metrics.so`)은
  # 이름이 달라 걸리지 않는다.
  - id: listline
    subject: text_config
    where:
      all:
        - { field: key, op: equals, value: "plugin" }
        - { field: value, op: equals, value: "${cfg.libname}" }

# 서로 다른 자리에서 온 두 근거의 논리곱 — 설정의 값과 디스크의 파일.
# 감춘 값만으로 판정하면, 파일을 이미 치운 기계에서 설정 한 줄을 근거로
# 벤더 파일을 고치게 된다.
verdict:
  require: "cfg and payload"

remediate:
  remove:
    - { ref: cfg } # structured_config.remove_key — 그 키 하나만
    - { ref: listline } # text_config.remove_line — 그 줄 하나만
    - { ref: payload } # file.quarantine_only

submit_hint:
  samples: [payload]
  confidentiality_min: 1
