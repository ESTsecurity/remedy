# 정답 플러그인 — ldso-preload
#
# **이것은 출제자의 답이지 응시자에게 주는 것이 아니다.** 기대 Op 이 도달
# 가능한지 확인하는 것이 목적이다. 도달할 수 없는 목록을 아무도 안 재면
# 응시자만 떨어진다 (README — 1 회차가 그렇게 무너졌다).

schema_version: 1
id: ldso-preload
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "라이브러리 경로 로더 제거"
  en: "Library path loader removal"

# 읽기 권한 상한. `text_config`·`file`·`shortcut` 전부 path 를 가지므로
# 여기에 걸린다 — 세 자리를 전부 적는다.
#
# 2026-09-01 까지 이 세 줄이 폭 경고를 맞았다. `root_depth` 가 `C:` 를 한
# 단계로 세어 리눅스 경로가 한 단계 얕게 계산됐기 때문이고 — 파일 넷짜리
# `/etc/ld.so.conf.d` 가 `C:\Windows` 와 같은 깊이 2였다 — 근거 없는
# 경고였으므로 린트를 고쳤다. 지금은 경고가 없다.
scan_roots:
  - "/etc/ld.so.conf.d"
  - "/usr/local/lib"
  - "/usr/share/applications"

subjects: [text_config, file, shortcut]

detect:
  # ── 부모 ──────────────────────────────────────────────
  # 검체가 덧붙인 한 줄. **파일 자체는 정상**이라 지우면 안 되고 그 줄만 뺀다.
  #
  # 자리만으로는 가르지 못한다 — 코퍼스의 같은 폴더에 정상 줄이 16개 있다
  # (`/usr/local/lib` · `/lib/x86_64-linux-gnu` 등). 가르는 것은 **숨김
  # 성분**이다: 정상 라이브러리 경로에는 `/.` 로 시작하는 성분이 없다.
  - id: cfgline
    subject: text_config
    where:
      all:
        - { field: path, op: starts_with, value: "/etc/ld.so.conf.d/" }
        # 정규식은 작은따옴표로 적는다 — YAML 이 역슬래시를 그대로 넘긴다.
        # `^/…/.<이름>$` — 경로 어딘가에 숨김 성분이 있고 그것이 마지막이다.
        - { field: line, op: matches, value: '^/[^\s#]*/\.[^/\s]+/?$' }
    capture:
      # 줄 내용이 곧 경로다. 폴더 이름의 꼬리는 감염마다 바뀌므로 증거에서 뽑는다.
      dir: "line | first_path"

  # ── 자식 ──────────────────────────────────────────────
  # 그 폴더 안의 공유 라이브러리. `from` 이 없으면 스냅샷 전체를 뒤지게 되고,
  # 그러면 무관한 `.so` 하나가 판정을 완성시킨다.
  #
  # **판정 근거로만 쓴다.** 제거는 아래 `contents` 가 폴더 전체를 맡는다.
  - id: payload
    subject: file
    from: "${cfgline.dir}"
    where:
      - { field: path, op: matches, value: '\.so(\.\d+)*$' }

  # 그 폴더의 파일 전부. **폴더 전체가 검체가 만든 것**이라는 관측이 근거다.
  #
  # `dir.delete_recursive` 를 쓰지 않는 이유는 위험해서가 아니라 **리눅스에
  # 없어서**다(`machine/ops.json` 의 `linux_from` 이 null). 그래서 폴더째가
  # 아니라 파일 단위로 격리한다 — 없는 Op 을 쓰는 대신 있는 것으로 같은 일을
  # 한다.
  - id: contents
    subject: file
    from: "${cfgline.dir}"
    where:
      # 부모가 capture 한 것이 디렉터리뿐이라 뺄 파일 경로가 없다.
      # `from` 에게만 범위를 맡기고 조건은 그 사실을 그대로 적는다
      # (22-remediate-recipes.md).
      #
      # **린트가 경고하고 그것이 맞다** — `from` 은 어디를 좁히지 몇 개를
      # 좁히지 않는다. 처음에 `starts_with "${cfgline.dir}"` 로 적었는데
      # 그것은 같은 말을 돌려 적은 것이었고, 그때는 린트가 연산자만 보아
      # 조용히 지나갔다. 지금은 양쪽 다 같은 경고를 받는다.
      - { field: path, op: exists }

  # ── 변조된 실행기 ─────────────────────────────────────
  # `.desktop` 은 정상 응용의 것이다. **지우면 그 응용의 실행기가 사라진다** —
  # 삭제가 아니라 인자만 뺀다. 값 보간이 이 항목을 같은 감염에 묶는다.
  - id: launcher
    subject: shortcut
    where:
      - { field: args, op: contains, value: "${cfgline.dir}" }

# 서로 다른 자리에서 온 두 근거의 논리곱 — 설정의 한 줄과 디스크의 파일.
# 줄 하나만으로 판정하면 숨김 폴더를 쓰는 정상 설정이 곧바로 오탐이 된다.
verdict:
  require: "cfgline and payload"

remediate:
  # 차례는 코어가 정한다. 유발자(설정 줄·실행기)가 산출물보다 먼저 처리된다.
  remove:
    - { ref: cfgline }     # text_config.remove_line — 덧붙은 줄만
    - { ref: launcher }    # shortcut.strip_args     — 덧붙은 인자만
    - { ref: contents }    # file.quarantine_only    — 폴더의 파일 전부

submit_hint:
  samples: [payload]
  confidentiality_min: 1
