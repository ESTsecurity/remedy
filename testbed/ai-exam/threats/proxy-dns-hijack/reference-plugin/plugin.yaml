# 정답 플러그인 — proxy-dns-hijack (이름 풀이와 나가는 길을 함께 돌린 검체)
#
# # 이 위협이 묻는 것
#
# **`hosts` 를 Windows 에서 처음 밟는다.** 리눅스 쪽 `tls-intercept` 가
# `/etc/hosts` 를 밟고 있었지만 Windows 재료에는 그 자리가 없었고, 그래서
# 채점기도 `line=` 매치를 볼 줄 몰랐다 — 같은 것을 재는 두 하네스가
# **비대칭**이었다(2026-09-21 에 Windows 쪽에 더했다).
#
# # 줄 셋 중 하나는 남아야 한다
#
#   192.168.10.14  buildserver buildserver.corp.example    조직이 넣었다 — 남는다
#   10.20.30.40    update.microsoft.com                    검체 — 보안 갱신을 막는다
#   10.20.30.40    login.bank-example.co.kr                검체 — 은행 주소를 가로챈다
#
# **파일을 통째로 치울 수 없다.** 그러면 이름 풀이가 망가지고 조직의 줄도
# 사라진다. 검체가 넣은 줄만 빼야 한다 — `ldso-preload` 가 설정 파일에서 하는
# 것과 같은 판단이고, `ssh-backdoor` 의 정기 작업 파일과는 반대다(그쪽은 파일
# 전체가 검체의 것이었다).
#
# # 무엇으로 가르는가
#
# 두 줄이 같은 주소를 가리킨다. 그 주소가 프록시 설정에도 그대로 있고, 그것이
# **셋을 하나로 묶는 지점**이다 — 이름 풀이를 돌려 그 주소로 보내고, 나가는
# 길도 그 주소를 거치게 했다. 주소 하나만 보고 겨누면 조직이 그 주소를 쓰는
# 기계에서 오탐이 나므로, 줄과 프록시가 **함께** 있을 때만 위협으로 선언한다.

schema_version: 1
id: proxy-dns-hijack
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "프록시·이름 풀이 변조 제거"
  en: "Proxy and DNS hijack removal"

scan_roots:
  - "C:\\ProgramData\\NetOpt"
  - "C:\\ProgramData\\NetTools"

subjects: [file, hosts_entry, proxy_config, autorun]

detect:
  # 돌려진 이름 둘. **조직이 넣은 줄은 이 주소를 쓰지 않는다.**
  #
  # 줄 전체가 아니라 주소로 겨눈다 — 검체가 어떤 이름을 더 넣었는지는 기계마다
  # 다르고, 같은 주소로 보내는 줄이 넷이든 열이든 전부 빼야 한다.
  - id: redirect
    subject: hosts_entry
    where:
      - { field: line, op: starts_with, value: "10.20.30.40" }

  # 나가는 길. 같은 주소다.
  - id: proxy
    subject: proxy_config
    where:
      - { field: server, op: equals, value: "10.20.30.40:8080" }

  # 페이로드. 옆의 `C:\ProgramData\NetTools` 는 정상 네트워크 도구다.
  - id: payload
    subject: file
    where:
      - { field: path, op: equals, value: "C:\\ProgramData\\NetOpt\\netopt.exe" }

  # 재부팅해도 다시 선다. 같은 키에 정상 항목 열여섯이 있으므로 **무엇을
  # 실행하는가**로 가른다.
  - id: runkey
    subject: autorun
    where:
      - { field: command, op: contains, value: "C:\\ProgramData\\NetOpt\\netopt.exe" }

# 돌려진 이름만으로는 부족하다 — 조직이 내부 주소로 이름을 돌리는 일은 흔하다.
# 나가는 길까지 그 주소를 거칠 때 비로소 가로채기다.
verdict:
  require: "redirect and proxy"

remediate:
  # **hosts 와 프록시는 `remove` 가 아니라 `restore` 다.**
  #
  # 둘 다 "지운다" 가 아니라 "원래대로 돌린다" 이고, 그 되돌리기는 ref 가
  # 아니라 **카탈로그 이름**으로 고른다(`RESTORE_NAMED`). `tls-intercept` 의
  # 주석이 그 까닭을 적는다 — `remove` 에 넣으면 계획이
  # `text_config.remove_line` 을 내고, 줄은 사라지지만 그것은 "원래대로" 가
  # 아니다.
  #
  # 파일은 남아야 하고 조직이 넣은 줄도 남아야 한다. 계획기가 위의 `redirect`
  # 증거에서 **검체가 넣은 줄만** 뽑아 `hosts.restore_line` 을 낸다.
  restore:
    - hosts # hosts.restore_line — 돌려진 줄 둘에 각각
    - proxy # proxy.restore
  remove:
    - { ref: payload } # file.quarantine_only
    - { ref: runkey } # autorun.remove

submit_hint:
  samples: [payload]
  confidentiality_min: 1
