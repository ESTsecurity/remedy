# 감염 스냅샷을 뜨기 위한 수집 매니페스트 — npm-posthook.
#
# # 이것은 탐지 룰이 아니다
#
# `detect` 는 **아무것도 맞히지 않도록** 일부러 짰다 (`xmr-miner-collect.yaml`
# 과 같다). 매니페스트가 있어야 선언 모드로 수집되고, 선언 모드여야 subject 를
# 고를 수 있을 뿐이다. 여기에 진짜 조건을 적으면 그 순간 스냅샷이 오염된다.
#
# # 정상 패키지를 함께 담는다
#
# 이 위협은 **같은 키가 정상 패키지에도 있다**는 것이 요점이다. `imgtools` 를
# 범위에서 빼면 키 이름으로 가르는 답안이 아무 데도 걸리지 않는다.
#
# # `structured_config` 를 리눅스에서 처음 담는 수집이다
#
# 수집기는 확장자로 거른다 — 구조적 설정은 `.json` 하나뿐이고 텍스트 설정은
# 여섯이다(`remedy-collect::config`). 그래서 `package.json` 은 담기고 같은
# 폴더의 `.js` 는 `file` 로만 담긴다.

schema_version: 1
id: npm-posthook-collect
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "감염 스냅샷 수집용 — npm-posthook"
  en: "infected snapshot collection - npm-posthook"

scan_roots:
  - "/usr/local/lib/node_modules/nodewatch-agent"
  - "/usr/local/lib/node_modules/imgtools"
  - "/var/tmp/.npm-cache"

subjects: [file, structured_config]

detect:
  - id: never
    subject: file
    where:
      - { field: path, op: equals, value: "/nonexistent/remedy-exam-never-matches" }

verdict: { require: "never" }
