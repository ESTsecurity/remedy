# 감염 스냅샷을 뜨기 위한 수집 매니페스트 — tls-intercept.
#
# # 이것은 탐지 룰이 아니다
#
# `detect` 는 **아무것도 맞히지 않도록** 일부러 짰다 (`corpus-all-subjects.yaml`
# 과 같다). 매니페스트가 있어야 선언 모드로 수집되고, 선언 모드여야 subject 를
# 고를 수 있을 뿐이다. 여기에 진짜 조건을 적으면 그 순간 스냅샷이 오염된다.
#
# # 범위를 넓게 잡는 이유
#
# 평가는 **응시자의 `scan_roots` 가 아니라 스냅샷의 것**을 쓴다
# (`pipeline.rs` 의 `scope_of`). 그래서 여기서 좁히면 넓게 선언한 응시자가
# 볼 것이 없어지고, 넓히면 오탐 압력이 모두에게 균등하게 늘어난다.

schema_version: 1
id: tls-intercept-collect
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "감염 스냅샷 수집용 — tls-intercept"
  en: "infected snapshot collection - tls-intercept"

# `/opt` 이다 — `/opt/netguard` 가 아니다. 정상 소프트웨어(`/opt/goodware`)가
# 같은 부모 아래 있어야 *"자리만으로 가르면 안 된다"* 를 잴 수 있다.
#
# `cert_store` 와 `hosts_entry` 는 자리가 정해져 있어 이 목록과 무관하게 모인다.
scan_roots:
  - "/opt"

subjects: [cert_store, hosts_entry, file]

detect:
  - id: never
    subject: file
    where:
      - { field: path, op: equals, value: "/nonexistent/remedy-exam-never-matches" }

verdict: { require: "never" }
