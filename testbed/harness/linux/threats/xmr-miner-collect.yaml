# 감염 스냅샷을 뜨기 위한 수집 매니페스트 — xmr-miner.
#
# # 이것은 탐지 룰이 아니다
#
# `detect` 는 **아무것도 맞히지 않도록** 일부러 짰다 (`ldso-preload-collect.yaml`
# 과 같다). 매니페스트가 있어야 선언 모드로 수집되고, 선언 모드여야 subject 를
# 고를 수 있을 뿐이다. 여기에 진짜 조건을 적으면 그 순간 스냅샷이 오염된다.
#
# # 범위
#
# 평가는 **응시자의 `scan_roots` 가 아니라 스냅샷의 것**을 쓴다
# (`pipeline.rs` 의 `scope_of`). 그래서 여기서 좁히면 넓게 선언한 응시자가
# 볼 것이 없어진다.
#
# `/etc/systemd/system` 은 systemd 수집기가 보는 네 자리 중 하나다
# (`systemd.rs` 의 상단 상수). 페이로드 쪽 `/usr/local/lib` 를 함께 넣어
# 유닛과 그 유닛이 가리키는 파일이 한 스냅샷에 들어오게 한다.

schema_version: 1
id: xmr-miner-collect
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "감염 스냅샷 수집용 — xmr-miner"
  en: "infected snapshot collection - xmr-miner"

scan_roots:
  - "/etc/systemd/system"
  - "/usr/local/lib"

subjects: [service, file]

detect:
  - id: never
    subject: file
    where:
      - { field: path, op: equals, value: "/nonexistent/remedy-exam-never-matches" }

verdict: { require: "never" }
