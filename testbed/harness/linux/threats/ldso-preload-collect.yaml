# 감염 스냅샷을 뜨기 위한 수집 매니페스트 — ldso-preload.
#
# # 이것은 탐지 룰이 아니다
#
# `detect` 는 **아무것도 맞히지 않도록** 일부러 짰다 (`corpus-all-subjects.yaml`
# 과 같다). 매니페스트가 있어야 선언 모드로 수집되고, 선언 모드여야 subject 를
# 고를 수 있을 뿐이다. 여기에 진짜 조건을 적으면 그 순간 스냅샷이 오염된다.
#
# # 범위를 넓게 잡는 이유
#
# 평가는 **응시자의 `scan_roots` 가 아니라 스냅샷의 것**을 쓴다
# (`pipeline.rs` 의 `scope_of`). 그래서 여기서 좁히면 넓게 선언한 응시자가
# 볼 것이 없어지고, 넓히면 오탐 압력이 모두에게 균등하게 늘어난다.
#
# 셋은 이 위협이 다루는 자리의 합집합이다 — 링커 설정 · 라이브러리 · 실행 항목.

schema_version: 1
id: ldso-preload-collect
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "감염 스냅샷 수집용 — ldso-preload"
  en: "infected snapshot collection - ldso-preload"

scan_roots:
  - "/etc/ld.so.conf.d"
  - "/usr/local/lib"
  - "/usr/share/applications"

subjects: [text_config, file, shortcut]

detect:
  - id: never
    subject: file
    where:
      - { field: path, op: equals, value: "/nonexistent/remedy-exam-never-matches" }

verdict: { require: "never" }
