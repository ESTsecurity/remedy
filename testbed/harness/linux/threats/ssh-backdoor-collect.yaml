# 감염 스냅샷을 뜨기 위한 수집 매니페스트 — ssh-backdoor.
#
# # 이것은 탐지 룰이 아니다
#
# `detect` 는 **아무것도 맞히지 않도록** 일부러 짰다 (`xmr-miner-collect.yaml`
# 과 같다). 매니페스트가 있어야 선언 모드로 수집되고, 선언 모드여야 subject 를
# 고를 수 있을 뿐이다. 여기에 진짜 조건을 적으면 그 순간 스냅샷이 오염된다.
#
# # 범위
#
# 평가는 **응시자의 `scan_roots` 가 아니라 스냅샷의 것**을 쓴다
# (`pipeline.rs` 의 `scope_of`). 그래서 여기서 좁히면 넓게 선언한 응시자가
# 볼 것이 없어진다.
#
# cron 은 `scan_roots` 와 무관하게 정해진 자리에서 거둔다(`cron.rs` 의
# `SYSTEM_FILES`·`SYSTEM_DIRS`) — `/etc/cron.d` 를 여기 적지 않아도 들어온다.
# 그래도 적어 두는 까닭은 **읽는 사람에게 이 위협의 자리를 보이기 위해서**다.

schema_version: 1
id: ssh-backdoor-collect
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "감염 스냅샷 수집용 — ssh-backdoor"
  en: "infected snapshot collection - ssh-backdoor"

scan_roots:
  - "/etc/ssh"
  - "/etc/cron.d"
  - "/usr/local/sbin"

subjects: [file, persistence, text_config]

detect:
  - id: never
    subject: file
    where:
      - { field: path, op: equals, value: "/nonexistent/remedy-exam-never-matches" }

verdict: { require: "never" }
