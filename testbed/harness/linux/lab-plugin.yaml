# Linux 실기기 검증용 실험 플러그인 — **치료까지 간다.**
#
# Windows 쪽 `guest/lab-plugin-p6.yaml` 의 Linux 짝이다. 나누는 이유도 같다 —
# 코퍼스용 `corpus-all-subjects.yaml` 은 **아무것도 맞히지 않도록** 일부러 짠
# 것이고, 여기는 파괴 Action 을 만든다.
#
# # 이것으로 재는 것
#
# **Linux 에서 `apply` 가 한 번도 실기기에서 돈 적이 없다.** 쓰기 백엔드
# (`remedy-platform/src/linux.rs`)는 26개 함수가 다 차 있고 단위 시험도 붙어
# 있지만, 그 시험은 전부 임시 디렉터리 위에서 돈다. 진짜 `/etc` · 진짜
# systemd 유닛 · 진짜 cron 파일 위에서 무엇이 일어나는지는 아무도 보지 않았다.
#
# 그리고 **G3** — `apply` 가 계획에 없는 것을 건드리지 않았는가(설계-09 P6).
# 그래서 픽스처에 일부러 **건드리면 안 되는 것**을 섞어 둔다:
#
#   /opt/remedy-lab/REMEDY-LAB.marker   증거이지만 치료 대상이 아니다
#   /opt/remedy-lab/keepme.conf         어느 규칙에도 걸리지 않는다
#   /etc/hosts 의 정상 줄               한 줄만 빼야 한다
#   lab.json 의 keep 키                 한 키만 빼야 한다
#   ca-certificates 의 다른 인증서      하나만 지워야 한다
#
# # 어디서 도는가
#
# **컨테이너다.** `/etc/ld.so.preload` 를 만들고 systemd 유닛을 지우는 하네스를
# 개발용 WSL 에서 돌릴 수는 없다. Windows 쪽이 VM 스냅샷으로 얻는 격리를
# Linux 에서는 컨테이너가 준다 — 그리고 더 싸다.

schema_version: 1
id: remedy-lab-linux
version: 1.0.0
min_core: "1.0.0"
platforms: [linux]
name:
  ko: "Linux 실기기 검증 실험 플러그인"
  en: "Linux on-metal verification lab plugin"

# 읽기 권한 상한.
#
# 자리가 정해진 subject(`persistence`·`service`·`autorun`·`cert_store`·
# `hosts_entry`·`process`)는 이 목록과 무관하게 모인다. 여기 적는 것은
# **경로를 가진 것**의 상한이다 — 페이로드와 두 설정 파일, 그리고 바로 가기.
scan_roots:
  - "/opt/remedy-lab"
  - "/usr/share/applications"
  # **모든 사용자로 편다.** 확장은 사용자마다 설치되므로 한 홈만 적으면
  # 나머지 사용자는 감염된 채 남는다. Linux 에서 이 토큰은 `/home/*` 와
  # `/root` 로 풀린다 (`remedy-platform/src/linux.rs`).
  - "%ALLUSERPROFILES%/.config/google-chrome/Default/Extensions"

subjects:
  [
    file,
    text_config,
    structured_config,
    hosts_entry,
    shortcut,
    autorun,
    cert_store,
    persistence,
    service,
    browser_extension,
    process,
  ]

detect:
  # ── 부모 ────────────────────────────────────────────────
  #
  # 마커 하나가 곧 이 실험대의 정체다. **마커 자체는 치료 대상이 아니다** —
  # 증거이면서 남는 것이 있어야, 없어진 것과 남은 것을 상태 diff 에서 함께
  # 볼 수 있다.
  - id: marker
    subject: file
    where:
      - { field: path, op: equals, value: "/opt/remedy-lab/REMEDY-LAB.marker" }

  # ── file.quarantine_only ────────────────────────────────
  #
  # `keepme.conf` 는 같은 디렉터리에 있지만 이름이 다르므로 걸리지 않는다.
  - id: payload
    subject: file
    where:
      - { field: path, op: equals, value: "/opt/remedy-lab/payload.so" }

  # ── text_config.remove_line ─────────────────────────────
  #
  # 파일이 아니라 **줄 하나**를 짚는다. 파일에는 정상 줄이 함께 있고 그것은
  # 남아야 한다. `.conf` 는 수집기가 text_config 로 보는 확장자다.
  - id: textline
    subject: text_config
    where:
      all:
        - { field: path, op: equals, value: "/opt/remedy-lab/lab.conf" }
        - { field: line, op: contains, value: "remedy-lab-implant" }

  # ── structured_config.remove_key ────────────────────────
  #
  # 같은 모양. 파일에 `keep` 키가 함께 있고 그것은 남아야 한다.
  - id: jsonkey
    subject: structured_config
    where:
      all:
        - { field: path, op: equals, value: "/opt/remedy-lab/lab.json" }
        - { field: key_path, op: equals, value: "remedy_lab_implant" }

  # ── hosts.restore_line ──────────────────────────────────
  #
  # /etc/hosts 에는 localhost 줄들이 함께 있다. **호스트 이름으로 짚는다** —
  # 주소로 짚으면 127.0.0.1 을 쓰는 정상 줄이 함께 걸린다.
  - id: hostline
    subject: hosts_entry
    where:
      - { field: hostnames, op: contains, value: "lab.remedy.invalid" }

  # ── shortcut.strip_args ─────────────────────────────────
  #
  # 바로 가기 자체는 정상이고 **인자만** 덧붙었다. 그래서 지우는 것이 아니라
  # 인자를 떼는 것이다.
  - id: shortcut
    subject: shortcut
    where:
      - { field: path, op: equals, value: "/usr/share/applications/remedy-lab.desktop" }

  # ── autorun.remove ──────────────────────────────────────
  - id: autostart
    subject: autorun
    where:
      - { field: id, op: contains, value: "remedy-lab-auto" }

  # ── cert_store.remove ───────────────────────────────────
  #
  # 같은 디렉터리의 다른 인증서는 남아야 한다.
  - id: cert
    subject: cert_store
    where:
      - { field: subject, op: contains, value: "REMEDY-LAB" }

  # ── persistence.delete ──────────────────────────────────
  #
  # /etc/cron.d 의 다른 파일은 남아야 한다.
  - id: cron
    subject: persistence
    where:
      - { field: id, op: contains, value: "remedy-lab" }

  # ── service.disable · service.delete ────────────────────
  #
  # Linux 에서 이 둘은 **순수 파일 조작**이다 — `.wants/` 링크를 지우고 유닛
  # 파일을 지운다. `systemctl` 을 부르지 않으므로 systemd 가 PID 1 이 아닌
  # 컨테이너에서도 잰다.
  - id: unit
    subject: service
    where:
      - { field: name, op: contains, value: "remedy-lab" }

  # ── browser_ext.remove ──────────────────────────────────
  #
  # 확장 식별자로만 가른다. 같은 자리의 정상 확장은 남아야 한다.
  - id: ext
    subject: browser_extension
    where:
      - { field: ext_id, op: equals, value: "remedylabremedylabremedylabremed" }

  # ── process.kill ────────────────────────────────────────
  #
  # **이름이 아니라 어디서 도는가로 가른다.** 되돌릴 수 없는 Op 이므로
  # 관측이 있을 때만 열린다.
  - id: proc
    subject: process
    where:
      - { field: image_path, op: starts_with, value: "/opt/remedy-lab/" }

# 서로 다른 자리에서 온 두 근거의 논리곱. 마커 하나로는 서지 않는다.
verdict:
  require: "marker and payload"

remediate:
  # `ref` 가 어떤 Op 으로 바뀌는지는 **subject 가 정한다** — 플러그인이 Op 을
  # 직접 고르지 않는다 (22-remediate-recipes.md).
  remove:
    - { ref: payload }
    - { ref: textline }
    - { ref: jsonkey }
    - { ref: shortcut }
    - { ref: autostart }
    - { ref: cert }
    - { ref: cron }
    - { ref: unit }
    - { ref: ext }
    - { ref: proc }
  # **규칙 id 가 아니라 표의 이름이다** (`RESTORE_NAMED` 넷 중 하나).
  # 2026-09-03 에 여기 `hostline` 을 적었다가 계획이 조용히
  # `registry.restore_default` 로 새는 것을 봤다. 린트가 이제 잡는다.
  restore:
    - hosts

submit_hint:
  samples: [payload]
  confidentiality_min: 1
