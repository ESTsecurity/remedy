# 감염 스냅샷을 뜨기 위한 수집 매니페스트 — cred-dump.
#
# # 이것은 탐지 룰이 아니다
#
# `detect` 는 **아무것도 맞히지 않도록** 일부러 짰다 (`search-hijack-collect.yaml`
# 과 같다). 매니페스트가 있어야 선언 모드로 수집되고, 선언 모드여야 subject 를
# 고를 수 있을 뿐이다. 여기에 진짜 조건을 적으면 그 순간 스냅샷이 오염된다.
#
# # `WDigest` 키를 범위에 넣는 까닭
#
# 이 키는 고정 경로 수집기가 보지 않는다 — 범위로 지목해야 값이 거둬진다.
# 그리고 **키 하나를 통째로 넣는다.** 검체가 만든 값만 좁혀 넣으면 같은 키의
# 정상 값 다섯이 스냅샷에 없게 되고, 그러면 *"키째 지우는 답안"* 이 아무 데도
# 걸리지 않는다.
#
# 자동 실행 등록은 `autorun` 이 고정 경로에서 거둬 오므로 범위에 넣지 않는다.

schema_version: 1
id: cred-dump-collect
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "감염 스냅샷 수집용 — cred-dump"
  en: "infected snapshot collection - cred-dump"

scan_roots:
  - "C:\\ProgramData\\SysDiag"
  - "C:\\ProgramData\\SysMon"
  - "HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\WDigest"

subjects: [file, registry_value, autorun]

detect:
  - id: never
    subject: file
    where:
      - { field: path, op: equals, value: "C:\nonexistent\remedy-exam-never-matches" }

verdict: { require: "never" }
