# 감염 스냅샷을 뜨기 위한 수집 매니페스트 — sideload-drop.
#
# # 이것은 탐지 룰이 아니다
#
# `detect` 는 **아무것도 맞히지 않도록** 일부러 짰다 (`search-hijack-collect.yaml`
# 과 같다). 매니페스트가 있어야 선언 모드로 수집되고, 선언 모드여야 subject 를
# 고를 수 있을 뿐이다. 여기에 진짜 조건을 적으면 그 순간 스냅샷이 오염된다.
#
# # 폴더 하나를 통째로 넣는다
#
# 이 위협은 **한 폴더 안에서** 갈린다. 검체 파일만 좁혀 넣으면 기준이 되는
# 정상 파일과 함정 둘(작은 정상 모듈 · 새로 갱신된 정상 모듈)이 스냅샷에
# 없게 되고, 그러면 시각·크기 중 하나만 본 답안이 아무 데도 걸리지 않는다.
#
# 자동 실행 등록은 `autorun` 이 고정 경로에서 거둬 오므로 범위에 넣지 않는다.

schema_version: 1
id: sideload-drop-collect
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "감염 스냅샷 수집용 — sideload-drop"
  en: "infected snapshot collection - sideload-drop"

scan_roots:
  - "C:\\ProgramData\\AcmeSync"

subjects: [file, autorun]

detect:
  - id: never
    subject: file
    where:
      - { field: path, op: equals, value: "C:\nonexistent\remedy-exam-never-matches" }

verdict: { require: "never" }
