# 감염 스냅샷을 뜨기 위한 수집 매니페스트 — proxy-dns-hijack.
#
# # 이것은 탐지 룰이 아니다
#
# `detect` 는 **아무것도 맞히지 않도록** 일부러 짰다 (`search-hijack-collect.yaml`
# 과 같다). 매니페스트가 있어야 선언 모드로 수집되고, 선언 모드여야 subject 를
# 고를 수 있을 뿐이다. 여기에 진짜 조건을 적으면 그 순간 스냅샷이 오염된다.
#
# # 범위에 레지스트리를 넣지 않는다
#
# `hosts_entry` 와 `proxy_config` 와 `autorun` 은 전부 **고정 경로에서** 거둬
# 오고 범위 필터를 타지 않는다. 리눅스 쪽 `tls-intercept` 가 그 증거다 —
# 범위가 `/opt` 뿐인데 `/etc/hosts` 를 밟았다.
#
# 여기에 `HKCU\…\Internet Settings` 를 더하면 같은 값이 `proxy_config` 로도
# `registry_value` 로도 거둬져 **한 자리에 치료가 둘 계획된다.** 그래서 뺐고,
# 파일 두 자리만 범위로 둔다.

schema_version: 1
id: proxy-dns-hijack-collect
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "감염 스냅샷 수집용 — proxy-dns-hijack"
  en: "infected snapshot collection - proxy-dns-hijack"

scan_roots:
  - "C:\\ProgramData\\NetOpt"
  - "C:\\ProgramData\\NetTools"

subjects: [file, hosts_entry, proxy_config, autorun]

detect:
  - id: never
    subject: file
    where:
      - { field: path, op: equals, value: "C:\nonexistent\remedy-exam-never-matches" }

verdict: { require: "never" }
