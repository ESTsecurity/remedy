# 감염 스냅샷을 뜨기 위한 수집 매니페스트 — hook-implant.
#
# # 이것은 탐지 룰이 아니다
#
# `detect` 는 **아무것도 맞히지 않도록** 일부러 짰다 (`search-hijack-collect.yaml`
# 과 같다). 매니페스트가 있어야 선언 모드로 수집되고, 선언 모드여야 subject 를
# 고를 수 있을 뿐이다. 여기에 진짜 조건을 적으면 그 순간 스냅샷이 오염된다.
#
# # 이 위협만 본문을 담는다
#
# 셋을 가르는 것이 파일 **내용**이므로 스냅샷에 본문이 있어야 한다. 그런데
# `collect` 는 `collect_extra` 의 **증거 참조(`ref`) 를 풀지 않는다** — 증거는
# 평가가 만들기 때문이다(`New-InfectedSnapshot.ps1` 이 같은 벽에서 합성
# 바이트를 붙였다). **경로 형(`path`)은 수집 1패스에서 그대로 담긴다**
# (`remedy-collect::extra::take_body`), 그래서 여기서는 경로 형을 쓴다.
#
# **셋을 다 담는다.** 검체만 담으면 "본문이 있는 파일이 검체" 가 되어 룰 없이도
# 갈리고, 그러면 이 위협이 재려던 것이 사라진다.
#
# 담기는 것은 무해한 자리 채우기 텍스트 수백 바이트씩이다(각 파일 상한 기본
# 8MB · 총량 예산은 그보다 훨씬 크다).
#
# 자동 실행 등록은 `autorun` 이 고정 경로에서 거둬 오므로 범위에 넣지 않는다.

schema_version: 1
id: hook-implant-collect
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "감염 스냅샷 수집용 — hook-implant"
  en: "infected snapshot collection - hook-implant"

scan_roots:
  - "C:\\ProgramData\\BuildKit\\hooks"

subjects: [file, autorun]

collect_extra:
  - { path: "C:\\ProgramData\\BuildKit\\hooks\\prepare.js" }
  - { path: "C:\\ProgramData\\BuildKit\\hooks\\publish.js" }
  - { path: "C:\\ProgramData\\BuildKit\\hooks\\telemetry.js" }

detect:
  - id: never
    subject: file
    where:
      - { field: path, op: equals, value: "C:\nonexistent\remedy-exam-never-matches" }

verdict: { require: "never" }
