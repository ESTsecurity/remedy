# 감염 스냅샷을 뜨기 위한 수집 매니페스트 — webshell-upload.
#
# # 이것은 탐지 룰이 아니다
#
# `detect` 는 **아무것도 맞히지 않도록** 일부러 짰다 (`search-hijack-collect.yaml`
# 과 같다). 매니페스트가 있어야 선언 모드로 수집되고, 선언 모드여야 subject 를
# 고를 수 있을 뿐이다. 여기에 진짜 조건을 적으면 그 순간 스냅샷이 오염된다.
#
# # 웹 루트 하나만 본다
#
# 이 위협은 **한 폴더 안에서 갈라진다.** 검체도 미끼도 전부
# `C:\inetpub\wwwroot` 아래에 있고, 밖을 볼 이유가 없다.
#
# 파일만 거둔다. 웹셸은 웹 서버가 실행하므로 자동 실행 등록도 서비스도
# 남기지 않는다 — 그것이 이 위협이 어려운 까닭이기도 하다. 지속성 자리를
# 훑는 답안은 아무것도 찾지 못한다.

schema_version: 1
id: webshell-upload-collect
version: 1.0.0
min_core: "1.0.0"
platforms: [windows]
name:
  ko: "감염 스냅샷 수집용 — webshell-upload"
  en: "infected snapshot collection - webshell-upload"

scan_roots:
  - "C:\\inetpub\\wwwroot"

subjects: [file]

detect:
  - id: never
    subject: file
    where:
      - { field: path, op: equals, value: "C:\nonexistent\remedy-exam-never-matches" }

verdict: { require: "never" }
