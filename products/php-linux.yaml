# 제품 원본 — 리눅스 PHP 를 찾는 조건(2026-11-23 · 하루 30건 차례 7 · 결정 K).
#
# 같은 제품의 점검 룰은 이 파일의 칸을 `plugin.yaml` 의 울타리 사이로 받는다 — `# >>> 제품 php-linux <칸>` ~
# `# <<< 제품 php-linux <칸>`. 칸은 `# === <칸>` 줄부터 다음 칸까지이고 들여쓰기 없이 적는다(채울 때 울타리 줄의
# 들여쓰기만큼 민다). 고치면 `cargo xtask products --write` 로 같은 제품의 룰을 모두 채우고, 채운 룰마다 버전을 올리고
# 조각을 더한다(`plugin-lock` · `fragments` 가 요구한다). 이 파일은 꾸러미에 들지 않는다.

# === rpm-package
# RPM 계열의 PHP 패키지(배포판 · Remi · SCL 의 이름 꼴 · SUSE 의 Apache 모듈) — 그 PHP 는 패키지의 판으로 가린다.
- id: rpm_php
  subject: package
  where:
    all:
      - { field: manager, op: equals, value: rpm }
      - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }

# === places
# RPM 계열 자리(`/usr/bin` · `/usr/sbin` · `/usr/lib64/httpd/modules`)에 패키지가 깔지 않은 PHP · PHP-FPM — 패키지의
# 판으로 가리지 못한다(`/usr/bin/php-fpm` 이 패키지 것이면 `/usr/sbin/php-fpm` 은 그 별칭일 수 있어 따로 둔다).
- id: bin_rpm_unowned
  subject: file
  where:
    all:
      - { field: path, op: matches, value: '^/usr/(bin/php(-cgi)?|lib64/httpd/modules/libphp[0-9]?\.so)$' }
      - { field: sha256, op: exists }
  exclude:
    - { field: package, op: matches, value: '.' }
- id: sbin_fpm_unowned
  subject: file
  where:
    all:
      - { field: path, op: equals, value: "/usr/sbin/php-fpm" }
      - { field: sha256, op: exists }
  exclude:
    - { field: package, op: matches, value: '.' }
- id: bin_fpm_owned
  subject: file
  where:
    all:
      - { field: path, op: equals, value: "/usr/bin/php-fpm" }
      - { field: sha256, op: exists }
      - { field: package, op: matches, value: '.' }
# 갈린 sbin(RHEL 9 계열)의 `/usr/bin/php-fpm` 을 어느 패키지도 깔지 않았다 — 패키지의 PHP-FPM 은 `/usr/sbin` 에 있다. 위 짝의
# 거꾸로다 — `/usr/sbin` 이 `bin` 으로 가는 링크인 기계에서 패키지가 `/usr/sbin/php-fpm` 으로 적은 파일은 소유 없는
# `/usr/bin/php-fpm` 으로도 오므로, 패키지의 `/usr/sbin/php-fpm` 이 있으면 세지 않는다.
- id: bin_fpm_unowned
  subject: file
  where:
    all:
      - { field: path, op: equals, value: "/usr/bin/php-fpm" }
      - { field: sha256, op: exists }
  exclude:
    - { field: package, op: matches, value: '.' }
- id: sbin_fpm_owned
  subject: file
  where:
    all:
      - { field: path, op: equals, value: "/usr/sbin/php-fpm" }
      - { field: sha256, op: exists }
      - { field: package, op: matches, value: '.' }
# 판 붙은 이름의 PHP 실행 파일 · 모듈이 패키지 기록에 없다 — 룰은 패키지 밖 실행 파일 · 모듈의 판을 판 없는 이름(`php` ·
# `php-cgi` · `php-fpm` · `libphp.so`)의 자리에서만 읽는다. 세 꼴이다.
# - 점으로 판을 붙인 이름(`php8.3` · `php-cgi8.3` · `php-fpm8.3`) — `/usr` · `/usr/local` 의 `bin` · `sbin`. Debian · Ubuntu 의 패키지가
#   이 이름으로 깔지만 기록(dpkg `.md5sums`)에 있으면 패키지 갈래가 판정한다 — 기록이 지워진 파일은 여기 온다(수집기는 dpkg 의
#   소유를 `.md5sums` 로만 안다).
# - 점 없이 판을 붙인 이름(`php83` · `php-fpm83`) — `/usr/local` 에서만. `/usr/bin` · `/usr/sbin` 의 그 이름은 Alpine 의 패키지
#   이름이고 apk 의 소유는 수집하지 않아 세지 않는다.
# - Debian Apache 모듈 자리의 판 붙은 모듈(`libphp7.so` · `libphp8.2.so`) — apxs 로 지은 PHP 가 그 자리에 둔다. 배포판 패키지의
#   모듈은 기록에 있어 세지 않는다.
- id: bin_named_unowned
  subject: file
  where:
    all:
      - { field: path, op: matches, value: '^/usr/((local/)?s?bin/php(-cgi|-fpm)?[0-9]+(\.[0-9]+)+|local/s?bin/php(-cgi|-fpm)?[0-9]+|lib/apache2/modules/libphp[0-9][0-9.]*\.so)$' }
      - { field: sha256, op: exists }
  exclude:
    - { field: package, op: matches, value: '.' }

# === pkg-epoch
# PHP 런타임 패키지의 판에 epoch 가 붙었다 — dpkg 는 `1:` 같은 앞자리(적어 둔 `0:` 도), RPM 은 1 이상(`0:` 은 RPM 줄의 계열 꼴
# `^(?:0:)?` 이 이미 받는다). dpkg · RPM 모두 epoch 를 먼저 견주므로 `1:8.2.35` 가 epoch 없는 고친 판보다 높게 나오고, 상류 판의
# 계열 꼴(`^8\.2\.`)에도 맞지 않는다. 상류 판으로 견주는 룰은 이 꼴을 고친 판과 견주지 못한다 — 확인 필요다(dpkg 의 지원이 끝난
# 계열은 epoch 가 붙어도 지원 끝 줄의 2 가 앞선다 · RPM 의 지원 끝 줄은 epoch 0 만 받아 6). Debian · Ubuntu · RHEL 계열 · SUSE 의
# PHP 런타임 패키지는 epoch 를 쓰지 않는다(읽고 판단) — epoch 를 쓰는 배포판은 그 기계마다 확인 필요가 되고, 그 배포판의 고친 판
# 줄을 더하면 판정한다. 메타 패키지(`php-defaults` 의
# `php-cli` 등 · 판 `2:8.2+93` 꼴)는 이름이 판 없이 `php-` 로 시작해 아래 dpkg 이름 꼴에 맞지 않는다.
- id: pkg_epoch
  subject: package
  where:
    any:
      - all:
          - { field: manager, op: equals, value: dpkg }
          - { field: name, op: matches, value: '^(php[0-9.]+-(cli|cgi|fpm)|libapache2-mod-php[0-9.]+|php5|libapache2-mod-php5)$' }
          - { field: version, op: matches, value: '^[0-9]+:' }
      - all:
          - { field: manager, op: equals, value: rpm }
          - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }
          - { field: version, op: matches, value: '^[1-9][0-9]*:' }

# === elsewhere
# 룰이 보는 자리 밖의 PHP — 실행 중인 프로세스 · 서비스가 띄우는 실행 파일 · Apache 설정이 싣는 모듈.
# - 프로세스: `exclude` 의 정규식이 룰의 실행 파일 자리다. 고친 뒤 다시 시작하지 않은 프로세스의 실행 파일에는 ` (deleted)` 가
#   붙어 이 꼴에 맞지 않는다 — 그것은 `changed` 칸의 `stale_php` 가 본다.
# - 서비스: systemd 유닛의 `ExecStart` 첫 낱말(돌고 있지 않아도 유닛 파일이 남는다)과 SysV · OpenRC · Upstart 의 시작
#   스크립트가 띄우는 실행 파일. 셸로 감싼 `ExecStart=/bin/sh -c …` 는 그 셸이 첫 낱말이라 보지 못한다.
# - Apache 설정: 멈춰 있어도 `LoadModule` 줄이 남는다. 선언한 자리는 룰의 파일 자리와 배포판 패키지가 모듈을 두는 자리
#   (`/usr/lib(64)/apache2*` · `httpd*` — SUSE 는 `/usr/lib64/apache2/mod_php8.so`)다 — 그 PHP 는 패키지 갈래가 판정한다.
#   직접 빌드 · XAMPP 의 `modules/` 는 그 Apache 아래라 선언한 자리가 아니다. RPM 계열은 `ServerRoot`(`/etc/httpd`) 기준의
#   `modules/` 로 적는다 — `/etc/httpd/modules` 는 배포판 모듈 자리로 가는 링크다.
- id: running_php
  subject: process
  where:
    - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
  exclude:
    - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }
- id: service_php
  subject: service
  where:
    - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
  exclude:
    - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }
- id: apache_php
  subject: text_config
  where:
    - { field: path, op: matches, value: '^/(etc/apache2|usr/local/apache2/conf|opt/lampp/etc)/' }
    - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s' }
  exclude:
    - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s+"?(/usr/lib(64)?/(apache2|httpd)[^/]*/|/usr/local/lib/|/(usr/local|opt)/php/)' }
- id: apache_php_rpm
  subject: text_config
  where:
    - { field: path, op: matches, value: '^/etc/httpd/' }
    - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s' }
  exclude:
    - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s+"?(/usr/lib(64)?/(apache2|httpd)[^/]*/|/usr/local/lib/|/(usr/local|opt)/php/|modules/)' }

# === changed
# 디스크의 판으로 가릴 수 없는 PHP.
# - `stale_php`: 고친 뒤 다시 시작하지 않아 지워진 옛 파일(실행 파일 · 모듈)을 실은 프로세스.
# - `pkg_bin_changed`: 패키지 판으로 판정하는 줄은 그 패키지가 깐 실행 파일이 패키지 기록(dpkg `.md5sums` · RPM 파일
#   다이제스트)과 같을 때만 믿는다 — 다르거나 · 기록이 없거나 · 끝까지 못 읽었으면 확인 필요다(바꾼 파일은 패키지 DB 의
#   판이 말하지 않는다). PHP 실행 파일 자리만 본다 — 같은 자리의 다른 패키지 파일(해시 상한을 넘어 늘 `unreadable` 인
#   것 등)로 PHP 판정을 막지 않는다.
- id: stale_php
  subject: process
  where:
    any:
      - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]* \(deleted\)$' }
      - { field: modules, op: matches, value: '/libphp[0-9.]*\.so \(deleted\)"' }
- id: pkg_bin_changed
  subject: file
  where:
    - { field: path, op: matches, value: '^/usr/(bin/php(-cgi|-fpm)?[0-9.]*|sbin/php-fpm[0-9.]*|lib/apache2/modules/libphp[0-9.]*\.so|lib64/httpd/modules/libphp[0-9]?\.so)$' }
    - { field: package, op: matches, value: '.' }
    - { field: package_match, op: in, value: [different, unrecorded, unreadable] }

# === unconfirmed
# 위 칸들이 확인 필요로 내는 까닭(verdict.unconfirmed 의 항목). 서비스와 Apache 설정은 멈춰 있어도 남는 자리라 같은 PHP 가
# 함께 설 수 있어 한 칸으로 둔다.
- when: "bin_rpm_unowned"
  why:
    ko: "RPM 계열의 자리에 어느 패키지도 깔지 않은 PHP 실행 파일이 있습니다(위 경로) — 패키지로 깐 PHP 가 아니라 그 버전을 가리지 못했습니다. 그 파일의 버전과 받은 곳을 확인하십시오"
    en: "a PHP executable that no package installed sits in an RPM system location (path above) - it is not a packaged PHP, so its version could not be told; check its version and origin"
- when: "sbin_fpm_unowned and not bin_fpm_owned"
  why:
    ko: "어느 패키지도 깔지 않은 /usr/sbin/php-fpm 이 있습니다 — 패키지로 깐 PHP-FPM 이 아니라 그 버전을 가리지 못했습니다. 그 파일의 버전과 받은 곳을 확인하십시오"
    en: "a /usr/sbin/php-fpm that no package installed is present - it is not a packaged PHP-FPM, so its version could not be told; check its version and origin"
- when: "bin_fpm_unowned and not sbin_fpm_owned"
  why:
    ko: "어느 패키지도 깔지 않은 /usr/bin/php-fpm 이 있습니다 — 패키지로 깐 PHP-FPM 이 아니라 그 버전을 가리지 못했습니다. 그 파일의 버전과 받은 곳을 확인하십시오"
    en: "a /usr/bin/php-fpm that no package installed is present - it is not a packaged PHP-FPM, so its version could not be told; check its version and origin"
- when: "bin_named_unowned"
  why:
    ko: "패키지 기록에 없는 PHP 실행 파일 · 모듈이 있습니다(위 경로) — 이 점검이 버전을 읽는 이름이 아니라 그 버전을 가리지 못했습니다. 그 파일의 버전과 받은 곳을 확인하고, 패키지가 깐 파일이면 패키지를 다시 설치한 뒤 다시 검사하십시오"
    en: "a PHP executable or module that no package record lists is present (path above) - this check does not read the version under that name, so its version could not be told; check its version and origin, and if a package installed it, reinstall the package and scan again"
- when: "running_php"
  why:
    ko: "이 점검이 보는 자리 밖에서 PHP 가 실행 중입니다(위 경로) — 그 PHP 는 판정하지 않았습니다. 그 PHP 의 버전과 받은 곳(패키지 · 공급사 · 직접 빌드)을 확인하십시오"
    en: "a PHP is running outside the places this check reads (path above) - that PHP was not judged; check its version and origin (package, vendor or own build)"
- when: "service_php or apache_php or apache_php_rpm"
  why:
    ko: "이 점검이 보는 자리 밖의 PHP 를 서비스가 띄우거나 Apache 설정이 싣습니다(위 서비스 · 설정 줄의 경로) — 그 PHP 는 판정하지 않았습니다. 그 PHP 의 버전과 받은 곳(패키지 · 공급사 · 직접 빌드)을 확인하십시오"
    en: "a service starts, or the Apache configuration loads, a PHP outside the places this check reads (the path in the service or configuration line above) - that PHP was not judged; check its version and origin (package, vendor or own build)"
- when: "pkg_bin_changed"
  why:
    ko: "패키지가 깐 PHP 실행 파일이 패키지 기록과 같은지 확인되지 않습니다(위 경로) — 내용이 다르거나 기록이 없어 그 패키지의 버전으로 판정하지 않았습니다. 누가 그 파일을 바꿨는지 확인하고, 패키지를 다시 설치한 뒤 다시 검사하십시오"
    en: "a PHP executable installed by a package cannot be confirmed to match the package record (path above) - its content differs or there is no record, so it was not judged by the package version; check who changed it, reinstall the package and scan again"
- when: "stale_php"
  why:
    ko: "고친 뒤 다시 시작하지 않은 PHP 가 실행 중입니다(위 경로) — 그 프로세스가 지워진 옛 PHP 파일(실행 파일 · 모듈)을 실은 채 돌고 있어 디스크의 버전으로 판정하지 않았습니다. 그 PHP 를 쓰는 서비스(PHP-FPM · 웹 서버)를 다시 시작한 뒤 다시 검사하십시오"
    en: "a PHP that was not restarted after an update is running (path above) - the process still runs a deleted old PHP file (executable or module), so it was not judged by the version on disk; restart the service using that PHP (PHP-FPM, web server) and scan again"
