# 제품 원본 — 리눅스 PHP 를 찾는 조건(2026-11-23 · 하루 30건 차례 7 · 결정 K).
#
# 같은 제품의 점검 룰은 이 파일의 칸을 `plugin.yaml` 의 울타리 사이로 받는다 — `# >>> 제품 php-linux <칸>` ~
# `# <<< 제품 php-linux <칸>`. 칸은 `# === <칸>` 줄부터 다음 칸까지이고 들여쓰기 없이 적는다(채울 때 울타리 줄의
# 들여쓰기만큼 민다). 고치면 `cargo xtask products --write` 로 같은 제품의 룰을 모두 채우고, 채운 룰마다 버전을 올리고
# 조각을 더한다(`plugin-lock` · `fragments` 가 요구한다). 이 파일은 꾸러미에 들지 않는다.

# === rpm-package
# RPM 계열의 PHP 패키지(배포판 · Remi · SCL 의 이름 꼴 · SUSE 의 Apache 모듈) — 그 PHP 는 패키지의 판으로 가린다.
- id: rpm_php
  subject: package
  where:
    all:
      - { field: manager, op: equals, value: rpm }
      - { field: name, op: matches, value: '^((rh-)?php[0-9]+-)?php[0-9.]*(-cli|-cgi|-fpm|-fastcgi)?$|^apache2-mod_php[0-9]*$' }

# === places
# RPM 계열 자리(`/usr/bin` · `/usr/sbin` · `/usr/lib64/httpd/modules`)에 패키지가 깔지 않은 PHP · PHP-FPM — 패키지의
# 판으로 가리지 못한다(`/usr/bin/php-fpm` 이 패키지 것이면 `/usr/sbin/php-fpm` 은 그 별칭일 수 있어 따로 둔다).
- id: bin_rpm_unowned
  subject: file
  where:
    all:
      - { field: path, op: matches, value: '^/usr/(bin/php(-cgi)?|lib64/httpd/modules/libphp[0-9]?\.so)$' }
      - { field: sha256, op: exists }
  exclude:
    - { field: package, op: matches, value: '.' }
- id: sbin_fpm_unowned
  subject: file
  where:
    all:
      - { field: path, op: equals, value: "/usr/sbin/php-fpm" }
      - { field: sha256, op: exists }
  exclude:
    - { field: package, op: matches, value: '.' }
- id: bin_fpm_owned
  subject: file
  where:
    all:
      - { field: path, op: equals, value: "/usr/bin/php-fpm" }
      - { field: sha256, op: exists }
      - { field: package, op: matches, value: '.' }

# === elsewhere
# 룰이 보는 자리 밖의 PHP — 실행 중인 프로세스 · 서비스가 띄우는 실행 파일 · Apache 설정이 싣는 모듈. 배포판 패키지가
# 두는 자리(`/usr/lib(64)/apache2*` · `httpd*`)와 룰의 파일 자리는 그 PHP 를 다른 갈래가 판정하므로 뺀다.
- id: running_php
  subject: process
  where:
    - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
  exclude:
    - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }
- id: service_php
  subject: service
  where:
    - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]*$' }
  exclude:
    - { field: image_path, op: matches, value: '^(/usr/(local/)?s?bin/[^/]+|/(usr/local|opt)/php/.+)$' }
- id: apache_php
  subject: text_config
  where:
    - { field: path, op: matches, value: '^/(etc/apache2|usr/local/apache2/conf|opt/lampp/etc)/' }
    - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s' }
  exclude:
    - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s+"?(/usr/lib(64)?/(apache2|httpd)[^/]*/|/usr/local/lib/|/(usr/local|opt)/php/)' }
- id: apache_php_rpm
  subject: text_config
  where:
    - { field: path, op: matches, value: '^/etc/httpd/' }
    - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s' }
  exclude:
    - { field: line, op: matches, value: '(?i)^\s*LoadModule\s+\S*php\S*\s+"?(/usr/lib(64)?/(apache2|httpd)[^/]*/|/usr/local/lib/|/(usr/local|opt)/php/|modules/)' }

# === changed
# 디스크의 판으로 가릴 수 없는 PHP — 고친 뒤 다시 시작하지 않아 지워진 옛 파일을 실은 프로세스 · 패키지 기록과 내용이
# 다르거나 기록이 없는 패키지 실행 파일.
- id: stale_php
  subject: process
  where:
    any:
      - { field: image_path, op: matches, value: '/(php|php-cgi|php-fpm|lsphp)[0-9.]* \(deleted\)$' }
      - { field: modules, op: matches, value: '/libphp[0-9.]*\.so \(deleted\)"' }
- id: pkg_bin_changed
  subject: file
  where:
    - { field: path, op: matches, value: '^/usr/(bin/php(-cgi|-fpm)?[0-9.]*|sbin/php-fpm[0-9.]*|lib/apache2/modules/libphp[0-9.]*\.so|lib64/httpd/modules/libphp[0-9]?\.so)$' }
    - { field: package, op: matches, value: '.' }
    - { field: package_match, op: in, value: [different, unrecorded, unreadable] }

# === unconfirmed
# 위 칸들이 확인 필요로 내는 까닭(verdict.unconfirmed 의 항목).
- when: "bin_rpm_unowned"
  why:
    ko: "RPM 계열의 자리에 어느 패키지도 깔지 않은 PHP 실행 파일이 있습니다(위 경로) — 패키지로 깐 PHP 가 아니라 그 버전을 가리지 못했습니다. 그 파일의 버전과 받은 곳을 확인하십시오"
    en: "a PHP executable that no package installed sits in an RPM system location (path above) - it is not a packaged PHP, so its version could not be told; check its version and origin"
- when: "sbin_fpm_unowned and not bin_fpm_owned"
  why:
    ko: "어느 패키지도 깔지 않은 /usr/sbin/php-fpm 이 있습니다 — 패키지로 깐 PHP-FPM 이 아니라 그 버전을 가리지 못했습니다. 그 파일의 버전과 받은 곳을 확인하십시오"
    en: "a /usr/sbin/php-fpm that no package installed is present - it is not a packaged PHP-FPM, so its version could not be told; check its version and origin"
- when: "running_php"
  why:
    ko: "이 점검이 보는 자리 밖에서 PHP 가 실행 중입니다(위 경로) — 그 PHP 는 판정하지 않았습니다. 그 PHP 의 버전과 받은 곳(패키지 · 공급사 · 직접 빌드)을 확인하십시오"
    en: "a PHP is running outside the places this check reads (path above) - that PHP was not judged; check its version and origin (package, vendor or own build)"
- when: "service_php or apache_php or apache_php_rpm"
  why:
    ko: "이 점검이 보는 자리 밖의 PHP 를 서비스가 띄우거나 Apache 설정이 싣습니다(위 서비스 · 설정 줄의 경로) — 그 PHP 는 판정하지 않았습니다. 그 PHP 의 버전과 받은 곳(패키지 · 공급사 · 직접 빌드)을 확인하십시오"
    en: "a service starts, or the Apache configuration loads, a PHP outside the places this check reads (the path in the service or configuration line above) - that PHP was not judged; check its version and origin (package, vendor or own build)"
- when: "pkg_bin_changed"
  why:
    ko: "패키지가 깐 PHP 실행 파일이 패키지 기록과 같은지 확인되지 않습니다(위 경로) — 내용이 다르거나 기록이 없어 그 패키지의 버전으로 판정하지 않았습니다. 누가 그 파일을 바꿨는지 확인하고, 패키지를 다시 설치한 뒤 다시 검사하십시오"
    en: "a PHP executable installed by a package cannot be confirmed to match the package record (path above) - its content differs or there is no record, so it was not judged by the package version; check who changed it, reinstall the package and scan again"
- when: "stale_php"
  why:
    ko: "고친 뒤 다시 시작하지 않은 PHP 가 실행 중입니다(위 경로) — 그 프로세스가 지워진 옛 PHP 파일(실행 파일 · 모듈)을 실은 채 돌고 있어 디스크의 버전으로 판정하지 않았습니다. 그 PHP 를 쓰는 서비스(PHP-FPM · 웹 서버)를 다시 시작한 뒤 다시 검사하십시오"
    en: "a PHP that was not restarted after an update is running (path above) - the process still runs a deleted old PHP file (executable or module), so it was not judged by the version on disk; restart the service using that PHP (PHP-FPM, web server) and scan again"
