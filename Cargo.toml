[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# 실험 픽스처는 제품이 아니다. 워크스페이스에 넣으면 `cargo xtask arch` 의
# 크레이트 수와 금지 의존 검사에 섞이고, `cargo test --workspace` 가 워치독
# 쌍을 빌드하게 된다. 하네스가 `--manifest-path` 로 따로 빌드한다.
exclude = ["testbed/fixtures/watchdog", "testbed/fixtures/labsvc"]

[workspace.package]
# **v1 이다** (설계-09 v1 마감 = P0~P11). 이 값이 `min_core` 비교의 좌변이고,
# 저장소의 모든 플러그인과 가이드 예제가 `min_core: "1.0.0"` 을 선언한다 —
# `0.0.0` 인 동안에는 그 선언을 강제하는 순간 전부 거부됐다 (2026-08-28 점검).
version = "1.17.0"
edition = "2021"
rust-version = "1.96"
license = "LicenseRef-ESTsecurity-Proprietary"

[workspace.dependencies]
# 1.22.1 아래로 내리지 않는다 — 1.19 는 wasmtime 43 · zip 8 · p256 0.13 에 묶여 권고
# 12건(wasmtime 8 · zip 3 · crypto-bigint 1)이 걸렸다(`cargo deny check`, 2026-11-02).
yara-x = "1.22.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# plugin.schema.json 을 타입에서 직접 생성한다. 손으로 쓴 생성기는 타입과 따로
# 놀 수 있고, 그러면 "스키마 단일 소스"가 이름뿐이 된다 (설계-09 P1).
schemars = "0.8"
# plugin.yaml 파싱. serde_yaml 은 유지보수가 중단됐다(RUSTSEC-2024-0320).
# 이 크레이트가 쓰는 파서 unsafe-libyaml 도 유지보수가 끝났다(RUSTSEC-2024-0449) —
# 근거와 재검토 조건은 `deny.toml`.
serde_yaml_ng = "0.10"
# 경로·값 비교 전 NFC 정규화. 한글은 NFD/NFC 바이트열이 완전히 달라, 정규화하지
# 않으면 같은 이름의 폴더가 다른 문자열로 보인다 (설계-02 §4).
unicode-normalization = "0.1"
sha2 = "0.10"
# 예약 작업 정의(Task XML) 파싱. COM 을 쓰지 않고 파일을 직접 읽는다.
quick-xml = "0.41"
thiserror = "2"
# RE2 계열. 역참조·전방탐색이 없는 대신 입력 길이에 선형이라 룰이 스캐너를
# 정지시키는 사고가 원천 차단된다 (설계-02 §4).
regex = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
# 인증서 지문. **보안 속성이 아니라 식별자다** — Windows 가 신뢰 저장소의 키
# 이름으로 SHA-1 을 쓰므로(레지스트리에서 공짜로 얻는다) Linux 도 같은 값을 내야
# 같은 인증서가 두 플랫폼에서 한 지문을 갖는다. 인증서의 신뢰를 이 해시가
# 결정하지 않는다 (설계-09 P12 후속).
sha1 = "0.10"
base64 = "0.22"
# 레지스트리 읽기. unsafe 를 크레이트 안에 가둬 두어 우리 코드는 forbid 를 유지한다.
winreg = "0.52"
# Windows API 원형. **이것을 직접 쓰는 곳은 `remedy-wintrust` 와 `remedy-winmods` 둘뿐이고**,
# 그 둘이 저장소에서 unsafe 를 쓰는 크레이트다 (설계-04 §1). 서명 검증과 프로세스에 실린
# 모듈 열거에는 안전 래퍼가 존재하지 않아 우리가 감싼다 — 근거는 설계-03 §3 과 설계-04 §1 에 있다.
windows-sys = "0.59"
# 배포 바이너리의 임포트 테이블을 읽는다. 정적 CRT 가 실제로 적용됐는지,
# 치료 경로에 네트워크가 링크되지 않았는지(설계-01 D9) 산출물에서 직접 본다.
# yara-x 가 이미 끌어오는 크레이트라 새 의존이 늘지 않는다.
object = { version = "0.39", default-features = false, features = ["read", "std"] }
# 청정 코퍼스를 압축해 보관한다. 실측 12.9MB 스냅샷이 gzip 후 1.9MB(15%)다.
# 코퍼스는 계속 늘어날 것이므로(설계-04 §3.2) 원문 그대로는 저장소가 감당하지 못한다.
flate2 = "1"

# ── 화면 — 키 입력 · 원시 모드 · Windows VT (목표 remedy_제품화 ③) ─────────
# 메뉴의 방향키 · 원시 모드의 Ctrl+C · Windows 콘솔의 VT 처리 켜기. **unsafe 를
# 크레이트 안에 가둬 둔다** — winreg 와 같은 이유이고, 우리 코드는
# forbid(unsafe_code) 를 유지한다. Rust 로 같은 일을 하는 Codex CLI 가 쓰는
# 크레이트다(벤치마크 2026-11-05). 기본 기능은 끈다 — 붙여넣기 · derive 는 쓰지 않는다.
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
# 줄 입력 모드(작업 중 · 승인 묻기)의 Ctrl+C. 원시 모드가 아니면 Ctrl+C 는 키가 아니라
# 신호로 온다 — 받지 않으면 OS 가 프로세스를 바로 끝낸다.
ctrlc = "3"

# ── 격리 컨테이너 (P5, 설계-03 §5) ───────────────────────────────────
# AEAD 는 **X**ChaCha20-Poly1305 다. 논스가 192비트라 컨테이너마다 난수로 뽑아도
# 재사용 위험이 없다 — AEAD 에서 가장 흔한 사고가 논스 재사용이고, 카운터를
# 관리해야 하는 설계는 재설치·복원·병렬 실행에서 그 관리가 깨진다. AES-NI 가
# 없는 32비트 대상에서도 소프트웨어 상수시간이다.
chacha20poly1305 = "0.10"
# 패스프레이즈 wrap 의 KDF. 메모리 하드라 GPU 대량 시도에 강하다.
argon2 = "0.5"
# 조직 복구 공개키 wrap. **RSA 를 쓰지 않는다** — deny.toml 의 RUSTSEC-2023-0071
# 예외가 "코어가 RSA 개인키를 다루면 즉시 재평가" 를 조건으로 달고 있고,
# 설계-01 미결 5의 서명 후보도 Ed25519 계열이다. 같은 곡선군으로 맞춘다.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
# 키 재료를 쓰고 나서 지운다. Drop 만으로는 컴파일러가 지우기를 없앨 수 있다.
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# 속성 기반 테스트 (설계-09 P5 검증 1번). 임의 파일·메타데이터로 격리→복원 왕복.
proptest = "1"

# ── 복원 메타데이터·여유 공간 (P5) ───────────────────────────────────
# 여유 공간 질의. 백업 전에 확인하지 못하면 파괴 도중 디스크가 찬다
# (설계-00 §5-2: 부족하면 파괴를 시작하지 않는다).
fs4 = "1"
# Windows 보안 디스크립터. **unsafe 를 크레이트 안에 가둬 둔다** — winreg 와 같은
# 이유이고, 그래야 우리 코드가 forbid(unsafe_code) 를 유지한다.
windows-permissions = "0.2"
# Linux 확장 속성. SELinux 컨텍스트도 여기로 실려 온다 (설계-02 §9).
xattr = "1"

# ── 신뢰 — 플러그인 서명 (P10, 설계-03 §3 G8 · 설계-01 미결 5) ───────
# 검증. **의존성이 0 개다**(2026-08-25 실측). 배포 바이너리가 서명을 확인하는
# 데 끌어오는 공급망 표면이 없다는 뜻이고, 서명 검사기 자신이 공격 표면이
# 되면 검사의 값어치가 사라지므로 이 성질을 채택 근거로 삼는다.
minisign-verify = "0.2"
# 서명 **생성**. `rpassword`(→ windows-sys) · `scrypt` · `salsa20` · `pbkdf2` 를
# 끌어온다(실측) — 개인키를 풀고 사람에게 암구호를 묻는 도구의 의존성이다.
# 그래서 제품이 아니라 `xtask` 가 쓴다. 치료 도구가 서명 능력을 갖지 않는 것은
# 자기 갱신 채널을 갖지 않는 것과 같은 이유다 (설계-01 D7).
minisign = "0.9"

# ── 동반 모듈 remedy-net 의 통신 (2026-11-10 · 설계-04 §1) ───────────────
# **본체는 이것들을 링크하지 않는다** — `cargo xtask arch` 가 본체의 의존 트리 전체를 본다.
#
# HTTP 는 손으로 짠 HTTP/1.1 이다. 리다이렉트 · 프록시 · 재시도 · 연결 재사용 · 압축이 처음부터
# 없고, 연결 직후 상대 IP 를 보고 TLS 바이트를 보내기 전에 닫는 검사가 한 자리에 선다. 범용
# 클라이언트 ureq 3 은 기본값이 환경 변수 프록시를 읽고(`Proxy::try_from_env`) 리다이렉트 10 ·
# 유휴 연결 10 · 헤더 64 KiB 이며, 그 검사는 semver 밖(unversioned) 전송 API 로만 들어간다
# (2026-11-10 조사). 암호 구현은 ring 이다 — rustls 기본(aws-lc-rs)은 cmake · NASM 을 요구하고,
# 배포 빌드의 MSVC · musl-tools 로 ring 이 선다.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# 응답 머리(상태 줄 · 헤더)만 읽는다 — hyper 가 쓰는 파서.
httparse = "1"
# 믿을 루트 = OS 저장소 ∪ Mozilla 목록 ∪ `--cacert`. 검증은 로컬(webpki)이다. OS 검증기
# (rustls-platform-verifier 0.7)는 Windows 에서 폐기 확인(OCSP · CRL)을 켜고 URL 내려받기를
# 막지 않아, 사용자가 적지 않은 주소로 요청이 나간다. 새 Windows 서버는 루트를 처음 쓸 때
# 내려받아 저장소가 덜 차 있으므로(ISRG Root X1 등) 내장 목록이 그 틈을 메운다.
rustls-native-certs = "0.8"
webpki-roots = "1"
# 시험의 TLS 서버 인증서를 그 자리에서 만든다 — 비밀키를 저장소에 두지 않는다.
rcgen = "0.14"
# 시험 서버가 RST 로 끊는다(SO_LINGER 0). std 에는 안정판 API 가 없다.
socket2 = "0.6"

# ── 동반 모듈 remedy-net 의 이미지 점검 (2026-11-10) ─────────────────────
# zstd 레이어의 압축을 푼다. 저장소에 C 코드를 들이지 않으려고 순수 Rust 판독기를 쓴다(zstd-sys 는 C 다).
# 0.9.1 아래로 내리지 않는다 — 0.8.3 전에는 스트림의 첫 프레임에 창 크기 상한이 걸리지 않아 작은 파일이 큰
# 할당을 낼 수 있었다(상류 PR #111). `hash` 는 프레임 체크섬을 스스로 대조하려고 켠다 — 스트리밍 판독기는
# 체크섬이 틀려도 오류를 내지 않는다(상류 이슈 #127). gzip 은 위의 flate2 를 그대로 쓴다.
ruzstd = { version = "0.9.1", default-features = false, features = ["std", "hash"] }
# 이미지 안의 실행 파일을 패키지 기록(dpkg 의 `.md5sums` · 옛 RPM 의 MD5 다이제스트)과 대조한다 — 출처 인증이
# 아니라 기록과 파일이 같은지만 본다. yara-x 가 이미 끌어오는 판이라 새 크레이트가 늘지 않는다.
md-5 = "0.11"
# 시험의 tar 픽스처를 짓는다 — 판독은 쓰지 않는다. 이 크레이트의 판독기는 GNU 긴 이름 · PAX 머리를 크기 상한 없이
# 메모리로 읽고(8 GiB 라고 적힌 머리 하나가 그만큼을 잡는다), 끝 블록 · 머리만 있는 형식의 경계가 사내
# runtime-scanner(Go 의 archive/tar)와 달라 같은 레이어를 다르게 읽는다. 판독은 remedy-net 이 Go 의 규칙을 옮겨
# 직접 한다.
tar = { version = "0.4.46", default-features = false }

[profile.release]
# 배포 바이너리는 단일 정적 산출물이다 (설계-01 D3).
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

# 개발 · 시험 빌드에서 **의존 크레이트의 디버그 정보를 끈다** — 워크스페이스 크레이트는 그대로다(변수 · 줄 번호).
# `target/debug` 는 `.pdb` 가 절반을 넘는다. 깨끗한 한 세대(`cargo test --no-run` + `cargo build`)를 잰 값
# (Windows · 2026-11-10): 17.4 → 8.3 GB(`.pdb` 8.7 → 2.2) · 처음 빌드 271 → 191초. 시험 결과는 같다.
# 의존 크레이트 안의 스택은 함수 이름까지만 나오고 파일 · 줄이 없다 — 그 안을 따라 들어가 볼 때만 이 칸을
# 잠깐 지운다. 배포 빌드(`release`)는 이 칸과 상관없다.
[profile.dev.package."*"]
debug = false
